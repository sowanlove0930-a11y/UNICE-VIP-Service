function inject(){
  var existing = [];
  try { existing = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){ existing = []; }
  if(!Array.isArray(existing)) existing = [];
  var dummy = makeData();
  var ids = {};
  existing.forEach(function(c){ if(c && c.id) ids[c.id] = true; });
  var added = 0;
  dummy.forEach(function(d){
    if(!ids[d.id]){ existing.push(d); added++; }
  });
  localStorage.setItem('unispace_customers', JSON.stringify(existing));
  finish(added + '명 추가 완료 (전체 ' + existing.length + '명)');
}

function replaceAll(){
  if(!confirm('기존 고객을 모두 지우고 부산 더미 30명으로 교체합니다.\n계속할까요?')) return;
  localStorage.setItem('unispace_customers', JSON.stringify(makeData()));
  finish('전체 교체 완료 (30명)');
}

function finish(msg){
  document.getElementById('result').innerHTML = '<div class="done">✅ ' + msg + '<br>3초 후 메인으로 이동</div>';
  setTimeout(function(){ window.location.href = 'index.html'; }, 3000);
}
