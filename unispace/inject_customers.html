<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>고객 좌표 테스트 데이터</title>
<style>
body{font-family:'Noto Sans KR',sans-serif;background:#080E1C;color:#F0F4FF;
display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
.box{background:#0D1628;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px;text-align:center;max-width:460px;width:100%;}
.title{font-size:18px;font-weight:800;margin-bottom:8px;color:#E8C97A;}
.sub{font-size:13px;color:#8B98B8;margin-bottom:16px;line-height:1.7;}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px;}
.tag{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:700;}
.t-c{background:rgba(16,185,129,.12);color:#34D399;}
.t-m{background:rgba(139,92,246,.12);color:#A78BFA;}
.t-w{background:rgba(244,163,38,.12);color:#FCD34D;}
.btn{padding:13px 28px;border:none;border-radius:12px;
background:linear-gradient(135deg,#E8C97A,#C9A84C);color:#080E1C;
font-size:14px;font-weight:800;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin:4px;}
.btn2{background:rgba(255,255,255,.06);color:#8B98B8;border:1px solid rgba(255,255,255,.14);}
.done{color:#34D399;font-size:14px;font-weight:700;margin-top:14px;}
.warn{color:#FCD34D;font-size:12px;margin-top:10px;line-height:1.6;}
</style></head>
<body>
<div class="box">
  <div class="title">📍 고객 좌표 테스트 데이터</div>
  <div class="sub">부산 해운대 · 센텀 · 서면 일대<br>좌표가 등록된 고객 12명을 추가합니다</div>
  <div class="tags">
    <span class="tag t-c">계약 고객 6명</span>
    <span class="tag t-m">관리 고객 4명</span>
    <span class="tag t-w">연락 필요 2명</span>
  </div>
  <button class="btn" onclick="inject()">기존 고객에 추가</button>
  <button class="btn btn2" onclick="replaceAll()">전체 교체</button>
  <div class="warn">⚠️ '전체 교체'는 기존 고객을 모두 지우고<br>테스트 데이터로 덮어씁니다</div>
  <div id="result"></div>
</div>
<script>
function makeData(){
  return [
    { id:'GEO001', name:'김영희', phone:'010-1111-2222', customerType:'계약', address:'부산 해운대구 우동 1407', lat:'35.1587', lng:'129.1604', lastContact:'2026-05-20', grade:'VIP' },
    { id:'GEO002', name:'박지훈', phone:'010-2222-3333', customerType:'계약', address:'부산 해운대구 좌동 1399', lat:'35.1709', lng:'129.1739', lastContact:'2026-05-18', grade:'일반' },
    { id:'GEO003', name:'이수진', phone:'010-3333-4444', customerType:'관리', address:'부산 해운대구 센텀중앙로 90', lat:'35.1690', lng:'129.1290', lastContact:'2026-05-15', grade:'일반' },
    { id:'GEO004', name:'최영민', phone:'010-4444-5555', customerType:'계약', address:'부산 수영구 광안해변로 219', lat:'35.1532', lng:'129.1185', lastContact:'2026-05-22', grade:'일반' },
    { id:'GEO005', name:'한지수', phone:'010-5555-6666', customerType:'관리', address:'부산 해운대구 마린시티1로 33', lat:'35.1539', lng:'129.1456', lastContact:'2026-05-10', grade:'VIP' },
    { id:'GEO006', name:'류상현', phone:'010-6666-7777', customerType:'계약', address:'부산 해운대구 달맞이길 30', lat:'35.1567', lng:'129.1810', lastContact:'2026-05-25', grade:'일반' },
    { id:'GEO007', name:'홍길동', phone:'010-7777-8888', customerType:'연락', address:'부산 수영구 수영로 677', lat:'35.1622', lng:'129.1130', lastContact:'2026-04-12', grade:'일반' },
    { id:'GEO008', name:'정민아', phone:'010-8888-9999', customerType:'관리', address:'부산 해운대구 센텀남대로 35', lat:'35.1684', lng:'129.1310', lastContact:'2026-05-08', grade:'일반' },
    { id:'GEO009', name:'강수빈', phone:'010-9999-0000', customerType:'계약', address:'부산 부산진구 중앙대로 668', lat:'35.1577', lng:'129.0594', lastContact:'2026-05-19', grade:'VIP' },
    { id:'GEO010', name:'오세훈', phone:'010-1010-2020', customerType:'연락', address:'부산 부산진구 서면로 39', lat:'35.1547', lng:'129.0596', lastContact:'2026-03-30', grade:'일반' },
    { id:'GEO011', name:'문지영', phone:'010-3030-4040', customerType:'계약', address:'부산 동래구 충렬대로 107', lat:'35.2049', lng:'129.0784', lastContact:'2026-05-21', grade:'일반' },
    { id:'GEO012', name:'배준호', phone:'010-5050-6060', customerType:'관리', address:'부산 연제구 중앙대로 1001', lat:'35.1799', lng:'129.0756', lastContact:'2026-05-05', grade:'일반' }
  ];
}

function inject(){
  var existing = [];
  try { existing = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){ existing = []; }
  if(!Array.isArray(existing)) existing = [];
  var dummy = makeData();
  var ids = {};
  existing.forEach(function(c){ if(c && c.id) ids[c.id] = true; });
  var added = 0;
  dummy.forEach(function(d){
    if(!ids[d.id]){ existing.push(d); added++; }
  });
  localStorage.setItem('unispace_customers', JSON.stringify(existing));
  finish(added + '명 추가 완료 (전체 ' + existing.length + '명)');
}

function replaceAll(){
  if(!confirm('기존 고객을 모두 지우고 테스트 데이터로 교체합니다.\n계속할까요?')) return;
  localStorage.setItem('unispace_customers', JSON.stringify(makeData()));
  finish('전체 교체 완료 (12명)');
}

function finish(msg){
  document.getElementById('result').innerHTML = '<div class="done">✅ ' + msg + '<br>3초 후 메인으로 이동</div>';
  setTimeout(function(){ window.location.href = 'index.html'; }, 3000);
}
</script>
</body></html>
