<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 알림 — UNISPACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=DM+Serif+Display:ital@0;1&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FBF9F4;--bg2:#FFFFFF;--bg3:#F4F1E9;
  --sur:rgba(26,39,68,.03);--sur2:rgba(26,39,68,.06);
  --bdr:#E8E0D0;--bdr2:#DCD2BE;
  /* ④ unispace.html 호환 별칭 */
  --surface:rgba(26,39,68,.03);--surface2:rgba(26,39,68,.06);
  --border:#E8E0D0;--border2:#DCD2BE;
  --gold:#B8860B;--gold2:#A6791A;--gold-g:rgba(201,168,76,.18);--gold-glow:rgba(201,168,76,.18);
  --green:#1F9268;--blue:#2563EB;--red:#DC2626;--purple:#6D4FB8;--orange:#C77D14;
  --navy:#1A2744;
  --text:#1A2744;--text2:#5C6678;--text3:#97A0B0;
  --r-xl:20px;--r-lg:16px;--r-md:12px;--r-sm:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* ② 커스텀 스크롤바 */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(201,168,76,.25);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(201,168,76,.45);}
*{scrollbar-width:thin;scrollbar-color:rgba(201,168,76,.25) transparent;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;word-break:keep-all;overflow-wrap:break-word;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 15% 10%,rgba(201,168,76,.05),transparent 60%),
             radial-gradient(ellipse 50% 50% at 85% 80%,rgba(37,99,235,.04),transparent 60%);}

/* ── 레이아웃 ── */
.app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 24px 40px;}

/* ── 헤더 ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--bdr);margin-bottom:24px;}
.back-btn{display:flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--bdr2);border-radius:20px;padding:7px 16px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.back-btn:hover{background:var(--sur2);color:var(--text);}
.header-center{text-align:center;}
.header-title{font-family:'Syncopate',sans-serif;font-size:13px;font-weight:700;letter-spacing:.15em;color:var(--gold);}
.header-date{font-size:12px;color:var(--text2);margin-top:3px;}
.header-right{font-size:13px;color:var(--text2);}

/* ── 요약 카드 ── */
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}

@media (max-width: 768px) {
  .summary-cards { gap: 7px; }
  .sum-card { padding: 11px 6px; }
  .sum-icon { font-size: 18px; }
  .sum-label { font-size: 9px; white-space: nowrap; text-align: center; letter-spacing: -0.6px; margin-left: -4px; margin-right: -4px; }
  .sum-card > div:last-child { text-align: center; white-space: nowrap; }
  .sum-count { font-size: 17px; letter-spacing: -0.5px; }
  .sum-unit { font-size: 9px; margin-left: 1px; }
  .ac-desc { font-size: 11.5px; letter-spacing: -0.3px; }
}
.sum-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:all .2s;}
.sum-card:hover{border-color:var(--bdr2);transform:translateY(-2px);}
.sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sum-today::before   {background:linear-gradient(90deg,var(--gold),transparent);}
.sum-d30::before     {background:linear-gradient(90deg,var(--purple),transparent);}
.sum-d5::before      {background:linear-gradient(90deg,var(--blue),transparent);}
.sum-manage::before  {background:linear-gradient(90deg,var(--orange),transparent);}
.sum-icon{font-size:20px;margin-bottom:6px;}
.sum-label{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px;}
.sum-card > div:last-child{white-space:nowrap;}
.sum-count{font-size:22px;font-weight:800;}
.sum-today  .sum-count{color:var(--gold2);}
.sum-d30    .sum-count{color:#6D4FB8;}
.sum-d5     .sum-count{color:#2563EB;}
.sum-manage .sum-count{color:var(--orange);}
.sum-unit{font-size:12px;color:var(--text2);font-weight:500;}

/* ── 섹션 ── */
.alarm-section{margin-bottom:24px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.section-badge{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;}
.badge-today  {background:rgba(201,168,76,.12);color:var(--gold2);border:1px solid rgba(201,168,76,.2);}
.badge-d30    {background:rgba(139,92,246,.12);color:#6D4FB8;border:1px solid rgba(139,92,246,.2);}
.badge-d5     {background:rgba(59,130,246,.12);color:#2563EB;border:1px solid rgba(59,130,246,.2);}
.badge-manage {background:rgba(244,163,38,.1);color:var(--orange);border:1px solid rgba(244,163,38,.2);}
.section-count{font-size:12px;color:var(--text2);}
.empty-section{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:20px;text-align:center;color:var(--text2);font-size:13px;}

/* ── 알림 카드 ── */
.alarm-list{display:flex;flex-direction:column;gap:8px;}
.alarm-card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:0;overflow:hidden;transition:all .2s;position:relative;}
.alarm-card:hover{border-color:var(--bdr2);}
/* ③ 완료 처리 — 부드러운 transition */
.alarm-card{transition:opacity .4s ease,filter .4s ease,border-color .2s;}
.alarm-card.done{opacity:.4;filter:grayscale(.65);}
.alarm-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.ac-birthday::before   {background:var(--gold);}
.ac-anniversary::before{background:var(--green);}
.ac-event::before      {background:var(--orange);}
.ac-payment::before    {background:var(--blue);}
.ac-aging::before      {background:var(--purple);}
.ac-noc::before        {background:var(--orange);}

.alarm-card-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 10px 18px;}
.ac-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.ac-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.ac-type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;}
.type-birthday   {background:rgba(201,168,76,.15);color:var(--gold2);}
.type-anniversary{background:rgba(16,185,129,.12);color:#1F9268;}
.type-event      {background:rgba(244,163,38,.12);color:var(--orange);}
.type-payment    {background:rgba(59,130,246,.12);color:#2563EB;}
.type-aging      {background:rgba(139,92,246,.12);color:#6D4FB8;}
.type-noc        {background:rgba(244,163,38,.1);color:var(--orange);}
.ac-name{font-size:15px;font-weight:700;}
.ac-desc{font-size:12px;color:var(--text2);margin-bottom:0;margin-top:3px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ac-phone{font-size:12px;color:var(--text3);}
.ac-phone-inline{font-size:12px;color:#6B7FA3;text-decoration:none;margin-left:4px;transition:color .2s;}
.ac-fp-chip{font-size:11px;font-weight:700;color:#5F5E5A;background:rgba(0,0,0,.05);border:1px solid var(--bdr2);border-radius:12px;padding:2px 9px;margin-left:auto;white-space:nowrap;}
.ac-phone-inline:hover{color:#93A8CC;}
.ac-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;margin-left:16px;}
/* ⑧ 카톡 버튼 — FFE500 대신 골드 계열 amber로 통일 */
.kakao-copy-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.28);border-radius:20px;color:var(--gold2);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.kakao-copy-btn:hover{background:rgba(201,168,76,.2);border-color:var(--gold);}
.done-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:20px;color:#1F9268;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.done-btn:hover{background:rgba(16,185,129,.18);}
.done-btn.checked{background:rgba(26,39,68,.03);border-color:var(--bdr);color:var(--text3);}


/* ── 아코디언 ── */
.section-header { cursor: pointer; user-select: none; }
.section-header:hover .section-badge { filter: brightness(1.1); }
.accordion-arrow {
  margin-left: auto; font-size: 12px; color: var(--text2);
  transition: transform .3s ease; flex-shrink: 0;
}
.accordion-arrow.closed { transform: rotate(-90deg); }
.accordion-body {
  overflow: hidden;
  transition: max-height .35s cubic-bezier(.77,0,.18,1), opacity .3s ease;
  max-height: 200000px; opacity: 1;
}
.accordion-body.closed { max-height: 0; opacity: 0; }

/* ── 카톡 버전 선택 모달 ── */
.kakao-modal-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(8,14,28,.88); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .3s;
  padding: 20px;
}
.kakao-modal-overlay.open { opacity: 1; pointer-events: all; }
.kakao-modal {
  width: 100%; max-width: 600px;
  background: var(--bg2); border: 1px solid var(--bdr2);
  border-radius: 20px;
  padding: 8px 0 24px;
  transform: translateY(20px) scale(.98);
  transition: transform .3s cubic-bezier(.34,1.2,.64,1);
  max-height: 86vh; overflow-y: auto;
}
.kakao-modal-overlay.open .kakao-modal { transform: translateY(0) scale(1); }
.kakao-modal-handle { width: 40px; height: 4px; background: var(--bdr2); border-radius: 2px; margin: 10px auto 0; }
.kakao-modal-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; justify-content: space-between; }
.kakao-modal-title { font-size: 16px; font-weight: 700; }
.kakao-modal-name  { font-size: 12px; color: var(--text2); margin-top: 3px; }
.kakao-modal-close { background: var(--sur); border: 1px solid var(--bdr); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; font-size: 14px; }

.kakao-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 14px; }
.kakao-tab {
  font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 9px;
  border: 1px solid var(--bdr); background: var(--sur); color: var(--text2);
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.kakao-tab:hover { border-color: var(--bdr2); }
.kakao-tab.on { background: rgba(201,168,76,.12); border-color: var(--gold); color: var(--gold2); }
.kakao-msg-view {
  background: var(--sur); border: 1px solid var(--bdr); border-radius: 14px;
  padding: 18px 18px; font-size: 14px; line-height: 1.85; color: var(--text);
  white-space: pre-wrap; word-break: break-word; min-height: 90px;
}
.kakao-version-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.kakao-version-item {
  border: 1.5px solid var(--bdr); border-radius: var(--r-lg);
  overflow: hidden; cursor: pointer; transition: border-color .2s;
}
.kakao-version-item:hover { border-color: var(--bdr2); }
.kakao-version-item.selected { border-color: var(--gold); background: rgba(201,168,76,.06); }
.kakao-version-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; background: var(--bg3);
}
.kakao-version-num {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  background: var(--sur2); color: var(--text2);
}
.kakao-version-item.selected .kakao-version-num { background: var(--gold); color: #fff; }
.kakao-version-label { font-size: 12px; font-weight: 700; color: var(--text2); }
.kakao-version-item.selected .kakao-version-label { color: var(--gold2); }
.kakao-version-preview {
  padding: 10px 14px; font-size: 12px; line-height: 1.8;
  color: var(--text); white-space: pre-line;
  max-height: 100px; overflow: hidden; position: relative;
}
.kakao-version-preview::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 30px; background: linear-gradient(transparent, var(--bg2));
}
.kakao-version-item.selected .kakao-version-preview::after { background: linear-gradient(transparent, rgba(201,168,76,.04)); }

/* ⑧ 카카오 복사 확인 버튼 — 골드 그라데이션으로 통일 */
.kakao-copy-confirm {
  margin: 4px 16px 0; padding: 14px;
  background: var(--gold);
  border: none; border-radius: var(--r-lg);
  color: #fff; font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 800; cursor: pointer;
  transition: all .2s; width: calc(100% - 32px);
  box-shadow: 0 4px 20px rgba(201,168,76,.3);
}
.kakao-copy-confirm:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(201,168,76,.45); }
/* ── 토스트 ── */

.gift-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: rgba(199,125,20,.92);
  border: 1px solid rgba(199,125,20,1);
  border-radius: 20px;
  color: #fff;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .2s;
  white-space: nowrap; text-decoration: none;
  opacity: 1 !important;
}
.gift-btn:hover { background: rgba(199,125,20,.2); transform: translateY(-1px); }

/* 카드 내 선물 버튼 (작은 버전) */
.gift-btn-sm {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px;
  background: rgba(199,125,20,.08);
  border: 1px solid rgba(199,125,20,.2);
  border-radius: 14px;
  color: var(--orange);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all .2s;
  white-space: nowrap; text-decoration: none;
  margin-bottom: 6px;
}
.gift-btn-sm:hover { background: rgba(199,125,20,.18); }

/* 카톡+완료 가로 배치 */
.ac-btn-row {
  display: flex; gap: 6px; align-items: center;
}
.ac-right {
  display: flex; flex-direction: row;
  align-items: center; gap: 8px;
  flex-shrink: 0; margin-left: 0;
}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(27,58,107,.95);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:500;z-index:500;opacity:0;transition:all .3s;white-space:nowrap;backdrop-filter:blur(8px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <!-- 헤더 -->
  <header class="header">
    <a class="back-btn" href="index.html">← 메인으로</a>
    <div class="header-center">
      <div class="header-title">TODAY ALARM</div>
      <div class="header-date" id="headerDate">—</div>
    </div>
    <div class="header-right" id="headerFp">유니스지사</div>
  </header>

  <!-- 요약 카드 -->
  <div class="summary-cards">
    <div class="sum-card sum-today" onclick="scrollToSection('today')">
      <div class="sum-icon">📋</div>
      <div class="sum-label">전체 알림</div>
      <div><span class="sum-count" id="cntToday">0</span><span class="sum-unit">건</span></div>
    </div>
    <div class="sum-card sum-d30" onclick="scrollToSection('d30')">
      <div class="sum-icon">📅</div>
      <div class="sum-label">D-30 예정</div>
      <div><span class="sum-count" id="cntD30">0</span><span class="sum-unit">건</span></div>
    </div>
    <div class="sum-card sum-d5" onclick="scrollToSection('d5')">
      <div class="sum-icon">💳</div>
      <div class="sum-label">D-5 이체</div>
      <div><span class="sum-count" id="cntD5">0</span><span class="sum-unit">건</span></div>
    </div>
    <div class="sum-card sum-manage" onclick="scrollToSection('manage')">
      <div class="sum-icon">⚠️</div>
      <div class="sum-label">장기 미연락</div>
      <div><span class="sum-count" id="cntManage">0</span><span class="sum-unit">건</span></div>
    </div>
  </div>

  <div id="alBranchFpTabs" style="display:none;flex-direction:column;gap:8px;margin-bottom:18px"></div>

  <!-- 오늘 알림 -->
  <div class="alarm-section" id="section-today">
    <div class="section-header" style="justify-content:space-between;" onclick="toggleSection('today')">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="section-badge badge-today">🔔 오늘 알림</div>
        <span class="section-count" id="labelToday"></span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <a class="gift-btn" href="https://orange.hanbizmall.com/?pn=member.login.form" target="_blank" onclick="event.stopPropagation()">🎁 선물 보내기</a>
        <span class="accordion-arrow" id="arrow-today">▼</span>
      </div>
    </div>
    <div class="accordion-body" id="body-today">
      <div class="alarm-list" id="listToday"></div>
    </div>
  </div>

  <!-- D-30 상령일 -->
  <div class="alarm-section" id="section-d30">
    <div class="section-header" onclick="toggleSection('d30')">
      <div class="section-badge badge-d30">📅 D-30 예정 · 상령일</div>
      <span class="section-count" id="labelD30"></span>
      <span class="accordion-arrow" id="arrow-d30">▼</span>
    </div>
    <div class="accordion-body" id="body-d30">
      <div class="alarm-list" id="listD30"></div>
    </div>
  </div>

  <!-- D-5 이체 -->
  <div class="alarm-section" id="section-d5">
    <div class="section-header" onclick="toggleSection('d5')">
      <div class="section-badge badge-d5">💳 D-5 예정 · 이체일</div>
      <span class="section-count" id="labelD5"></span>
      <span class="accordion-arrow" id="arrow-d5">▼</span>
    </div>
    <div class="accordion-body" id="body-d5">
      <div class="alarm-list" id="listD5"></div>
    </div>
  </div>

  <!-- 관리 알림 -->
  <div class="alarm-section" id="section-manage">
    <div class="section-header" onclick="toggleSection('manage')">
      <div class="section-badge badge-manage">⚠️ 관리 알림 · 장기 미연락 30일+</div>
      <span class="section-count" id="labelManage"></span>
      <span class="accordion-arrow" id="arrow-manage">▼</span>
    </div>
    <div class="accordion-body" id="body-manage">
      <div class="alarm-list" id="listManage"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>


// ── 카톡 문구 데이터 ──────────────────────────────
function getSign() {
  var fp = JSON.parse(localStorage.getItem('unispace_user') || '{}');
  var name  = fp.name  || '담당 FP';
  var role  = fp.role  || 'FP';
  var phone = fp.phone || '';
  var line1 = '한화생명금융 VIP사업부 유니스지사';
  var line2 = name + ' ' + role;
  return line1 + '\n' + line2 + (phone ? '\n' + phone : '');
}

var KAKAO_TEMPLATES = {
  birthday: {
    label: '🎂 생일',

var ALARM_MAP = {};
var kakaoCurrentType = null;
var kakaoCurrentC    = null;
var kakaoCurrentE    = null;
var kakaoSelected    = 0;

function openKakaoModal(key) {
  var cfg = ALARM_MAP[key];
  if (!cfg) { showToast('오류: 알림 정보를 찾을 수 없어요'); return; }
  kakaoCurrentType = cfg.kakaoType;
  kakaoCurrentC    = cfg.customer;
  kakaoCurrentE    = cfg.extra || {};
  kakaoSelected    = 0;

  var tpl = KAKAO_TEMPLATES[kakaoCurrentType];
  if (!tpl) return;

  document.getElementById('kakaoModalTitle').textContent = tpl.label + ' 문구 선택';
  document.getElementById('kakaoModalName').textContent  = kakaoCurrentC.name + ' 고객님';

  var list = document.getElementById('kakaoVersionList');
  // tabs row + single message view
  var tabsHtml = '<div class="kakao-tabs" id="kakaoTabs">' +
    tpl.versions.map(function(v, i) {
      return '<button type="button" class="kakao-tab'+(i===0?' on':'')+'" id="ktab_'+i+'" onclick="selectKakaoVersion('+i+')">'+v.name+'</button>';
    }).join('') +
  '</div>';
  var bodyHtml = '<div class="kakao-msg-view" id="kakaoMsgView"></div>';
  list.innerHTML = tabsHtml + bodyHtml;
  renderKakaoMsgView();

  document.getElementById('kakaoModalOverlay').classList.add('open');
}

function renderKakaoMsgView() {
  var tpl = KAKAO_TEMPLATES[kakaoCurrentType];
  if (!tpl) return;
  var v = tpl.versions[kakaoSelected];
  if (!v) return;
  var preview = v.text(kakaoCurrentC, kakaoCurrentE).replace(/\\n/g, "\n");
  var view = document.getElementById('kakaoMsgView');
  if (view) view.innerHTML = escHtml(preview);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectKakaoVersion(i) {
  kakaoSelected = i;
  var tabs = document.querySelectorAll('.kakao-tab');
  tabs.forEach(function(el, idx) { el.classList.toggle('on', idx === i); });
  renderKakaoMsgView();
}

function confirmKakaoCopy() {
  var tpl = KAKAO_TEMPLATES[kakaoCurrentType];
  if (!tpl) return;
  var text = tpl.versions[kakaoSelected].text(kakaoCurrentC, kakaoCurrentE);
  text = text.replace(/\\n/g, '\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function(){
      document.getElementById('kakaoModalOverlay').classList.remove('open');
      showToast('💬 카톡 문구가 복사됐어요!');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    document.getElementById('kakaoModalOverlay').classList.remove('open');
    showToast('💬 카톡 문구가 복사됐어요!');
  }
}

function closeKakaoModal(e) {
  if (!e || e.target === document.getElementById('kakaoModalOverlay'))
    document.getElementById('kakaoModalOverlay').classList.remove('open');
}
// ── 아코디언 ──────────────────────────────────────
function toggleSection(id) {
  var body  = document.getElementById('body-'+id);
  var arrow = document.getElementById('arrow-'+id);
  if (!body) return;
  var isOpen = !body.classList.contains('closed');
  if (isOpen) {
    body.classList.add('closed');
    if (arrow) arrow.classList.add('closed');
  } else {
    body.classList.remove('closed');
    if (arrow) arrow.classList.remove('closed');
  }
}

  return r==='대표'||r==='지점장'||t==='지점장'||t==='교육지점장';

function _alBranchKey(b){ var s=String(b||''); if(s.indexOf('알파')>=0) return '알파'; if(s.indexOf('브라보')>=0) return '브라보'; return ''; }
function _alScope(){
  var r=_alUser.role||'', t=_alUser.title||'';
  if(r==='대표'||t==='교육지점장') return 'all';
  if(r==='지점장'||t==='지점장') return _alBranchKey(_alUser.branch)||'all';
  return 'self';
}
var _alBranch='all', _alFp='all', _alFpDir=[];
var _alFpCache=[], _alFpAlmMap={}, _alFpTotal=0;
TODAY.setHours(0,0,0,0);

function dateDiff(d) {
  // d: 'YYYY-MM-DD' 또는 Date
  var t = d instanceof Date ? d : new Date(d);
  t.setHours(0,0,0,0);
  return Math.round((t - TODAY) / 86400000);
}

function thisYearDate(mmdd) {
  // mmdd: 'MM-DD' 형식 → 올해 날짜
  var parts = mmdd.split('-');
  return new Date(TODAY.getFullYear(), parseInt(parts[0])-1, parseInt(parts[1]));
}

function fmtDate(d) {
  if (!d) return '—';
  return d.replace(/-/g,'.');
}

var toastTimer;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2800);
}

function scrollToSection(id) {
  var el = document.getElementById('section-'+id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function makeCard(cfg) {
  ALARM_MAP[cfg.kakaoKey] = cfg;
  var doneKey = cfg.doneKey;
  var isDone  = !!DONE[doneKey];
  var card = document.createElement('div');
  card.className = 'alarm-card ' + cfg.colorCls + (isDone ? ' done' : '');
  var fpChip = '';
  if(_alIsAdmin() && cfg.customer){
    var fn = cfg.customer.fpName || cfg.customer.fp || '';
    var bk = _alBranchKey(cfg.customer.branch);
    if(fn){
      fpChip = '<span class="ac-fp-chip">👤 '+fn+(bk?' <span style="opacity:.7">· '+bk+'</span>':'')+'</span>';
    }
  }
  card.innerHTML =
    '<div class="alarm-card-inner">' +
      '<div class="ac-left">' +
        '<div class="ac-top">' +
          '<span class="ac-type-badge ' + cfg.typeCls + '">' + cfg.typeLabel + '</span>' +
          '<span class="ac-name">' + cfg.name + '</span>' +
          '<a href="tel:' + cfg.phone + '" class="ac-phone-inline">📞 ' + cfg.phone + '</a>' +
          fpChip +
        '</div>' +
        '<div class="ac-desc">' + cfg.desc + '</div>' +
      '</div>' +
      '<div class="ac-right">' +
        '<button class="kakao-copy-btn" onclick="openKakaoModal(\'' + cfg.kakaoKey + '\')">💬 카톡</button>' +
        '<button class="done-btn' + (isDone?' checked':'') + '" id="doneBtn_'+doneKey+'" onclick="markDone(\'' + doneKey + '\',this)">' +
          (isDone ? '✓ 완료' : '✅ 완료') +
        '</button>' +
      '</div>' +
    '</div>';
  return card;
}

  } else {

    ta.value = text; document.body.appendChild(ta);

function markDone(key, btn) {
  DONE[key] = !DONE[key];
  localStorage.setItem('unispace_alarm_done', JSON.stringify(DONE));
  var card = btn.closest('.alarm-card');
  if (DONE[key]) {
    card.classList.add('done');
    btn.classList.add('checked');
    btn.textContent = '✓ 완료';
    showToast('✅ 완료 처리됐어요!');
  } else {
    card.classList.remove('done');
    btn.classList.remove('checked');
    btn.textContent = '✅ 완료';
  }
}

// ── 카카오 문구 생성 ──────────────────────────────

// ── 메인 렌더 ─────────────────────────────────────
function _alFilteredDB(){
  if(!_alIsAdmin()) return DB;
  var scope=_alScope();
  return DB.filter(function(c){
    var bk=_alBranchKey(c.branch);
    if(scope!=='all' && bk!==scope) return false;
    if(_alBranch!=='all' && bk!==_alBranch) return false;
    if(_alFp!=='all' && (c.fpName||c.fp||'')!==_alFp) return false;
    return true;
  });
}
// count today-alarm-relevant items for one customer (birthday, anniv, event, d5, d30, no-contact)
function _alCustAlarmCount(c){
  var n=0;
  if(c.birth){
    var bp=c.birth.split('-');
    if(bp.length>=3){
      if(dateDiff(thisYearDate(bp[1]+'-'+bp[2]))===0) n++;
      var bMonth=parseInt(bp[1])-1, bDay=parseInt(bp[2]);
      var birthThisYear=new Date(TODAY.getFullYear(),bMonth,bDay);
      var lastBirthday=birthThisYear<=TODAY?birthThisYear:new Date(TODAY.getFullYear()-1,bMonth,bDay);
      var agingDate=new Date(lastBirthday); agingDate.setMonth(agingDate.getMonth()+6);
      if(dateDiff(agingDate)===30) n++;
    }
  }
  (c.contracts||[]).forEach(function(ct){
    if(ct.date){
      var cDate=new Date(ct.date);
      var diff=Math.round((TODAY-cDate)/86400000);
      if(diff===100) n++;
      [1,2,3].forEach(function(yr){ var a=new Date(cDate); a.setFullYear(a.getFullYear()+yr); if(dateDiff(a)===0) n++; });
    }
    if(ct.payday){
      var d5Date=new Date(TODAY.getFullYear(),TODAY.getMonth(),parseInt(ct.payday));
      if(dateDiff(d5Date)===5) n++;
    }
  });
  (c.events||[]).forEach(function(ev){
    if(!ev.alertDate && !ev.date) return;
    if(dateDiff(new Date(ev.alertDate||ev.date))===0) n++;
  });
  var nocBase = c.lastContact ? c.lastContact.split(' ')[0] : (c.registered || '');
  if(nocBase){
    var lc=new Date(nocBase);
    if(!isNaN(lc.getTime()) && Math.round((TODAY-lc)/86400000)>=30) n++;
  }
  return n;
}
function _alLoadFpDir(cb){
  // build FP directory from loaded customer data (fpName + branch)
  var seen={};
  _alFpDir=[];
  DB.forEach(function(c){
    var nm=c.fpName||c.fp||''; if(!nm) return;
    if(seen[nm]) return; seen[nm]=true;
    _alFpDir.push({ name:nm, branch:c.branch||'' });
  });
  if(cb) cb();
}
function renderAlTabs(){
  var wrap=document.getElementById('alBranchFpTabs');
  if(!wrap) return;
  if(!_alIsAdmin()){ wrap.style.display='none'; return; }
  wrap.style.display='flex';
  var scope=_alScope();
  var branches = scope==='all' ? [['all','전체'],['알파','알파'],['브라보','브라보']] : [['all',scope+' 전체'],[scope,scope]];
  var bh='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="font-size:12px;color:var(--text2);font-weight:700;min-width:34px">지점</span>';
  branches.forEach(function(b){
    var on=_alBranch===b[0];
    bh+='<button type="button" onclick="setAlBranch(\''+b[0]+'\')" style="font-size:12px;font-weight:700;padding:6px 13px;border-radius:16px;cursor:pointer;font-family:inherit;border:1px solid '+(on?'var(--orange)':'var(--bdr)')+';background:'+(on?'rgba(199,125,20,.12)':'var(--bg2)')+';color:'+(on?'var(--orange)':'var(--text2)')+'">'+b[1]+'</button>';
  });
  bh+='</div>';
  var fps=_alFpDir.filter(function(f){
    if(scope!=='all' && _alBranchKey(f.branch)!==scope) return false;
    if(_alBranch!=='all' && _alBranchKey(f.branch)!==_alBranch) return false;
    return true;
  });
  // count alarms per FP across the visible scope
  var almMap={};
  DB.forEach(function(c){
    var b=_alBranchKey(c.branch);
    if(scope!=='all' && b!==scope) return;
    if(_alBranch!=='all' && b!==_alBranch) return;
    var n=_alCustAlarmCount(c);
    if(n>0){ var nm=c.fpName||c.fp||''; if(nm) almMap[nm]=(almMap[nm]||0)+n; }
  });
  // only FPs that have at least one alarm
  fps=fps.filter(function(f){ return (almMap[f.name]||0)>0; });
  var totalAlm=0; for(var k in almMap) totalAlm+=almMap[k];
  fps.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),'ko'); });
  _alFpCache = fps;
  _alFpAlmMap = almMap;
  _alFpTotal = totalAlm;
  var curLabel = (_alFp==='all') ? ('전체 FP ('+totalAlm+')') : (_alFp+' ('+(almMap[_alFp]||0)+')');
  var fh='<div style="display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:var(--text2);font-weight:700;min-width:34px">FP</span>';
  fh+='<div style="flex:1;position:relative">';
  fh+='<div onclick="toggleAlFpDd()" style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--bdr2);border-radius:12px;background:var(--bg2);cursor:pointer">';
  fh+='<span style="font-size:12px;font-weight:700;color:#185FA5" id="alFpDdLabel">'+curLabel+'</span>';
  fh+='<span style="font-size:11px;color:var(--text3)" id="alFpDdChev">▾</span>';
  fh+='</div>';
  fh+='<div id="alFpDdBody" style="display:none;margin-top:4px;border:1px solid var(--bdr2);border-radius:12px;background:var(--bg2);overflow:hidden">';
  fh+='<div style="padding:8px 10px;border-bottom:1px solid var(--bdr)"><input type="text" id="alFpSearch" placeholder="FP 검색" oninput="renderAlFpList()" autocomplete="off" style="width:100%;box-sizing:border-box;border:1px solid var(--bdr);border-radius:8px;padding:7px 10px;font-size:12px;background:var(--bg2);color:var(--text);font-family:inherit;outline:none"></div>';
  fh+='<div id="alFpList" style="max-height:200px;overflow-y:auto"></div>';
  fh+='</div></div></div>';
  wrap.innerHTML=bh+fh;
}

function toggleAlFpDd(){
  var body=document.getElementById('alFpDdBody');
  var chev=document.getElementById('alFpDdChev');
  if(!body) return;
  var open=body.style.display!=='none';
  if(open){ body.style.display='none'; if(chev) chev.textContent='▾'; }
  else { body.style.display='block'; if(chev) chev.textContent='▴'; var s=document.getElementById('alFpSearch'); if(s) s.value=''; renderAlFpList(); }
}

function renderAlFpList(){
  var el=document.getElementById('alFpList'); if(!el) return;
  var q=''; var si=document.getElementById('alFpSearch'); if(si) q=String(si.value||'').trim();
  var h='';
  var onAll=(_alFp==='all');
  h+='<div onclick="setAlFp(\'all\')" style="padding:9px 12px;font-size:12px;cursor:pointer;'+(onAll?'background:rgba(37,99,235,.1);color:#185FA5;font-weight:700':'color:var(--text2)')+'">전체 FP <span style="color:var(--orange)">'+_alFpTotal+'</span></div>';
  var list=_alFpCache.filter(function(f){ return !q || String(f.name).indexOf(q)>=0; });
  list.forEach(function(f){
    var nm=f.name; var cnt=_alFpAlmMap[nm]||0; var on=(_alFp===nm);
    h+='<div onclick="setAlFp(\''+nm.replace(/'/g,"")+'\')" style="padding:9px 12px;font-size:12px;cursor:pointer;'+(on?'background:rgba(37,99,235,.1);color:#185FA5;font-weight:700':'color:var(--text)')+'">'+nm+' <span style="color:var(--orange);float:right">'+cnt+'</span></div>';
  });
  if(!list.length) h+='<div style="padding:12px;text-align:center;font-size:11px;color:var(--text3)">FP가 없습니다</div>';
  el.innerHTML=h;
}
function setAlBranch(b){ _alBranch=b; _alFp='all'; renderAlTabs(); render(); }
function setAlFp(n){ _alFp=n; renderAlTabs(); render(); }
function render() {
  renderAlTabs();
  // 날짜 표시
  var days = ['일','월','화','수','목','금','토'];
  var d = new Date();
  document.getElementById('headerDate').textContent =
    d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ')';

  var fp = JSON.parse(localStorage.getItem('unispace_user') || '{}');
  if (fp.name) {
    var _role = (fp.title && fp.title!=='유니스 대표') ? fp.title : (fp.role || 'FP');
    document.getElementById('headerFp').textContent = fp.name + ' ' + _role;
  }

  var todayItems=[], d30Items=[], d5Items=[], manageItems=[];

  _alFilteredDB().forEach(function(c) {
    var name  = c.name;
    var phone = c.phone;

    // ① 생일
    if (c.birth) {
      var bParts = c.birth.split('-');
      if (bParts.length >= 3) {
        var bDate = thisYearDate(bParts[1]+'-'+bParts[2]);
        var bDiff = dateDiff(bDate);
        if (bDiff === 0) {
          var age = d.getFullYear() - parseInt(bParts[0]);
          todayItems.push({ c:c, colorCls:'ac-birthday', typeCls:'type-birthday', typeLabel:'🎂 생일',
            name:name, phone:phone, desc:age+'세 · '+c.birth,
            doneKey:'birthday_'+c.id+'_'+d.getFullYear(),
            kakaoKey:'birthday_'+c.id, kakaoType:'birthday', customer:c, extra:{},
            kakaoMsg: kakaoMsg('birthday', c, {}) });
        }
      }
    }

    // ② 계약 기념일 (100일 / 1·2·3주년)
    (c.contracts||[]).forEach(function(ct, ci) {
      if (!ct.date) return;
      var cDate = new Date(ct.date);
      var diff  = Math.round((TODAY - cDate) / 86400000);
      var insurer = ct.insurer || '';

      if (diff === 100) {
        todayItems.push({ c:c, colorCls:'ac-anniversary', typeCls:'type-anniversary', typeLabel:'🎉 100일',
          name:name, phone:phone, desc:insurer+' · 계약일 '+fmtDate(ct.date),
          doneKey:'c100_'+c.id+'_'+ci,
          kakaoKey:'c100_'+c.id+'_'+ci, kakaoType:'c100', customer:c, extra:{insurer:insurer},
          kakaoMsg: kakaoMsg('c100', c, {insurer:insurer}) });
      }
      [1,2,3].forEach(function(yr) {
        var anniv = new Date(cDate); anniv.setFullYear(anniv.getFullYear()+yr);
        if (dateDiff(anniv) === 0) {
          todayItems.push({ c:c, colorCls:'ac-anniversary', typeCls:'type-anniversary', typeLabel:'🎉 '+yr+'주년',
            name:name, phone:phone, desc:insurer+' · 계약일 '+fmtDate(ct.date),
            doneKey:'anniv'+yr+'_'+c.id+'_'+ci,
            kakaoKey:'anniv_'+yr+'_'+c.id+'_'+ci, kakaoType:'anniversary', customer:c, extra:{insurer:insurer,year:yr},
            kakaoMsg: kakaoMsg('anniversary', c, {insurer:insurer, year:yr}) });
        }
      });

      // ⑤ 이체일 D-5
      if (ct.payday) {
        var payDay = parseInt(ct.payday);
        var d5Date = new Date(TODAY.getFullYear(), TODAY.getMonth(), payDay);
        if (dateDiff(d5Date) === 5) {
          d5Items.push({ c:c, colorCls:'ac-payment', typeCls:'type-payment', typeLabel:'💳 이체 D-5',
            name:name, phone:phone, desc:insurer+' · '+ct.payday+'일 이체 · 월 '+Number(ct.premium||0).toLocaleString()+'원',
            doneKey:'pay_'+c.id+'_'+ci+'_'+TODAY.getFullYear()+'_'+TODAY.getMonth(),
            kakaoKey:'pay_'+c.id+'_'+ci, kakaoType:'payment', customer:c, extra:{insurer:insurer,payday:ct.payday},
            kakaoMsg: kakaoMsg('payment', c, {insurer:insurer, payday:ct.payday}) });
        }
      }
    });

    // ③ 커스텀이벤트
    (c.events||[]).forEach(function(ev, ei) {
      if (!ev.alertDate && !ev.date) return;
      var evDate = new Date(ev.alertDate || ev.date);
      if (dateDiff(evDate) === 0) {
        todayItems.push({ c:c, colorCls:'ac-event', typeCls:'type-event', typeLabel:'📌 이벤트',
          name:name, phone:phone, desc:(ev.name||'커스텀이벤트')+' · '+(ev.repeat||'1회'),
          doneKey:'ev_'+c.id+'_'+ei+'_'+TODAY.getFullYear(),
          kakaoKey:'ev_'+c.id+'_'+ei, kakaoType:'event', customer:c, extra:{eventName:ev.name},
          kakaoMsg: kakaoMsg('event', c, {eventName:ev.name}) });
      }
    });

    // ④ 상령일 D-30 (직전 생일 + 6개월)
    if (c.birth) {
      var bp = c.birth.split('-');
      if (bp.length >= 3) {
        var bMonth = parseInt(bp[1])-1, bDay = parseInt(bp[2]);
        // 직전 생일 계산 (올해 생일이 오늘 이전이면 올해, 아니면 작년)
        var birthThisYear = new Date(TODAY.getFullYear(), bMonth, bDay);
        var lastBirthday = birthThisYear <= TODAY ? birthThisYear : new Date(TODAY.getFullYear()-1, bMonth, bDay);
        // 상령일 = 직전 생일 + 6개월
        var agingDate = new Date(lastBirthday);
        agingDate.setMonth(agingDate.getMonth() + 6);
        if (dateDiff(agingDate) === 30) {
          d30Items.push({ c:c, colorCls:'ac-aging', typeCls:'type-aging', typeLabel:'⏰ 상령일 D-30',
            name:name, phone:phone, desc:'상령일 '+(agingDate.getMonth()+1)+'월 '+agingDate.getDate()+'일',
            doneKey:'aging_'+c.id+'_'+TODAY.getFullYear(),
            kakaoKey:'aging_'+c.id, kakaoType:'aging', customer:c, extra:{},
            kakaoMsg: kakaoMsg('aging', c, {}) });
        }
      }
    }

    // ⑥ 장기 미연락 30일+
    var nocBase = c.lastContact ? c.lastContact.split(' ')[0] : (c.registered || '');
    if (nocBase) {
      var lc = new Date(nocBase);
      if (!isNaN(lc.getTime())) {
        var nocDiff = Math.round((TODAY - lc) / 86400000);
        if (nocDiff >= 30) {
          var nocDesc = c.lastContact
            ? '마지막 연락 '+fmtDate(nocBase)
            : '등록 후 '+nocDiff+'일 · 첫 연락 필요';
          var nocLabel = c.lastContact ? '📵 미연락 '+nocDiff+'일' : '🆕 첫 연락 필요';
          manageItems.push({ c:c, colorCls:'ac-noc', typeCls:'type-noc', typeLabel:nocLabel,
            name:name, phone:phone, desc:nocDesc,
            doneKey:'noc_'+c.id,
            kakaoKey:'noc_'+c.id, kakaoType:'noc', customer:c, extra:{},
            kakaoMsg: kakaoMsg('noc', c, {}) });
        }
      }
    }
  });

  // 카운트 업데이트 — cntToday는 전체 합산 (오늘 챙길 고객 총수)
  document.getElementById('cntToday').textContent  = todayItems.length + d30Items.length + d5Items.length + manageItems.length;
  document.getElementById('cntD30').textContent    = d30Items.length;
  document.getElementById('cntD5').textContent     = d5Items.length;
  document.getElementById('cntManage').textContent = manageItems.length;

  // 렌더
  renderSection('listToday',  'labelToday',  todayItems,  '생일·기념일·이벤트 없음');
  renderSection('listD30',    'labelD30',    d30Items,    '상령일 30일 전 고객 없음');
  renderSection('listD5',     'labelD5',     d5Items,     '이체일 5일 전 고객 없음');
  renderSection('listManage', 'labelManage', manageItems, '30일 이상 미연락 고객 없음');
}

function renderSection(listId, labelId, items, emptyMsg) {
  var el    = document.getElementById(listId);
  var label = document.getElementById(labelId);
  var sectionId = listId.replace('list','section-');
  // sectionId 찾기
  var sectionEl = el.closest('.alarm-section');
  label.textContent = items.length ? items.length + '건' : '';
  if (!items.length) {
    var hint = (listId==='listToday') ? '<div style="font-size:11px;color:var(--text3);background:rgba(0,0,0,.03);border-radius:8px;padding:8px 10px;margin-bottom:8px;line-height:1.5">💡 고객 생일 · 계약 100일/주년 기념일 · 등록한 커스텀 이벤트가 오늘이면 여기에 표시됩니다</div>' : '';
    el.innerHTML = hint + '<div class="empty-section" style="padding:12px;font-size:12px;">✨ ' + emptyMsg + '</div>';
    if (sectionEl) sectionEl.style.opacity = (listId==='listToday') ? '1' : '0.5';
    return;
  }
  if (sectionEl) sectionEl.style.opacity = '1';
  el.innerHTML = '';
  // 완료 항목은 뒤로
  items.sort(function(a,b){ return (DONE[a.doneKey]?1:0) - (DONE[b.doneKey]?1:0); });
  items.forEach(function(item) { el.appendChild(makeCard(item)); });
}


// ── 과거에 주입된 테스트 더미 고객(ALARM_TEST*) 제거 ──────
(function() {
  try {
    var arr = JSON.parse(localStorage.getItem('unispace_customers') || '[]');
    var cleaned = arr.filter(function(c){ return !(c && c.id && String(c.id).indexOf('ALARM_TEST') === 0); });
    if (cleaned.length !== arr.length) {
      localStorage.setItem('unispace_customers', JSON.stringify(cleaned));
    }
  } catch(e) {}
})();

DB = JSON.parse(localStorage.getItem('unispace_customers') || '[]');
_alLoadFpDir();
var d = new Date();
render();
</script>
