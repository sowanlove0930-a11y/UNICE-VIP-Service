<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주변 고객 찾기 — UNISPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080E1C;--bg2:#0D1628;--bg3:#111D35;--gold:#C9A84C;--gold2:#E8C97A;--text:#F0F4FF;--text2:#8B98B8;--text3:#4A5568;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--bdr);z-index:100;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:20px;padding:6px 14px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.back-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.header-title{font-family:'Syncopate',sans-serif;font-size:12px;font-weight:700;color:var(--gold2);letter-spacing:.1em;}
.header-sub{font-size:12px;color:var(--text2);margin-left:auto;}

/* 메인 레이아웃 */
.main{display:flex;flex:1;overflow:hidden;}

/* 좌측 패널 */
.left{width:280px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;}
.lhead{padding:14px 16px;border-bottom:1px solid var(--bdr);}
.ltitle{font-size:11px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-bottom:10px;}
.mcard{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.mlabel{font-size:10px;color:#60A5FA;font-weight:700;margin-bottom:3px;}
.mname{font-size:14px;font-weight:700;color:var(--text);}
.maddr{font-size:11px;color:var(--text2);margin-top:2px;}
.addr-input{width:100%;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:8px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;margin-top:6px;}
.addr-input:focus{outline:none;border-color:var(--gold);}
.search-btn{width:100%;padding:8px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.rrow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.rlabel{font-size:11px;color:var(--text2);white-space:nowrap;}
.rchips{display:flex;gap:4px;}
.rchip{font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;font-weight:600;transition:all .2s;border:1px solid var(--bdr);}
.rchip.on{background:rgba(59,130,246,.18);color:#60A5FA;border-color:rgba(59,130,246,.4);}
.rchip.off{background:rgba(255,255,255,.04);color:var(--text3);}
.rcnt{padding:7px 16px;font-size:11px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,.05);}
.rcnt b{color:var(--text);}
.clist{flex:1;overflow-y:auto;}
.ci{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;}
.ci:hover{background:rgba(255,255,255,.05);}
.ci.sel{background:rgba(59,130,246,.18);border-left:3px solid #60A5FA;padding-left:11px;}
.ci.sel .cn{color:#60A5FA;}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.cn{font-size:13px;font-weight:600;color:var(--text);}
.cd{font-size:11px;font-weight:700;color:#60A5FA;}
.ci2{font-size:11px;color:var(--text2);}
.ctag{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700;margin-left:3px;vertical-align:middle;}
.tc{background:rgba(16,185,129,.12);color:#34D399;}
.tm{background:rgba(139,92,246,.12);color:#A78BFA;}
.tw{background:rgba(244,163,38,.12);color:#FCD34D;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}

/* 지도 */
.map-wrap{flex:1;position:relative;}
#kakaoMap{width:100%;height:100%;}

/* 팝업 */
.map-popup{position:absolute;background:rgba(13,22,40,.96);border:1px solid var(--bdr2);border-radius:14px;padding:0;min-width:230px;max-width:260px;max-height:calc(100% - 24px);z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none;overflow:hidden;}
.drag-handle{background:rgba(255,255,255,.04);padding:8px 14px 6px;cursor:grab;user-select:none;border-bottom:1px solid rgba(255,255,255,.06);}
.drag-handle:active{cursor:grabbing;}
.drag-bar{width:36px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 6px;}
.popup-inner-head{display:flex;align-items:center;justify-content:space-between;}
.pnamewrap{display:flex;align-items:center;gap:6px;}
.popup-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;}
.popup-body{padding:12px 14px;overflow-y:auto;max-height:calc(100vh - 120px);}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pname{font-size:14px;font-weight:700;color:var(--text);}
.ptag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
.prow{font-size:11px;color:var(--text2);margin-bottom:3px;}
.prow b{color:#60A5FA;}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:8px 0;}
.section-label{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:5px;}
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px;}
.nav-btn{padding:7px 4px;border-radius:8px;text-align:center;cursor:pointer;transition:all .2s;border:1px solid var(--bdr);background:rgba(255,255,255,.04);text-decoration:none;}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-icon{font-size:14px;display:block;margin-bottom:2px;}
.nav-text{font-size:10px;color:var(--text2);font-weight:600;}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.contact-btn{padding:7px;border-radius:8px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;text-decoration:none;display:block;}
.btn-call{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#34D399;}
.btn-kakao{background:rgba(254,229,0,.1);border:1px solid rgba(254,229,0,.25);color:#FEE500;}
.btn-call:hover{background:rgba(16,185,129,.2);}
.btn-kakao:hover{background:rgba(254,229,0,.18);}
.set-base-btn{width:100%;padding:7px;border-radius:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#60A5FA;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:5px;}
.set-base-btn:hover{background:rgba(59,130,246,.22);}
.detail-btn{width:100%;padding:8px;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;}

.route-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;}
.route-btn{padding:6px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.btn-from{background:rgba(59,130,246,.12);color:#60A5FA;border:1px solid rgba(59,130,246,.3);}
.btn-from.active{background:rgba(59,130,246,.35);color:#fff;}
.btn-to{background:rgba(239,68,68,.1);color:#F87171;border:1px solid rgba(239,68,68,.3);}
.btn-to.active{background:rgba(239,68,68,.3);color:#fff;}
.route-status{margin-top:6px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px;margin-bottom:4px;}
.route-info{font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.6;}
.route-info b{color:var(--gold2);}
.route-nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.route-nav-btn{padding:6px 2px;border-radius:6px;text-align:center;font-size:10px;font-weight:700;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25);color:var(--gold2);text-decoration:none;display:block;}
.route-nav-btn:hover{background:rgba(201,168,76,.25);}
/* 범례 */
.legend{position:absolute;bottom:12px;left:12px;background:rgba(13,22,40,.9);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;z-index:20;}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--text2);}
.lr:last-child{margin-bottom:0;}
.ldot{width:9px;height:9px;border-radius:50%;}

/* 이벤트 카드 */
.ev-card{border-radius:8px;padding:8px 10px;margin-bottom:5px;}
.ev-card-event{background:rgba(232,201,122,.08);border:1px solid rgba(232,201,122,.2);}
.ev-card-custom{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);}
.ev-card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.ev-card-name{font-size:11px;font-weight:700;color:#F0F4FF;}
.ev-dday{font-size:11px;font-weight:800;color:#E8C97A;}
.ev-dday-custom{font-size:11px;font-weight:800;color:#A78BFA;}
.ev-dday-today{font-size:11px;font-weight:800;color:#34D399;}
.ev-date{font-size:11px;color:#8B98B8;}
.ev-section-label{font-size:10px;font-weight:700;margin-bottom:4px;}
.ev-section-label-event{color:#E8C97A;}
.ev-section-label-custom{color:#A78BFA;}
/* 선택 고객 카드 */
.selected-customer-card{margin-top:8px;}
.scc-divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin-bottom:10px;}
.scc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.scc-info{display:flex;align-items:center;gap:6px;}
.scc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.scc-name{font-size:12px;font-weight:700;color:var(--text);}
.scc-tag{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700;}
.scc-dist{font-size:10px;color:var(--text2);}
.scc-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.scc-btn{padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.scc-from{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#60A5FA;}
.scc-from:hover{background:rgba(59,130,246,.22);}
.scc-to{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171;}
.scc-to:hover{background:rgba(239,68,68,.2);}
/* 계약 요약 */
.popup-contracts{margin-bottom:2px;}
.pc-item{background:rgba(255,255,255,.04);border-radius:7px;padding:6px 8px;margin-bottom:4px;font-size:11px;}
.pc-company{font-weight:700;color:var(--text);margin-bottom:1px;}
.pc-detail{color:var(--text2);font-size:10px;}
.pc-empty{font-size:11px;color:var(--text3);}
/* 경유지 라인 구조 */
.rp-route-row{display:flex;gap:8px;margin-bottom:2px;}
.rp-route-line-col{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0;padding-top:14px;}
.rp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.rp-dot-from{background:#3B82F6;}
.rp-dot-to{background:#EF4444;}
.rp-dot-via{background:#A78BFA;}
.rp-vline{flex:1;width:1.5px;background:rgba(255,255,255,.12);min-height:10px;}
.rp-route-content{flex:1;min-width:0;padding-bottom:4px;overflow:hidden;}
.rp-add-via{width:100%;padding:6px;border-radius:7px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);color:#8B98B8;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin:2px 0;}
.rp-add-via:hover{background:rgba(255,255,255,.08);color:var(--text);}
/* 경유지 슬롯 */
.rp-via-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;min-width:0;overflow:hidden;}
.rp-via-slot{width:0;flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);border-radius:7px;padding:5px 8px;overflow:hidden;}
.rp-via-label{font-size:9px;color:#A78BFA;font-weight:700;flex-shrink:0;white-space:nowrap;}
.rp-via-name{font-size:11px;font-weight:700;color:#F0F4FF;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-via-del{background:none;border:none;color:#4A5568;font-size:11px;cursor:pointer;padding:0;flex-shrink:0;}
.rp-via-order{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.rp-via-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;color:#8B98B8;font-size:9px;cursor:pointer;padding:1px 4px;line-height:1;}
.rp-via-btn:hover{background:rgba(255,255,255,.14);}
/* 선택고객 경유지 버튼 */
.scc-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.scc-via{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#A78BFA;}
.scc-via:hover{background:rgba(139,92,246,.22);}
/* 길찾기 열기 버튼 */
.route-open-bar{padding:10px 14px;border-top:1px solid var(--bdr);flex-shrink:0;}
.route-open-btn{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(232,201,122,.3);background:rgba(232,201,122,.1);color:var(--gold2);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.route-open-btn:hover{background:rgba(232,201,122,.2);}
.route-open-btn.has-route{background:rgba(232,201,122,.25);border-color:var(--gold2);}
/* 길찾기 팝업 */
.route-popup{position:absolute;background:rgba(13,22,40,.97);border:1px solid rgba(255,255,255,.14);border-radius:16px;width:280px;max-width:280px;min-width:280px;max-height:calc(100% - 24px);overflow:hidden;display:flex;flex-direction:column;z-index:8000;box-shadow:0 8px 32px rgba(0,0,0,.6);right:12px;bottom:12px;}
.route-popup-header{background:rgba(255,255,255,.04);padding:8px 14px 8px;border-bottom:1px solid rgba(255,255,255,.07);cursor:grab;flex-shrink:0;user-select:none;}
.route-popup-header:active{cursor:grabbing;}
.route-popup-body{padding:12px 14px;overflow-y:auto;flex:1;}
.rp-reset-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:var(--text2);font-size:10px;padding:3px 8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.rp-popup-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;line-height:1;}
/* 길찾기 패널 */
.route-panel{border-top:1px solid var(--bdr);padding:12px 14px;flex-shrink:0;background:var(--bg2);}
.rp-title{font-size:10px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-bottom:8px;}
.rp-label{font-size:10px;color:var(--text2);margin-bottom:4px;}
.rp-from-row{display:flex;gap:4px;margin-bottom:4px;min-width:0;overflow:hidden;}
.rp-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:7px;padding:6px 8px;min-height:30px;}
.rp-slot.has-from{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.25);}
.rp-slot.has-to{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25);}
.rp-slot-text{font-size:11px;color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-slot.has-from .rp-slot-text{color:#60A5FA;font-weight:700;}
.rp-slot.has-to .rp-slot-text{color:#F87171;font-weight:700;}
.rp-clear{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0;}
.rp-myloc{padding:5px 9px;border-radius:7px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.12);color:#60A5FA;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0;}
.rp-input{width:100%;padding:5px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:7px;color:var(--text);font-size:11px;font-family:'Noto Sans KR',sans-serif;margin-bottom:6px;box-sizing:border-box;}
.rp-input:focus{outline:none;border-color:var(--gold);}
.rp-swap-row{display:flex;align-items:center;gap:6px;margin:4px 0 8px;}
.rp-line{flex:1;height:1px;background:var(--bdr);}
.rp-swap{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);color:var(--text2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rp-swap:hover{background:rgba(255,255,255,.1);}
.rp-nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;opacity:.3;pointer-events:none;}
.rp-nav-btns.active{opacity:1;pointer-events:all;}
.rp-nav-btn{padding:7px 4px;border-radius:7px;text-align:center;background:rgba(232,201,122,.08);border:1px solid rgba(232,201,122,.2);color:var(--gold2);font-size:11px;font-weight:700;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;}
.rp-nav-btn span{font-size:9px;}
.rp-nav-btn:hover{background:rgba(232,201,122,.18);}
.rp-hint{font-size:10px;color:var(--text3);text-align:center;margin-top:5px;}
.rp-mapsel{padding:5px 8px;border-radius:7px;border:1px solid rgba(232,201,122,.25);background:rgba(232,201,122,.08);color:var(--gold2);font-size:12px;cursor:pointer;flex-shrink:0;transition:all .2s;}
.rp-mapsel:hover{background:rgba(232,201,122,.18);}
.rp-mapsel.active{background:rgba(232,201,122,.3);border-color:var(--gold2);}
.map-select-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(37,99,235,.95);border-radius:20px;padding:9px 16px;display:flex;align-items:center;gap:8px;z-index:500;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.msb-icon{font-size:14px;}
.msb-text{font-size:12px;font-weight:700;color:#fff;}
.msb-cancel{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:3px 10px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.msb-cancel:hover{background:rgba(255,255,255,.35);}
/* 내 위치 버튼 */
.myloc-btn{padding:8px 11px;border:none;border-radius:8px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60A5FA;font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.myloc-btn:hover{background:rgba(59,130,246,.28);}
.pinbase-btn{padding:8px 11px;border:none;border-radius:8px;background:rgba(232,201,122,.1);border:1px solid rgba(232,201,122,.3);color:var(--gold2);font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.pinbase-btn:hover{background:rgba(232,201,122,.22);}
.pinbase-btn.active{background:rgba(232,201,122,.3);border-color:var(--gold2);}
.myloc-btn:hover{background:rgba(59,130,246,.28);}
.myloc-btn.loading{opacity:.6;cursor:wait;}

/* 검색 결과 목록 */
.search-result-list{background:rgba(13,22,40,.98);border:1px solid rgba(232,201,122,.25);border-radius:10px;margin-top:6px;overflow:hidden;}
.srl-items-wrap{max-height:260px;overflow-y:auto;}
.srl-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);}
.srl-title{font-size:10px;font-weight:700;color:var(--gold2);}
.srl-cancel{background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:0;}

<script>
// ── 카카오 API 키 ────────────────────────────────────
var KAKAO_JS_KEY   = 'cbfa60013e8c77c5a8c168d4d5862d51';
var KAKAO_REST_KEY = '281bb27cc451ac8e5f6bf303af9fec09';

// ── 전역 변수 ────────────────────────────────────────
var kakaoMap = null;
var markers  = [];
var circles  = [];
var radiusKm = 5;
var centerLat = 0, centerLng = 0;
var selectedCustomerId = null;
var allCustomers = [];
var routeFrom = null;
var routeTo   = null;
var panelFrom = null;  // { name, lat, lng }
var panelTo   = null;  // { name, lat, lng, address }
var panelVia  = [];    // [{ name, lat, lng }]
var mapSelectMode = null;
var mapSelectMarker = null;
var mapSelectOverlay = null;
var routeFromMarker = null;   var routeFromOverlay = null;
var routeToMarker   = null;   var routeToOverlay   = null;
var routeViaMarkers = [];
var selectedPanelCustomer = null;
var myLocMarker  = null;
var myLocOverlay = null;
var centerOverlay = null;
var centerMarkerGlobal = null;
var pinBaseMode = false;
var pinBaseMarker = null;
var myLat = null, myLng = null;
var isCustomerMode = false;

// ── 길찾기 핀 헬퍼 ──────────────────────────────────
function makeRoutePinImage(color, label) {
  var lines = label.length > 3 ? [label.slice(0,3), label.slice(3)] : [label];
  var lineH = 13, pad = 6, minW = 32;
  var textW = Math.max(minW, label.length * 7 + pad * 2);
  var boxH = lines.length > 1 ? 24 : 16;
  var totalH = 36 + boxH + 4;
  var cx = textW / 2;
  var textEls = lines.map(function(t, i) {
    return '<text x="' + cx + '" y="' + (boxH/2 + (i - (lines.length-1)/2) * lineH) + '" text-anchor="middle" dominant-baseline="middle" font-family="\'Noto Sans KR\',Arial,sans-serif" font-size="10" font-weight="700" fill="#0D1628">' + t + '</text>';
  }).join('');
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + textW + '" height="' + totalH + '" viewBox="0 0 ' + textW + ' ' + totalH + '">'
    + '<rect x="1" y="1" width="' + (textW-2) + '" height="' + (boxH-2) + '" rx="5" ry="5" fill="' + color + '" stroke="white" stroke-width="1.5"/>'
    + textEls
    + '<polygon points="' + (cx-6) + ',' + boxH + ' ' + (cx+6) + ',' + boxH + ' ' + cx + ',' + (boxH+4) + '" fill="' + color + '"/>'
    + '<g transform="translate(' + (cx-14) + ',' + (boxH+4) + ')">'
    + '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '"/>'
    + '<circle cx="14" cy="14" r="5" fill="white" opacity="0.9"/>'
    + '</g>'
    + '</svg>';
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(textW, totalH),
    { offset: new kakao.maps.Point(cx, totalH) }
  );
}

function makeRouteAddrOverlay(pos, addrText, color) {
  var el = document.createElement('div');
  el.style.cssText = 'background:' + color + ';color:#fff;font-size:10px;font-weight:700;'
    + 'padding:2px 8px;border-radius:5px;white-space:nowrap;max-width:160px;overflow:hidden;'
    + 'text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none;';
  el.textContent = addrText;
  return new kakao.maps.CustomOverlay({ position:pos, content:el, yAnchor:4.2, zIndex:5 });
}

function updateRoutePinAddr(type, pos, addrText) {
  var color = type === 'from' ? '#3B82F6' : type === 'to' ? '#EF4444' : '#A78BFA';
  if(type === 'from') {
    if(routeFromOverlay) routeFromOverlay.setMap(null);
    routeFromOverlay = makeRouteAddrOverlay(pos, addrText, color);
    routeFromOverlay.setMap(kakaoMap);
  } else if(type === 'to') {
    if(routeToOverlay) routeToOverlay.setMap(null);
    routeToOverlay = makeRouteAddrOverlay(pos, addrText, color);
    routeToOverlay.setMap(kakaoMap);
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi]) {
      if(routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
      routeViaMarkers[vi].overlay = makeRouteAddrOverlay(pos, addrText, color);
      routeViaMarkers[vi].overlay.setMap(kakaoMap);
    }
  }
}

function attachRoutePinDrag(marker, type) {
  var geocoder = new kakao.maps.services.Geocoder();
  var dragTimer = null;
  kakao.maps.event.addListener(marker, 'drag', function() {
    var p = marker.getPosition();
    if(dragTimer) clearTimeout(dragTimer);
    dragTimer = setTimeout(function() {
      geocoder.coord2Address(p.getLng(), p.getLat(), function(result, status) {
        var a = p.getLat().toFixed(4) + ',' + p.getLng().toFixed(4);
        if(status === kakao.maps.services.Status.OK && result.length > 0) {
          var r = result[0];
          a = r.road_address ? r.road_address.address_name : r.address.address_name;
        }
        updateRoutePinAddr(type, marker.getPosition(), a);
      });
    }, 200);
  });
  kakao.maps.event.addListener(marker, 'dragend', function() {
    if(dragTimer) clearTimeout(dragTimer);
    var p = marker.getPosition();
    geocoder.coord2Address(p.getLng(), p.getLat(), function(result, status) {
      var a = p.getLat().toFixed(4) + ',' + p.getLng().toFixed(4);
      if(status === kakao.maps.services.Status.OK && result.length > 0) {
        var r = result[0];
        a = r.road_address ? r.road_address.address_name : r.address.address_name;
      }
      var obj = { name:a, lat:String(p.getLat()), lng:String(p.getLng()), address:a };
      if(type === 'from') panelFrom = obj;
      else if(type === 'to') panelTo = obj;
      else if(type && type.indexOf('via_') === 0) {
        var vi = parseInt(type.split('_')[1], 10);
        if(vi >= 0 && vi < panelVia.length) panelVia[vi] = obj;
      }
      updateRoutePinAddr(type, p, a);
      renderRoutePanel();
    });
  });
}

function setRoutePin(type, pos, labelText) {
  var color = type === 'from' ? '#3B82F6' : type === 'to' ? '#EF4444' : '#A78BFA';
  var img = makeRoutePinImage(color, labelText);
  if(type === 'from') {
    if(routeFromMarker){ routeFromMarker.setMap(null); }
    if(routeFromOverlay){ routeFromOverlay.setMap(null); }
    routeFromMarker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    routeFromOverlay = makeRouteAddrOverlay(pos, labelText, color);
    routeFromOverlay.setMap(kakaoMap);
    attachRoutePinDrag(routeFromMarker, type);
  } else if(type === 'to') {
    if(routeToMarker){ routeToMarker.setMap(null); }
    if(routeToOverlay){ routeToOverlay.setMap(null); }
    routeToMarker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    routeToOverlay = makeRouteAddrOverlay(pos, labelText, color);
    routeToOverlay.setMap(kakaoMap);
    attachRoutePinDrag(routeToMarker, type);
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi] && routeViaMarkers[vi].marker) routeViaMarkers[vi].marker.setMap(null);
    if(routeViaMarkers[vi] && routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
    var vm = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    var vo = makeRouteAddrOverlay(pos, labelText, color);
    vo.setMap(kakaoMap);
    routeViaMarkers[vi] = { marker:vm, overlay:vo };
    attachRoutePinDrag(vm, type);
  }
}

function clearRoutePin(type) {
  if(type === 'from') {
    if(routeFromMarker){ routeFromMarker.setMap(null); routeFromMarker = null; }
    if(routeFromOverlay){ routeFromOverlay.setMap(null); routeFromOverlay = null; }
  } else if(type === 'to') {
    if(routeToMarker){ routeToMarker.setMap(null); routeToMarker = null; }
    if(routeToOverlay){ routeToOverlay.setMap(null); routeToOverlay = null; }
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi]) {
      if(routeViaMarkers[vi].marker) routeViaMarkers[vi].marker.setMap(null);
      if(routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
      routeViaMarkers[vi] = null;
    }
  }
}

function clearAllRoutePins() {
  clearRoutePin('from'); clearRoutePin('to');
  routeViaMarkers.forEach(function(vm){
    if(vm) {
      if(vm.marker) vm.marker.setMap(null);
      if(vm.overlay) vm.overlay.setMap(null);
    }
  });
  routeViaMarkers = [];
}

function getRoutePinLabel(type) {
  if(type === 'from') return '출발';
  if(type === 'to') return '도착';
  if(type && type.indexOf('via_') === 0) {
    var n = parseInt(type.split('_')[1], 10) + 1;
    return '경유' + n;
  }
  return '';
}

// ── 초기화 ───────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  // 고객 데이터 로드
  try { allCustomers = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){}

  // sessionStorage에서 타겟 정보
  var target = null;
  try { target = JSON.parse(sessionStorage.getItem('nearbyTarget') || 'null'); } catch(e){}
  if(target) {
    isCustomerMode = true;
    if(target.id) {
      window._baseCustomerId = target.id;
    } else if(target.name && target.lat) {
      var matchedC = allCustomers.filter(function(a){ return a.name == target.name && String(a.lat) == String(parseFloat(target.lat).toFixed(4)).slice(0,7); })[0];
      if(!matchedC) matchedC = allCustomers.filter(function(a){ return a.name == target.name; })[0];
      if(matchedC) window._baseCustomerId = matchedC.id;
    }
    document.getElementById('targetName').textContent = target.name || '—';
    document.getElementById('targetAddr').textContent = target.address || '주소를 입력해주세요';
    document.getElementById('addrInput').value        = target.address || '';
    document.getElementById('headerSub').textContent  = target.name + ' 주변 고객 찾기';
    if(target.lat && target.lng) {
      centerLat = parseFloat(target.lat);
      centerLng = parseFloat(target.lng);
    }
    sessionStorage.removeItem('nearbyTarget');
  }

  // 기준 고객 카드 클릭 → 지도 해당 위치로 이동

    var popup = document.getElementById('mapPopup');
    var handle = document.getElementById('phead');
    if(!popup || !handle) return;
    var dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

    function dragStart(cx, cy){
      dragging = true;
      startX = cx; startY = cy;
      origLeft = parseInt(popup.style.left) || 0;
      origTop  = parseInt(popup.style.top)  || 0;
      popup.style.transition = 'none';
    }
    function dragMove(cx, cy){
      if(!dragging) return;
      var dx = cx - startX, dy = cy - startY;
      var mapWrap = document.querySelector('.map-wrap');
      var mw = mapWrap ? mapWrap.offsetWidth  : window.innerWidth;
      var mh = mapWrap ? mapWrap.offsetHeight : window.innerHeight;
      var nx = Math.max(0, Math.min(origLeft + dx, mw - popup.offsetWidth));
      var ny = Math.max(0, Math.min(origTop  + dy, mh - popup.offsetHeight));
      popup.style.left = nx + 'px';
      popup.style.top  = ny + 'px';
    }
    function dragEnd(){ dragging = false; }

    handle.addEventListener('mousedown',  function(e){ dragStart(e.clientX, e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ dragMove(e.clientX, e.clientY); });
    document.addEventListener('mouseup',   dragEnd);
    handle.addEventListener('touchstart',  function(e){ var t=e.touches[0]; dragStart(t.clientX, t.clientY); }, {passive:true});
    document.addEventListener('touchmove',  function(e){ if(!dragging) return; var t=e.touches[0]; dragMove(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});

    function dm(cx,cy){ if(!dragging) return; var mw=rp.parentElement.offsetWidth||window.innerWidth; var mh=rp.parentElement.offsetHeight||window.innerHeight; var nr=Math.max(0, ox-(cx-sx)); var nb=Math.max(0, oy-(cy-sy)); nr=Math.min(nr, mw-rp.offsetWidth); nb=Math.min(nb, mh-rp.offsetHeight); rp.style.right=nr+'px'; rp.style.bottom=nb+'px'; }
    function de(){ dragging=false; }
    hd.addEventListener('mousedown', function(e){ ds(e.clientX,e.clientY); e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ dm(e.clientX,e.clientY); });
    document.addEventListener('mouseup', de);
    hd.addEventListener('touchstart', function(e){ var t=e.touches[0]; ds(t.clientX,t.clientY); }, {passive:true});
    document.addEventListener('touchmove', function(e){ if(!dragging) return; var t=e.touches[0]; dm(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
    document.addEventListener('touchend', de);
  })();
});

// ── 카카오맵 로드 ────────────────────────────────────
function loadKakaoScript(key) {
  var existing = document.getElementById('kakaoScript');
  if(existing) existing.remove();
  var s = document.createElement('script');
  s.id  = 'kakaoScript';
  s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey='+key+'&libraries=services&autoload=false';
  s.onload = function() {
    if(typeof kakao === 'undefined' || !kakao.maps) {
      console.error('[NEARBY] kakao 객체 없음 - 도메인 미등록 가능성');
      alert('지도 SDK 로드 실패.\n현재 주소: ' + window.location.origin + '\n이 주소가 카카오 콘솔 도메인과 일치하는지 확인하세요.');
      return;
    }
    kakao.maps.load(function() {
      var container = document.getElementById('kakaoMap');
      var options = { center: new kakao.maps.LatLng(35.1631, 129.1635), level: 7 };
      kakaoMap = new kakao.maps.Map(container, options);
      console.log('[NEARBY] 지도 로드 성공');

      // 지도 클릭 → 선택 모드일 때 위치 설정
      kakao.maps.event.addListener(kakaoMap, 'click', function(mouseEvent) {
        // 핀잡기 모드 처리
        if(pinBaseMode) {
          var latlng = mouseEvent.latLng;

          // 기존 임시 핀 제거
          if(pinBaseMarker){ pinBaseMarker.setMap(null); pinBaseMarker = null; }

          // 파란 핀 생성 (draggable)
          var svgCenter = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
            +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="#3B82F6"/>'
            +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.95"/>'
            +'</svg>';
          var centerImg = new kakao.maps.MarkerImage(
            'data:image/svg+xml;base64,'+btoa(svgCenter),
            new kakao.maps.Size(28,36),
            { offset: new kakao.maps.Point(14,36) }
          );
          pinBaseMarker = new kakao.maps.Marker({
            position: latlng,
            map: kakaoMap,
            image: centerImg,
            draggable: true,
            title: '기준 위치 (드래그로 이동)'
          });

          // 역지오코딩 후 기준 설정
          function applyBase(pos) {
            var geocoder2 = new kakao.maps.services.Geocoder();
            geocoder2.coord2Address(pos.getLng(), pos.getLat(), function(result, status) {
              var addrStr = pos.getLat().toFixed(4)+', '+pos.getLng().toFixed(4);
              if(status === kakao.maps.services.Status.OK && result.length > 0) {
                var r = result[0];
                addrStr = r.road_address ? r.road_address.address_name : r.address.address_name;
              }
              centerLat = pos.getLat(); centerLng = pos.getLng();
              var mlabel = document.querySelector('.mlabel');
              if(mlabel) mlabel.textContent = '📌 기준 위치';
              document.getElementById('targetName').textContent = addrStr;
              document.getElementById('targetAddr').textContent = '';
              // pinBaseMarker 제거 후 drawNearby로 파란 핀 + 라벨 + 클릭 이벤트 생성
              if(pinBaseMarker){ pinBaseMarker.setMap(null); pinBaseMarker = null; }
              drawNearby(centerLat, centerLng);
            });
          }

          // 기존 기준 파란 핀 제거
          if(centerMarkerGlobal){ centerMarkerGlobal.setMap(null); centerMarkerGlobal = null; }
          if(centerOverlay){ centerOverlay.setMap(null); centerOverlay = null; }

          applyBase(latlng);

          // 드래그 완료 시에도 재적용
          kakao.maps.event.addListener(pinBaseMarker, 'dragend', function(){
            applyBase(pinBaseMarker.getPosition());
          });

          // 모드 종료 — 버튼은 active 유지 (한 번 더 누르면 취소)
          pinBaseMode = false;
          var btn = document.getElementById('btnPinBase');
          if(btn) btn.className = 'pinbase-btn active';
          var banner = document.getElementById('mapSelectBanner');
          if(banner) banner.style.display = 'none';
          kakaoMap.setCursor('');
          return;
        }

        // 길찾기 지도선택 모드 처리
        if(!mapSelectMode) return;
        var latlng = mouseEvent.latLng;
          var curMode = mapSelectMode;
          exitMapSelectMode();

          (function(mode, pos) {
            var gc = new kakao.maps.services.Geocoder();
            gc.coord2Address(pos.getLng(), pos.getLat(), function(result, status) {
              var a = pos.getLat().toFixed(4) + ',' + pos.getLng().toFixed(4);
              if(status === kakao.maps.services.Status.OK && result.length > 0) {
                var r = result[0];
                a = r.road_address ? r.road_address.address_name : r.address.address_name;
              }
              var obj = { name:a, lat:String(pos.getLat()), lng:String(pos.getLng()), address:a };
              if(mode === 'from') panelFrom = obj;
              else if(mode === 'to') panelTo = obj;
              else if(mode && mode.indexOf('via_') === 0) {
                var vi = parseInt(mode.split('_')[1], 10);
                if(vi >= 0 && vi < panelVia.length) panelVia[vi] = obj;
              }
              var pinLabel = getRoutePinLabel(mode);
              setRoutePin(mode, pos, pinLabel);
              updateRoutePinAddr(mode, pos, a);
              renderRoutePanel();
            });
          })(curMode, latlng);
      });
      var addr = document.getElementById('addrInput').value.trim();
      if(addr) searchAddr();
    });
  };
  s.onerror = function() {
    console.error('[NEARBY] SDK 스크립트 로드 자체 실패');
    console.error('[NEARBY] 현재 주소(origin):', window.location.origin);
    console.error('[NEARBY] 사용 키:', key);
    alert('지도 SDK 스크립트 로드 실패\n\n현재 페이지 주소: ' + window.location.origin + '\n\n카카오 콘솔 JavaScript SDK 도메인에\n위 주소가 정확히 등록되어 있어야 합니다.\n저장 후 5~10분 기다린 뒤 Ctrl+Shift+R 새로고침하세요.');
  };
  document.head.appendChild(s);
}

// ── 주소 검색 ────────────────────────────────────────
function searchAddr() {
  if(!kakaoMap) { alert('먼저 지도를 불러주세요'); return; }
  var addr = document.getElementById('addrInput').value.trim();
  if(!addr) { alert('주소를 입력해주세요'); return; }

  var list = document.getElementById('searchResultList');
  var items = document.getElementById('srlItems');
  var title = document.getElementById('srlTitle');
  if(!list || !items) return;

  // 로딩 표시
  list.style.display = '';
  items.innerHTML = '<div class="srl-loading"><div style="width:12px;height:12px;border-radius:50%;border:2px solid #60A5FA;border-top-color:transparent;animation:srl-spin .7s linear infinite;flex-shrink:0;"></div>카카오맵 검색 중...</div>';
  title.textContent = '"' + addr + '" 검색 중...';

  var places = new kakao.maps.services.Places();
  var searchLat = (centerLat && centerLat != 0) ? centerLat : 35.1796;
  var searchLng = (centerLng && centerLng != 0) ? centerLng : 129.0756;
  places.keywordSearch(addr, function(result, status) {
    if(status === kakao.maps.services.Status.OK && result.length > 0) {
      showSearchResults(result, addr);
    } else {
      // 주소 검색 fallback
      var geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(addr, function(result2, status2) {
        if(status2 === kakao.maps.services.Status.OK && result2.length > 0) {
          showSearchResults(result2.map(function(r){
            return { place_name: r.address_name, address_name: r.address_name, road_address_name:'', category_name:'주소', x: r.x, y: r.y, phone:'' };
          }), addr);
        } else {
          items.innerHTML = '<div class="srl-loading">😕 검색 결과가 없습니다</div>';
          title.textContent = '"' + addr + '" 결과 없음';
        }
      });
    }
  }, {
    location: new kakao.maps.LatLng(searchLat, searchLng),
    sort: kakao.maps.services.SortBy.DISTANCE
  });
}

function showSearchResults(results, keyword) {
  var list = document.getElementById('searchResultList');
  var items = document.getElementById('srlItems');
  var title = document.getElementById('srlTitle');
  if(!list || !items) return;

  title.textContent = '"' + keyword + '" 검색결과 ' + results.length + '건';
  items.innerHTML = '';

  // 검색어 포함된 항목 상단으로 정렬
  var kw = keyword.replace(/\s/g,'').toLowerCase();
  var sorted = results.slice().sort(function(a, b) {
    var an = a.place_name.replace(/\s/g,'').toLowerCase();
    var bn = b.place_name.replace(/\s/g,'').toLowerCase();
    var aMatch = an.indexOf(kw) !== -1 ? 0 : 1;
    var bMatch = bn.indexOf(kw) !== -1 ? 0 : 1;
    return aMatch - bMatch;
  });

  sorted.slice(0, 15).forEach(function(p, idx) {
    var item = document.createElement('div');
    var kw2 = keyword.replace(/\s/g,'').toLowerCase();
    var pn = p.place_name.replace(/\s/g,'').toLowerCase();
    var isFirst = idx === 0 || pn.indexOf(kw2) !== -1;
    item.className = 'srl-item' + (idx === 0 ? ' srl-first' : '');

    var distStr = '';
    if(p.distance) {
      var d = parseInt(p.distance, 10);
      distStr = d < 1000 ? d + 'm' : (d/1000).toFixed(1) + 'km';
    }

    item.innerHTML = '<div class="srl-item-top">'
      +'<span class="srl-item-name">'+p.place_name+'</span>'
      +(distStr ? '<span class="srl-item-dist">'+distStr+'</span>' : '')
      +'</div>'
      +'<div class="srl-item-addr">'+(p.road_address_name || p.address_name || '')+'</div>'
      +(p.category_name ? '<div class="srl-item-cat">'+p.category_name.split(' > ').pop()+(p.phone?' · '+p.phone:'')+'</div>' : '');

    (function(place){
      item.addEventListener('click', function(){
        // 기준 위치 설정
        var lat = parseFloat(place.y);
        var lng = parseFloat(place.x);
        centerLat = lat; centerLng = lng;
        var mlabelEl3 = document.querySelector('.mlabel');
        if(mlabelEl3) mlabelEl3.textContent = isCustomerMode ? '📅 기준 고객' : '🔍 기준 위치';
        if(!isCustomerMode) {
          document.getElementById('targetName').textContent = place.place_name;
        }
        document.getElementById('targetAddr').textContent = place.road_address_name || place.address_name || '';
        // 결과 목록 닫기
        document.getElementById('searchResultList').style.display = 'none';
        document.getElementById('addrInput').value = '';
        // 지도 이동 + 주변 재계산
        drawNearby(lat, lng);
      });
    })(p);

    items.appendChild(item);
  });

  // 취소 버튼
  var cancel = document.getElementById('srlCancel');
  if(cancel) {
    cancel.onclick = function(){
      list.style.display = 'none';
      document.getElementById('addrInput').value = '';
    };
  }
}

// spin 애니메이션 (CSS에 없으면 동적 추가)
(function(){
  if(!document.getElementById('srl-style')) {

// ── 고객 마커+반경만 재계산 (기준 핀 유지) ──────────────
function refreshNearbyOnly(lat, lng) {
  // 고객 마커만 제거 (index 1 이후: 0은 기준마커)
  // 실제론 markers[0]이 기준 마커 — nearbyMarkers만 지우기
  if(window._nearbyMarkers) {
    window._nearbyMarkers.forEach(function(nm){
      if(nm.marker) nm.marker.setMap(null);
    });
    window._nearbyMarkers = [];
  }
  // 반경원 제거 후 재생성
  circles.forEach(function(c){ c.setMap(null); });
  circles = [];

  var centerPos = new kakao.maps.LatLng(lat, lng);

  // 반경 원 재생성
  var circle = new kakao.maps.Circle({
    center: centerPos,
    radius: radiusKm * 1000,
    strokeWeight: 2,
    strokeColor: '#60A5FA',
    strokeOpacity: 1.0,
    strokeStyle: 'dashed',
    fillColor: '#3B82F6',
    fillOpacity: 0.12
  });
  circle.setMap(kakaoMap);
  circles.push(circle);

  // 반경 라벨
  var labelLng = lng + (radiusKm * 1000 / 111320 / Math.cos(lat * Math.PI / 180));
  var radiusLabelEl = document.createElement('div');
  radiusLabelEl.style.cssText = 'background:rgba(96,165,250,.85);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.3);';
  radiusLabelEl.textContent = radiusKm + 'km';
  var radiusOverlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(lat, labelLng),
    content: radiusLabelEl,
    yAnchor: 0.5
  });
  radiusOverlay.setMap(kakaoMap);
  circles.push(radiusOverlay);

  // 고객 필터 + 리스트 + 마커 재렌더
  var nearby = [];
  allCustomers.forEach(function(c) {
    if(!c.lat || !c.lng) return;
    var dist = getDistKm(lat, lng, parseFloat(c.lat), parseFloat(c.lng));
    if(dist <= radiusKm) nearby.push({ c:c, dist:dist });
  });
  nearby.sort(function(a,b){ return a.dist-b.dist; });
  document.getElementById('resultCount').innerHTML = '반경 '+radiusKm+'km 내 고객 <b>'+nearby.length+'명</b> 발견';

  if(!nearby.length) {

  var listHtml = '';

    var c = item.c; var dist = item.dist;
    var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
    var tagClass = c.customerType==='계약'?'tc':c.customerType==='관리'?'tm':'tw';
    var tagText  = c.customerType||'고객';

    if(evInfo.hasCustom) evDots += '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#A78BFA;margin-left:2px;vertical-align:middle;"></span>';
    listHtml += '<div class="ci" id="citem_'+idx+'"><div class="ctop"><span class="cn">'+c.name+evDots+'</span><span class="cd">'+distStr+'</span></div><div class="ci2">'+(c.address||'주소 미등록')+'<span class="ctag '+tagClass+'">'+tagText+'</span></div></div>';

    var pos = new kakao.maps.LatLng(parseFloat(c.lat), parseFloat(c.lng));
    var color = c.customerType==='계약'?'#10B981':c.customerType==='관리'?'#8B5CF6':'#F59E0B';
    var svgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
      +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'"/>'
      +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>'
      +'</svg>';

    var marker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:markerImg, title:c.name });
    nearbyMarkers.push({ marker:marker, labelEl:null, pos:pos, color:color });

    var evInfo = getUpcomingEvents(c);

    labelEl.style.cssText = 'position:relative;display:inline-flex;align-items:center;gap:0;background:rgba(13,22,40,.9);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;color:#F0F4FF;white-space:nowrap;margin-bottom:2px;cursor:pointer';

      if(evInfo.hasEvent){ var d1=document.createElement('div'); d1.style.cssText='width:7px;height:7px;border-radius:50%;background:#E8C97A;border:1px solid rgba(13,22,40,.8)'; dotWrap.appendChild(d1); }
      if(evInfo.hasCustom){ var d2=document.createElement('div'); d2.style.cssText='width:7px;height:7px;border-radius:50%;background:#A78BFA;border:1px solid rgba(13,22,40,.8)'; dotWrap.appendChild(d2); }
      labelEl.appendChild(dotWrap);
    }
    (function(customer, distance){ function fire(e){ if(e){e.preventDefault();e.stopPropagation();} showPopup(customer, distance); } labelEl.addEventListener('click', fire); labelEl.addEventListener('touchstart', fire); })(c, dist);
    var nameOverlay = new kakao.maps.CustomOverlay({ position:pos, content:labelEl, yAnchor:3.0, clickable:true, zIndex:1 });
    nameOverlay.setMap(kakaoMap);
    nearbyMarkers[nearbyMarkers.length-1].labelEl = labelEl;
    nearbyMarkers[nearbyMarkers.length-1].overlay = nameOverlay;
    (function(customer, distance, markerEl){ kakao.maps.event.addListener(markerEl, 'click', function(){ showPopup(customer, distance); }); })(c, dist, marker);
  });

  document.getElementById('clist').innerHTML = listHtml;
  window._nearbyList = nearby;
  window._nearbyMarkers = nearbyMarkers;

  nearby.forEach(function(item, idx){

// ── 이벤트 D-day 계산 (D-3 ~ D-0) ──────────────────
function calcDday(dateStr, repeat) {
  if(!dateStr) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var parts = dateStr.split('-');
  if(parts.length < 2) return null;
  var target;
  if(repeat === '매년' || repeat === '매년반복') {
    var m = parseInt(parts[1],10)-1;
    var d = parseInt(parts[2]||1,10);
    target = new Date(today.getFullYear(), m, d);
    if(target < today) target.setFullYear(today.getFullYear()+1);
  } else {
    target = new Date(dateStr);
  }
  target.setHours(0,0,0,0);
  var diff = Math.round((target - today) / 86400000);
  return diff;
}

function getUpcomingEvents(c) {
  var result = { events:[], hasEvent:false, hasCustom:false };
  if(c.events && c.events.length) {
    c.events.forEach(function(ev){
      var d = calcDday(ev.alertDate || ev.date, ev.repeat || ev.trigger);
      if(d !== null && d >= 0 && d <= 3) {
        result.events.push({ name:ev.name, dday:d, date:ev.alertDate||ev.date, repeat:ev.repeat||ev.trigger, type:'event' });
        result.hasEvent = true;
      }
    });
  }
  if(c.etcNote && c.etcNote.trim()) {
    var noteLines = c.etcNote.split('\n').filter(function(l){ return l.trim(); });
    noteLines.forEach(function(line){
      result.events.push({ name:line.trim(), dday:null, date:'', repeat:'', type:'custom' });
      result.hasCustom = true;
    });
  }
  return result;
}

function findCustomerById(id) {
  for(var i=0; i<allCustomers.length; i++){
    if(allCustomers[i].id === id) return allCustomers[i];
  }
  if(window._nearbyList){
    for(var j=0; j<window._nearbyList.length; j++){
      if(window._nearbyList[j].c.id === id) return window._nearbyList[j].c;
    }
  }
  return null;
}

// ── 고객 선택 ────────────────────────────────────────
function selectCustomer(idx) {
  document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
  var el = document.getElementById('citem_'+idx);
  if(el) el.classList.add('sel');
  var item = window._nearbyList[idx];
  if(item) showPopup(item.c, item.dist);

  // 지도 이동 + 라벨 하이라이트
  if(kakaoMap && window._nearbyMarkers && window._nearbyMarkers[idx]) {
    var nm = window._nearbyMarkers[idx];
    kakaoMap.setCenter(nm.pos);

    // 모든 라벨 원래 스타일로
    window._nearbyMarkers.forEach(function(m){
      if(m.labelEl) {
        m.labelEl.style.background = 'rgba(13,22,40,.9)';
        m.labelEl.style.border = '1px solid rgba(255,255,255,.16)';
        m.labelEl.style.transform = 'scale(1)';
        m.labelEl.style.zIndex = '';
      }
      if(m.overlay) m.overlay.setZIndex(1);
      if(m.marker) m.marker.setZIndex(1);
    });

    // 선택된 라벨 하이라이트
    if(nm.labelEl) {
      nm.labelEl.style.background = nm.color || 'rgba(16,185,129,.9)';
      nm.labelEl.style.border = '1px solid rgba(255,255,255,.4)';
      nm.labelEl.style.transform = 'scale(1.15)';
      nm.labelEl.style.zIndex = '100';
    }
    if(nm.overlay) nm.overlay.setZIndex(10);
    if(nm.marker) nm.marker.setZIndex(10);
  }
}

// ── 팝업 표시 ────────────────────────────────────────
function showPopup(c, dist) {
  // 이미 열린 팝업의 같은 고객 클릭 → 닫기 + 선택 카드 숨김
  var popup = document.getElementById('mapPopup');
  if(popup && popup.style.display !== 'none' && selectedCustomerId === c.id) {
    closePopup();
    var card = document.getElementById('selectedCustomerCard');
    if(card) card.style.display = 'none';
    selectedPanelCustomer = null;
    // 리스트 하이라이트 해제
    document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
    return;
  }

  console.log('[NEARBY] showPopup 호출:', c.name);
  console.log('[NEARBY] events:', JSON.stringify(c.events || []));
  console.log('[NEARBY] etcNote:', c.etcNote || '없음');
  selectedCustomerId = c.id;

  // 왼쪽 리스트 하이라이트 + 스크롤
  if(window._nearbyList) {
    document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
    window._nearbyList.forEach(function(item, idx){
      if(item.c.id === c.id) {
        var el = document.getElementById('citem_'+idx);
        if(el) {
          el.classList.add('sel');
          el.scrollIntoView({ behavior:'smooth', block:'nearest' });
        }
        // 라벨 하이라이트도 동기화
        if(window._nearbyMarkers && window._nearbyMarkers[idx]) {
          window._nearbyMarkers.forEach(function(m){
            if(m.labelEl) {
              m.labelEl.style.background = 'rgba(13,22,40,.9)';
              m.labelEl.style.border = '1px solid rgba(255,255,255,.16)';
              m.labelEl.style.transform = 'scale(1)';
              m.labelEl.style.zIndex = '';
            }
            if(m.overlay) m.overlay.setZIndex(1);
            if(m.marker) m.marker.setZIndex(1);
          });
          var nm = window._nearbyMarkers[idx];
          if(nm.labelEl) {
            nm.labelEl.style.background = nm.color || 'rgba(16,185,129,.9)';
            nm.labelEl.style.border = '1px solid rgba(255,255,255,.4)';
            nm.labelEl.style.transform = 'scale(1.15)';
            nm.labelEl.style.zIndex = '100';
          }
          if(nm.overlay) nm.overlay.setZIndex(10);
          if(nm.marker) nm.marker.setZIndex(10);
        }
      }
    });
  }

  var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
  var tagClass = c.customerType==='계약'?'tc':c.customerType==='관리'?'tm':'tw';

  var elName = document.getElementById('popupName');
  if(elName) elName.textContent = c.name;
  var elTag = document.getElementById('popupTag');
  if(elTag){ elTag.textContent = c.customerType||'고객'; elTag.className = 'ptag '+tagClass; }
  var elAddr = document.getElementById('popupAddr');
  if(elAddr) elAddr.textContent = '📍 '+(c.address||'주소 미등록')+' · '+distStr;
  var elPhone = document.getElementById('popupPhone');
  if(elPhone) elPhone.innerHTML = c.phone ? '📞 '+c.phone : '';
  var elContact = document.getElementById('popupContact');
  if(elContact) elContact.textContent = c.lastContact ? '마지막 연락: '+c.lastContact : '';

  // 이벤트 카드 렌더링
  var evSection = document.getElementById('popupEventSection');
  var evCards   = document.getElementById('popupEventCards');
  var evInfo = getUpcomingEvents(c);
  if(evSection && evCards) {
    if(evInfo.events.length > 0) {
      evSection.style.display = '';
      var html = '';
      evInfo.events.forEach(function(ev){
        if(ev.type === 'event') {
          var ddayStr = ev.dday === 0 ? '<span class="ev-dday-today">D-DAY</span>' : '<span class="ev-dday">D-'+ev.dday+'</span>';
          var repeatStr = (ev.repeat === '매년' || ev.repeat === '매년반복') ? ' (매년)' : '';
          html += '<div class="ev-card ev-card-event">'
            +'<div class="ev-card-row"><span class="ev-card-name">'+ev.name+'</span>'+ddayStr+'</div>'
            +'<div class="ev-date">'+ev.date+repeatStr+'</div>'
            +'</div>';
        } else {
          html += '<div class="ev-card ev-card-custom">'
            +'<div class="ev-section-label ev-section-label-custom">★ 커스텀 알림</div>'
            +'<div class="ev-card-name">'+ev.name+'</div>'
            +'</div>';
        }
      });
      if(evInfo.hasEvent) {
        evCards.innerHTML = '<div class="ev-section-label ev-section-label-event">🎂 이벤트</div>' + html;
      } else {
        evCards.innerHTML = html;
      }
    } else {
      evSection.style.display = 'none';
      evCards.innerHTML = '';
    }
  }

  // 계약 요약 렌더링
  var pcEl = document.getElementById('popupContracts');
  if(pcEl) {
    if(c.contracts && c.contracts.length > 0) {
      var pcHtml = '';
      c.contracts.slice(0,3).forEach(function(ct){
        pcHtml += '<div class="pc-item">'
          +'<div class="pc-company">'+(ct.company||ct.insurerName||'—')+'</div>'
          +'<div class="pc-detail">'+(ct.productName||ct.product||'')+(ct.premium?' · 월 '+ct.premium:'')+'</div>'
          +'</div>';
      });
      if(c.contracts.length > 3) pcHtml += '<div class="pc-detail" style="padding:2px 0;color:var(--text3)">외 '+(c.contracts.length-3)+'건 더보기</div>';
      pcEl.innerHTML = pcHtml;
    } else {
      pcEl.innerHTML = '<div class="pc-empty">계약 정보 없음</div>';
    }
  }

  // 선택 고객 카드 갱신
  selectedPanelCustomer = c;
  renderSelectedCustomerCard(c, dist);

  // 전화
  var bc = document.getElementById('btnCall');
  if(bc) bc.href = c.phone ? 'tel:'+c.phone.replace(/-/g,'') : '#';

  // 카카오톡
  var bk = document.getElementById('btnKakao');
  if(bk){
    bk.onclick = function() {
      if(typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({ objectType:'text', text:'[유니스] '+c.name+' 고객님께 연락드립니다.', link:{ mobileWebUrl: window.location.href } });
      } else { alert('카카오톡 공유는 카카오 SDK 연동 후 사용 가능합니다.'); }
      return false;
    };
  }

  // 팝업 위치
  var popup = document.getElementById('mapPopup');
  if(popup){
    popup.style.display = 'block';
    popup.style.zIndex  = '9999';
    popup.style.left    = '16px';
    popup.style.top     = '12px';
    console.log('[NEARBY] 팝업 표시 완료');
  } else {
    console.error('[NEARBY] mapPopup 요소 없음');
  }
}

// ── 선택 고객 카드 렌더 ──────────────────────────────
function renderSelectedCustomerCard(c, dist) {
  var card = document.getElementById('selectedCustomerCard');
  if(!card) return;
  card.style.display = '';
  var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
  var typeColor = c.customerType==='계약'?'#10B981':c.customerType==='관리'?'#8B5CF6':'#F59E0B';
  var tagBg = c.customerType==='계약'?'rgba(16,185,129,.12)':c.customerType==='관리'?'rgba(139,92,246,.12)':'rgba(244,163,38,.12)';
  var tagColor = c.customerType==='계약'?'#34D399':c.customerType==='관리'?'#A78BFA':'#FCD34D';
  var dot  = document.getElementById('sccDot');
  var name = document.getElementById('sccName');
  var tag  = document.getElementById('sccTag');
  var dstEl= document.getElementById('sccDist');
  if(dot)  dot.style.background = typeColor;
  if(name) name.textContent = c.name;
  if(tag)  { tag.textContent = c.customerType||''; tag.style.background = tagBg; tag.style.color = tagColor; }
  if(dstEl) dstEl.textContent = distStr;

  var sf = document.getElementById('sccFrom');
  var st = document.getElementById('sccTo');
  if(sf) sf.className = 'scc-btn scc-from';
  if(st) st.className = 'scc-btn scc-to';
}

// ── 패널 내위치 설정 ─────────────────────────────────
function getMyLocForPanel(type, btn) {
  if(!navigator.geolocation){ alert('위치 정보를 지원하지 않는 브라우저입니다.'); return; }
  var origText = btn ? btn.textContent : '';
  if(btn) btn.textContent = '⏳';

  function applyLoc(lat, lng) {
    var obj = { name:'내 현재 위치', lat:String(lat), lng:String(lng) };
    if(type === 'from') panelFrom = obj;
    else if(type === 'to') panelTo = obj;
    else if(type.indexOf('via_') === 0) {
      var idx = parseInt(type.split('_')[1], 10);
      if(idx >= 0 && idx < panelVia.length) panelVia[idx] = obj;
    }
    if(btn) btn.textContent = origText;
    renderRoutePanel();

    // 지도 이동 + 내 위치 마커 표시
    if(kakaoMap) {
      var myPos = new kakao.maps.LatLng(lat, lng);
      kakaoMap.setCenter(myPos);
      kakaoMap.setLevel(5);

      // 기존 내 위치 마커/오버레이 제거
      if(myLocMarker)  { myLocMarker.setMap(null);  myLocMarker  = null; }
      if(myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }

      // 노란 마커
      var svgMe = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">'
        +'<circle cx="16" cy="16" r="14" fill="#FBBF24" stroke="#fff" stroke-width="2"/>'
        +'<circle cx="16" cy="16" r="6" fill="#fff" opacity=".9"/>'
        +'</svg>';
      var myImg = new kakao.maps.MarkerImage(
        'data:image/svg+xml;base64,'+btoa(svgMe),
        new kakao.maps.Size(32,32),
        { offset: new kakao.maps.Point(16,16) }
      );
      myLocMarker = new kakao.maps.Marker({ position:myPos, map:kakaoMap, image:myImg, title:'내 위치' });

      // 라벨 오버레이
      var labelEl = document.createElement('div');
      labelEl.style.cssText = 'background:rgba(251,191,36,.9);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;color:#1a1a1a;white-space:nowrap;margin-bottom:2px';
      labelEl.textContent = '📍 내 위치';
      myLocOverlay = new kakao.maps.CustomOverlay({ position:myPos, content:labelEl, yAnchor:3.0 });
      myLocOverlay.setMap(kakaoMap);

    }
  }

  function onError(err) {
    if(err.code === 1) {
      // 권한 거부 - 재시도 없이 안내
      if(btn) btn.textContent = origText;
      alert('위치 권한이 거부됐습니다.\n브라우저 주소창 옆 자물쇠 → 위치 허용으로 변경 후 다시 시도하세요.');
    } else {
      // GPS 실패 → 저정밀도로 재시도
      navigator.geolocation.getCurrentPosition(
        function(pos){ applyLoc(pos.coords.latitude, pos.coords.longitude); },
        function(){
          if(btn) btn.textContent = origText;
          alert('위치를 가져올 수 없습니다. 잠시 후 다시 시도해주세요.');
        },
        { enableHighAccuracy:false, timeout:10000, maximumAge:60000 }
      );
    }
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){ applyLoc(pos.coords.latitude, pos.coords.longitude); },
    onError,
    { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
  );
}

// ── 지도 선택 모드 ───────────────────────────────────
function enterMapSelectMode(type) {
  if(!kakaoMap){ alert('먼저 지도를 불러주세요.'); return; }
  mapSelectMode = type;
  var banner = document.getElementById('mapSelectBanner');
  var icon   = document.getElementById('mapSelectIcon');
  var text   = document.getElementById('mapSelectText');
  var fromBtn = document.getElementById('rpFromMapSel');
  var toBtn   = document.getElementById('rpToMapSel');
  if(banner){ banner.style.display = ''; }
  if(type === 'from'){
    if(icon) icon.textContent = '🚩';
    if(text) text.textContent = '출발지를 지도에서 클릭해주세요';
    if(fromBtn) fromBtn.className = 'rp-mapsel active';
    if(toBtn)   toBtn.className   = 'rp-mapsel';
  } else if(type === 'to'){
    if(icon) icon.textContent = '🏁';
    if(text) text.textContent = '도착지를 지도에서 클릭해주세요';
    if(toBtn)   toBtn.className   = 'rp-mapsel active';
    if(fromBtn) fromBtn.className = 'rp-mapsel';
  } else {
    var viaNum = type.split('_')[1];
    if(icon) icon.textContent = '◈';
    if(text) text.textContent = '경유지 '+viaNum+'을 지도에서 클릭해주세요';
    if(fromBtn) fromBtn.className = 'rp-mapsel';
    if(toBtn)   toBtn.className   = 'rp-mapsel';
  }
  kakaoMap.setCursor('crosshair');
}

function exitMapSelectMode() {
  mapSelectMode = null;
  var banner = document.getElementById('mapSelectBanner');
  if(banner) banner.style.display = 'none';
  var fromBtn = document.getElementById('rpFromMapSel');
  var toBtn   = document.getElementById('rpToMapSel');
  if(fromBtn) fromBtn.className = 'rp-mapsel';
  if(toBtn)   toBtn.className   = 'rp-mapsel';
  if(kakaoMap) kakaoMap.setCursor('');
  if(mapSelectMarker){ mapSelectMarker.setMap(null); mapSelectMarker = null; }
  if(mapSelectOverlay){ mapSelectOverlay.setMap(null); mapSelectOverlay = null; }
}

function showMapSelectMarker(latlng, type, label) {
  if(mapSelectMarker){ mapSelectMarker.setMap(null); mapSelectMarker = null; }
  if(mapSelectOverlay){ mapSelectOverlay.setMap(null); mapSelectOverlay = null; }
  var color = type === 'from' ? '#3B82F6' : type === 'to' ? '#EF4444' : '#A78BFA';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
    +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'"/>'
    +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>'
    +'</svg>';
  var img = new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,'+btoa(svg),
    new kakao.maps.Size(28,36),
    { offset: new kakao.maps.Point(14,36) }
  );
  mapSelectMarker = new kakao.maps.Marker({ position:latlng, map:kakaoMap, image:img, title:label });
  var labelEl = document.createElement('div');
  labelEl.style.cssText = 'background:rgba(13,22,40,.9);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#F0F4FF;white-space:nowrap;margin-bottom:2px;max-width:160px;overflow:hidden;text-overflow:ellipsis';
  labelEl.textContent = (type==='from'?'🚩 ':type==='to'?'🏁 ':'◈ ') + label;
  mapSelectOverlay = new kakao.maps.CustomOverlay({ position:latlng, content:labelEl, yAnchor:2.4 });
  mapSelectOverlay.setMap(kakaoMap);
}

// ── 길찾기 패널 렌더 ─────────────────────────────────
function refreshViaPins() {
  routeViaMarkers.forEach(function(vm, i) {
    if(vm && vm.marker) {
      var v = panelVia[i];
      if(v && v.lat && v.lng) {
        var pos = new kakao.maps.LatLng(parseFloat(v.lat), parseFloat(v.lng));
        var newImg = makeRoutePinImage('#A78BFA', '경유' + (i + 1));
        vm.marker.setImage(newImg);
        vm.marker.setPosition(pos);
      }
    }
  });
}

function renderRoutePanel() {
  refreshViaPins();
  var tn = document.getElementById('transitNotice');
  if(tn) tn.style.display = panelVia.length > 0 ? '' : 'none';
  var fromSlot  = document.getElementById('rpFromSlot');
  var fromText  = document.getElementById('rpFromText');
  var fromClear = document.getElementById('rpFromClear');
  var toSlot    = document.getElementById('rpToSlot');
  var toText    = document.getElementById('rpToText');
  var toClear   = document.getElementById('rpToClear');
  var navBtns   = document.getElementById('rpNavBtns');
  var hint      = document.getElementById('rpHint');
  var fromInput = document.getElementById('rpFromInput');
  var toInput   = document.getElementById('rpToInput');
  var viaList   = document.getElementById('rpViaList');

  // 출발지
  if(panelFrom) {
    fromSlot.className = 'rp-slot has-from';
    fromText.textContent = panelFrom.name;
    fromClear.style.display = '';
    if(fromInput) fromInput.value = '';
  } else {
    fromSlot.className = 'rp-slot';
    fromText.textContent = '미설정';
    fromClear.style.display = 'none';
  }

  // 도착지
  if(panelTo) {
    toSlot.className = 'rp-slot has-to';
    toText.textContent = panelTo.name;
    toClear.style.display = '';
    if(toInput) toInput.value = '';
  } else {
    toSlot.className = 'rp-slot';
    toText.textContent = '고객 핀 또는 지도 선택';
    toClear.style.display = 'none';
  }

  // 경유지 목록 렌더
  if(viaList) {
    viaList.innerHTML = '';
    panelVia.forEach(function(v, i) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:4px;';

      var lineCol = document.createElement('div');
      lineCol.style.cssText = 'display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0;padding-top:2px;gap:2px;';
      var dot = document.createElement('div');
      dot.style.cssText = 'width:10px;height:10px;border-radius:50%;background:#A78BFA;flex-shrink:0;';
      var vline = document.createElement('div');
      vline.style.cssText = 'flex:1;width:1.5px;background:rgba(255,255,255,.12);min-height:10px;';
      lineCol.appendChild(dot);
      lineCol.appendChild(vline);

      var content = document.createElement('div');
      content.style.cssText = 'flex:1;';

      var viaRow = document.createElement('div');
      viaRow.className = 'rp-via-row';

      var slot = document.createElement('div');
      slot.className = 'rp-via-slot';

      var label = document.createElement('span');
      label.className = 'rp-via-label';
      label.textContent = '경유 '+(i+1);

      // 슬롯 이름 — 주소 또는 좌표 간략하게
      var displayName = '';
      if(v.name && v.name !== '내 현재 위치') {
        displayName = v.name;
      } else if(v.name === '내 현재 위치') {
        displayName = '📍 내 현재 위치';
      } else if(v.lat && v.lng) {
        displayName = parseFloat(v.lat).toFixed(4)+', '+parseFloat(v.lng).toFixed(4);
      } else {
        displayName = '미설정';
      }

      var name = document.createElement('span');
      name.className = 'rp-via-name';
      name.textContent = displayName;
      if(!v.lat) name.style.color = '#4A5568';

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'rp-via-del';
      del.textContent = '✕';
      (function(idx){ del.addEventListener('click', function(){ clearRoutePin('via_'+idx); panelVia.splice(idx,1); routeViaMarkers.splice(idx,1); renderRoutePanel(); }); })(i);

      slot.appendChild(label);
      slot.appendChild(name);
      slot.appendChild(del);

      // 내위치 버튼
      var viaMyLoc = document.createElement('button');
      viaMyLoc.type = 'button';
      viaMyLoc.className = 'rp-myloc';
      viaMyLoc.textContent = '📍';
      viaMyLoc.title = '내 현재 위치';
      (function(idx, btn){
        btn.addEventListener('click', function(){ getMyLocForPanel('via_'+idx, btn); });
      })(i, viaMyLoc);

      // 지도선택 버튼
      var viaMapSel = document.createElement('button');
      viaMapSel.type = 'button';
      viaMapSel.className = 'rp-mapsel';
      viaMapSel.textContent = '📌';
      viaMapSel.title = '지도에서 선택';
      (function(idx){
        viaMapSel.addEventListener('click', function(){
          var viaKey = 'via_'+idx;
          if(mapSelectMode === viaKey) {
            exitMapSelectMode();
          } else if(routeViaMarkers[idx] && routeViaMarkers[idx].marker) {
            clearRoutePin(viaKey);
            if(panelVia[idx]) { panelVia[idx] = { name:'', lat:'', lng:'' }; }
            renderRoutePanel();
          } else {
            enterMapSelectMode(viaKey);
          }
        });
      })(i);

      var orderCol = document.createElement('div');
      orderCol.className = 'rp-via-order';

      var upBtn = document.createElement('button');
      upBtn.type = 'button'; upBtn.className = 'rp-via-btn'; upBtn.textContent = '▲';
      (function(idx){ upBtn.addEventListener('click', function(){
        if(idx===0) return;
        var tmp=panelVia[idx-1]; panelVia[idx-1]=panelVia[idx]; panelVia[idx]=tmp;
        renderRoutePanel();
      }); })(i);

      var downBtn = document.createElement('button');
      downBtn.type = 'button'; downBtn.className = 'rp-via-btn'; downBtn.textContent = '▼';
      (function(idx){ downBtn.addEventListener('click', function(){
        if(idx>=panelVia.length-1) return;
        var tmp=panelVia[idx+1]; panelVia[idx+1]=panelVia[idx]; panelVia[idx]=tmp;
        renderRoutePanel();
      }); })(i);

      orderCol.appendChild(upBtn);
      orderCol.appendChild(downBtn);

      viaRow.appendChild(slot);
      viaRow.appendChild(viaMyLoc);
      viaRow.appendChild(viaMapSel);
      viaRow.appendChild(orderCol);
      content.appendChild(viaRow);

      // 주소 입력칸 — 미설정일 때만 표시
      if(!v.lat) {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'rp-input';
        input.placeholder = '주소 직접 입력';
        (function(idx){ input.addEventListener('keydown', function(e){
          if(e.key==='Enter') searchRouteAddr('via_'+idx, this.value.trim());
        }); })(i);
        content.appendChild(input);
      }

      row.appendChild(lineCol);
      row.appendChild(content);
      viaList.appendChild(row);
    });
  }

  // 길찾기 URL 생성 (출발+도착 필수, 경유지는 좌표 있는 것만)
  var validVia = panelVia.filter(function(v){ return v.lat && v.lng; });
  if(panelFrom && panelTo) {
    navBtns.className = 'rp-nav-btns active';
    hint.style.display = 'none';

    // 카카오맵 파라미터 방식 URL
    var sp = 'spx='+panelFrom.lng+'&spy='+panelFrom.lat+'&sname='+encodeURIComponent(panelFrom.name);
    var ep = 'epx='+panelTo.lng+'&epy='+panelTo.lat+'&ename='+encodeURIComponent(panelTo.name);
    var viaParam = '';
    validVia.forEach(function(v, i){
      viaParam += '&via'+(i+1)+'x='+v.lng+'&via'+(i+1)+'y='+v.lat+'&via'+(i+1)+'name='+encodeURIComponent(v.name);
    });

    // 카카오맵 공식 URL: /link/by/{이동수단}/출발이름,위도,경도/경유이름,위도,경도/도착이름,위도,경도
    var fLat  = parseFloat(panelFrom.lat).toFixed(6);
    var fLng  = parseFloat(panelFrom.lng).toFixed(6);
    var tLat  = parseFloat(panelTo.lat).toFixed(6);
    var tLng  = parseFloat(panelTo.lng).toFixed(6);
    var fName = panelFrom.name;
    var tName = panelTo.name;

    var viaRoute = '';
    validVia.forEach(function(v){
      viaRoute += '/'+v.name+','+parseFloat(v.lat).toFixed(6)+','+parseFloat(v.lng).toFixed(6);
    });

    var base  = 'https://map.kakao.com/link/by/';
    var route = fName+','+fLat+','+fLng + viaRoute + '/'+tName+','+tLat+','+tLng;

    var carUrl  = base + 'car/'     + route;
    var busUrl  = base + 'traffic/' + fName + ',' + fLat + ',' + fLng + '/' + tName + ',' + tLat + ',' + tLng;
    var walkUrl = base + 'walk/'    + route;

    var rc = document.getElementById('rpCar');  if(rc)  rc.href = carUrl;
    var rb = document.getElementById('rpBus');  if(rb)  rb.href = busUrl;
    var rw = document.getElementById('rpWalk'); if(rw)  rw.href = walkUrl;
  } else {
    navBtns.className = 'rp-nav-btns';
    hint.style.display = '';
  }

  // 열기 버튼 상태 — 설정된 게 있으면 강조
  var ob = document.getElementById('routeOpenBtn');
  if(ob) {
    var hasAny = panelFrom || panelTo || panelVia.length > 0;
    ob.className = 'route-open-btn' + (hasAny ? ' has-route' : '');
    ob.textContent = hasAny ? '🗺️ 길찾기 수정중' : '🗺️ 길찾기 열기';
  }
}

// ── 길찾기 주소 검색 ──────────────────────────────────
function searchRouteAddr(type, addr) {
  if(!addr || !kakaoMap) return;
  var geocoder = new kakao.maps.services.Geocoder();
  var places   = new kakao.maps.services.Places();
  var isVia = type.indexOf('via_') === 0;
  var viaIdx = isVia ? parseInt(type.split('_')[1], 10) : -1;

  function applyObj(obj) {
    if(type === 'from') panelFrom = obj;
    else if(type === 'to') panelTo = obj;
    else if(isVia && viaIdx >= 0 && viaIdx < panelVia.length) {
      panelVia[viaIdx] = obj;
    }
    renderRoutePanel();
  }

  places.keywordSearch(addr, function(result, status) {
    var found = false;
    if(status === kakao.maps.services.Status.OK && result.length > 0) {
      var p = result[0];
      applyObj({ name:p.place_name||addr, lat:p.y, lng:p.x, address:p.address_name||addr });
      found = true;
    }
    if(!found) {
      geocoder.addressSearch(addr, function(result2, status2) {
        if(status2 === kakao.maps.services.Status.OK) {
          applyObj({ name:addr, lat:result2[0].y, lng:result2[0].x, address:addr });
        } else { alert('주소를 찾을 수 없습니다.'); }
      });
    }
  });
}

// ── 내 현재 위치 찾기 ────────────────────────────────
function findMyLocation() {
  if(!kakaoMap){ alert('먼저 지도를 불러주세요'); return; }
  if(!navigator.geolocation){ alert('이 브라우저는 위치 정보를 지원하지 않습니다'); return; }
  var btn = document.getElementById('btnMyLoc');
  if(btn){ btn.textContent = '⏳ 위치 찾는 중...'; btn.className = 'myloc-btn loading'; }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;

      // 기존 내 위치 마커/오버레이 제거
      if(myLocMarker)  { myLocMarker.setMap(null);  myLocMarker  = null; }
      if(myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }

      var myPos = new kakao.maps.LatLng(myLat, myLng);

      // 내 위치 마커 (노란 별 모양)
      var svgMe = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">'
        +'<circle cx="16" cy="16" r="14" fill="#FBBF24" stroke="#fff" stroke-width="2"/>'
        +'<circle cx="16" cy="16" r="6" fill="#fff" opacity=".9"/>'
        +'</svg>';
      var myImg = new kakao.maps.MarkerImage(
        'data:image/svg+xml;base64,'+btoa(svgMe),
        new kakao.maps.Size(32,32),
        { offset: new kakao.maps.Point(16,16) }
      );
      myLocMarker = new kakao.maps.Marker({ position:myPos, map:kakaoMap, image:myImg, title:'내 위치' });

      // 내 위치 라벨
      var myLabelEl = document.createElement('div');
      myLabelEl.style.cssText = 'background:rgba(251,191,36,.9);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;color:#1a1a1a;white-space:nowrap;margin-bottom:2px;cursor:pointer';
      myLabelEl.textContent = '📍 내 위치';
      myLabelEl.addEventListener('click', function(){
        // 내 위치를 출발지로 설정
        routeFrom = { id:'MY_LOCATION', name:'내 위치', lat:String(myLat), lng:String(myLng) };
        var bf = document.getElementById('btnFrom');
        if(bf) bf.className = 'route-btn btn-from active';
        updateRouteStatus();
        alert('내 현재 위치가 출발지로 설정됐습니다.');
      });
      myLocOverlay = new kakao.maps.CustomOverlay({ position:myPos, content:myLabelEl, yAnchor:3.0, clickable:true });
      myLocOverlay.setMap(kakaoMap);

      // 지도 중심 이동 + 주변 고객 표시
      centerLat = myLat; centerLng = myLng;
      var mlabelEl4 = document.querySelector('.mlabel');
      if(mlabelEl4) mlabelEl4.textContent = '📍 기준 위치';
      document.getElementById('targetName').textContent = '내 현재 위치';
      document.getElementById('targetAddr').textContent = '위도 '+myLat.toFixed(4)+' / 경도 '+myLng.toFixed(4);
      document.getElementById('headerSub').textContent  = '내 위치 주변 고객 찾기';
      drawNearby(myLat, myLng);

      if(btn){ btn.textContent = '📍 내 위치'; btn.className = 'myloc-btn'; }
    },
    function(err){
      if(btn){ btn.textContent = '📍 내 위치'; btn.className = 'myloc-btn'; }
      var msg = '위치를 가져올 수 없습니다.';
      if(err.code === 1) msg = '위치 권한이 거부됐습니다.\n브라우저 주소창 옆 자물쇠 아이콘 → 위치 허용으로 바꿔주세요.';
      if(err.code === 2) msg = '위치 신호를 찾을 수 없습니다. 잠시 후 다시 시도해주세요.';
      if(err.code === 3) msg = '위치 요청 시간이 초과됐습니다.';
      alert(msg);
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}

function closePopup() {
  var p = document.getElementById('mapPopup');
  if(p) p.style.display = 'none';
}

function setAsBase() {
  var c = selectedCustomerId ? null : null;
  if(window._nearbyList) {
    window._nearbyList.forEach(function(item){
      if(item.c.id === selectedCustomerId) c = item.c;
    });
  }
  if(!c) { c = allCustomers.filter(function(a){ return a.id === selectedCustomerId; })[0]; }
  if(!c || !c.lat || !c.lng) { alert('이 고객은 좌표가 없어 기준으로 설정할 수 없습니다.'); return; }

  // 좌측 기준 고객 카드 업데이트
  var tnEl = document.getElementById('targetName');
  var taEl = document.getElementById('targetAddr');
  var mlabelEl2 = document.querySelector('.mlabel');
  if(mlabelEl2) mlabelEl2.textContent = '📅 기준 고객';
  if(tnEl) tnEl.textContent = c.name;
  if(taEl) taEl.textContent = c.address || '';
  document.getElementById('headerSub') && (document.getElementById('headerSub').textContent = c.name + ' 주변 고객 찾기');

  // 팝업 닫기
  closePopup();

  // 기준 고객 ID 기억 (drawNearby 후 마커 라벨 교체용)
  window._baseCustomerId = c.id;
  isCustomerMode = true;

  // 지도 이동 + 주변 재계산
  centerLat = parseFloat(c.lat);
  centerLng = parseFloat(c.lng);
  drawNearby(centerLat, centerLng);
}

}

// ── 마커 클리어 ──────────────────────────────────────
function clearMarkers() {
  markers.forEach(function(m){ m.setMap(null); });
  circles.forEach(function(c){ c.setMap(null); });
  if(centerOverlay){ centerOverlay.setMap(null); centerOverlay = null; }
  if(centerMarkerGlobal){ centerMarkerGlobal.setMap(null); centerMarkerGlobal = null; }
  markers=[]; circles=[];
}

// ── 거리 계산 (Haversine) ────────────────────────────
function getDistKm(lat1,lng1,lat2,lng2) {
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
