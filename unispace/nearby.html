<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>주변 고객 찾기 — UNISPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080E1C;--bg2:#0D1628;--bg3:#111D35;--gold:#C9A84C;--gold2:#E8C97A;--text:#F0F4FF;--text2:#8B98B8;--text3:#4A5568;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--bdr);z-index:100;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:20px;padding:6px 14px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.back-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.header-title{font-family:'Syncopate',sans-serif;font-size:12px;font-weight:700;color:var(--gold2);letter-spacing:.1em;}
.header-sub{font-size:12px;color:var(--text2);margin-left:auto;}

/* 메인 레이아웃 */
.main{display:flex;flex:1;overflow:hidden;}

/* 좌측 패널 */
.left{width:280px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.lhead{padding:14px 16px;border-bottom:1px solid var(--bdr);}
.ltitle{font-size:11px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-bottom:10px;}
.mcard{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.14);border-left:3px solid rgba(96,165,250,.55);border-radius:8px;padding:9px 12px;margin-bottom:14px;}
.mlabel{font-size:9px;color:#60A5FA;font-weight:700;margin-bottom:3px;letter-spacing:.04em;text-transform:uppercase;opacity:.85;}
.mname{font-size:14px;font-weight:700;color:var(--text);}
.maddr{font-size:11px;color:var(--text2);margin-top:2px;}
.addr-input{width:100%;padding:9px 11px;background:rgba(255,255,255,.06);border:1px solid var(--bdr2);border-radius:8px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;margin-top:0;transition:border-color .18s,box-shadow .18s;}
.addr-input::placeholder{color:var(--text3);}
.addr-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,.12);}
.search-btn{width:100%;padding:9px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 3px 12px rgba(201,168,76,.25);transition:all .18s;letter-spacing:.02em;}
.search-btn:hover{box-shadow:0 4px 16px rgba(201,168,76,.4);transform:translateY(-1px);}
.rrow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.rlabel{font-size:11px;color:var(--text2);white-space:nowrap;}
.rchips{display:flex;gap:4px;}
.rchip{font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;font-weight:600;transition:all .2s;border:1px solid var(--bdr);}
.rchip.on{background:rgba(59,130,246,.18);color:#60A5FA;border-color:rgba(59,130,246,.4);}
.rchip.off{background:rgba(255,255,255,.04);color:var(--text3);}
.rcnt{padding:7px 16px;font-size:11px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,.05);}
.rcnt b{color:var(--text);}
.clist{flex:1;overflow-y:auto;}
.ci{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;transition:background .15s;}
.ci:hover{background:rgba(255,255,255,.045);}
.ci.sel{background:rgba(59,130,246,.16);border-left:3px solid #60A5FA;padding-left:13px;}
.ci.sel .cn{color:#60A5FA;}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.cn{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
.cd{font-size:11px;font-weight:700;color:#60A5FA;}
.ci2{font-size:11px;color:var(--text2);line-height:1.45;}
.ctag{font-size:9px;padding:1.5px 6px;border-radius:5px;font-weight:700;margin-left:5px;vertical-align:middle;letter-spacing:.02em;}
.tc{background:rgba(16,185,129,.14);color:#34D399;}
.tm{background:rgba(139,92,246,.14);color:#A78BFA;}
.tw{background:rgba(244,163,38,.14);color:#FCD34D;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}

/* 지도 */
.map-wrap{flex:1;position:relative;}
#kakaoMap{width:100%;height:100%;}

/* 팝업 */
.map-popup{position:absolute;background:rgba(13,22,40,.96);border:1px solid var(--bdr2);border-radius:14px;padding:0;min-width:230px;max-width:260px;max-height:calc(100% - 24px);z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none;overflow:hidden;}
.drag-handle{background:rgba(255,255,255,.04);padding:8px 14px 6px;cursor:grab;user-select:none;border-bottom:1px solid rgba(255,255,255,.06);}
.drag-handle:active{cursor:grabbing;}
.drag-bar{width:36px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 6px;}
.popup-inner-head{display:flex;align-items:center;justify-content:space-between;}
.pnamewrap{display:flex;align-items:center;gap:6px;}
.popup-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;}
.popup-body{padding:12px 14px;overflow-y:auto;max-height:calc(100vh - 120px);}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pname{font-size:14px;font-weight:700;color:var(--text);}
.ptag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
.prow{font-size:11px;color:var(--text2);margin-bottom:3px;}
.prow b{color:#60A5FA;}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:8px 0;}
.section-label{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:5px;}
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px;}
.nav-btn{padding:7px 4px;border-radius:8px;text-align:center;cursor:pointer;transition:all .2s;border:1px solid var(--bdr);background:rgba(255,255,255,.04);text-decoration:none;}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-icon{font-size:14px;display:block;margin-bottom:2px;}
.nav-text{font-size:10px;color:var(--text2);font-weight:600;}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.contact-btn{padding:7px;border-radius:8px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;text-decoration:none;display:block;}
.btn-call{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#34D399;}
.btn-kakao{background:rgba(254,229,0,.1);border:1px solid rgba(254,229,0,.25);color:#FEE500;}
.btn-call:hover{background:rgba(16,185,129,.2);}
.btn-kakao:hover{background:rgba(254,229,0,.18);}
.set-base-btn{width:100%;padding:7px;border-radius:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#60A5FA;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:5px;}
.set-base-btn:hover{background:rgba(59,130,246,.22);}
.detail-btn{width:100%;padding:8px;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;}

.route-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;}
.route-btn{padding:6px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.btn-from{background:rgba(59,130,246,.12);color:#60A5FA;border:1px solid rgba(59,130,246,.3);}
.btn-from.active{background:rgba(59,130,246,.35);color:#fff;}
.btn-to{background:rgba(239,68,68,.1);color:#F87171;border:1px solid rgba(239,68,68,.3);}
.btn-to.active{background:rgba(239,68,68,.3);color:#fff;}
.route-status{margin-top:6px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px;margin-bottom:4px;}
.route-info{font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.6;}
.route-info b{color:var(--gold2);}
.route-nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.route-nav-btn{padding:6px 2px;border-radius:6px;text-align:center;font-size:10px;font-weight:700;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25);color:var(--gold2);text-decoration:none;display:block;}
.route-nav-btn:hover{background:rgba(201,168,76,.25);}
/* 범례 */
.legend{position:absolute;bottom:12px;left:12px;background:rgba(13,22,40,.9);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;z-index:20;}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--text2);}
.lr:last-child{margin-bottom:0;}
.ldot{width:9px;height:9px;border-radius:50%;}

/* 이벤트 카드 */
.ev-card{border-radius:8px;padding:8px 10px;margin-bottom:5px;}
.ev-card-event{background:rgba(232,201,122,.08);border:1px solid rgba(232,201,122,.2);}
.ev-card-custom{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);}
.ev-card-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.ev-card-name{font-size:11px;font-weight:700;color:#F0F4FF;}
.ev-dday{font-size:11px;font-weight:800;color:#E8C97A;}
.ev-dday-custom{font-size:11px;font-weight:800;color:#A78BFA;}
.ev-dday-today{font-size:11px;font-weight:800;color:#34D399;}
.ev-date{font-size:11px;color:#8B98B8;}
.ev-section-label{font-size:10px;font-weight:700;margin-bottom:4px;}
.ev-section-label-event{color:#E8C97A;}
.ev-section-label-custom{color:#A78BFA;}
/* 선택 고객 카드 */
.selected-customer-card{margin-top:8px;}
.scc-divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin-bottom:10px;}
.scc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.scc-info{display:flex;align-items:center;gap:6px;}
.scc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.scc-name{font-size:12px;font-weight:700;color:var(--text);}
.scc-tag{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700;}
.scc-dist{font-size:10px;color:var(--text2);}
.scc-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.scc-btn{padding:8px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.scc-from{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);color:#60A5FA;}
.scc-from:hover{background:rgba(59,130,246,.22);}
.scc-to{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#F87171;}
.scc-to:hover{background:rgba(239,68,68,.2);}
/* 계약 요약 */
.popup-contracts{margin-bottom:2px;}
.pc-item{background:rgba(255,255,255,.04);border-radius:7px;padding:6px 8px;margin-bottom:4px;font-size:11px;}
.pc-company{font-weight:700;color:var(--text);margin-bottom:1px;}
.pc-detail{color:var(--text2);font-size:10px;}
.pc-empty{font-size:11px;color:var(--text3);}
/* 경유지 라인 구조 */
.rp-route-row{display:flex;gap:8px;margin-bottom:2px;}
.rp-route-line-col{display:flex;flex-direction:column;align-items:center;width:12px;flex-shrink:0;padding-top:14px;}
.rp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.rp-dot-from{background:#3B82F6;}
.rp-dot-to{background:#EF4444;}
.rp-dot-via{background:#A78BFA;}
.rp-vline{flex:1;width:1.5px;background:rgba(255,255,255,.12);min-height:10px;}
.rp-route-content{flex:1;min-width:0;padding-bottom:4px;overflow:hidden;}
.rp-add-via{width:100%;padding:6px;border-radius:7px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);color:#8B98B8;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin:2px 0;}
.rp-add-via:hover{background:rgba(255,255,255,.08);color:var(--text);}
/* 경유지 슬롯 */
.rp-via-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;min-width:0;overflow:hidden;}
.rp-via-slot{width:0;flex:1;min-width:0;display:flex;align-items:center;gap:5px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.25);border-radius:7px;padding:5px 8px;overflow:hidden;}
.rp-via-label{font-size:9px;color:#A78BFA;font-weight:700;flex-shrink:0;white-space:nowrap;}
.rp-via-name{font-size:11px;font-weight:700;color:#F0F4FF;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-via-del{background:none;border:none;color:#4A5568;font-size:11px;cursor:pointer;padding:0;flex-shrink:0;}
.rp-via-order{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.rp-via-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;color:#8B98B8;font-size:9px;cursor:pointer;padding:1px 4px;line-height:1;}
.rp-via-btn:hover{background:rgba(255,255,255,.14);}
/* 선택고객 경유지 버튼 */
.scc-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.scc-via{background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3);color:#A78BFA;}
.scc-via:hover{background:rgba(139,92,246,.22);}
/* 탭 */
.panel-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.ptab{flex:1;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Noto Sans KR',sans-serif;}
.ptab.active{color:#E8C97A;border-bottom-color:#E8C97A;background:linear-gradient(180deg,rgba(201,168,76,.06),transparent);}
.ptab:hover:not(.active){color:var(--text2);}
/* 동선관리 탭 */
.ds-preview{padding:5px 14px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:28px;}
.ds-pi{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;cursor:grab;user-select:none;transition:opacity .15s;display:inline-flex;align-items:center;gap:3px;}
.ds-pi:active{cursor:grabbing;}
.ds-pi.dragging{opacity:.35;}
.ds-pi .ds-seq-n{font-size:9px;opacity:.7;}
.ds-pf{background:rgba(59,130,246,.2);color:#60A5FA;border:1px solid rgba(59,130,246,.3);}
.ds-pv{background:rgba(167,139,250,.2);color:#A78BFA;border:1px solid rgba(167,139,250,.3);}
.ds-pt{background:rgba(239,68,68,.2);color:#F87171;border:1px solid rgba(239,68,68,.3);}
.ds-hint{font-size:9px;color:var(--text3);margin-left:2px;}
.ds-drop-indicator{width:2px;height:18px;background:#E8C97A;border-radius:1px;flex-shrink:0;}
.ds-seq{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;margin-left:6px;}
.ds-s0{background:#3B82F6;color:#fff;}
.ds-s1{background:#A78BFA;color:#fff;}
.ds-s2{background:#EF4444;color:#fff;}
.ds-sm{background:rgba(255,255,255,.06);color:var(--text3);border:1px dashed rgba(255,255,255,.15);}
/* 오늘의 동선 탭 */
.today-card{margin:8px 14px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:8px 12px;}
.today-hd{font-size:10px;font-weight:700;color:#34D399;margin-bottom:6px;}
.today-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.today-row:last-child{border-bottom:none;}
.today-seq-num{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:rgba(52,211,153,.18);color:#34D399;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.today-body{flex:1;min-width:0;}
.today-time{font-size:10px;color:#34D399;font-weight:600;flex-shrink:0;}
.today-name{font-size:11px;font-weight:700;color:var(--text);}
.today-place{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.today-empty{text-align:center;padding:16px;font-size:12px;color:var(--text3);}
/* 경로 미리보기(오늘) */
.today-route-bar{padding:4px 14px 5px;border-bottom:1px solid rgba(255,255,255,.05);}
/* 길찾기 버튼 (하단) */
.route-open-bar{padding:10px 14px;border-top:1px solid var(--bdr);flex-shrink:0;}
.route-open-btn{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(232,201,122,.3);background:rgba(232,201,122,.1);color:var(--gold2);font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.route-open-btn:hover{background:rgba(232,201,122,.2);}
.route-open-btn.has-route{background:rgba(232,201,122,.25);border-color:var(--gold2);}
/* 길찾기 팝업 */
.route-popup{position:absolute;background:rgba(13,22,40,.97);border:1px solid rgba(255,255,255,.14);border-radius:16px;width:280px;max-width:280px;min-width:280px;max-height:calc(100% - 24px);overflow:hidden;display:flex;flex-direction:column;z-index:8000;box-shadow:0 8px 32px rgba(0,0,0,.6);right:12px;bottom:12px;}
.route-popup-header{background:rgba(255,255,255,.04);padding:8px 14px 8px;border-bottom:1px solid rgba(255,255,255,.07);cursor:grab;flex-shrink:0;user-select:none;}
.route-popup-header:active{cursor:grabbing;}
.route-popup-body{padding:12px 14px;overflow-y:auto;flex:1;}
.rp-reset-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:var(--text2);font-size:10px;padding:3px 8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.rp-popup-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;line-height:1;}
/* 길찾기 패널 */
.route-panel{border-top:1px solid var(--bdr);padding:12px 14px;flex-shrink:0;background:var(--bg2);}
.rp-title{font-size:10px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-bottom:8px;}
.rp-label{font-size:10px;color:var(--text2);margin-bottom:4px;}
.rp-from-row{display:flex;gap:4px;margin-bottom:4px;min-width:0;overflow:hidden;}
.rp-slot{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:7px;padding:6px 8px;min-height:30px;}
.rp-slot.has-from{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.25);}
.rp-slot.has-to{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.25);}
.rp-slot-text{font-size:11px;color:var(--text3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-slot.has-from .rp-slot-text{color:#60A5FA;font-weight:700;}
.rp-slot.has-to .rp-slot-text{color:#F87171;font-weight:700;}
.rp-clear{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0;}
.rp-myloc{padding:5px 9px;border-radius:7px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.12);color:#60A5FA;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;flex-shrink:0;}
.rp-input{width:100%;padding:5px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:7px;color:var(--text);font-size:11px;font-family:'Noto Sans KR',sans-serif;margin-bottom:6px;box-sizing:border-box;}
.rp-input:focus{outline:none;border-color:var(--gold);}
.rp-swap-row{display:flex;align-items:center;gap:6px;margin:4px 0 8px;}
.rp-line{flex:1;height:1px;background:var(--bdr);}
.rp-swap{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);color:var(--text2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rp-swap:hover{background:rgba(255,255,255,.1);}
.rp-nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:8px;opacity:.3;pointer-events:none;}
.rp-nav-btns.active{opacity:1;pointer-events:all;}
.rp-nav-btn{padding:7px 4px;border-radius:7px;text-align:center;background:rgba(232,201,122,.08);border:1px solid rgba(232,201,122,.2);color:var(--gold2);font-size:11px;font-weight:700;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;}
.rp-nav-btn span{font-size:9px;}
.rp-nav-btn:hover{background:rgba(232,201,122,.18);}
.rp-hint{font-size:10px;color:var(--text3);text-align:center;margin-top:5px;}
.rp-mapsel{padding:5px 8px;border-radius:7px;border:1px solid rgba(232,201,122,.25);background:rgba(232,201,122,.08);color:var(--gold2);font-size:12px;cursor:pointer;flex-shrink:0;transition:all .2s;}
.rp-mapsel:hover{background:rgba(232,201,122,.18);}
.rp-mapsel.active{background:rgba(232,201,122,.3);border-color:var(--gold2);}
.map-select-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(37,99,235,.95);border-radius:20px;padding:9px 16px;display:flex;align-items:center;gap:8px;z-index:500;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.msb-icon{font-size:14px;}
.msb-text{font-size:12px;font-weight:700;color:#fff;}
.msb-cancel{background:rgba(255,255,255,.2);border:none;border-radius:10px;padding:3px 10px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.msb-cancel:hover{background:rgba(255,255,255,.35);}
/* 내 위치 버튼 */
.myloc-btn{padding:8px 11px;border:none;border-radius:8px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);color:#60A5FA;font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.myloc-btn:hover{background:rgba(59,130,246,.28);}
.pinbase-btn{padding:8px 11px;border:none;border-radius:8px;background:rgba(232,201,122,.1);border:1px solid rgba(232,201,122,.3);color:var(--gold2);font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.pinbase-btn:hover{background:rgba(232,201,122,.22);}
.pinbase-btn.active{background:rgba(232,201,122,.3);border-color:var(--gold2);}
.myloc-btn:hover{background:rgba(59,130,246,.28);}
.myloc-btn.loading{opacity:.6;cursor:wait;}

/* 검색 결과 목록 */
.search-result-list{position:absolute;top:130px;left:0;right:0;bottom:0;background:var(--bg2);z-index:50;display:flex;flex-direction:column;overflow:hidden;border-top:2px solid rgba(232,201,122,.3);}
.srl-items-wrap{flex:1;overflow-y:auto;}
.srl-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.srl-title{font-size:11px;font-weight:700;color:var(--gold2);}
.srl-cancel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:var(--text2);font-size:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:3px 9px;}
.srl-item{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;transition:background .15s;}
.srl-item:hover{background:rgba(255,255,255,.05);}
.srl-item.srl-first{background:rgba(59,130,246,.1);border-left:2px solid #60A5FA;}
.srl-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;}
.srl-item-name{font-size:12px;font-weight:700;color:#F0F4FF;}
.srl-item.srl-first .srl-item-name{color:#60A5FA;}
.srl-item-dist{font-size:10px;color:#8B98B8;}
.srl-item.srl-first .srl-item-dist{color:#60A5FA;font-weight:700;}
.srl-item-addr{font-size:10px;color:#8B98B8;}
.srl-item-cat{font-size:10px;color:#4A5568;margin-top:1px;}
.srl-hint{font-size:10px;color:var(--text3);text-align:center;padding:6px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;}
.srl-loading{padding:12px 10px;font-size:11px;color:#8B98B8;display:flex;align-items:center;gap:8px;}
.srl-sec-label{font-size:10px;font-weight:700;color:#8B98B8;padding:6px 12px 3px;border-top:1px solid rgba(255,255,255,.05);letter-spacing:.3px;}
/* 반경 선택 */
.radius-input{display:none;}
@media (max-width: 768px) {
  /* 헤더: 컴팩트, 글자 안 쪼개지게 */
  .header { gap: 8px; padding: 10px 12px; flex-wrap: nowrap; }
  .back-btn { padding: 6px 11px; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
  .header-title { font-size: 11px; white-space: nowrap; flex-shrink: 0; }
  .header-sub { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #headerSub { margin-left: auto !important; min-width: 0; }
  #headerUser { margin-left: 8px !important; font-size: 11px; white-space: nowrap; flex-shrink: 0; }

  /* 레이아웃: 좌우 → 위아래 */
  .main { flex-direction: column; }
  .left {
    width: 100%; flex: 0 0 auto;
    border-right: none; border-bottom: 2px solid var(--bdr);
    max-height: 44vh; overflow-y: auto;
  }
  .map-wrap { flex: 1; min-height: 320px; width: 100%; }

  /* ── 패널 내용 압축(세로 길이 단축) ── */
  .lhead { padding: 8px 14px; }
  .ltitle { margin-bottom: 5px; font-size: 10px; }
  .mcard { padding: 6px 10px; margin-bottom: 8px; }
  .mname { font-size: 13px; }
  .maddr { font-size: 10px; }
  .addr-input { padding: 7px 11px; font-size: 12px; }
  .search-btn { padding: 7px; margin-top: 4px; }
  .rrow { margin-top: 5px; }
  .rchip { padding: 2px 8px; }
  .ptab { padding: 7px 6px !important; font-size: 12px !important; }
  .clist { padding-bottom: 6px; }

  /* ── 고객 정보 팝업: 하단 시트형 ── */
  .map-popup {
    position: fixed !important;
    left: 0 !important; right: 0 !important;
    bottom: 0 !important; top: auto !important;
    width: 100% !important; min-width: 0 !important; max-width: 100% !important;
    max-height: 62vh !important;
    border-radius: 18px 18px 0 0 !important;
    box-shadow: 0 -8px 30px rgba(0,0,0,.5) !important;
    overflow-y: auto !important;
    animation: sheetUp .22s ease-out;
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .map-popup .drag-bar { width: 44px; height: 4px; margin: 8px auto 8px; }
  .drag-handle { position: sticky; top: 0; background: rgba(13,22,40,.98); z-index: 2; padding-top: 2px; }
}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="javascript:history.back()">← 돌아가기</a>
  <div class="header-title">📍 NEARBY</div>
  <div class="header-sub" id="headerSub" style="margin-left:auto">주변 고객 찾기</div>
  <div class="header-sub" id="headerUser" style="margin-left:14px;color:var(--text)"></div>
</div>

<div class="main">
  <!-- 좌측 패널 -->
  <div class="left">
    <div class="lhead">
      <div class="ltitle">기준 위치</div>
      <div class="mcard" id="targetCard" style="cursor:pointer;" title="클릭하면 이 위치로 이동">
        <div class="mlabel">📅 기준 고객</div>
        <div class="mname" id="targetName">—</div>
        <div class="maddr" id="targetAddr">주소를 입력해주세요</div>
      </div>
      <input type="text" class="addr-input" id="addrInput" placeholder="장소명, 주소 또는 고객명 입력">
      <div style="display:flex;gap:5px;margin-top:6px;">
        <button type="button" class="search-btn" style="flex:1;margin-top:0;" onclick="searchAddr()">🔍 검색</button>
        <button type="button" class="myloc-btn" id="btnMyLoc" title="내 현재 위치">📍</button>
        <button type="button" class="pinbase-btn" id="btnPinBase" title="지도에서 기준 잡기">📌</button>
      </div>
      <div class="rrow">
        <span class="rlabel">반경</span>
        <div class="rchips" id="rchips">
          <span class="rchip off" onclick="setRadius(1,this)">1km</span>
          <span class="rchip off" onclick="setRadius(3,this)">3km</span>
          <span class="rchip on"  onclick="setRadius(5,this)">5km</span>
          <span class="rchip off" onclick="setRadius(10,this)">10km</span>
        </div>
      </div>
    </div>

    <!-- 검색 결과 시트 (패널 전체 오버레이) -->
    <div class="search-result-list" id="searchResultList" style="display:none">
      <div class="srl-header">
        <span class="srl-title" id="srlTitle">검색결과</span>
        <button type="button" class="srl-cancel" id="srlCancel">✕ 닫기</button>
      </div>
      <div class="srl-items-wrap">
        <div id="srlItems"></div>
      </div>
      <div class="srl-hint" id="srlHint">클릭하면 기준 위치로 설정됩니다</div>
    </div>

    <!-- 탭 -->
    <div class="panel-tabs">
      <button type="button" class="ptab active" id="tabRoute">📍 고객지도</button>
      <button type="button" class="ptab" id="tabNearby" style="display:none">📍 주변 고객</button>
      <button type="button" class="ptab" id="tabToday" style="display:none">📅 동선 조회</button>
    </div>

    <!-- 모드 토글: 주변고객(조회) / 동선관리(담기) / 초기화 -->
    <div id="routeModeBar" style="display:flex;gap:6px;padding:8px 14px 4px">
      <button type="button" id="modeViewBtn" style="flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:2px solid #60A5FA;background:rgba(59,130,246,.16);color:#93C5FD">🔍 주변고객</button>
      <button type="button" id="modeAddBtn" style="flex:1;padding:7px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid var(--bdr2);background:var(--sur);color:var(--text2)">🧭 동선관리</button>
      <button type="button" id="routeResetBtn" style="padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#FCA5A5;white-space:nowrap">🗑 초기화</button>
    </div>

    <!-- 동선관리: 순서편집은 지도 위 팝업으로 표시 -->

    <!-- 동선 조회: 날짜·FP 검색 (항상 표시) -->
    <div id="routeSearchBar" style="margin:8px 14px 2px;position:relative">
      <div style="font-size:10px;font-weight:700;color:#E8C97A;margin-bottom:5px;">📅 FP 동선 조회</div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="hidden" id="routeDateInput">
        <button type="button" id="dateTriggerBtn" style="flex:1;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#F0F4FF;font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📅 날짜 선택</button>
        <select id="routeFpSelect" style="flex:1;padding:7px 10px;background:#16213A;border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#F0F4FF;font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer"></select>
        <button type="button" id="routeLoadBtn" style="padding:7px 12px;border:none;border-radius:8px;background:linear-gradient(135deg,#E8C97A,#C9A84C);color:#080E1C;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif">조회</button>
      </div>
      <!-- 커스텀 달력 팝업 -->
      <div id="calPopup" style="display:none;position:absolute;top:62px;left:0;z-index:9500;width:262px;background:#0F1A30;border:1px solid rgba(232,201,122,.3);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.6);padding:12px;font-family:'Noto Sans KR',sans-serif;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <button type="button" id="calPrev" style="width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.06);color:#F0F4FF;font-size:14px;cursor:pointer">‹</button>
          <div id="calTitle" style="font-size:13px;font-weight:700;color:#F0F4FF;"></div>
          <button type="button" id="calNext" style="width:28px;height:28px;border:none;border-radius:7px;background:rgba(255,255,255,.06);color:#F0F4FF;font-size:14px;cursor:pointer">›</button>
        </div>
        <div id="calDow" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;"></div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;"></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px;">
          <button type="button" id="calClear" style="border:none;background:none;color:#8B98B8;font-size:11px;font-weight:600;cursor:pointer">삭제</button>
          <button type="button" id="calToday" style="border:none;background:none;color:#E8C97A;font-size:11px;font-weight:700;cursor:pointer">오늘</button>
        </div>
      </div>
    </div>

    <!-- 동선 조회: 카드 -->
    <div id="todayCard" style="display:none">
      <div class="today-card" id="todayInner"></div>
      <div class="today-route-bar" id="todayRouteBar" style="display:none">
        <div class="ds-preview" style="padding:0"></div>
      </div>
    </div>

    <div class="rcnt" id="resultCount">주소를 검색하면 주변 고객이 표시됩니다</div>
    <div class="clist" id="clist"><div class="empty">🔍 주소를 검색해주세요</div></div>

    <!-- 길찾기 열기 버튼 -->
    <div class="route-open-bar">
      <button type="button" class="route-open-btn" id="routeOpenBtn">🗺️ 길찾기 열기</button>
    </div>
  </div>

  <!-- 지도 -->
  <div class="map-wrap">
    <div id="kakaoMap"></div>

    <!-- 동선 순서 팝업 -->
    <div id="dsOrderPopup" style="display:none;position:absolute;top:12px;right:12px;background:rgba(13,22,40,.96);border:1px solid rgba(232,201,122,.3);border-radius:14px;width:250px;max-height:340px;z-index:9000;overflow:hidden;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);">
      <div id="dsOrderPopupHeader" style="background:rgba(255,255,255,.04);padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.07);cursor:grab;user-select:none;">
        <div style="width:32px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 7px;"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;font-weight:700;color:#E8C97A;">🗺️ 동선 순서</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span id="dsOrderCount" style="font-size:10px;color:#8B98B8;"></span>
            <button type="button" id="dsOrderMin" style="font-size:11px;color:#8B98B8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;line-height:1;">─</button>
            <button type="button" id="dsOrderReset" style="font-size:9px;color:#8B98B8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 7px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">초기화</button>
          </div>
        </div>
      </div>
      <div id="dsOrderList" style="flex:1;overflow-y:auto;max-height:270px;"></div>
    </div>

    <!-- 지도 선택 모드 배너 -->
    <div class="map-select-banner" id="mapSelectBanner" style="display:none">
      <span class="msb-icon" id="mapSelectIcon">🚩</span>
      <span class="msb-text" id="mapSelectText">출발지를 지도에서 클릭해주세요</span>
      <button type="button" class="msb-cancel" id="mapSelectCancel">취소</button>
    </div>

    <!-- 길찾기 팝업 -->
    <div class="route-popup" id="routePopup" style="display:none">
      <div class="route-popup-header" id="routePopupHeader">
        <div style="width:32px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 6px;"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
          <div style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;">
            <span style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;">🗺️ 길찾기</span>
            <span id="transitNotice" style="display:none;font-size:10px;color:#FCD34D;background:rgba(252,211,77,.1);border:1px solid rgba(252,211,77,.25);border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🚌 경유지 미적용</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <button type="button" class="rp-reset-btn" id="rpResetBtn" style="white-space:nowrap;">초기화</button>
            <button type="button" class="rp-popup-close" id="rpMinBtn" title="최소화" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;line-height:1;">─</button>
            <button type="button" class="rp-popup-close" id="routePopupClose">✕</button>
          </div>
        </div>
      </div>
      <div class="route-popup-body">
        <!-- 출발지 -->
        <div class="rp-route-row">
          <div class="rp-route-line-col">
            <div class="rp-dot rp-dot-from"></div>
            <div class="rp-vline"></div>
          </div>
          <div class="rp-route-content">
            <div class="rp-label">출발지</div>
            <div class="rp-from-row">
              <div class="rp-slot" id="rpFromSlot">
                <span class="rp-slot-text" id="rpFromText">미설정</span>
                <button type="button" class="rp-clear" id="rpFromClear" style="display:none">✕</button>
              </div>
              <button type="button" class="rp-myloc" id="rpMyLoc" title="내 현재 위치">📍</button>
              <button type="button" class="rp-mapsel" id="rpFromMapSel" title="지도에서 선택">📌</button>
              <button type="button" class="rp-via-btn" id="rpFromDown" title="아래로" style="font-size:9px;">▼</button>
            </div>
            <input type="text" class="rp-input" id="rpFromInput" placeholder="주소 직접 입력">
          </div>
        </div>

        <!-- 경유지 목록 -->
        <div id="rpViaList"></div>

        <!-- + 경유지 추가 -->
        <div class="rp-route-row">
          <div class="rp-route-line-col"><div class="rp-vline"></div></div>
          <div class="rp-route-content">
            <button type="button" class="rp-add-via" id="rpAddVia">+ 경유지 추가</button>
          </div>
        </div>

        <!-- 도착지 -->
        <div class="rp-route-row">
          <div class="rp-route-line-col"><div class="rp-dot rp-dot-to"></div></div>
          <div class="rp-route-content">

    if(kakaoMap) kakaoMap.setCursor('');
    clearRouteLayer();

    else populateRouteFpSelect('');
    var dInp = document.getElementById('routeDateInput');
    if(dInp && !dInp.value) dInp.value = (window._activeRoute && window._activeRoute.date) ? window._activeRoute.date : new Date().toISOString().slice(0,10);
  } else {
    clearRouteLayer();
  }
  if(tab == 'ds') {
    // 동선관리(편집) 진입: 동선 원본 백업 정리 (초기화가 빈 상태로 동작하도록)
    window._originalRoute = null;
    // 동선조회에서 적재된 동선(_activeRoute 기반)은 동선관리 탭에 가져오지 않음
    if(window._activeRoute) {
      dsQueue = [];
      window._activeRoute = null;
      clearDsPolylines();
      clearDsRoleLayer();
      clearInlineRoleBadges();
    }
    openDsEditSheet();
    renderDsEditList();
    if(dsQueue.length > 0) {
      syncDsQueueToRoute();
    }
    drawDsPolylines();
    if(dsQueue.length > 0) injectDsRoleLabels();
    updateDsMarkerLabels();
    var rp = document.getElementById('routePopup');

  } else {
    closeDsEditSheet();
    clearAllRoutePins();
    clearDsPolylines();
    clearDsRoleLayer();
    clearInlineRoleBadges();

    panelFrom = null; panelTo = null; panelVia = [];
    renderRoutePanel();

  if(clistEl) clistEl.style.display = '';

  if(tab != 'today' && window._nearbyList && centerLat && centerLng) {
    refreshNearbyOnly(centerLat, centerLng);
    if(tab == 'ds') { injectDsRoleLabels(); updateDsMarkerLabels(); }
  }
  // 동선조회 렌더링은 ds/else 정리 이후에 실행 (정리에 지워지지 않도록)
  if(tab == 'today') {
    if(window._activeRoute && window._activeRoute.stops && window._activeRoute.stops.length) {
      renderRouteFromData(window._activeRoute);

      renderTodayCard();
    }
  }
}

function renderDsEditList() {
  var list = document.getElementById('dsOrderList');
  var countEl = document.getElementById('dsOrderCount');
  if(!list) return;
  if(countEl) countEl.textContent = dsQueue.length > 0 ? dsQueue.length + '개' : '';
  list.innerHTML = '';
  if(dsQueue.length == 0) {
    list.innerHTML = '<div style="text-align:center;padding:16px;font-size:11px;color:#8B98B8;">고객을 클릭해 동선을 추가하세요</div>';

  }
  dsQueue.forEach(function(item, i) {
    var isFirst = i == 0;
    var isLast = i == dsQueue.length - 1 && dsQueue.length > 1;
    var seqBg = isFirst ? 'rgba(59,130,246,.25)' : (isLast ? 'rgba(239,68,68,.25)' : 'rgba(167,139,250,.25)');
    var seqClr = isFirst ? '#93C5FD' : (isLast ? '#FCA5A5' : '#C4B5FD');
    var row = document.createElement('div');
    row.style.cssText = 'padding:6px 12px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:8px;';
    row.innerHTML = '<div style="width:20px;height:20px;border-radius:50%;flex-shrink:0;text-align:center;line-height:20px;font-size:10px;font-weight:700;background:' + seqBg + ';color:' + seqClr + ';">' + (i+1) + '</div>'
      + '<div style="flex:1;min-width:0;">'
      + '<div style="font-size:11px;font-weight:700;color:#F0F4FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + item.name + '</div>'
      + (item.address && item.address != item.name ? '<div style="font-size:9px;color:#8B98B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + item.address + '</div>' : '')
      + '</div>'
      + '<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">'
      + '<button type="button" data-action="up" data-idx="' + i + '" style="width:22px;height:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:8px;color:#8B98B8;cursor:pointer;' + (isFirst ? 'opacity:.2;pointer-events:none;' : '') + '">&#9650;</button>'
      + '<button type="button" data-action="down" data-idx="' + i + '" style="width:22px;height:15px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:3px;font-size:8px;color:#8B98B8;cursor:pointer;' + (i == dsQueue.length-1 ? 'opacity:.2;pointer-events:none;' : '') + '">&#9660;</button>'
      + '</div>'
      + '<button type="button" data-action="del" data-idx="' + i + '" style="width:18px;height:18px;border-radius:4px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);font-size:9px;color:#F87171;cursor:pointer;flex-shrink:0;">&#10005;</button>';
    row.querySelectorAll('button').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var action = btn.dataset.action;
        var idx = parseInt(btn.dataset.idx, 10);
        if(action == 'up' && idx > 0) {
          var tmp = dsQueue[idx]; dsQueue[idx] = dsQueue[idx-1]; dsQueue[idx-1] = tmp;
        } else if(action == 'down' && idx < dsQueue.length-1) {
          var tmp2 = dsQueue[idx]; dsQueue[idx] = dsQueue[idx+1]; dsQueue[idx+1] = tmp2;
        } else if(action == 'del') {
          dsQueue.splice(idx, 1);
        }
        syncDsQueueToRoute();
        if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
        applyNearbyMarkerOpacity();
        injectDsRoleLabels();
        updateDsMarkerLabels();
        drawDsPolylines();
        renderDsEditList();
      });
    });
    list.appendChild(row);
  });
}

function renderDsPreview() {
  var el = document.getElementById('dsPreview');
  if(!el) return;
  el.innerHTML = '';
  if(dsQueue.length == 0) {
    el.innerHTML = '<span class="ds-hint">고객을 순서대로 클릭해 동선을 설정하세요</span>';
    return;
  }

  var dragSrcIdx = null;
  var dropIndicator = document.createElement('div');
  dropIndicator.className = 'ds-drop-indicator';
  dropIndicator.style.display = 'none';

  function getChipCls(i) {
    return 'ds-pi ' + (i == 0 ? 'ds-pf' : (i == dsQueue.length - 1 && dsQueue.length > 1 ? 'ds-pt' : 'ds-pv'));
  }

  function buildChips() {
    el.innerHTML = '';
    dsQueue.forEach(function(item, i) {
      var chip = document.createElement('span');
      chip.className = getChipCls(i);
      chip.draggable = true;
      chip.dataset.idx = i;
      chip.innerHTML = '<span class="ds-seq-n">' + (i+1) + '</span>' + item.name;

      chip.addEventListener('dragstart', function(e) {
        dragSrcIdx = i;
        setTimeout(function(){ chip.classList.add('dragging'); }, 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      chip.addEventListener('dragend', function() {
        chip.classList.remove('dragging');
        dropIndicator.style.display = 'none';
        dragSrcIdx = null;
      });
      chip.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var rect = chip.getBoundingClientRect();
        var mid = rect.left + rect.width / 2;
        var targetIdx = e.clientX < mid ? i : i + 1;
        if(targetIdx != dragSrcIdx && targetIdx != dragSrcIdx + 1) {
          dropIndicator.style.display = '';
          if(e.clientX < mid) {
            el.insertBefore(dropIndicator, chip);
          } else {
            el.insertBefore(dropIndicator, chip.nextSibling);
          }
        }
      });
      chip.addEventListener('drop', function(e) {
        e.preventDefault();
        if(dragSrcIdx == null || dragSrcIdx == i) return;
        var rect = chip.getBoundingClientRect();
        var mid = rect.left + rect.width / 2;
        var toIdx = e.clientX < mid ? i : i + 1;
        if(toIdx > dragSrcIdx) toIdx--;
        if(toIdx == dragSrcIdx) return;
        var moved = dsQueue.splice(dragSrcIdx, 1)[0];
        dsQueue.splice(toIdx, 0, moved);
        syncDsQueueToRoute();
        if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
        applyNearbyMarkerOpacity();
        injectDsRoleLabels();
        updateDsMarkerLabels();
        drawDsPolylines();
        renderDsEditList();
      });

      el.appendChild(chip);

      if(i < dsQueue.length - 1) {
        var arr = document.createElement('span');
        arr.className = 'ds-hint';
        arr.textContent = '→';
        el.appendChild(arr);
      }
    });

    var hint = document.createElement('span');
    hint.className = 'ds-hint';
    hint.style.cssText = 'margin-left:auto;color:rgba(232,201,122,.5);font-size:9px;white-space:nowrap;';
    hint.textContent = dsQueue.length > 0 ? '✏️ 순서편집' : '재클릭: 제거';
    el.appendChild(hint);
  }

  buildChips();
}

function makeRouteStopMarker(num, color){
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">'
    + '<path d="M15 0C7 0 0.5 6.5 0.5 14.5C0.5 25 15 40 15 40S29.5 25 29.5 14.5C29.5 6.5 23 0 15 0z" fill="' + color + '" stroke="#fff" stroke-width="1.5"/>'
    + '<circle cx="15" cy="14.5" r="9" fill="#fff"/>'
    + '<text x="15" y="14.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="' + color + '">' + num + '</text>'
    + '</svg>';
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(30,40),
    { offset: new kakao.maps.Point(15,40) }
  );
}

function makeRouteStopOverlay(pos, roleText, name, roleColor){
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;';

  badge.textContent = roleText;
  var nameBox = document.createElement('div');
  nameBox.style.cssText = 'background:rgba(8,14,28,.92);border:1px solid rgba(201,168,76,.28);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;color:#F0F4FF;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.45);';
  nameBox.textContent = name;
  wrap.appendChild(badge); wrap.appendChild(nameBox);
  return new kakao.maps.CustomOverlay({ position:pos, content:wrap, yAnchor:3.0, zIndex:6, clickable:true });
}

function renderTodayListFromQueue(){
  var inner = document.getElementById('todayInner');
  if(!inner) return;
  var fpName = (window._activeRoute && window._activeRoute.fpName) || '';
  var dateStr = (window._activeRoute && window._activeRoute.date) || '';
  var header = '📅 ' + fpName + ' ' + dateStr + ' 동선 (' + dsQueue.length + '곳)';
  var html = '<div class="today-hd">' + header + '</div>';
  if(!dsQueue.length){
    html += '<div class="today-empty">동선이 비어있습니다 · 담기 모드로 추가하세요</div>';
    inner.innerHTML = html;
    return;
  }
  dsQueue.forEach(function(q, i){
    var seqCls = i == 0 ? 'ds-seq ds-s0' : (i == dsQueue.length - 1 ? 'ds-seq ds-s2' : 'ds-seq ds-s1');

function renderRouteFromData(route){
  var inner = document.getElementById('todayInner');
  if(!inner || !route || !route.stops) return;
  window._activeRoute = route;
  // 최초 불러온 동선 원본 백업 (초기화 시 복원용) — 깊은 복사
  try { window._originalRoute = JSON.parse(JSON.stringify(route)); } catch(e){ window._originalRoute = null; }
  var stops = route.stops;
  var header = '📅 ' + (route.fpName||'') + ' ' + (route.date||'') + ' 동선 (' + stops.length + '곳)';
  var html = '<div class="today-hd">' + header + '</div>';
  if(!stops.length){
    html += '<div class="today-empty">해당 날짜에 좌표가 등록된 동선이 없습니다</div>';
    inner.innerHTML = html;
    clearRouteLayer();
    return;
  }
  stops.forEach(function(s, i) {
    var seqCls = i == 0 ? 'ds-seq ds-s0' : (i == stops.length - 1 ? 'ds-seq ds-s2' : 'ds-seq ds-s1');
    var supTxt = '';
    if(s.support){
      var sIcon = s.support=='지점장' ? '🎯' : '👤';
      var sReq = s.supportReqTime ? ' ' + s.supportReqTime + (s.supportReqEndTime?'~'+s.supportReqEndTime:'') : '';
      supTxt = ' <span style="color:#93C5FD;font-size:9px">' + sIcon + s.support + sReq + '</span>';
    }
    html += '<div class="today-row route-row" data-ri="' + i + '" style="cursor:pointer">'
      + '<div class="today-seq-num">' + (i+1) + '</div>'
      + '<div class="today-body">'
      + '<div class="today-name">' + (s.time ? '<span class="today-time">' + s.time + '</span> ' : '') + s.name + supTxt + '</div>'
      + '<div class="today-place">' + (s.address || '') + '</div>'
      + '</div>'
      + '</div>';
  });
  if(route.skipped) html += '<div style="font-size:10px;color:var(--text3);padding:6px 0 0">※ 좌표 없는 활동 ' + route.skipped + '건은 지도에서 제외됨</div>';
  inner.innerHTML = html;

  // 동선을 dsQueue로 적재 (실제 핀/이음선은 drawNearby 이후에 그림 — 주변 마커와 중복 방지)
  clearRouteLayer();
  if(!kakaoMap) return;
  dsQueue = [];
  stops.forEach(function(s){
    if(!s.lat || !s.lng) return;
    dsQueue.push({ id: s.id || ('RT_'+s.name+'_'+s.lat), custId: s.custId || '', name: s.name, lat: String(s.lat), lng: String(s.lng), address: s.address || s.name });
  });
  // 리스트 행 클릭 → 해당 위치로 이동
  var path = [];
  stops.forEach(function(s){ if(s.lat && s.lng) path.push(new kakao.maps.LatLng(parseFloat(s.lat), parseFloat(s.lng))); });
  inner.querySelectorAll('.route-row').forEach(function(rowEl){
    rowEl.addEventListener('click', function(){
      var ri = parseInt(rowEl.getAttribute('data-ri'));
      var s = stops[ri];
      if(s && s.lat && s.lng && kakaoMap){
        kakaoMap.setCenter(new kakao.maps.LatLng(parseFloat(s.lat), parseFloat(s.lng)));
        showRouteStopInfo(s);
      }
    });
  });
  if(path.length === 1){
    kakaoMap.setCenter(path[0]);
  } else if(path.length > 1){
    var bounds = new kakao.maps.LatLngBounds();
    path.forEach(function(p){ bounds.extend(p); });
    kakaoMap.setBounds(bounds);
  }

  // 동선 첫 출발지를 기준으로 주변 고객을 개별 진입과 동일하게(선명) 표시
  if(stops.length){
    var firstStop = null;
    for(var fs=0; fs<stops.length; fs++){ if(stops[fs].lat && stops[fs].lng){ firstStop = stops[fs]; break; } }
    if(firstStop){
      centerLat = parseFloat(firstStop.lat);
      centerLng = parseFloat(firstStop.lng);
      // 동선 진입: 기준 고객 없음 (파란 기준핀 미표시)
      isCustomerMode = false;
      window._baseCustomerId = '';
      window._routeEntryNoBase = true;
      drawNearby(centerLat, centerLng);
      window._routeEntryNoBase = false;
      // drawNearby가 clearMarkers로 동선 레이어를 지우므로 동선(번호핀+이음선) 다시 그림
      syncDsQueueToRoute();
      injectDsRoleLabels();
      updateDsMarkerLabels();
      drawDsPolylines();
    }
  }
}

// 동선조회: 동선 정류장 외 반경 고객을 흐리게 표시
function drawRouteNearbyDimmed(lat, lng){
  if(!kakaoMap) return;
  var rKm = (typeof radiusKm === 'number' && radiusKm) ? radiusKm : 5;
  var allCustomers = [];
  try { allCustomers = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){}
  if(!Array.isArray(allCustomers)) allCustomers = [];
  // 동선에 포함된 고객(이름+좌표) 집합
  var inRoute = {};
  dsQueue.forEach(function(q){ inRoute[q.name + '|' + String(q.lat).slice(0,7)] = true; });
  if(!window._routeDimMarkers) window._routeDimMarkers = [];
  window._routeDimMarkers.forEach(function(m){ if(m.marker) m.marker.setMap(null); if(m.overlay) m.overlay.setMap(null); });
  window._routeDimMarkers = [];
  allCustomers.forEach(function(c){
    if(!c.lat || !c.lng) return;
    var dist = getDistKm(lat, lng, parseFloat(c.lat), parseFloat(c.lng));
    if(dist > rKm) return;
    if(inRoute[c.name + '|' + String(c.lat).slice(0,7)]) return; // 동선 포함 고객 제외
    var pos = new kakao.maps.LatLng(parseFloat(c.lat), parseFloat(c.lng));
    var color = c.customerType==='계약'?'#10B981':c.customerType==='관리'?'#8B5CF6':'#F59E0B';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="31" viewBox="0 0 28 36"><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '"/><circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/></svg>';
    var img = new kakao.maps.MarkerImage('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))), new kakao.maps.Size(24,31));
    var mk = new kakao.maps.Marker({ position: pos, map: kakaoMap, image: img, title: c.name, zIndex: 2 });
    mk.setOpacity(0.45);
    var lblEl = document.createElement('div');
    lblEl.style.cssText = 'background:rgba(8,14,28,.55);border:1px solid rgba(201,168,76,.15);border-radius:6px;padding:2px 7px;font-size:9px;font-weight:600;color:rgba(240,244,255,.6);white-space:nowrap;cursor:pointer;';
    lblEl.textContent = c.name;
    var ov = new kakao.maps.CustomOverlay({ position: pos, content: lblEl, yAnchor: 2.4, zIndex: 2, clickable: true });
    ov.setMap(kakaoMap);
    (function(cust){ lblEl.addEventListener('click', function(){ if(canAddToRoute()){ addToDsQueue(cust); } else { showPopup(cust, getDistKm(lat,lng,parseFloat(cust.lat),parseFloat(cust.lng))); } });
      kakao.maps.event.addListener(mk, 'click', function(){ if(canAddToRoute()){ addToDsQueue(cust); } else { showPopup(cust, getDistKm(lat,lng,parseFloat(cust.lat),parseFloat(cust.lng))); } }); })(c);
    window._routeDimMarkers.push({ marker: mk, overlay: ov });
  });
}

function clearRouteDimMarkers(){
  if(!window._routeDimMarkers) return;
  window._routeDimMarkers.forEach(function(m){ if(m.marker) m.marker.setMap(null); if(m.overlay) m.overlay.setMap(null); });

function buildRouteFromActivities(fpId, dateStr){
  var db={}; try{ db=JSON.parse(localStorage.getItem('unispace_activities')||'{}'); }catch(e){}
  var customers=[]; try{ customers=JSON.parse(localStorage.getItem('unispace_customers')||'[]'); }catch(e){}
  function findCust(nm){ for(var i=0;i<customers.length;i++){ if(customers[i] && customers[i].name==nm) return customers[i]; } return null; }
  var acts = Object.values(db).filter(function(a){ return a.fpId===fpId && a.date===dateStr; });
  acts.sort(function(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); });
  var stops=[]; var skipped=0; var fpName='';
  acts.forEach(function(a){
    if(a.fpName) fpName=a.fpName;
    var la=a.lat, ln=a.lng, addr=a.place||a.placeAddr||'';
    var matchedCust = findCust(a.customerName);
    if(!la || !ln){ var c=matchedCust; if(c && c.lat && c.lng){ la=c.lat; ln=c.lng; if(!addr) addr=c.address||''; } }
    if(!la || !ln){ skipped++; return; }
    stops.push({ id:a.id, custId:(matchedCust && matchedCust.id) || '', name:a.customerName, address:addr, lat:String(la), lng:String(ln),
      time:a.time||'', type:a.type||'', status:a.status||'', support:a.support||'',
      supportReqTime:a.supportReqTime||'', supportReqEndTime:a.supportReqEndTime||'' });
  });
  return { fpId:fpId, fpName:fpName, date:dateStr, stops:stops, skipped:skipped };
}

function populateRouteFpSelect(selectedFpId){

  var fpMap={};

  var myId = window._myFpId || '';
  // 본인이 FP면 본인만, 아니면 전체
  sel.innerHTML='';
  var ids = Object.keys(fpMap);
  if(myId && fpMap[myId]){ ids = [myId]; } // FP 본인이면 본인만
  ids.forEach(function(id){
    var opt=document.createElement('option');
    opt.value=id; opt.textContent=fpMap[id];
    opt.style.background='#16213A'; opt.style.color='#F0F4FF';

}

var _calView = new Date();
function initCustomCalendar(){
  var trigger = document.getElementById('dateTriggerBtn');
  var popup = document.getElementById('calPopup');
  if(!trigger || !popup) return;
  var hidden = document.getElementById('routeDateInput');
  if(hidden && hidden.value){
    var pv = hidden.value.split('-');
    _calView = new Date(parseInt(pv[0],10), parseInt(pv[1],10)-1, 1);
    updateDateTriggerLabel();
  }
  // 요일 헤더
  var dowEl = document.getElementById('calDow');
  if(dowEl && !dowEl.dataset.done){
    var dows = ['일','월','화','수','목','금','토'];
    dowEl.innerHTML = dows.map(function(d,idx){
      var clr = idx===0 ? '#FF8A8A' : (idx===6 ? '#8AB4FF' : '#8B98B8');
      return '<div style="text-align:center;font-size:10px;font-weight:700;color:'+clr+';padding:2px 0;">'+d+'</div>';
    }).join('');
    dowEl.dataset.done = '1';
  }
  trigger.addEventListener('click', function(e){
    e.stopPropagation();
    popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
    if(popup.style.display === 'block') renderCalGrid();
  });
  document.getElementById('calPrev').addEventListener('click', function(e){ e.stopPropagation(); _calView.setMonth(_calView.getMonth()-1); renderCalGrid(); });
  document.getElementById('calNext').addEventListener('click', function(e){ e.stopPropagation(); _calView.setMonth(_calView.getMonth()+1); renderCalGrid(); });
  document.getElementById('calToday').addEventListener('click', function(e){
    e.stopPropagation();
    var t = new Date();
    setCalDate(t.getFullYear(), t.getMonth(), t.getDate());
  });
  document.getElementById('calClear').addEventListener('click', function(e){
    e.stopPropagation();
    if(hidden) hidden.value = '';
    updateDateTriggerLabel();
    popup.style.display = 'none';
  });
  // 팝업 바깥 클릭 시 닫기
  document.addEventListener('click', function(ev){
    if(popup.style.display !== 'none' && !popup.contains(ev.target) && ev.target !== trigger){
      popup.style.display = 'none';
    }
  });
  popup.addEventListener('click', function(ev){ ev.stopPropagation(); });
}

function renderCalGrid(){
  var grid = document.getElementById('calGrid');
  var title = document.getElementById('calTitle');
  if(!grid || !title) return;
  var y = _calView.getFullYear(), m = _calView.getMonth();
  title.textContent = y + '년 ' + (m+1) + '월';
  var first = new Date(y, m, 1);
  var startDow = first.getDay();
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var hidden = document.getElementById('routeDateInput');
  var sel = hidden && hidden.value ? hidden.value : '';
  var todayStr = new Date().toISOString().slice(0,10);
  var cells = '';
  for(var b=0; b<startDow; b++){ cells += '<div></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = y + '-' + ('0'+(m+1)).slice(-2) + '-' + ('0'+d).slice(-2);
    var dow = new Date(y, m, d).getDay();
    var isSel = dateStr === sel;
    var isToday = dateStr === todayStr;
    var clr = dow===0 ? '#FF8A8A' : (dow===6 ? '#8AB4FF' : '#F0F4FF');
    var bg = isSel ? 'background:#3B82F6;color:#fff;' : (isToday ? 'background:rgba(232,201,122,.18);' : '');
    var bd = isToday && !isSel ? 'border:1px solid rgba(232,201,122,.5);' : 'border:1px solid transparent;';
    cells += '<div class="cal-day" data-date="'+dateStr+'" style="text-align:center;font-size:12px;font-weight:600;padding:6px 0;border-radius:7px;cursor:pointer;color:'+clr+';'+bg+bd+'">'+d+'</div>';
  }
  grid.innerHTML = cells;
  grid.querySelectorAll('.cal-day').forEach(function(cell){
    cell.addEventListener('click', function(e){
      e.stopPropagation();
      var ds = cell.getAttribute('data-date').split('-');
      setCalDate(parseInt(ds[0],10), parseInt(ds[1],10)-1, parseInt(ds[2],10));
    });
  });
}

function setCalDate(y, m, d){

    var c = customers.filter(function(cu){ return cu.name == a.customerName; })[0];
    var obj = { name: a.customerName, lat: c ? (c.lat||'') : '', lng: c ? (c.lng||'') : '', address: c ? (c.address||a.place||'') : (a.place||'') };
    if(i == 0) panelFrom = obj;
    else if(i == acts.length - 1) panelTo = obj;
    else panelVia.push(obj);
    if(c && c.lat && c.lng) {
      var pos = new kakao.maps.LatLng(parseFloat(c.lat), parseFloat(c.lng));
      var type = i == 0 ? 'from' : (i == acts.length - 1 ? 'to' : 'via_' + (i-1));
      var pinNum = String(i+1);
      var overlayTxt = (i+1) + '. ' + a.customerName + (obj.address ? ' · ' + obj.address : '');
      setRoutePin(type, pos, pinNum);
      updateRoutePinAddr(type, pos, overlayTxt);
    }
  });
  renderRoutePanel();
  var ob = document.getElementById('routeOpenBtn');
  if(ob && (panelFrom || panelTo)) ob.className = 'route-open-btn has-route';
}

function flashHighlightInList(customer) {
  if(!window._nearbyList) return;
  var foundIdx = -1;
  window._nearbyList.forEach(function(item, i) {
    var c = item.c;
    var match = (customer.id && c.id) ? customer.id == c.id : (customer.name == c.name && String(customer.lat).slice(0,7) == String(c.lat).slice(0,7));
    if(match) foundIdx = i;
  });
  if(foundIdx === -1) return;
  var el = document.getElementById('citem_' + foundIdx);
  if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  el.style.transition = 'background .15s';
  el.style.background = 'rgba(232,201,122,.18)';
  el.style.borderLeft = '3px solid #E8C97A';
  setTimeout(function(){ el.style.background = ''; el.style.borderLeft = ''; }, 1200);
}

// 동선 큐 전체 초기화 (담기/조회 공통)
function resetDsQueue() {
  // 동선 진입(원본 동선 있음): 초기화 시 최초 불러온 동선으로 복원
  if(window._originalRoute && window._originalRoute.stops && window._originalRoute.stops.length){
    var orig = null;
    try { orig = JSON.parse(JSON.stringify(window._originalRoute)); } catch(e){ orig = window._originalRoute; }
    dsQueue = [];
    clearAllRoutePins();
    clearDsPolylines();
    clearDsRoleLayer();
    clearInlineRoleBadges();
    if(typeof _clearRemovedRoutePins === 'function') _clearRemovedRoutePins();
    setRouteMode('view');
    renderRouteFromData(orig);
    return;
  }
  dsQueue = [];
  window._activeRoute = null;
  clearAllRoutePins();
  clearDsPolylines();
  clearDsRoleLayer();
  clearInlineRoleBadges();
  if(typeof _clearRemovedRoutePins === 'function') _clearRemovedRoutePins();
  restoreNearbyMarkerOpacity();
  panelFrom = null; panelTo = null; panelVia = [];
  renderRoutePanel();
  renderDsEditList();
  // 개별 진입(기준 고객 있음): 파란 기준핀 복원 위해 drawNearby. 그 외엔 주변만 갱신
  if(isCustomerMode && window._baseCustomerId && centerLat && centerLng){
    drawNearby(centerLat, centerLng);
  } else if(centerLat && centerLng && window._nearbyList){
    refreshNearbyOnly(centerLat, centerLng);
  }
  var ob = document.getElementById('routeOpenBtn');
  if(ob) ob.className = 'route-open-btn';
  if(currentTab == 'today') renderTodayListFromQueue();
}

// 동선 큐 전체 재렌더 (핀/이름/역할/이음선 모두 일관되게 다시 그림)
function rerenderDsQueue() {
  syncDsQueueToRoute();
  clearDsRoleLayer();
  drawDsPolylines();
  injectDsRoleLabels();
  updateDsMarkerLabels();
  renderDsEditList();
  if(currentTab == 'today') renderTodayListFromQueue();
}

// 큐에서 항목 제거 (id 또는 이름+좌표로 매칭)
function removeFromDsQueue(matchObj) {
  var ri = dsQueue.findIndex(function(q){
    if(matchObj.id && q.id) return q.id == matchObj.id;
    return q.name == matchObj.name && String(q.lat).slice(0,7) == String(matchObj.lat).slice(0,7);
  });
  if(ri === -1) return false;
  var removed = dsQueue[ri];
  dsQueue.splice(ri, 1);
  // 빠진 고객이 기준 고객이면 파란 기준핀 복원 (원래 위치 유지)
  var isBaseRemoved = window._baseCustomerId && ((removed.id && removed.id == window._baseCustomerId) || (removed.custId && removed.custId == window._baseCustomerId) || (isCustomerMode && removed.lat && removed.lng && centerLat && centerLng && getDistKm(centerLat, centerLng, parseFloat(removed.lat), parseFloat(removed.lng)) < 0.05));
  if(isBaseRemoved && centerLat && centerLng){
    isCustomerMode = true;
    drawNearby(centerLat, centerLng);
    rerenderDsQueue();
    return true;
  }
  if(centerLat && centerLng && window._nearbyList) refreshNearbyOnly(centerLat, centerLng);
  rerenderDsQueue();
  // 빠진 고객이 주변 마커로 표시되지 않는 경우(동선 진입 등) 일반 핀+이름을 직접 남김
  if(removed && removed.lat && removed.lng){
    var isArb = removed.id && String(removed.id).indexOf('DS_PIN_') === 0;
    var hasNm = false;
    if(window._nearbyList){
      for(var k=0;k<window._nearbyList.length;k++){
        var nc = window._nearbyList[k] && window._nearbyList[k].c;
        if(!nc) continue;
        if((nc.id && removed.id && nc.id==removed.id) || (nc.name==removed.name && String(nc.lat).slice(0,7)==String(removed.lat).slice(0,7))){ hasNm = true; break; }
      }
    }
    // 임의좌표(DS_PIN_)는 일반 핀으로 남기지 않음. 그 외 고객이 주변 마커에 없으면 일반 핀 생성
    if(!isArb && !hasNm){
      _drawRemovedRoutePin(removed);
    }
  }
  return true;
}

// 동선에서 뺀 고객을 일반 핀+이름으로 표시 (동선 진입 시 복원)
function _drawRemovedRoutePin(cust){
  if(!kakaoMap || !cust || !cust.lat || !cust.lng) return;
  var pos = new kakao.maps.LatLng(parseFloat(cust.lat), parseFloat(cust.lng));
  var full = null;
  if(window.allCustomers){ for(var z=0;z<allCustomers.length;z++){ if(allCustomers[z] && (allCustomers[z].id==cust.id || allCustomers[z].name==cust.name)){ full=allCustomers[z]; break; } } }
  var color = (full && full.customerType==='계약')?'#10B981':(full && full.customerType==='관리')?'#8B5CF6':'#F59E0B';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '"/><circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/></svg>';
  var img = new kakao.maps.MarkerImage('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))), new kakao.maps.Size(28,36));
  var mk = new kakao.maps.Marker({ position: pos, map: kakaoMap, image: img, title: cust.name, zIndex: 4 });
  var lblEl = document.createElement('div');
  lblEl.style.cssText = 'background:rgba(13,22,40,.9);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#F0F4FF;white-space:nowrap;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.45);';
  lblEl.textContent = cust.name;
  var ov = new kakao.maps.CustomOverlay({ position: pos, content: lblEl, yAnchor: 2.4, zIndex: 4, clickable: true });
  ov.setMap(kakaoMap);
  (function(c2){ function fire(){ if(canAddToRoute()){ addToDsQueue(c2); } else if(full){ showPopup(full, 0); } else { showRouteToast(c2.name + (c2.address?('\n📍 '+c2.address):'')); } }
    lblEl.addEventListener('click', fire);
    kakao.maps.event.addListener(mk, 'click', fire); })(cust);
  _removedRoutePins.push({ marker: mk, overlay: ov, key: cust.name + '|' + String(cust.lat).slice(0,7) });
}

function _clearRemovedRoutePins(){
  if(!_removedRoutePins) return;
  _removedRoutePins.forEach(function(p){ if(p.marker) p.marker.setMap(null); if(p.overlay) p.overlay.setMap(null); });
  _removedRoutePins = [];
}


function addToDsQueue(customer) {
  if(!customer || !customer.lat || !customer.lng) return;
  // 동선에서 빠져 일반 핀으로 남아있던 같은 고객이 있으면 그 핀 제거 (중복 방지)
  if(_removedRoutePins && _removedRoutePins.length){
    var ckey = customer.name + '|' + String(customer.lat).slice(0,7);
    for(var rp = _removedRoutePins.length - 1; rp >= 0; rp--){
      if(_removedRoutePins[rp].key === ckey){
        if(_removedRoutePins[rp].marker) _removedRoutePins[rp].marker.setMap(null);
        if(_removedRoutePins[rp].overlay) _removedRoutePins[rp].overlay.setMap(null);
        _removedRoutePins.splice(rp, 1);
      }
    }
  }
  var idx = dsQueue.findIndex(function(q){
    if(customer.id && q.id) return q.id == customer.id;
    return q.name == customer.name && String(q.lat).slice(0,7) == String(customer.lat).slice(0,7);
  });
  if(idx !== -1) {
    // 이미 큐에 있으면 제거 (토글)
    var removedC = dsQueue[idx];
    dsQueue.splice(idx, 1);
    // 빠진 고객이 기준 고객이면 파란 기준핀 복원 (drawNearby 재호출)
    var isBaseRemoved = window._baseCustomerId && ((removedC.id && removedC.id == window._baseCustomerId) || (removedC.custId && removedC.custId == window._baseCustomerId));
    if(isBaseRemoved && centerLat && centerLng){
      isCustomerMode = true;
      drawNearby(centerLat, centerLng);
      rerenderDsQueue();
      return;
    }
    if(centerLat && centerLng && window._nearbyList) refreshNearbyOnly(centerLat, centerLng);
    rerenderDsQueue();
    return;
  }
  dsQueue.push({ id: customer.id, name: customer.name, lat: customer.lat, lng: customer.lng, address: customer.address || '' });
  if(centerLat && centerLng && window._nearbyList) refreshNearbyOnly(centerLat, centerLng);
  rerenderDsQueue();
  setTimeout(function(){ flashHighlightInList(customer); }, 100);
}

function updateDsMarkerLabels() {
  // Role badge is attached as a child element ABOVE nameBox inside labelEl
  // (column flex), so it always sits directly above the name with no overlap.
  // nameBox structure itself is never modified.
  if(!window._nearbyMarkers || !window._nearbyList) return;
  window._nearbyMarkers.forEach(function(nm, i) {
    var c = window._nearbyList[i] ? window._nearbyList[i].c : null;
    if(!c || !nm.labelEl) return;
    // 기준 고객(파란 기준핀으로 대체 표시)은 큐에 담겨도 일반 마커를 다시 켜지 않음
    var isBaseC = (window._baseCustomerId && c.id === window._baseCustomerId);
    if(!isBaseC && isCustomerMode && c.lat && c.lng && centerLat && centerLng){
      if(getDistKm(centerLat, centerLng, parseFloat(c.lat), parseFloat(c.lng)) < 0.03) isBaseC = true;
    }
    if(isBaseC){
      if(nm.marker) nm.marker.setMap(null);
      if(nm.overlay) nm.overlay.setMap(null);
      if(nm.labelEl) nm.labelEl.style.display = 'none';
      return;
    }
    var queueIdx = dsQueue.findIndex(function(q){
      if(q.id && (String(q.id).startsWith('MY_LOC_') || String(q.id).startsWith('DS_PIN_'))) return false;
      if(c.id && q.custId && q.custId == c.id) return true;
      if(c.id && q.id && !q.id.startsWith('MY_LOC_') && !q.id.startsWith('DS_PIN_') && !q.id.startsWith('RT_') && !q.id.startsWith('act_')) return q.id == c.id;
      return q.name == c.name;
    });
    var inQueue = queueIdx !== -1;
    // remove any existing role badge child first
    var oldBadge = nm.labelEl.querySelector('.ds-role-badge-inline');
    if(oldBadge) oldBadge.parentNode.removeChild(oldBadge);
    if(inQueue) {
      // 동선에 담긴 고객은 번호 핀(injectDsRoleLabels)으로 표시하므로 주변 마커/라벨 숨김
      if(nm.marker) nm.marker.setMap(null);
      if(nm.overlay) nm.overlay.setMap(null);
      nm.labelEl.style.display = 'none';
    } else {
      // 큐에 없는 고객: 담기 모드면 흐리게
      if(nm.marker) nm.marker.setMap(kakaoMap);
      if(nm.overlay) nm.overlay.setMap(kakaoMap);
      nm.labelEl.style.display = '';
      var dimOff = canAddToRoute() && dsQueue.length > 0;
      nm.labelEl.style.opacity = dimOff ? '0.6' : '1';
      if(nm.marker) nm.marker.setOpacity(dimOff ? 0.6 : 1.0);
    }
  });
}

// 길찾기 팝업에서 선택한 좌표(from/to/via_N)를 dsQueue에 반영 → 번호핀+이음선 통일
function setRoutePointToQueue(mode, obj){
  // panel 변수도 함께 유지(카카오 내비 호출용)
  if(mode === 'from') panelFrom = obj;
  else if(mode === 'to') panelTo = obj;
  else if(mode && mode.indexOf('via_') === 0){
    var vi0 = parseInt(mode.split('_')[1], 10);
    if(vi0 >= 0 && vi0 < panelVia.length) panelVia[vi0] = obj;
    else panelVia.push(obj);
  }
  var keepId = (obj.id && String(obj.id).indexOf('DS_PIN_') !== 0 && String(obj.id).indexOf('MY_LOC_') !== 0) ? obj.id : ('DS_PIN_' + Date.now() + '_' + Math.floor(Math.random()*1000));
  var qItem = { id: keepId, custId: obj.custId || (obj.id && String(obj.id).indexOf('DS_PIN_') !== 0 ? obj.id : ''), name: obj.name, lat: obj.lat, lng: obj.lng, address: obj.address || obj.name };
  // 슬롯에 있던 기존 항목이 실제 고객(임의좌표 아님)이면, 동선에서 빼고 원래 위치에 일반 핀으로 복원
  function _displaceReal(prev){
    if(!prev) return;
    var isArbPrev = prev.id && (String(prev.id).indexOf('DS_PIN_') === 0 || String(prev.id).indexOf('MY_LOC_') === 0);
    if(isArbPrev) return;
    // 기준 고객이면 파란 기준핀으로 복원, 아니면 일반 핀
    var isBasePrev = window._baseCustomerId && ((prev.id && prev.id == window._baseCustomerId) || (prev.custId && prev.custId == window._baseCustomerId));
    if(isBasePrev && centerLat && centerLng){
      isCustomerMode = true;
      window._restoreBaseAfter = true;
    } else if(prev.lat && prev.lng){
      _drawRemovedRoutePin(prev);
    }
  }
  if(mode === 'from'){
    if(dsQueue.length === 0) dsQueue.push(qItem);
    else { _displaceReal(dsQueue[0]); dsQueue[0] = qItem; }
  } else if(mode === 'to'){
    if(dsQueue.length <= 1) dsQueue.push(qItem);
    else { _displaceReal(dsQueue[dsQueue.length - 1]); dsQueue[dsQueue.length - 1] = qItem; }
  } else if(mode && mode.indexOf('via_') === 0){
    var vi = parseInt(mode.split('_')[1], 10);
    var targetIdx = vi + 1; // 0=from 다음이 첫 경유
    var lastIdx = dsQueue.length - 1; // 도착 위치
    if(dsQueue.length <= 1){
      // 출발만 있거나 빈 경우: 뒤에 추가
      dsQueue.push(qItem);
    } else if(targetIdx >= lastIdx){
      // 새 경유: 도착 바로 앞에 삽입 (도착 보존)
      dsQueue.splice(lastIdx, 0, qItem);
    } else {
      // 기존 경유 슬롯 교체
      _displaceReal(dsQueue[targetIdx]); dsQueue[targetIdx] = qItem;
    }
  }
  // 번호핀 + 이음선 통일 렌더
  clearAllRoutePins();
  injectDsRoleLabels();
  updateDsMarkerLabels();
  drawDsPolylines();
  renderDsEditList();
  renderRoutePanel();
  if(window._restoreBaseAfter){ window._restoreBaseAfter = false; if(centerLat && centerLng) drawNearby(centerLat, centerLng); injectDsRoleLabels(); updateDsMarkerLabels(); drawDsPolylines(); }
  if(currentTab == 'today') renderTodayListFromQueue();
  var ob = document.getElementById('routeOpenBtn');
  if(ob) ob.className = 'route-open-btn' + (dsQueue.length > 1 ? ' has-route' : '');
}

// 길찾기 팝업 X 삭제: dsQueue의 해당 지점 제거 → 번호핀/이음선 갱신
function removeRoutePointFromQueue(mode){
  var rmIdx = -1;
  if(mode === 'from') rmIdx = 0;
  else if(mode === 'to') rmIdx = dsQueue.length - 1;
  else if(mode && mode.indexOf('via_') === 0){
    var vi = parseInt(mode.split('_')[1], 10);
    rmIdx = vi + 1;
  }
  if(rmIdx < 0 || rmIdx >= dsQueue.length) return;
  var removed = dsQueue[rmIdx];
  dsQueue.splice(rmIdx, 1);
  // 실제 고객이면 원래 위치에 복원 (기준 고객은 파란핀)
  var isArb = removed.id && (String(removed.id).indexOf('DS_PIN_') === 0 || String(removed.id).indexOf('MY_LOC_') === 0);
  var restoredBase = false;
  if(!isArb && removed.lat && removed.lng){
    var isBase = window._baseCustomerId && ((removed.id && removed.id == window._baseCustomerId) || (removed.custId && removed.custId == window._baseCustomerId));
    if(isBase && centerLat && centerLng){ isCustomerMode = true; drawNearby(centerLat, centerLng); restoredBase = true; }
    else _drawRemovedRoutePin(removed);
  }
  clearAllRoutePins();
  injectDsRoleLabels();
  updateDsMarkerLabels();
  drawDsPolylines();
  // panel 배열을 dsQueue 기준으로 재구성 (팝업 입력칸 동기화)
  panelFrom = null; panelTo = null; panelVia = [];
  dsQueue.forEach(function(it, ix){
    var o = { name: it.name, lat: it.lat, lng: it.lng, address: it.address };
    if(ix === 0) panelFrom = o;
    else if(ix === dsQueue.length - 1 && dsQueue.length > 1) panelTo = o;
    else panelVia.push(o);
  });
  renderDsEditList();
  renderRoutePanel();
  if(currentTab == 'today') renderTodayListFromQueue();
  var ob2 = document.getElementById('routeOpenBtn');
  if(ob2) ob2.className = 'route-open-btn' + (dsQueue.length > 1 ? ' has-route' : '');
}

// dsQueue 내 두 인접 항목 교환 (출발/경유/도착 자유 이동). qIdx와 qIdx+dir을 swap
function swapInQueue(qIdx, dir){
  var t = qIdx + dir;
  if(qIdx < 0 || qIdx >= dsQueue.length) return;
  if(t < 0 || t >= dsQueue.length) return;
  var tmp = dsQueue[t]; dsQueue[t] = dsQueue[qIdx]; dsQueue[qIdx] = tmp;
  clearAllRoutePins();
  injectDsRoleLabels();
  updateDsMarkerLabels();
  drawDsPolylines();
  panelFrom = null; panelTo = null; panelVia = [];
  dsQueue.forEach(function(it, ix){
    var o = { name: it.name, lat: it.lat, lng: it.lng, address: it.address };
    if(ix === 0) panelFrom = o;
    else if(ix === dsQueue.length - 1 && dsQueue.length > 1) panelTo = o;
    else panelVia.push(o);
  });
  renderDsEditList();
  renderRoutePanel();
  if(currentTab == 'today') renderTodayListFromQueue();
}

// 경유지 순서 이동 (panelVia idx 기준, dsQueue는 idx+1) — swapInQueue로 위임
function moveViaInQueue(viaIdx, dir){
  swapInQueue(viaIdx + 1, dir);
}

function syncDsQueueToRoute() {
  panelFrom = null; panelTo = null; panelVia = [];
  clearAllRoutePins();
  clearDsRoleLayer();
  dsQueue.forEach(function(item, i) {
    var obj = { name: item.name, lat: item.lat, lng: item.lng, address: item.address };
    if(i == 0) panelFrom = obj;
    else if(i == dsQueue.length - 1 && dsQueue.length > 1) panelTo = obj;
    else panelVia.push(obj);
    var pos = new kakao.maps.LatLng(parseFloat(item.lat), parseFloat(item.lng));
    var type = i == 0 ? 'from' : (i == dsQueue.length - 1 && dsQueue.length > 1 ? 'to' : 'via_' + (panelVia.length - 1));
    if(!isRouteTab()) {
      var label = i == 0 ? '출발' : (i == dsQueue.length - 1 && dsQueue.length > 1 ? '도착' : '경유' + (panelVia.length));
      setRoutePin(type, pos, label);
      updateRoutePinAddr(type, pos, item.address || item.name);
    }
  });
  renderRoutePanel();
  var ob = document.getElementById('routeOpenBtn');
  if(ob) ob.className = 'route-open-btn' + (dsQueue.length > 1 ? ' has-route' : '');
  drawDsPolylines();
}

function attachRoutePinDsClick2(pos, queueIdx) {}

function injectDsRoleLabels() {
  clearDsRoleLayer();
  if(!kakaoMap || !isRouteTab()) return;
  // 기준 고객이 동선에 담기면 파란 기준핀 숨김 (번호 핀으로 대체, 중복 방지)
  if(window._baseCustomerId && centerMarkerGlobal){
    var baseInQueue = dsQueue.some(function(q){
      if(q.custId && q.custId == window._baseCustomerId) return true;
      if(q.id && q.id == window._baseCustomerId) return true;
      return false;
    });
    if(baseInQueue){
      centerMarkerGlobal.setMap(null); centerMarkerGlobal = null;
      if(centerOverlay){ centerOverlay.setMap(null); centerOverlay = null; }
    }
  }
  dsQueue.forEach(function(item, i) {
    var pos = new kakao.maps.LatLng(parseFloat(item.lat), parseFloat(item.lng));
    var roleText = i == 0 ? '출발' : (i == dsQueue.length - 1 && dsQueue.length > 1 ? '도착' : '경유' + i);
    var roleColor = i == 0 ? '#3B82F6' : (i == dsQueue.length - 1 && dsQueue.length > 1 ? '#EF4444' : '#A78BFA');
    var isPinType = item.id && (String(item.id).indexOf('DS_PIN_') === 0 || String(item.id).indexOf('MY_LOC_') === 0 || item.id === 'MY_LOC_FIXED');
    if(isPinType) {
      var pinSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40"><path d="M15 0C7 0 0.5 6.5 0.5 14.5C0.5 25 15 40 15 40S29.5 25 29.5 14.5C29.5 6.5 23 0 15 0z" fill="' + roleColor + '" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="14.5" r="9" fill="#fff"/><text x="15" y="14.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="' + roleColor + '">' + (i+1) + '</text></svg>';

      (function(itm){ kakao.maps.event.addListener(pinMarker, 'click', function(){ if(canAddToRoute()){ removeFromDsQueue(itm); } else { showRouteToast(itm.name + (itm.address?('\n📍 '+itm.address):'')); } }); })(item);

      var addrText = item.address || item.name;
      var shortAddr = addrText.length > 14 ? addrText.replace(/^[^\s]+\s[^\s]+\s/, '') : addrText;
      var pinLblEl = document.createElement('div');
      pinLblEl.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;pointer-events:none;';
