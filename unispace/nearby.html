      pinBadge.textContent = roleText;
      var pinNameDiv = document.createElement('div');
      pinNameDiv.style.cssText = 'background:rgba(8,14,28,.92);border:1px solid rgba(201,168,76,.28);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#F0F4FF;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px rgba(0,0,0,.45);';
      pinNameDiv.textContent = shortAddr;
      pinLblEl.appendChild(pinBadge);
      pinLblEl.appendChild(pinNameDiv);
      var pinLblOv = new kakao.maps.CustomOverlay({ position: pos, content: pinLblEl, yAnchor: 1.9, zIndex: 7 });
      pinLblOv._dsRoleKind = 'pin';
      pinLblOv.setMap(kakaoMap);
      dsRoleOverlays.push(pinLblOv);
      // drag live: move label overlay + line with the pin, update queue coords
      (function(qIdx3, lOv){ kakao.maps.event.addListener(pinMarker, 'drag', function(){
        var p3 = pinMarker.getPosition();
        if(!dsQueue[qIdx3]) return;
        dsQueue[qIdx3].lat = String(p3.getLat()); dsQueue[qIdx3].lng = String(p3.getLng());
        lOv.setPosition(p3);
        drawDsPolylines();
      }); })(i, pinLblOv);
      // dragend: update address + queue data in place; do NOT destroy/rebuild markers
      (function(qIdx2, nDiv, lOv){ kakao.maps.event.addListener(pinMarker, 'dragend', function(){
        var p2 = pinMarker.getPosition();
        lOv.setPosition(p2);
        if(dsQueue[qIdx2]){ dsQueue[qIdx2].lat = String(p2.getLat()); dsQueue[qIdx2].lng = String(p2.getLng()); }
        drawDsPolylines();
        var gc2 = new kakao.maps.services.Geocoder();
        gc2.coord2Address(p2.getLng(), p2.getLat(), function(result2, status2){
          var a2 = p2.getLat().toFixed(4) + ',' + p2.getLng().toFixed(4);
          if(status2 === kakao.maps.services.Status.OK && result2.length > 0){
            var r2 = result2[0];
            a2 = r2.road_address ? r2.road_address.address_name : r2.address.address_name;
          }
          if(!dsQueue[qIdx2]) return;
          dsQueue[qIdx2].name = a2; dsQueue[qIdx2].address = a2;
          dsQueue[qIdx2].lat = String(p2.getLat()); dsQueue[qIdx2].lng = String(p2.getLng());
          if(nDiv) nDiv.textContent = a2.length > 14 ? a2.replace(/^[^\s]+\s[^\s]+\s/, '') : a2;
          renderRoutePanel();
          renderDsEditList();
        });
      }); })(i, pinNameDiv, pinLblOv);
    } else {
      // 일반 고객: 주변 마커가 이미 있으면 updateDsMarkerLabels가 배지 부착.
      // 주변 마커가 없으면(동선조회 등) 여기서 직접 핀+라벨 생성.
      var hasNearbyMarker = false;
      if(window._nearbyList){
        for(var k=0;k<window._nearbyList.length;k++){
          var nc = window._nearbyList[k] && window._nearbyList[k].c;
          if(!nc) continue;
          if((nc.id && item.id && nc.id==item.id) || (nc.name==item.name && String(nc.lat).slice(0,7)==String(item.lat).slice(0,7))){ hasNearbyMarker = true; break; }
        }
      }
      // 동선에 담긴 모든 고객을 동일하게 번호 핀으로 표시 (동선 버튼 진입과 동일)
      hasNearbyMarker = false;
      if(!hasNearbyMarker){
        var cSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40"><path d="M15 0C7 0 0.5 6.5 0.5 14.5C0.5 25 15 40 15 40S29.5 25 29.5 14.5C29.5 6.5 23 0 15 0z" fill="' + roleColor + '" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="14.5" r="9" fill="#fff"/><text x="15" y="14.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="' + roleColor + '">' + (i+1) + '</text></svg>';
        var cImg = new kakao.maps.MarkerImage('data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(cSvg))), new kakao.maps.Size(30,40), { offset: new kakao.maps.Point(15,40) });
        var cMarker = new kakao.maps.Marker({ position: pos, map: kakaoMap, image: cImg, title: item.name, zIndex: 6 });
        dsRoleMarkers.push(cMarker);
        // 같은 고객의 주변 마커를 즉시 숨김 (번호 핀과 중복 방지)
        if(window._nearbyMarkers && window._nearbyList){
          var itemCustId = item.custId || ((item.id && String(item.id).indexOf('RT_') !== 0) ? item.id : '');
          for(var hm=0; hm<window._nearbyMarkers.length; hm++){
            var hc = window._nearbyList[hm] && window._nearbyList[hm].c;
            if(!hc) continue;
            var matchById = itemCustId && hc.id && hc.id == itemCustId;
            var matchByNameSpot = (hc.name == item.name) && hc.lat && hc.lng && item.lat && item.lng && getDistKm(parseFloat(hc.lat), parseFloat(hc.lng), parseFloat(item.lat), parseFloat(item.lng)) < 0.03;
            if(matchById || matchByNameSpot){
              var hnm = window._nearbyMarkers[hm];
              if(hnm.marker) hnm.marker.setMap(null);
              if(hnm.overlay) hnm.overlay.setMap(null);
              if(hnm.labelEl) hnm.labelEl.style.display = 'none';

        var cLblEl = document.createElement('div');
        cLblEl.style.cssText = 'display:inline-flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;';
        var cBadge = document.createElement('div');
        cBadge.style.cssText = 'background:' + roleColor + ';color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;margin-bottom:3px;letter-spacing:.03em;box-shadow:0 2px 6px rgba(0,0,0,.4);';
        cBadge.textContent = roleText;
        var cNameDiv = document.createElement('div');
        cNameDiv.style.cssText = 'background:rgba(8,14,28,.92);border:1px solid rgba(201,168,76,.28);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#F0F4FF;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px rgba(0,0,0,.45);';
        cNameDiv.textContent = item.name;
        cLblEl.appendChild(cBadge);
        cLblEl.appendChild(cNameDiv);
        var cLblOv = new kakao.maps.CustomOverlay({ position: pos, content: cLblEl, yAnchor: 1.9, zIndex: 8 });
        cLblOv._dsRoleKind = 'pin';
        cLblOv.setMap(kakaoMap);
        dsRoleOverlays.push(cLblOv);
        (function(itm, qIndex){
          function handleClick(){
            if(canAddToRoute()){
              // 담기 모드: 동선에서만 제거 (일반 고객 핀은 주변 마커로 남음)
              removeFromDsQueue(itm);
              return;
            }
            // 조회 모드: 고객 정보 표시
            var full = null;
            if(window.allCustomers){ for(var z=0;z<allCustomers.length;z++){ if(allCustomers[z] && (allCustomers[z].id==itm.id || allCustomers[z].name==itm.name)){ full=allCustomers[z]; break; } } }
            if(full && typeof showPopup === 'function') showPopup(full, 0);
            else showRouteToast(itm.name + (itm.address?('\n📍 '+itm.address):''));

          kakao.maps.event.addListener(cMarker, 'click', handleClick);

      }

// ── 길찾기 핀 헬퍼 ──────────────────────────────────
function makeRoutePinImage(color, label) {
  var lines = label.length > 3 ? [label.slice(0,3), label.slice(3)] : [label];
  var lineH = 13, pad = 6, minW = 32;
  var textW = Math.max(minW, label.length * 7 + pad * 2);
  var boxH = lines.length > 1 ? 24 : 16;
  var totalH = 36 + boxH + 4;
  var cx = textW / 2;
  var textEls = lines.map(function(t, i) {
    return '<text x="' + cx + '" y="' + (boxH/2 + (i - (lines.length-1)/2) * lineH) + '" text-anchor="middle" dominant-baseline="middle" font-family="\'Noto Sans KR\',Arial,sans-serif" font-size="10" font-weight="700" fill="#0D1628">' + t + '</text>';
  }).join('');
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + textW + '" height="' + totalH + '" viewBox="0 0 ' + textW + ' ' + totalH + '">'
    + '<rect x="1" y="1" width="' + (textW-2) + '" height="' + (boxH-2) + '" rx="5" ry="5" fill="' + color + '" stroke="white" stroke-width="1.5"/>'
    + textEls
    + '<polygon points="' + (cx-6) + ',' + boxH + ' ' + (cx+6) + ',' + boxH + ' ' + cx + ',' + (boxH+4) + '" fill="' + color + '"/>'
    + '<g transform="translate(' + (cx-14) + ',' + (boxH+4) + ')">'
    + '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '"/>'
    + '<circle cx="14" cy="14" r="5" fill="white" opacity="0.9"/>'
    + '</g>'
    + '</svg>';
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(textW, totalH),
    { offset: new kakao.maps.Point(cx, totalH) }
  );
}

function makeRouteAddrOverlay(pos, addrText, color, yAnchorVal) {
  var el = document.createElement('div');
  el.style.cssText = 'background:' + color + ';color:#fff;font-size:10px;font-weight:700;'
    + 'padding:2px 8px;border-radius:5px;white-space:nowrap;max-width:160px;overflow:hidden;'
    + 'text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none;';
  el.textContent = addrText;
  return new kakao.maps.CustomOverlay({ position:pos, content:el, yAnchor: yAnchorVal || 4.2, zIndex:5 });
}

function updateRoutePinAddr(type, pos, addrText) {
  if(currentTab == 'ds') return;
  var color = type === 'from' ? '#3B82F6' : type === 'to' ? '#EF4444' : '#A78BFA';
  var ya = 4.2;
  if(type === 'from') {
    if(routeFromOverlay) routeFromOverlay.setMap(null);
    routeFromOverlay = makeRouteAddrOverlay(pos, addrText, color, ya);
    routeFromOverlay.setMap(kakaoMap);
  } else if(type === 'to') {
    if(routeToOverlay) routeToOverlay.setMap(null);
    routeToOverlay = makeRouteAddrOverlay(pos, addrText, color, ya);
    routeToOverlay.setMap(kakaoMap);
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi]) {
      if(routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
      routeViaMarkers[vi].overlay = makeRouteAddrOverlay(pos, addrText, color, ya);
      routeViaMarkers[vi].overlay.setMap(kakaoMap);
    }
  }
}

function attachRoutePinDrag(marker, type) {
  var geocoder = new kakao.maps.services.Geocoder();
  var dragTimer = null;
  kakao.maps.event.addListener(marker, 'drag', function() {
    var p = marker.getPosition();
    // 실시간 연결선 갱신 (dsQueue 좌표 임시 업데이트)
    if(currentTab == 'ds') {
      var qIdx = type === 'from' ? 0 : type === 'to' ? dsQueue.length - 1 : (parseInt(type.split('_')[1], 10) + 1);
      if(dsQueue[qIdx]) { dsQueue[qIdx].lat = String(p.getLat()); dsQueue[qIdx].lng = String(p.getLng()); }
      drawDsPolylines();
    }
    if(dragTimer) clearTimeout(dragTimer);
    dragTimer = setTimeout(function() {
      geocoder.coord2Address(p.getLng(), p.getLat(), function(result, status) {
        var a = p.getLat().toFixed(4) + ',' + p.getLng().toFixed(4);
        if(status === kakao.maps.services.Status.OK && result.length > 0) {
          var r = result[0];
          a = r.road_address ? r.road_address.address_name : r.address.address_name;
        }
        updateRoutePinAddr(type, marker.getPosition(), a);
      });
    }, 200);
  });
  kakao.maps.event.addListener(marker, 'dragend', function() {
    if(dragTimer) clearTimeout(dragTimer);
    var p = marker.getPosition();
    geocoder.coord2Address(p.getLng(), p.getLat(), function(result, status) {
      var a = p.getLat().toFixed(4) + ',' + p.getLng().toFixed(4);
      if(status === kakao.maps.services.Status.OK && result.length > 0) {
        var r = result[0];
        a = r.road_address ? r.road_address.address_name : r.address.address_name;
      }
      var obj = { name:a, lat:String(p.getLat()), lng:String(p.getLng()), address:a };
      if(type === 'from') panelFrom = obj;
      else if(type === 'to') panelTo = obj;
      else if(type && type.indexOf('via_') === 0) {
        var vi = parseInt(type.split('_')[1], 10);
        if(vi >= 0 && vi < panelVia.length) panelVia[vi] = obj;
      }
      // dsQueue 좌표 동기화
      if(currentTab == 'ds') {
        var qIdx2 = type === 'from' ? 0 : type === 'to' ? dsQueue.length - 1 : (parseInt(type.split('_')[1], 10) + 1);
        if(dsQueue[qIdx2]) { dsQueue[qIdx2].lat = String(p.getLat()); dsQueue[qIdx2].lng = String(p.getLng()); dsQueue[qIdx2].address = a; dsQueue[qIdx2].name = a; }
        drawDsPolylines();
        renderDsEditList();
      }
      updateRoutePinAddr(type, p, a);
      renderRoutePanel();
    });
  });
}

function attachRoutePinDsClick(marker, queueIdx) {
  kakao.maps.event.addListener(marker, 'click', function() {
    if(currentTab != 'ds') return;
    if(queueIdx >= 0 && queueIdx < dsQueue.length) {
      dsQueue.splice(queueIdx, 1);
      syncDsQueueToRoute();
      if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
      applyNearbyMarkerOpacity();
      injectDsRoleLabels();
      updateDsMarkerLabels();
      drawDsPolylines();
      renderDsEditList();
    }
  });
}

function setRoutePin(type, pos, labelText) {
  var color = type === 'from' ? '#3B82F6' : type === 'to' ? '#EF4444' : '#A78BFA';
  var img = makeRoutePinImage(color, labelText);
  var isDsTab = currentTab == 'ds';
  if(type === 'from') {
    if(routeFromMarker){ routeFromMarker.setMap(null); }
    if(routeFromOverlay){ routeFromOverlay.setMap(null); routeFromOverlay = null; }
    routeFromMarker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    if(!isDsTab) { routeFromOverlay = makeRouteAddrOverlay(pos, labelText, color); routeFromOverlay.setMap(kakaoMap); }
    attachRoutePinDrag(routeFromMarker, type);
    if(isDsTab) attachRoutePinDsClick(routeFromMarker, 0);
  } else if(type === 'to') {
    if(routeToMarker){ routeToMarker.setMap(null); }
    if(routeToOverlay){ routeToOverlay.setMap(null); routeToOverlay = null; }
    routeToMarker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    if(!isDsTab) { routeToOverlay = makeRouteAddrOverlay(pos, labelText, color); routeToOverlay.setMap(kakaoMap); }
    attachRoutePinDrag(routeToMarker, type);
    if(isDsTab) attachRoutePinDsClick(routeToMarker, dsQueue.length - 1);
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi] && routeViaMarkers[vi].marker) routeViaMarkers[vi].marker.setMap(null);
    if(routeViaMarkers[vi] && routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
    var vm = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:img, draggable:true, title:labelText });
    var vo = null;
    if(!isDsTab) { vo = makeRouteAddrOverlay(pos, labelText, color); vo.setMap(kakaoMap); }
    routeViaMarkers[vi] = { marker:vm, overlay:vo };
    attachRoutePinDrag(vm, type);
    if(isDsTab) attachRoutePinDsClick(vm, vi + 1);
  }
}

function clearRoutePin(type) {
  if(type === 'from') {
    if(routeFromMarker){ routeFromMarker.setMap(null); routeFromMarker = null; }
    if(routeFromOverlay){ routeFromOverlay.setMap(null); routeFromOverlay = null; }
  } else if(type === 'to') {
    if(routeToMarker){ routeToMarker.setMap(null); routeToMarker = null; }
    if(routeToOverlay){ routeToOverlay.setMap(null); routeToOverlay = null; }
  } else if(type && type.indexOf('via_') === 0) {
    var vi = parseInt(type.split('_')[1], 10);
    if(routeViaMarkers[vi]) {
      if(routeViaMarkers[vi].marker) routeViaMarkers[vi].marker.setMap(null);
      if(routeViaMarkers[vi].overlay) routeViaMarkers[vi].overlay.setMap(null);
      routeViaMarkers[vi] = null;
    }
  }
}

function clearAllRoutePins() {
  clearRoutePin('from'); clearRoutePin('to');
  routeViaMarkers.forEach(function(vm){
    if(vm) {
      if(vm.marker) vm.marker.setMap(null);
      if(vm.overlay) vm.overlay.setMap(null);
    }
  });
  routeViaMarkers = [];
}

function applyNearbyMarkerOpacity() {
  if(!window._nearbyMarkers || !window._nearbyList) return;
  var dimMode = (routeMode == 'add');
  window._nearbyMarkers.forEach(function(nm, i) {
    var c = window._nearbyList[i] ? window._nearbyList[i].c : null;
    if(!c) return;
    if(!dimMode){
      if(nm.marker) nm.marker.setOpacity(1.0);
      if(nm.labelEl) nm.labelEl.style.opacity = '1';
      return;
    }
    var inQueue = dsQueue.findIndex(function(q){
      if(c.id && q.id && !q.id.startsWith('MY_LOC_') && !q.id.startsWith('DS_PIN_')) return q.id == c.id;
      return q.name == c.name && String(q.lat).slice(0,7) == String(c.lat).slice(0,7);
    }) !== -1;
    if(nm.marker) nm.marker.setOpacity(inQueue ? 1.0 : 0.6);
    if(nm.labelEl) nm.labelEl.style.opacity = inQueue ? '1' : '0.6';
  });
}

function restoreNearbyMarkerOpacity() {
  if(!window._nearbyMarkers) return;
  window._nearbyMarkers.forEach(function(nm) {
    if(nm.labelEl) { nm.labelEl.style.display = ''; nm.labelEl.style.opacity = '1'; }
    if(nm.marker) nm.marker.setOpacity(1);
  });
}

function clearDsPolylines() {
  dsPolylines.forEach(function(p){ p.setMap(null); });
  dsPolylines = [];
  dsBadges.forEach(function(b){ b.setMap(null); });
  dsBadges = [];
}

function clearDsRoleLayer() {
  dsRoleOverlays.forEach(function(o){ o.setMap(null); });
  dsRoleOverlays = [];
  dsRoleMarkers.forEach(function(m){ m.setMap(null); });
  dsRoleMarkers = [];
}

function clearInlineRoleBadges() {
  if(!window._nearbyMarkers) return;
  window._nearbyMarkers.forEach(function(nm){
    if(nm.labelEl){
      var b = nm.labelEl.querySelector('.ds-role-badge-inline');
      if(b) b.parentNode.removeChild(b);
    }
  });
}

function drawDsPolylines() {
  clearDsPolylines();
  if(!kakaoMap || dsQueue.length < 2) return;
  var validItems = dsQueue.filter(function(q){ return q.lat && q.lng; });
  if(validItems.length < 2) return;
  for(var i = 0; i < validItems.length - 1; i++) {
    var p1 = new kakao.maps.LatLng(parseFloat(validItems[i].lat), parseFloat(validItems[i].lng));
    var p2 = new kakao.maps.LatLng(parseFloat(validItems[i+1].lat), parseFloat(validItems[i+1].lng));
    // 흰 테두리 선 (배경)
    var bgLine = new kakao.maps.Polyline({
      path: [p1, p2],
      strokeWeight: 10,
      strokeColor: '#FFFFFF',
      strokeOpacity: 0.85,
      strokeStyle: 'solid'
    });
    bgLine.setMap(kakaoMap);
    dsPolylines.push(bgLine);
    // 빨간 실선 (전경) — 흐린 반경 핀들 사이에서도 잘 보이도록 강조
    var fgLine = new kakao.maps.Polyline({
      path: [p1, p2],
      strokeWeight: 5,
      strokeColor: '#EF2B2B',
      strokeOpacity: 1.0,
      strokeStyle: 'solid'
    });
    fgLine.setMap(kakaoMap);
    dsPolylines.push(fgLine);
    // 선 중앙 원형 숫자 배지
    (function(segIdx, lat1, lng1, lat2, lng2) {
      var midLat = (lat1 + lat2) / 2;
      var midLng = (lng1 + lng2) / 2;
      var midPos = new kakao.maps.LatLng(midLat, midLng);
      var badgeEl = document.createElement('div');
      badgeEl.style.cssText = 'width:21px;height:21px;border-radius:50%;background:#080E1C;border:1.5px solid rgba(239,43,43,.9);text-align:center;line-height:18px;font-size:11px;font-weight:800;color:#FF6B6B;font-family:\'Noto Sans KR\',Arial,sans-serif;pointer-events:none;box-shadow:0 2px 7px rgba(0,0,0,.5);';
      badgeEl.textContent = String(segIdx + 1);
      var badge = new kakao.maps.CustomOverlay({
        position: midPos,
        content: badgeEl,
        yAnchor: 0.5,
        zIndex: 3
      });
      badge.setMap(kakaoMap);
      dsBadges.push(badge);
    })(i, parseFloat(validItems[i].lat), parseFloat(validItems[i].lng), parseFloat(validItems[i+1].lat), parseFloat(validItems[i+1].lng));
  }
}

function getRoutePinLabel(type) {
  if(type === 'from') return '출발';
  if(type === 'to') return '도착';
  if(type && type.indexOf('via_') === 0) {
    var n = parseInt(type.split('_')[1], 10) + 1;
    return '경유' + n;
  }
  return '';
}

// ── 카카오맵 로드 ────────────────────────────────────
function loadKakaoScript(key) {
  var existing = document.getElementById('kakaoScript');
  if(existing) existing.remove();
  var s = document.createElement('script');
  s.id  = 'kakaoScript';
  s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey='+key+'&libraries=services&autoload=false';
  s.onload = function() {
    if(typeof kakao === 'undefined' || !kakao.maps) {
      console.error('[NEARBY] kakao 객체 없음 - 도메인 미등록 가능성');
      alert('지도 SDK 로드 실패.\n현재 주소: ' + window.location.origin + '\n이 주소가 카카오 콘솔 도메인과 일치하는지 확인하세요.');
      return;
    }
    kakao.maps.load(function() {
      var container = document.getElementById('kakaoMap');
      var options = { center: new kakao.maps.LatLng(35.1631, 129.1635), level: 7 };
      kakaoMap = new kakao.maps.Map(container, options);
      console.log('[NEARBY] 지도 로드 성공');

      // 탭 클릭 이벤트
      var tabNearby = document.getElementById('tabNearby');
      var tabRoute = document.getElementById('tabRoute');
      var tabToday = document.getElementById('tabToday');
      if(tabNearby) tabNearby.addEventListener('click', function(){ switchTab('nearby'); });
      if(tabRoute) tabRoute.addEventListener('click', function(){ switchTab('ds'); });
      if(tabToday) tabToday.addEventListener('click', function(){ switchTab('today'); });
      var mvb=document.getElementById('modeViewBtn'); if(mvb) mvb.addEventListener('click', function(){
        // 주변고객(조회) 모드: 짜놓은 동선은 보존하고 모드만 전환. 동선이 없을 때만 일반 주변보기로 복귀
        if(currentTab == 'ds' && dsQueue.length === 0){ switchTab('nearby'); }
        setRouteMode('view');
      });
      var mab=document.getElementById('modeAddBtn'); if(mab) mab.addEventListener('click', function(){
        if(_arbPinMarker){ _arbPinMarker.setMap(null); _arbPinMarker = null; }
        // 동선관리(담기) 모드: 개별/검색 진입(nearby)이면 편집 상태(ds)로 전환. 동선 진입(today)은 유지하되 편집 팝업 표시
        if(currentTab == 'nearby'){ switchTab('ds'); }
        else if(currentTab == 'today'){ if(typeof openDsEditSheet === 'function') openDsEditSheet(); }
        setRouteMode('add');
      });
      var rrb=document.getElementById('routeResetBtn'); if(rrb) rrb.addEventListener('click', function(){ resetDsQueue(); });

        function ds(cx,cy){ dragging=true; sx=cx; sy=cy; ox=pop.offsetLeft; oy=pop.offsetTop; pop.style.right='auto'; pop.style.left=ox+'px'; pop.style.top=oy+'px'; pop.style.transition='none'; }
        function dm(cx,cy){ if(!dragging)return; pop.style.left=(ox+(cx-sx))+'px'; pop.style.top=(oy+(cy-sy))+'px'; }
        function du(){ dragging=false; pop.style.transition=''; }
        hd.addEventListener('mousedown',function(e){ ds(e.clientX,e.clientY); });
        document.addEventListener('mousemove',function(e){ dm(e.clientX,e.clientY); });

              dsQueue.push(obj);
              syncDsQueueToRoute();
              drawDsPolylines();
              if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
              applyNearbyMarkerOpacity();
              injectDsRoleLabels();
              updateDsMarkerLabels();
              renderDsEditList();
              if(currentTab == 'today') renderTodayListFromQueue();
            } else {

              if(mlabelEl) mlabelEl.textContent = '📌 기준 위치';
              var tn = document.getElementById('targetName'); if(tn) tn.textContent = a;
              var ta = document.getElementById('targetAddr'); if(ta) ta.textContent = '';
              isCustomerMode = false; window._baseCustomerId = '';
              drawNearby(centerLat, centerLng);
              // 임의좌표 핀: drawNearby(=clearMarkers) 이후에 그려야 지워지지 않음. 1개만 유지
              if(_arbPinMarker){ _arbPinMarker.setMap(null); _arbPinMarker = null; }
              var arbSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="#3B82F6"/><circle cx="14" cy="14" r="6" fill="white" opacity="0.95"/></svg>';
              var arbImg = new kakao.maps.MarkerImage('data:image/svg+xml;base64,'+btoa(arbSvg), new kakao.maps.Size(28,36), { offset:new kakao.maps.Point(14,36) });
              _arbPinMarker = new kakao.maps.Marker({ position:latlng, map:kakaoMap, image:arbImg, zIndex:9, title:a, draggable:true });
              _bindArbPinDrag(_arbPinMarker, arbImg);
            }
          });
          window._dsPinMode = false;
          var btn2 = document.getElementById('btnPinBase');
          var banner2 = document.getElementById('mapSelectBanner');
          if(routeMode != 'add') {
            // 조회 모드: 임의좌표 핀이 찍혔으므로 버튼 active 유지 (재클릭 시 핀 제거)
            if(btn2) btn2.className = 'pinbase-btn active';
            if(banner2) banner2.style.display = 'none';

            if(banner2) banner2.style.display = 'none';
          }

        }

        // 핀잡기 모드 처리
        if(pinBaseMode) {
          var latlng = mouseEvent.latLng;

          // 기존 임시 핀 제거
          if(pinBaseMarker){ pinBaseMarker.setMap(null); pinBaseMarker = null; }

          // 파란 핀 생성 (draggable)
          var svgCenter = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
            +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="#3B82F6"/>'
            +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.95"/>'

          var centerImg = new kakao.maps.MarkerImage(
            'data:image/svg+xml;base64,'+btoa(svgCenter),

            position: latlng,
            map: kakaoMap,
            image: centerImg,
            draggable: true,
            title: '기준 위치 (드래그로 이동)'
          });

          // 역지오코딩 후 기준 설정
          function applyBase(pos) {
            var geocoder2 = new kakao.maps.services.Geocoder();
            geocoder2.coord2Address(pos.getLng(), pos.getLat(), function(result, status) {
              var addrStr = pos.getLat().toFixed(4)+', '+pos.getLng().toFixed(4);
              if(status === kakao.maps.services.Status.OK && result.length > 0) {
                var r = result[0];

              if(pinBaseMarker){ pinBaseMarker.setMap(null); pinBaseMarker = null; }
              drawNearby(centerLat, centerLng);
            });
          }

          // 기존 기준 파란 핀 제거
          if(centerMarkerGlobal){ centerMarkerGlobal.setMap(null); centerMarkerGlobal = null; }
          if(centerOverlay){ centerOverlay.setMap(null); centerOverlay = null; }

          applyBase(latlng);

          // 드래그 완료 시에도 재적용
          kakao.maps.event.addListener(pinBaseMarker, 'dragend', function(){
            applyBase(pinBaseMarker.getPosition());

          // 모드 종료 — 버튼은 active 유지 (한 번 더 누르면 취소)
          pinBaseMode = false;

          var banner = document.getElementById('mapSelectBanner');

        }

        // 길찾기 지도선택 모드 처리
        if(!mapSelectMode) return;
        var latlng = mouseEvent.latLng;
          var curMode = mapSelectMode;
          exitMapSelectMode();

          (function(mode, pos) {
            var gc = new kakao.maps.services.Geocoder();
            gc.coord2Address(pos.getLng(), pos.getLat(), function(result, status) {

              }
              var obj = { name:a, lat:String(pos.getLat()), lng:String(pos.getLng()), address:a };
              setRoutePointToQueue(mode, obj);
            });
          })(curMode, latlng);
      });
      var hasPending = !!(window._pendingRoute && window._pendingRoute.stops && window._pendingRoute.stops.length);
      var addr = document.getElementById('addrInput').value.trim();
      if(addr && !hasPending) searchAddr();

      // index 주간현황에서 전달된 하루 동선 자동 표시
      if(hasPending){
        window._activeRoute = window._pendingRoute;
        switchTab('today');
      } else {
        // 개별/검색 진입: 통합 탭(고객지도) 활성화 + 모드 바 표시
        if(centerLat && centerLng && !window._nearbyList){ drawNearby(centerLat, centerLng); }
        switchTab('nearby');
      }
      // 동선 조회 검색 UI 초기화 (FP 목록 + 오늘 날짜 기본값)
      var _rdi = document.getElementById('routeDateInput');
      if(_rdi && !_rdi.value) _rdi.value = (window._activeRoute && window._activeRoute.date) ? window._activeRoute.date : new Date().toISOString().slice(0,10);
      if(typeof updateDateTriggerLabel === 'function') updateDateTriggerLabel();
      populateRouteFpSelect(window._activeRoute ? window._activeRoute.fpId : '');
    });
  };
  s.onerror = function() {
    console.error('[NEARBY] SDK 스크립트 로드 자체 실패');
    console.error('[NEARBY] 현재 주소(origin):', window.location.origin);
    console.error('[NEARBY] 사용 키:', key);
    alert('지도 SDK 스크립트 로드 실패\n\n현재 페이지 주소: ' + window.location.origin + '\n\n카카오 콘솔 JavaScript SDK 도메인에\n위 주소가 정확히 등록되어 있어야 합니다.\n저장 후 5~10분 기다린 뒤 Ctrl+Shift+R 새로고침하세요.');
  };
  document.head.appendChild(s);
}

// ── 주소 검색 ────────────────────────────────────────
function searchAddr() {
  if(!kakaoMap) { alert('먼저 지도를 불러주세요'); return; }
  var addr = document.getElementById('addrInput').value.trim();
  if(!addr) { alert('검색어를 입력해주세요'); return; }

  var list = document.getElementById('searchResultList');
  var items = document.getElementById('srlItems');
  var title = document.getElementById('srlTitle');
  if(!list || !items) return;

  list.style.display = '';
  var srlHint = document.getElementById('srlHint');
  if(srlHint) srlHint.textContent = canAddToRoute() ? '[+ 추가] 클릭해 동선에 추가' : '클릭하면 기준 위치로 설정됩니다';
  items.innerHTML = '<div class="srl-loading"><div style="width:12px;height:12px;border-radius:50%;border:2px solid #60A5FA;border-top-color:transparent;animation:srl-spin .7s linear infinite;flex-shrink:0;"></div>검색 중...</div>';
  title.textContent = '"' + addr + '" 검색 중...';

  // 고객 이름 매칭
  var kw = addr.replace(/\s/g, '').toLowerCase();
  var customers = [];
  try { customers = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){}
  var matched = customers.filter(function(c) {
    return c.name && c.name.replace(/\s/g,'').toLowerCase().indexOf(kw) !== -1;
  });

  var places = new kakao.maps.services.Places();
  var searchLat = (centerLat && centerLat != 0) ? centerLat : 35.1796;
  var searchLng = (centerLng && centerLng != 0) ? centerLng : 129.0756;
  places.keywordSearch(addr, function(result, status) {
    var placeResults = [];
    if(status === kakao.maps.services.Status.OK && result.length > 0) {
      placeResults = result;
      showSearchResultsCombined(matched, placeResults, addr);
    } else {
      var geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(addr, function(result2, status2) {
        if(status2 === kakao.maps.services.Status.OK && result2.length > 0) {
          placeResults = result2.map(function(r){
            return { place_name: r.address_name, address_name: r.address_name, road_address_name:'', category_name:'주소', x: r.x, y: r.y, phone:'' };
          });
        }
        showSearchResultsCombined(matched, placeResults, addr);
      });
    }
  }, {
    location: new kakao.maps.LatLng(searchLat, searchLng),
    sort: kakao.maps.services.SortBy.DISTANCE
  });
}

function showSearchResultsCombined(customerMatches, placeResults, keyword) {
  var list = document.getElementById('searchResultList');
  var items = document.getElementById('srlItems');
  var title = document.getElementById('srlTitle');
  if(!list || !items) return;

  var total = customerMatches.length + placeResults.length;
  title.textContent = '"' + keyword + '" 검색결과 ' + total + '건';
  items.innerHTML = '';

  // 고객 섹션
  var custSec = document.createElement('div');
  custSec.style.cssText = 'font-size:10px;font-weight:700;color:#8B98B8;padding:5px 12px 3px;border-top:1px solid rgba(255,255,255,.05);letter-spacing:.3px;';
  custSec.innerHTML = '👤 내 고객 <span style="background:rgba(52,211,153,.1);color:#34D399;border-radius:4px;padding:1px 5px;margin-left:3px;">' + customerMatches.length + '명</span>';
  items.appendChild(custSec);

  if(customerMatches.length == 0) {
    var noC = document.createElement('div');
    noC.style.cssText = 'text-align:center;padding:8px;font-size:10px;color:#8B98B8;';
    noC.textContent = '일치하는 고객 없음';
    items.appendChild(noC);
  } else {
    customerMatches.forEach(function(c) {
      var item = document.createElement('div');
      item.style.cssText = 'padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:center;gap:8px;';
      item.addEventListener('mouseover', function(){ item.style.background='rgba(255,255,255,.04)'; });
      item.addEventListener('mouseout', function(){ item.style.background=''; });
      var tagClass = c.customerType=='계약' ? 'rgba(16,185,129,.12);color:#34D399' : c.customerType=='관리' ? 'rgba(139,92,246,.12);color:#A78BFA' : 'rgba(244,163,38,.12);color:#FCD34D';
      var dist = '';
      if(centerLat && centerLng && c.lat && c.lng) {
        var dlat = (parseFloat(c.lat) - centerLat) * 111;
        var dlng = (parseFloat(c.lng) - centerLng) * 111 * Math.cos(centerLat * Math.PI / 180);
        var d = Math.sqrt(dlat*dlat + dlng*dlng);
        dist = d < 1 ? Math.round(d*1000) + 'm' : d.toFixed(1) + 'km';
      }
      item.innerHTML = '<div style="width:28px;height:28px;border-radius:50%;background:rgba(139,92,246,.2);color:#A78BFA;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">' + (c.name ? c.name.charAt(0) : '?') + '</div>'
        + '<div style="flex:1;min-width:0;">'
        + '<div style="font-size:12px;font-weight:700;color:#F0F4FF;">' + c.name + ' <span style="font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700;background:' + tagClass + '">' + (c.customerType||'고객') + '</span></div>'
        + '<div style="font-size:10px;color:#8B98B8;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (c.address||'주소 미등록') + '</div>'
        + '</div>'
        + (dist ? '<div style="font-size:10px;color:#60A5FA;flex-shrink:0;margin-right:4px;">' + dist + '</div>' : '')
        + (canAddToRoute() ? '<div class="srl-add-btn" style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(232,201,122,.15);color:#E8C97A;border:1px solid rgba(232,201,122,.3);white-space:nowrap;flex-shrink:0;cursor:pointer;">+ 추가</div>' : '');
      item.addEventListener('click', function() {
        if(canAddToRoute()) {
          addToDsQueue(c);
          document.getElementById('searchResultList').style.display = 'none';
          document.getElementById('addrInput').value = '';
          return;
        }
        if(c.lat && c.lng) {
          // 기준 고객 변경: 기존 동선 정리 (이전 기준이 동선 핀으로 남지 않도록)
          dsQueue = []; window._activeRoute = null;

          panelFrom = null; panelTo = null; panelVia = [];

          window._baseCustomerId = c.id;
          document.getElementById('targetName').textContent = c.name;
          document.getElementById('targetAddr').textContent = c.address || '';
          document.getElementById('headerSub') && (document.getElementById('headerSub').textContent = c.name + ' 주변 고객 찾기');
          var ml = document.querySelector('.mlabel');
          if(ml) ml.textContent = '📅 기준 고객';
          document.getElementById('searchResultList').style.display = 'none';
          document.getElementById('addrInput').value = '';

        } else if(c.address) {
          var gc = new kakao.maps.services.Geocoder();
          gc.addressSearch(c.address, function(r, s) {
            if(s === kakao.maps.services.Status.OK && r.length > 0) {

              if(typeof clearInlineRoleBadges === 'function') clearInlineRoleBadges();
              if(typeof clearRouteDimMarkers === 'function') clearRouteDimMarkers();
              panelFrom = null; panelTo = null; panelVia = [];

              if(typeof renderDsEditList === 'function') renderDsEditList();

              centerLat = parseFloat(r[0].y); centerLng = parseFloat(r[0].x);
              isCustomerMode = true;

    });
  }

  // 장소 섹션
  var placeSec = document.createElement('div');
  placeSec.style.cssText = 'font-size:10px;font-weight:700;color:#8B98B8;padding:5px 12px 3px;border-top:1px solid rgba(255,255,255,.07);letter-spacing:.3px;';
  placeSec.innerHTML = '🔍 장소 검색 <span style="background:rgba(255,193,68,.1);color:#FCD34D;border-radius:4px;padding:1px 5px;margin-left:3px;">카카오</span>';
  items.appendChild(placeSec);

  if(placeResults.length == 0) {
    var noP = document.createElement('div');
    noP.style.cssText = 'text-align:center;padding:8px;font-size:10px;color:#8B98B8;';
    noP.textContent = '장소 검색 결과 없음';
    items.appendChild(noP);
  } else {
    showSearchResults(placeResults, keyword, items);
  }
}

function showSearchResults(results, keyword, containerEl) {
  var list = document.getElementById('searchResultList');
  var items = containerEl || document.getElementById('srlItems');
  var title = document.getElementById('srlTitle');
  if(!list || !items) return;

  if(!containerEl) {
    title.textContent = '"' + keyword + '" 검색결과 ' + results.length + '건';
    items.innerHTML = '';
  }

  // 검색어 포함된 항목 상단으로 정렬
  var kw = keyword.replace(/\s/g,'').toLowerCase();
  var sorted = results.slice().sort(function(a, b) {
    var an = a.place_name.replace(/\s/g,'').toLowerCase();
    var bn = b.place_name.replace(/\s/g,'').toLowerCase();
    var aMatch = an.indexOf(kw) !== -1 ? 0 : 1;
    var bMatch = bn.indexOf(kw) !== -1 ? 0 : 1;
    return aMatch - bMatch;
  });

      +(canAddToRoute() ? '<span style="font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(232,201,122,.15);color:#E8C97A;border:1px solid rgba(232,201,122,.3);margin-left:4px;cursor:pointer;">+ 추가</span>' : '')

// ── 고객 마커+반경만 재계산 (기준 핀 유지) ──────────────
// 리스트 항목용: 미팅 일정 + 임박 이벤트(D-3) 텍스트 HTML 생성
function buildMeetingEventHtml(c) {
  var html = '';
  var meetings = getAllMeetings(c.name);
  if(meetings.length){
    var todayStr = new Date().toISOString().slice(0,10);
    var upcoming = [];
    var pastCount = 0;
    meetings.forEach(function(m){
      if(m.date >= todayStr) upcoming.push(m);
      else pastCount++;
    });
    var segs = [];
    if(upcoming.length){
      var nx = upcoming[0];
      var isToday = nx.date == todayStr;
      var dlabel = isToday ? '오늘' : nx.date.slice(5).replace('-','/');
      segs.push('<span style="font-size:9px;color:#E8C97A;font-weight:700;">📅 예정 ' + dlabel + (nx.time?(' '+nx.time):'') + (upcoming.length>1?(' 외 '+(upcoming.length-1)+'건'):'') + '</span>');
    }
    if(pastCount){
      segs.push('<span style="font-size:9px;color:#8B98B8;font-weight:600;">🕘 지난 상담이력 ' + pastCount + '회</span>');
    }
    if(segs.length){
      html += '<div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;padding-left:1px">' + segs.join('') + '</div>';
    }
  }
  var ev = getUpcomingEvents(c);
  if(ev.events && ev.events.length){
    var evParts = ev.events.slice(0,3).map(function(e){
      if(e.type === 'custom'){
        return '<span style="font-size:9px;color:#C4B5FD;font-weight:600;">📌 ' + e.name + '</span>';
      }
      var dd = e.dday === 0 ? 'D-DAY' : ('D-' + e.dday);
      return '<span style="font-size:9px;color:#E8C97A;font-weight:700;">🎉 ' + e.name + ' ' + dd + '</span>';
    });
    html += '<div style="margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;padding-left:1px">' + evParts.join('') + '</div>';
  }
  return html;
}

function getTodayMeeting(customerName) {
  var acts = {};
  try { acts = JSON.parse(localStorage.getItem('unispace_activities') || '{}'); } catch(e){}
  var today = new Date().toISOString().slice(0,10);
  var fpId = window._myFpId || '';
  var match = Object.values(acts).filter(function(a) {
    return a.date == today && a.customerName == customerName && (!fpId || a.fpId == fpId);
  }).sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); })[0];
  return match || null;
}

// 고객의 모든 미팅 일정 (과거 포함, 날짜순)
function getAllMeetings(customerName) {
  var acts = {};
  try { acts = JSON.parse(localStorage.getItem('unispace_activities') || '{}'); } catch(e){}
  var fpId = window._myFpId || '';
  return Object.values(acts).filter(function(a) {
    return a.customerName == customerName && (!fpId || a.fpId == fpId) && a.date;
  }).sort(function(a,b){
    var dc = (a.date||'').localeCompare(b.date||'');
    return dc !== 0 ? dc : (a.time||'').localeCompare(b.time||'');
  });
}

function refreshNearbyOnly(lat, lng) {
  // 고객 마커만 제거 (index 1 이후: 0은 기준마커)
  // 실제론 markers[0]이 기준 마커 — nearbyMarkers만 지우기
  if(window._nearbyMarkers) {
    window._nearbyMarkers.forEach(function(nm){
      if(nm.marker) nm.marker.setMap(null);
      if(nm.overlay) nm.overlay.setMap(null);
    });
    window._nearbyMarkers = [];
  }
  // 반경원 제거 후 재생성
  circles.forEach(function(c){ c.setMap(null); });
  circles = [];

  var centerPos = new kakao.maps.LatLng(lat, lng);

  // 반경 원 재생성
  var circle = new kakao.maps.Circle({
    center: centerPos,
    radius: radiusKm * 1000,
    strokeWeight: 2,
    strokeColor: '#60A5FA',
    strokeOpacity: 1.0,
    strokeStyle: 'dashed',
    fillColor: '#3B82F6',
    fillOpacity: 0.12
  });
  circle.setMap(kakaoMap);
  circles.push(circle);

  // 반경 라벨
  var labelLng = lng + (radiusKm * 1000 / 111320 / Math.cos(lat * Math.PI / 180));
  var radiusLabelEl = document.createElement('div');
  radiusLabelEl.style.cssText = 'background:rgba(96,165,250,.9);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;border:1px solid rgba(255,255,255,.35);box-shadow:0 2px 8px rgba(0,0,0,.35);letter-spacing:.02em;';
  radiusLabelEl.textContent = radiusKm + 'km';
  var radiusOverlay = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(lat, labelLng),
    content: radiusLabelEl,
    yAnchor: 0.5
  });
  radiusOverlay.setMap(kakaoMap);
  circles.push(radiusOverlay);

  // 고객 필터 + 리스트 + 마커 재렌더
  var nearby = [];
  allCustomers.forEach(function(c) {
    if(!c.lat || !c.lng) return;
    var dist = getDistKm(lat, lng, parseFloat(c.lat), parseFloat(c.lng));
    if(dist <= radiusKm) nearby.push({ c:c, dist:dist });
  });
  nearby.sort(function(a,b){ return a.dist-b.dist; });
  document.getElementById('resultCount').innerHTML = '반경 '+radiusKm+'km 내 고객 <b>'+nearby.length+'명</b> 발견';

  if(!nearby.length) {
    document.getElementById('clist').innerHTML = '<div class="empty">😊 반경 '+radiusKm+'km 내<br>등록된 고객이 없습니다</div>';
    return;
  }

  var listHtml = '';
  var nearbyMarkers = [];
  nearby.forEach(function(item, idx) {
    var c = item.c; var dist = item.dist;
    var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
    var tagClass = c.customerType==='계약'?'tc':c.customerType==='관리'?'tm':'tw';
    var tagText  = c.customerType||'고객';
    var evInfo = getUpcomingEvents(c);
    var evDots = '';
    if(evInfo.hasEvent) evDots += '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#E8C97A;margin-left:3px;vertical-align:middle;"></span>';
    if(evInfo.hasCustom) evDots += '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#A78BFA;margin-left:2px;vertical-align:middle;"></span>';
    var dsIdx2 = dsQueue.findIndex(function(q){
      if(q.id && (String(q.id).startsWith('MY_LOC_') || String(q.id).startsWith('DS_PIN_'))) return false;
      if(c.id && q.custId && q.custId == c.id) return true;
      if(c.id && q.id && !String(q.id).startsWith('RT_') && !String(q.id).startsWith('act_')) return q.id == c.id;
      return q.name == c.name;
    });
    var seqHtml2 = '';
    if(dsIdx2 !== -1) {
      var seqCls2 = dsIdx2 == 0 ? 'ds-s0' : (dsIdx2 == dsQueue.length-1 && dsQueue.length > 1 ? 'ds-s2' : 'ds-s1');
      seqHtml2 = '<div class="ds-seq ' + seqCls2 + '">' + (dsIdx2+1) + '</div>';
    } else if(canAddToRoute()) {
      seqHtml2 = '<div class="ds-seq ds-sm">+</div>';
    }
    var mtg = getTodayMeeting(c.name);
    var mtgHtml = buildMeetingEventHtml(c);
    var borderStyle = mtg ? 'border-left:3px solid rgba(232,201,122,.6);padding-left:9px;' : '';
    listHtml += '<div class="ci" id="citem_'+idx+'" style="display:flex;align-items:center;' + borderStyle + '"><div style="flex:1;min-width:0;"><div class="ctop"><span class="cn">'+c.name+evDots+'</span><span class="cd">'+distStr+'</span></div><div class="ci2">'+(c.address||'주소 미등록')+'<span class="ctag '+tagClass+'">'+tagText+'</span></div>' + mtgHtml + '</div>'+seqHtml2+'</div>';

    var pos = new kakao.maps.LatLng(parseFloat(c.lat), parseFloat(c.lng));
    // 동선 큐에 포함된 고객은 번호 핀으로 표시 → 주변 마커 생성 안 함(중복 방지)
    var inRouteQ = dsQueue.findIndex(function(q){
      if(q.id && (String(q.id).startsWith('MY_LOC_') || String(q.id).startsWith('DS_PIN_'))) return false;
      if(c.id && q.custId && q.custId == c.id) return true;
      if(c.id && q.id && !String(q.id).startsWith('MY_LOC_') && !String(q.id).startsWith('DS_PIN_') && !String(q.id).startsWith('RT_') && !String(q.id).startsWith('act_')) return q.id == c.id;
      return q.name == c.name;
    }) !== -1;
    if(inRouteQ){
      nearbyMarkers.push({ marker:null, labelEl:null, pos:pos, color:null });
      return;
    }
    var color = c.customerType==='계약'?'#10B981':c.customerType==='관리'?'#8B5CF6':'#F59E0B';
    var svgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
      +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'"/>'
      +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>'
      +'</svg>';
    var markerImg = new kakao.maps.MarkerImage('data:image/svg+xml;base64,'+btoa(svgContent), new kakao.maps.Size(28,36));
    var marker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:markerImg, title:c.name });
    var inQueueNow = isRouteTab() && dsQueue.findIndex(function(q){
      if(c.id && q.id && !q.id.startsWith('MY_LOC_') && !q.id.startsWith('DS_PIN_')) return q.id == c.id;
      return q.name == c.name && String(q.lat).slice(0,7) == String(c.lat).slice(0,7);
    }) !== -1;
    var dimNow = canAddToRoute() && dsQueue.length > 0;
    marker.setOpacity(inQueueNow ? 1.0 : (dimNow ? 0.6 : 1.0));
    nearbyMarkers.push({ marker:marker, labelEl:null, pos:pos, color:color });

    var evInfo = getUpcomingEvents(c);
    var queueIdx2 = isRouteTab() ? dsQueue.findIndex(function(q){
      if(c.id && q.id && !q.id.startsWith('MY_LOC_') && !q.id.startsWith('DS_PIN_')) return q.id == c.id;
      return q.name == c.name && String(q.lat).slice(0,7) == String(c.lat).slice(0,7);
    }) : -1;
    var labelEl = document.createElement('div');
    labelEl.style.cssText = 'position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:0;white-space:nowrap;margin-bottom:2px;cursor:pointer';
    var nameBox = document.createElement('div');
    nameBox.style.cssText = 'background:rgba(8,14,28,.92);border:1px solid rgba(201,168,76,.28);border-radius:7px;padding:5px 11px;font-size:11px;font-weight:700;color:#F0F4FF;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.3);letter-spacing:.01em;';
    var nameSpan = document.createElement('span'); nameSpan.textContent = c.name;
    nameBox.appendChild(nameSpan);
    if(evInfo.hasEvent || evInfo.hasCustom) {

      dotWrap.style.cssText = 'display:inline-flex;gap:2px;margin-left:5px;align-items:center';
      if(evInfo.hasEvent){ var d1=document.createElement('div'); d1.style.cssText='width:7px;height:7px;border-radius:50%;background:#E8C97A;border:1px solid rgba(13,22,40,.8)'; dotWrap.appendChild(d1); }
      if(evInfo.hasCustom){ var d2=document.createElement('div'); d2.style.cssText='width:7px;height:7px;border-radius:50%;background:#A78BFA;border:1px solid rgba(13,22,40,.8)'; dotWrap.appendChild(d2); }
      nameBox.appendChild(dotWrap);
    }

    if(queueIdx2 === -1 && canAddToRoute() && dsQueue.length > 0) {
      labelEl.style.opacity = '0.6';

    var nameOverlay = new kakao.maps.CustomOverlay({ position:pos, content:labelEl, yAnchor:2.6, clickable:true, zIndex:1 });
    nameOverlay.setMap(kakaoMap);

  // 기준 고객은 큐에 담겨도 일반 마커는 숨김(파란 기준핀에 출발/도착 배지로 표시).
  // 기준 고객이 아닌 큐 항목은 그대로 표시.
  if(window._baseCustomerId || isCustomerMode) {
    nearby.forEach(function(item, idx) {

      if(item.c.lat && item.c.lng){

}

  function makeCenterLabel(addrText) {

// ── 이벤트 D-day 계산 (D-3 ~ D-0) ──────────────────
function calcDday(dateStr, repeat) {
  if(!dateStr) return null;
  var today = new Date(); today.setHours(0,0,0,0);
  var parts = dateStr.split('-');
  if(parts.length < 2) return null;
  var target;
  if(repeat === '매년' || repeat === '매년반복') {
    var m = parseInt(parts[1],10)-1;
    var d = parseInt(parts[2]||1,10);
    target = new Date(today.getFullYear(), m, d);
    if(target < today) target.setFullYear(today.getFullYear()+1);
  } else {
    target = new Date(dateStr);
  }
  target.setHours(0,0,0,0);
  var diff = Math.round((target - today) / 86400000);
  return diff;
}

function getUpcomingEvents(c) {
  var result = { events:[], hasEvent:false, hasCustom:false };
  if(c.events && c.events.length) {
    c.events.forEach(function(ev){
      var d = calcDday(ev.alertDate || ev.date, ev.repeat || ev.trigger);
      if(d !== null && d >= 0 && d <= 3) {
        result.events.push({ name:ev.name, dday:d, date:ev.alertDate||ev.date, repeat:ev.repeat||ev.trigger, type:'event' });
        result.hasEvent = true;
      }
    });
  }
  if(c.etcNote && c.etcNote.trim()) {
    var noteLines = c.etcNote.split('\n').filter(function(l){ return l.trim(); });
    noteLines.forEach(function(line){
      result.events.push({ name:line.trim(), dday:null, date:'', repeat:'', type:'custom' });
      result.hasCustom = true;
    });
  }
  return result;
}

// ── 고객 ID로 찾기 ───────────────────────────────────
function findCustomerById(id) {
  for(var i=0; i<allCustomers.length; i++){
    if(allCustomers[i].id === id) return allCustomers[i];
  }
  if(window._nearbyList){
    for(var j=0; j<window._nearbyList.length; j++){
      if(window._nearbyList[j].c.id === id) return window._nearbyList[j].c;
    }
  }
  return null;
}

  if((currentTab == 'ds' || currentTab == 'today') && routeMode == 'add') {
    if(item && item.c && item.c.lat && item.c.lng) {
      addToDsQueue(item.c);
    }
    return;
  }

  document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
  var el = document.getElementById('citem_'+idx);
  if(el) el.classList.add('sel');
  if(item) showPopup(item.c, item.dist);

  // 지도 이동 + 라벨 하이라이트
  if(kakaoMap && window._nearbyMarkers && window._nearbyMarkers[idx]) {
    var nm = window._nearbyMarkers[idx];
    kakaoMap.setCenter(nm.pos);

    // 모든 라벨 원래 스타일로
    window._nearbyMarkers.forEach(function(m){
      if(m.labelEl) {
        m.labelEl.style.background = 'rgba(13,22,40,.9)';
        m.labelEl.style.border = '1px solid rgba(255,255,255,.16)';
        m.labelEl.style.transform = 'scale(1)';
        m.labelEl.style.zIndex = '';
      }
      if(m.overlay) m.overlay.setZIndex(1);
      if(m.marker) m.marker.setZIndex(1);
    });

    // 선택된 라벨 하이라이트
    if(nm.labelEl) {
      nm.labelEl.style.background = nm.color || 'rgba(16,185,129,.9)';
      nm.labelEl.style.border = '1px solid rgba(255,255,255,.4)';
      nm.labelEl.style.transform = 'scale(1.15)';
      nm.labelEl.style.zIndex = '100';
    }
    if(nm.overlay) nm.overlay.setZIndex(10);
    if(nm.marker) nm.marker.setZIndex(10);
  }
}

function showPopup(c, dist) {

  }

  console.log('[NEARBY] showPopup 호출:', c.name);

              m.labelEl.style.background = 'rgba(13,22,40,.9)';
              m.labelEl.style.border = '1px solid rgba(255,255,255,.16)';
              m.labelEl.style.transform = 'scale(1)';
              m.labelEl.style.zIndex = '';
            }
            if(m.overlay) m.overlay.setZIndex(1);
            if(m.marker) m.marker.setZIndex(1);
          });
          var nm = window._nearbyMarkers[idx];
          if(nm.labelEl) {
            nm.labelEl.style.background = nm.color || 'rgba(16,185,129,.9)';
            nm.labelEl.style.border = '1px solid rgba(255,255,255,.4)';

  var elPhone = document.getElementById('popupPhone');
  if(elPhone) elPhone.innerHTML = c.phone ? '📞 '+c.phone : '';

  if(elContact) elContact.textContent = c.lastContact ? '마지막 연락: '+c.lastContact : '';

  // 이벤트 카드 렌더링
  var evSection = document.getElementById('popupEventSection');
  var evCards   = document.getElementById('popupEventCards');

      });

  // 상담 이력 렌더링 (전체 미팅, 최신순)
  var phEl = document.getElementById('popupHistory');

  selectedPanelCustomer = c;
  renderSelectedCustomerCard(c, dist);

  // 전화
  var bc = document.getElementById('btnCall');
  if(bc) bc.href = c.phone ? 'tel:'+c.phone.replace(/-/g,'') : '#';

  // 카카오톡
  var bk = document.getElementById('btnKakao');

      if(typeof Kakao !== 'undefined' && Kakao.isInitialized()) {

  }

  // 동선 담기/빼기 버튼 (담기 모드에서만)
  var brt = document.getElementById('btnPopupRoute');
  if(brt){
    if(canAddToRoute()){

        if(c.id && q.id && !q.id.startsWith('MY_LOC_') && !q.id.startsWith('DS_PIN_')) return q.id == c.id;
        return q.name == c.name && String(q.lat).slice(0,7) == String(c.lat).slice(0,7);

// ── 패널 내위치 설정 ─────────────────────────────────
function getMyLocForPanel(type, btn) {
  if(!navigator.geolocation){ alert('위치 정보를 지원하지 않는 브라우저입니다.'); return; }
  var origText = btn ? btn.textContent : '';
  if(btn) btn.textContent = '⏳';

  function applyLoc(lat, lng) {
    var obj = { name:'내 현재 위치', lat:String(lat), lng:String(lng), address:'내 현재 위치' };
    setRoutePointToQueue(type, obj);
    if(btn) btn.textContent = origText;

    // 지도 이동 + 내 위치 마커 표시
    if(kakaoMap) {
      var myPos = new kakao.maps.LatLng(lat, lng);
      kakaoMap.setCenter(myPos);
      kakaoMap.setLevel(5);

      // 기존 내 위치 마커/오버레이 제거
      if(myLocMarker)  { myLocMarker.setMap(null);  myLocMarker  = null; }
      if(myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }

      // 노란 마커
      var svgMe = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">'
        +'<circle cx="16" cy="16" r="14" fill="#FBBF24" stroke="#fff" stroke-width="2"/>'
        +'<circle cx="16" cy="16" r="6" fill="#fff" opacity=".9"/>'
        +'</svg>';
      var myImg = new kakao.maps.MarkerImage(
        'data:image/svg+xml;base64,'+btoa(svgMe),
        new kakao.maps.Size(32,32),
        { offset: new kakao.maps.Point(16,16) }
      );
      myLocMarker = new kakao.maps.Marker({ position:myPos, map:kakaoMap, image:myImg, title:'내 위치' });

      // 라벨 오버레이
      var labelEl = document.createElement('div');
      labelEl.style.cssText = 'background:rgba(251,191,36,.9);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;color:#1a1a1a;white-space:nowrap;margin-bottom:2px';
      labelEl.textContent = '📍 내 위치';
      myLocOverlay = new kakao.maps.CustomOverlay({ position:myPos, content:labelEl, yAnchor:3.0 });
      myLocOverlay.setMap(kakaoMap);

    }
  }

  function onError(err) {
    if(err.code === 1) {
      // 권한 거부 - 재시도 없이 안내
      if(btn) btn.textContent = origText;
      alert('위치 권한이 거부됐습니다.\n브라우저 주소창 옆 자물쇠 → 위치 허용으로 변경 후 다시 시도하세요.');
    } else {
      // GPS 실패 → 저정밀도로 재시도
      navigator.geolocation.getCurrentPosition(
        function(pos){ applyLoc(pos.coords.latitude, pos.coords.longitude); },
        function(){
          if(btn) btn.textContent = origText;
          alert('위치를 가져올 수 없습니다. 잠시 후 다시 시도해주세요.');
        },
        { enableHighAccuracy:false, timeout:10000, maximumAge:60000 }
      );
    }
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){ applyLoc(pos.coords.latitude, pos.coords.longitude); },
    onError,
    { enableHighAccuracy:true, timeout:8000, maximumAge:0 }
  );
}

      content.style.cssText = 'flex:1;';

      var viaRow = document.createElement('div');
      viaRow.className = 'rp-via-row';

      var slot = document.createElement('div');
      slot.className = 'rp-via-slot';

      var label = document.createElement('span');
      label.className = 'rp-via-label';
      label.textContent = '경유 '+(i+1);

      // 슬롯 이름 — 주소 또는 좌표 간략하게
      var displayName = '';
      if(v.name && v.name !== '내 현재 위치') {
        displayName = v.name;
      } else if(v.name === '내 현재 위치') {
        displayName = '📍 내 현재 위치';
      } else if(v.lat && v.lng) {
        displayName = parseFloat(v.lat).toFixed(4)+', '+parseFloat(v.lng).toFixed(4);
      } else {
        displayName = '미설정';
      }

      var name = document.createElement('span');
      name.className = 'rp-via-name';
      name.textContent = displayName;
      if(!v.lat) name.style.color = '#4A5568';

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'rp-via-del';
      del.textContent = '✕';
      (function(idx){ del.addEventListener('click', function(){ clearRoutePin('via_'+idx); routeViaMarkers.splice(idx,1); removeRoutePointFromQueue('via_'+idx); }); })(i);

      slot.appendChild(label);
      slot.appendChild(name);
      slot.appendChild(del);

      // 내위치 버튼
      var viaMyLoc = document.createElement('button');
      viaMyLoc.type = 'button';
      viaMyLoc.className = 'rp-myloc';
      viaMyLoc.textContent = '📍';
      viaMyLoc.title = '내 현재 위치';
      (function(idx, btn){
        btn.addEventListener('click', function(){ getMyLocForPanel('via_'+idx, btn); });
      })(i, viaMyLoc);

      // 지도선택 버튼
      var viaMapSel = document.createElement('button');
      viaMapSel.type = 'button';
      viaMapSel.className = 'rp-mapsel';
      viaMapSel.textContent = '📌';
      viaMapSel.title = '지도에서 선택';
      (function(idx){
        viaMapSel.addEventListener('click', function(){
          var viaKey = 'via_'+idx;
          if(mapSelectMode === viaKey) {
            exitMapSelectMode();
          } else if(routeViaMarkers[idx] && routeViaMarkers[idx].marker) {
            clearRoutePin(viaKey);
            if(panelVia[idx]) { panelVia[idx] = { name:'', lat:'', lng:'' }; }
            renderRoutePanel();
          } else {
            enterMapSelectMode(viaKey);
          }
        });
      })(i);

      var orderCol = document.createElement('div');
      orderCol.className = 'rp-via-order';

      var upBtn = document.createElement('button');
      upBtn.type = 'button'; upBtn.className = 'rp-via-btn'; upBtn.textContent = '▲';
      (function(idx){ upBtn.addEventListener('click', function(){
        moveViaInQueue(idx, -1);
      }); })(i);

      var downBtn = document.createElement('button');
      downBtn.type = 'button'; downBtn.className = 'rp-via-btn'; downBtn.textContent = '▼';
      (function(idx){ downBtn.addEventListener('click', function(){
        moveViaInQueue(idx, 1);
      }); })(i);

      orderCol.appendChild(upBtn);
      orderCol.appendChild(downBtn);

      viaRow.appendChild(slot);
      viaRow.appendChild(viaMyLoc);
      viaRow.appendChild(viaMapSel);
      viaRow.appendChild(orderCol);
      content.appendChild(viaRow);

      // 주소 입력칸 — 미설정일 때만 표시
      if(!v.lat) {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'rp-input';
        input.placeholder = '주소 직접 입력';
        (function(idx){ input.addEventListener('keydown', function(e){
          if(e.key==='Enter') searchRouteAddr('via_'+idx, this.value.trim());
        }); })(i);
        content.appendChild(input);
      }

      row.appendChild(lineCol);
      row.appendChild(content);
      viaList.appendChild(row);
    });
  }

  // 길찾기 URL 생성 (출발+도착 필수, 경유지는 좌표 있는 것만)
  var validVia = panelVia.filter(function(v){ return v.lat && v.lng; });
  if(panelFrom && panelTo) {
    navBtns.className = 'rp-nav-btns active';
    hint.style.display = 'none';

    // 카카오맵 파라미터 방식 URL
    var sp = 'spx='+panelFrom.lng+'&spy='+panelFrom.lat+'&sname='+encodeURIComponent(panelFrom.name);
    var ep = 'epx='+panelTo.lng+'&epy='+panelTo.lat+'&ename='+encodeURIComponent(panelTo.name);
    var viaParam = '';
    validVia.forEach(function(v, i){
      viaParam += '&via'+(i+1)+'x='+v.lng+'&via'+(i+1)+'y='+v.lat+'&via'+(i+1)+'name='+encodeURIComponent(v.name);
    });

    // 카카오맵 공식 URL: /link/by/{이동수단}/출발이름,위도,경도/경유이름,위도,경도/도착이름,위도,경도
    var fLat  = parseFloat(panelFrom.lat).toFixed(6);
    var fLng  = parseFloat(panelFrom.lng).toFixed(6);
    var tLat  = parseFloat(panelTo.lat).toFixed(6);
    var tLng  = parseFloat(panelTo.lng).toFixed(6);
    var fName = panelFrom.name;
    var tName = panelTo.name;

    var viaRoute = '';
    validVia.forEach(function(v){
      viaRoute += '/'+v.name+','+parseFloat(v.lat).toFixed(6)+','+parseFloat(v.lng).toFixed(6);
    });

    var base  = 'https://map.kakao.com/link/by/';
    var route = fName+','+fLat+','+fLng + viaRoute + '/'+tName+','+tLat+','+tLng;

    var carUrl  = base + 'car/'     + route;
    var busUrl  = base + 'traffic/' + fName + ',' + fLat + ',' + fLng + '/' + tName + ',' + tLat + ',' + tLng;
    var walkUrl = base + 'walk/'    + route;

    var rc = document.getElementById('rpCar');  if(rc)  rc.href = carUrl;
    var rb = document.getElementById('rpBus');  if(rb)  rb.href = busUrl;
    var rw = document.getElementById('rpWalk'); if(rw)  rw.href = walkUrl;
  } else {
    navBtns.className = 'rp-nav-btns';
    hint.style.display = '';
  }

  // 열기 버튼 상태 — 설정된 게 있으면 강조
  var ob = document.getElementById('routeOpenBtn');
  if(ob) {
    var hasAny = panelFrom || panelTo || panelVia.length > 0;
    ob.className = 'route-open-btn' + (hasAny ? ' has-route' : '');
    ob.textContent = hasAny ? '🗺️ 길찾기 수정중' : '🗺️ 길찾기 열기';
  }
}

// ── 길찾기 주소 검색 ──────────────────────────────────
function searchRouteAddr(type, addr) {
  if(!addr || !kakaoMap) return;
  var geocoder = new kakao.maps.services.Geocoder();
  var places   = new kakao.maps.services.Places();
  var isVia = type.indexOf('via_') === 0;
  var viaIdx = isVia ? parseInt(type.split('_')[1], 10) : -1;

  function applyObj(obj) {
    setRoutePointToQueue(type, obj);
  }

  places.keywordSearch(addr, function(result, status) {
    var found = false;
    if(status === kakao.maps.services.Status.OK && result.length > 0) {
      var p = result[0];
      applyObj({ name:p.place_name||addr, lat:p.y, lng:p.x, address:p.address_name||addr });
      found = true;
    }
    if(!found) {
      geocoder.addressSearch(addr, function(result2, status2) {
        if(status2 === kakao.maps.services.Status.OK) {
          applyObj({ name:addr, lat:result2[0].y, lng:result2[0].x, address:addr });
        } else { alert('주소를 찾을 수 없습니다.'); }
      });
    }
  });
}

// ── 내 현재 위치 찾기 ────────────────────────────────
function findMyLocation() {
  if(!kakaoMap){ alert('먼저 지도를 불러주세요'); return; }
  if(!navigator.geolocation){ alert('이 브라우저는 위치 정보를 지원하지 않습니다'); return; }
  var btn = document.getElementById('btnMyLoc');
  if(btn){ btn.textContent = '⏳ 위치 찾는 중...'; btn.className = 'myloc-btn loading'; }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      myLat = pos.coords.latitude;
      myLng = pos.coords.longitude;

      if(btn){ btn.textContent = '📍'; btn.className = 'myloc-btn'; }

      // 동선관리 탭: 큐에 추가
      if(currentTab == 'ds') {
        var obj = { id:'MY_LOC_' + Date.now(), name:'내 위치', lat:String(myLat), lng:String(myLng), address:'내 현재 위치' };
        dsQueue.push(obj);
        syncDsQueueToRoute();
        if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
        injectDsRoleLabels();
        updateDsMarkerLabels();
        drawDsPolylines();
        renderDsEditList();

        // 지도 내 위치 표시 (노란 마커 유지)
        if(myLocMarker)  { myLocMarker.setMap(null);  myLocMarker  = null; }
        if(myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }
        var myPos = new kakao.maps.LatLng(myLat, myLng);
        var svgMe = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#FBBF24" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="6" fill="#fff" opacity=".9"/></svg>';
        var myImg = new kakao.maps.MarkerImage('data:image/svg+xml;base64,'+btoa(svgMe), new kakao.maps.Size(32,32), { offset: new kakao.maps.Point(16,16) });
        myLocMarker = new kakao.maps.Marker({ position:myPos, map:kakaoMap, image:myImg, title:'내 위치' });
        kakaoMap.setCenter(myPos);
        return;
      }

      var myPos = new kakao.maps.LatLng(myLat, myLng);

      // 기존 내 위치 마커/오버레이 제거
      if(myLocMarker)  { myLocMarker.setMap(null);  myLocMarker  = null; }
      if(myLocOverlay) { myLocOverlay.setMap(null); myLocOverlay = null; }

      var myPos = new kakao.maps.LatLng(myLat, myLng);

      // 내 위치 마커 (노란 별 모양)
      var svgMe = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">'
        +'<circle cx="16" cy="16" r="14" fill="#FBBF24" stroke="#fff" stroke-width="2"/>'
        +'<circle cx="16" cy="16" r="6" fill="#fff" opacity=".9"/>'
        +'</svg>';
      var myImg = new kakao.maps.MarkerImage(
        'data:image/svg+xml;base64,'+btoa(svgMe),
        new kakao.maps.Size(32,32),
        { offset: new kakao.maps.Point(16,16) }
      );
      myLocMarker = new kakao.maps.Marker({ position:myPos, map:kakaoMap, image:myImg, title:'내 위치' });

      // 내 위치 라벨
      var myLabelEl = document.createElement('div');
      myLabelEl.style.cssText = 'background:rgba(251,191,36,.9);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;color:#1a1a1a;white-space:nowrap;margin-bottom:2px;cursor:pointer';
      myLabelEl.textContent = '📍 내 위치';
      myLabelEl.addEventListener('click', function(){
        if(currentTab == 'ds') {
          var myId = 'MY_LOC_FIXED';
          var existing = dsQueue.findIndex(function(q){ return q.id == myId; });
          if(existing !== -1) {
            dsQueue.splice(existing, 1);
            syncDsQueueToRoute();
            if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
            applyNearbyMarkerOpacity();
            injectDsRoleLabels();
            updateDsMarkerLabels();
            drawDsPolylines();
            renderDsEditList();
          } else {
            var obj = { id: myId, name:'내 위치', lat:String(myLat), lng:String(myLng), address:'내 현재 위치' };
            dsQueue.push(obj);
            syncDsQueueToRoute();
            if(centerLat && centerLng) refreshNearbyOnly(centerLat, centerLng);
            applyNearbyMarkerOpacity();
            injectDsRoleLabels();
            updateDsMarkerLabels();
            drawDsPolylines();
            renderDsEditList();
          }
          return;
        }
        routeFrom = { id:'MY_LOCATION', name:'내 위치', lat:String(myLat), lng:String(myLng) };
        var bf = document.getElementById('btnFrom');
        if(bf) bf.className = 'route-btn btn-from active';
        updateRouteStatus();
        alert('내 현재 위치가 출발지로 설정됐습니다.');
      });
      myLocOverlay = new kakao.maps.CustomOverlay({ position:myPos, content:myLabelEl, yAnchor:3.0, clickable:true });
      myLocOverlay.setMap(kakaoMap);

      // 지도 중심 이동 + 주변 고객 표시
      centerLat = myLat; centerLng = myLng;
      var mlabelEl4 = document.querySelector('.mlabel');
      if(mlabelEl4) mlabelEl4.textContent = '📍 기준 위치';
      document.getElementById('targetName').textContent = '내 현재 위치';
      document.getElementById('targetAddr').textContent = '위도 '+myLat.toFixed(4)+' / 경도 '+myLng.toFixed(4);
      document.getElementById('headerSub').textContent  = '내 위치 주변 고객 찾기';
      drawNearby(myLat, myLng);
    },
    function(err){
      if(btn){ btn.textContent = '📍 내 위치'; btn.className = 'myloc-btn'; }
      var msg = '위치를 가져올 수 없습니다.';
      if(err.code === 1) msg = '위치 권한이 거부됐습니다.\n브라우저 주소창 옆 자물쇠 아이콘 → 위치 허용으로 바꿔주세요.';
      if(err.code === 2) msg = '위치 신호를 찾을 수 없습니다. 잠시 후 다시 시도해주세요.';
      if(err.code === 3) msg = '위치 요청 시간이 초과됐습니다.';
      alert(msg);
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}

function closePopup() {
  var p = document.getElementById('mapPopup');
  if(p) p.style.display = 'none';
  // 길찾기 패널 하단 선택 고객 카드 해제
  var card = document.getElementById('selectedCustomerCard');
  if(card) card.style.display = 'none';
  selectedPanelCustomer = null;
  selectedCustomerId = null;
  // 리스트 하이라이트 해제
  document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
  // 마커 zIndex 원상복구
  if(window._nearbyMarkers) {
    window._nearbyMarkers.forEach(function(m){
      if(m.labelEl) {
        m.labelEl.style.background = 'rgba(13,22,40,.9)';
        m.labelEl.style.border = '1px solid rgba(255,255,255,.16)';
        m.labelEl.style.transform = 'scale(1)';
        m.labelEl.style.zIndex = '';
      }
      if(m.overlay) m.overlay.setZIndex(1);
      if(m.marker) m.marker.setZIndex(1);
    });
  }
}

function setAsBase() {
  var c = selectedCustomerId ? null : null;
  if(window._nearbyList) {
    window._nearbyList.forEach(function(item){
      if(item.c.id === selectedCustomerId) c = item.c;
    });
  }
  if(!c) { c = allCustomers.filter(function(a){ return a.id === selectedCustomerId; })[0]; }
  if(!c || !c.lat || !c.lng) { alert('이 고객은 좌표가 없어 기준으로 설정할 수 없습니다.'); return; }

  // 좌측 기준 고객 카드 업데이트
  var tnEl = document.getElementById('targetName');
  var taEl = document.getElementById('targetAddr');
  var mlabelEl2 = document.querySelector('.mlabel');
  if(mlabelEl2) mlabelEl2.textContent = '📅 기준 고객';
  if(tnEl) tnEl.textContent = c.name;
  if(taEl) taEl.textContent = c.address || '';
  document.getElementById('headerSub') && (document.getElementById('headerSub').textContent = c.name + ' 주변 고객 찾기');

  // 팝업 닫기
  closePopup();

  // 기준 고객 ID 기억 (drawNearby 후 마커 라벨 교체용)
  window._baseCustomerId = c.id;
  isCustomerMode = true;

  // 기준 고객을 바꾸면 기존 동선 큐/레이어 초기화 (이전 기준이 동선 핀으로 남지 않도록)
  dsQueue = [];
  window._activeRoute = null;
  if(typeof clearDsPolylines === 'function') clearDsPolylines();
  if(typeof clearDsRoleLayer === 'function') clearDsRoleLayer();
  if(typeof clearInlineRoleBadges === 'function') clearInlineRoleBadges();
  if(typeof clearRouteDimMarkers === 'function') clearRouteDimMarkers();
  panelFrom = null; panelTo = null; panelVia = [];
  if(typeof renderRoutePanel === 'function') renderRoutePanel();
  if(typeof renderDsEditList === 'function') renderDsEditList();
  setRouteMode('view');

  // 지도 이동 + 주변 재계산
  centerLat = parseFloat(c.lat);
  centerLng = parseFloat(c.lng);
  drawNearby(centerLat, centerLng);
}

// ── 마커 클리어 ──────────────────────────────────────
function _bindArbPinDrag(mk, arbImg) {
  if(!mk) return;
  kakao.maps.event.addListener(mk, 'dragend', function(){
    var np = mk.getPosition();
    centerLat = np.getLat(); centerLng = np.getLng();
    isCustomerMode = false; window._baseCustomerId = '';
    var gc2 = new kakao.maps.services.Geocoder();
    gc2.coord2Address(np.getLng(), np.getLat(), function(res2, st2){
      var a2 = np.getLat().toFixed(4) + ',' + np.getLng().toFixed(4);
      if(st2 === kakao.maps.services.Status.OK && res2.length > 0){
        var rr = res2[0];
        a2 = rr.road_address ? rr.road_address.address_name : rr.address.address_name;
      }
      var tn2 = document.getElementById('targetName'); if(tn2) tn2.textContent = a2;
      var ml2 = document.querySelector('.mlabel'); if(ml2) ml2.textContent = '📌 기준 위치';
      drawNearby(centerLat, centerLng);
      // drawNearby가 clearMarkers로 핀을 지우므로 재생성
      if(_arbPinMarker){ _arbPinMarker.setMap(null); }
      _arbPinMarker = new kakao.maps.Marker({ position:np, map:kakaoMap, image:arbImg, zIndex:9, title:a2, draggable:true });
      _bindArbPinDrag(_arbPinMarker, arbImg);
    });
  });
}

function clearMarkers() {
  markers.forEach(function(m){ m.setMap(null); });
  circles.forEach(function(c){ c.setMap(null); });
  if(centerOverlay){ centerOverlay.setMap(null); centerOverlay = null; }
  if(centerMarkerGlobal){ centerMarkerGlobal.setMap(null); centerMarkerGlobal = null; }
  if(window._nearbyMarkers){
    window._nearbyMarkers.forEach(function(nm){
      if(nm.marker) nm.marker.setMap(null);
      if(nm.overlay) nm.overlay.setMap(null);
    });
    window._nearbyMarkers = [];
  }
  markers=[]; circles=[];
}

// ── 거리 계산 (Haversine) ────────────────────────────
function getDistKm(lat1,lng1,lat2,lng2) {
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
