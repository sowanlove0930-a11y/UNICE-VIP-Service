<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주변 고객 찾기 — UNISPACE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080E1C;--bg2:#0D1628;--bg3:#111D35;--gold:#C9A84C;--gold2:#E8C97A;--text:#F0F4FF;--text2:#8B98B8;--text3:#4A5568;--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.14);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}

/* 헤더 */
.header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--bdr);z-index:100;flex-shrink:0;}
.back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:20px;padding:6px 14px;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;}
.back-btn:hover{background:rgba(255,255,255,.1);color:var(--text);}
.header-title{font-family:'Syncopate',sans-serif;font-size:12px;font-weight:700;color:var(--gold2);letter-spacing:.1em;}
.header-sub{font-size:12px;color:var(--text2);margin-left:auto;}

/* 메인 레이아웃 */
.main{display:flex;flex:1;overflow:hidden;}

/* 좌측 패널 */
.left{width:280px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden;}
.lhead{padding:14px 16px;border-bottom:1px solid var(--bdr);}
.ltitle{font-size:11px;font-weight:700;color:var(--gold2);letter-spacing:.06em;margin-bottom:10px;}
.mcard{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.mlabel{font-size:10px;color:#60A5FA;font-weight:700;margin-bottom:3px;}
.mname{font-size:14px;font-weight:700;color:var(--text);}
.maddr{font-size:11px;color:var(--text2);margin-top:2px;}
.addr-input{width:100%;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:8px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;margin-top:6px;}
.addr-input:focus{outline:none;border-color:var(--gold);}
.search-btn{width:100%;padding:8px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.rrow{display:flex;align-items:center;gap:8px;margin-top:8px;}
.rlabel{font-size:11px;color:var(--text2);white-space:nowrap;}
.rchips{display:flex;gap:4px;}
.rchip{font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;font-weight:600;transition:all .2s;border:1px solid var(--bdr);}
.rchip.on{background:rgba(59,130,246,.18);color:#60A5FA;border-color:rgba(59,130,246,.4);}
.rchip.off{background:rgba(255,255,255,.04);color:var(--text3);}
.rcnt{padding:7px 16px;font-size:11px;color:var(--text2);border-bottom:1px solid rgba(255,255,255,.05);}
.rcnt b{color:var(--text);}
.clist{flex:1;overflow-y:auto;}
.ci{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s;}
.ci:hover{background:rgba(255,255,255,.03);}
.ci.sel{background:rgba(59,130,246,.07);border-left:2px solid #3B82F6;}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.cn{font-size:13px;font-weight:600;color:var(--text);}
.cd{font-size:11px;font-weight:700;color:#60A5FA;}
.ci2{font-size:11px;color:var(--text2);}
.ctag{font-size:9px;padding:1px 5px;border-radius:5px;font-weight:700;margin-left:3px;vertical-align:middle;}
.tc{background:rgba(16,185,129,.12);color:#34D399;}
.tm{background:rgba(139,92,246,.12);color:#A78BFA;}
.tw{background:rgba(244,163,38,.12);color:#FCD34D;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;}

/* 지도 */
.map-wrap{flex:1;position:relative;}
#kakaoMap{width:100%;height:100%;}

/* API 키 안내 배너 */
.api-banner{position:absolute;inset:0;background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:12px;padding:30px;}
.api-title{font-size:16px;font-weight:800;color:var(--gold2);}
.api-sub{font-size:13px;color:var(--text2);text-align:center;line-height:1.7;}
.api-input{width:100%;max-width:340px;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:10px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;text-align:center;}
.api-btn{padding:10px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.api-link{font-size:11px;color:#60A5FA;text-decoration:none;}
.api-link:hover{text-decoration:underline;}

/* 팝업 */
.map-popup{position:absolute;background:rgba(13,22,40,.96);border:1px solid var(--bdr2);border-radius:14px;padding:14px;min-width:210px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none;}
.popup-close{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pname{font-size:14px;font-weight:700;color:var(--text);}
.ptag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;}
.prow{font-size:11px;color:var(--text2);margin-bottom:3px;}
.prow b{color:#60A5FA;}
.divider{border:none;border-top:1px solid rgba(255,255,255,.07);margin:8px 0;}
.section-label{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:5px;}
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px;}
.nav-btn{padding:7px 4px;border-radius:8px;text-align:center;cursor:pointer;transition:all .2s;border:1px solid var(--bdr);background:rgba(255,255,255,.04);text-decoration:none;}
.nav-btn:hover{background:rgba(255,255,255,.1);}
.nav-icon{font-size:14px;display:block;margin-bottom:2px;}
.nav-text{font-size:10px;color:var(--text2);font-weight:600;}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.contact-btn{padding:7px;border-radius:8px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;text-decoration:none;display:block;}
.btn-call{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#34D399;}
.btn-kakao{background:rgba(254,229,0,.1);border:1px solid rgba(254,229,0,.25);color:#FEE500;}
.btn-call:hover{background:rgba(16,185,129,.2);}
.btn-kakao:hover{background:rgba(254,229,0,.18);}
.detail-btn{width:100%;padding:8px;border-radius:8px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#080E1C;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;}

.route-btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px;}
.route-btn{padding:6px 4px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .2s;}
.btn-from{background:rgba(59,130,246,.12);color:#60A5FA;border:1px solid rgba(59,130,246,.3);}
.btn-from.active{background:rgba(59,130,246,.35);color:#fff;}
.btn-to{background:rgba(239,68,68,.1);color:#F87171;border:1px solid rgba(239,68,68,.3);}
.btn-to.active{background:rgba(239,68,68,.3);color:#fff;}
.route-status{margin-top:6px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px;margin-bottom:4px;}
.route-info{font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.6;}
.route-info b{color:var(--gold2);}
.route-nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.route-nav-btn{padding:6px 2px;border-radius:6px;text-align:center;font-size:10px;font-weight:700;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.25);color:var(--gold2);text-decoration:none;display:block;}
.route-nav-btn:hover{background:rgba(201,168,76,.25);}
/* 범례 */
.legend{position:absolute;bottom:12px;left:12px;background:rgba(13,22,40,.9);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px;z-index:20;}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;color:var(--text2);}
.lr:last-child{margin-bottom:0;}
.ldot{width:9px;height:9px;border-radius:50%;}

/* 반경 선택 */
.radius-input{display:none;}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="javascript:history.back()">← 돌아가기</a>
  <div class="header-title">📍 NEARBY</div>
  <div class="header-sub" id="headerSub">주변 고객 찾기</div>
</div>

<div class="main">
  <!-- 좌측 패널 -->
  <div class="left">
    <div class="lhead">
      <div class="ltitle">기준 위치</div>
      <div class="mcard" id="targetCard">
        <div class="mlabel">📅 기준 고객</div>
        <div class="mname" id="targetName">—</div>
        <div class="maddr" id="targetAddr">주소를 입력해주세요</div>
      </div>
      <input type="text" class="addr-input" id="addrInput" placeholder="장소명 또는 주소 입력 (예: 해운대 스타벅스)">
      <button type="button" class="search-btn" onclick="searchAddr()">🔍 검색 및 주변 고객 찾기</button>
      <div class="rrow">
        <span class="rlabel">반경</span>
        <div class="rchips" id="rchips">
          <span class="rchip off" onclick="setRadius(1,this)">1km</span>
          <span class="rchip off" onclick="setRadius(3,this)">3km</span>
          <span class="rchip on"  onclick="setRadius(5,this)">5km</span>
          <span class="rchip off" onclick="setRadius(10,this)">10km</span>
        </div>
      </div>
    </div>
    <div class="rcnt" id="resultCount">주소를 검색하면 주변 고객이 표시됩니다</div>
    <div class="clist" id="clist"><div class="empty">🔍 주소를 검색해주세요</div></div>
  </div>

  <!-- 지도 -->
  <div class="map-wrap">
    <!-- API 키 안내 배너 -->
    <div class="api-banner" id="apiBanner">
      <div class="api-title">🗺️ 카카오맵 API 키 필요</div>
      <div class="api-sub">실제 지도를 사용하려면<br>카카오 개발자 API 키가 필요합니다.<br>발급은 무료입니다.</div>
      <input type="text" class="api-input" id="apiKeyInput" placeholder="카카오 JavaScript API 키 입력">
      <button type="button" class="api-btn" onclick="initMap()">지도 불러오기</button>
      <a href="https://developers.kakao.com" target="_blank" class="api-link">→ 카카오 개발자 콘솔에서 무료 발급</a>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">키는 이 기기에만 저장됩니다</div>
    </div>
    <div id="kakaoMap"></div>

    <!-- 팝업 -->
    <div class="map-popup" id="mapPopup">
      <button type="button" class="popup-close" id="btnClose">✕</button>
      <div class="phead">
        <span class="pname" id="popupName"></span>
        <span class="ptag" id="popupTag"></span>
      </div>
      <div class="prow" id="popupAddr"></div>
      <div class="prow" id="popupPhone"></div>
      <div class="prow" id="popupContact"></div>
      <div class="divider"></div>
      <div class="route-btns">
        <button type="button" class="route-btn btn-from" id="btnFrom">🚩 출발지 설정</button>
        <button type="button" class="route-btn btn-to" id="btnTo">🏁 도착지 설정</button>
      </div>
      <div class="route-status" id="routeStatus" style="display:none">
        <div class="route-info" id="routeInfo"></div>
        <div class="route-nav-btns">
          <a class="route-nav-btn" id="routeCar" href="#" target="_blank">🚗 자동차</a>
          <a class="route-nav-btn" id="routeBus" href="#" target="_blank">🚌 대중교통</a>
          <a class="route-nav-btn" id="routeWalk" href="#" target="_blank">🚶 도보</a>
        </div>
      </div>
      <div class="divider"></div>
      <div class="section-label">🗺️ 현재 위치로 길찾기</div>
      <div class="nav-btns">
        <a class="nav-btn" id="navCar" href="#" target="_blank">
          <span class="nav-icon">🚗</span><span class="nav-text">자동차</span>
        </a>
        <a class="nav-btn" id="navBus" href="#" target="_blank">
          <span class="nav-icon">🚌</span><span class="nav-text">대중교통</span>
        </a>
        <a class="nav-btn" id="navWalk" href="#" target="_blank">
          <span class="nav-icon">🚶</span><span class="nav-text">도보</span>
        </a>
      </div>
      <div class="divider"></div>
      <div class="section-label">📲 연락하기</div>
      <div class="contact-btns">
        <a class="contact-btn btn-call" id="btnCall" href="#">📞 전화걸기</a>
        <a class="contact-btn btn-kakao" id="btnKakao" href="#">💬 카카오톡</a>
      </div>
      <button type="button" class="detail-btn" id="btnDetail">고객 상세 보기 →</button>
    </div>

    <!-- 범례 -->
    <div class="legend" id="mapLegend" style="display:none">
      <div class="lr"><div class="ldot" style="background:#3B82F6"></div>기준 위치</div>
      <div class="lr"><div class="ldot" style="background:#10B981"></div>계약 고객</div>
      <div class="lr"><div class="ldot" style="background:#8B5CF6"></div>관리 고객</div>
      <div class="lr"><div class="ldot" style="background:#F59E0B"></div>연락 필요</div>
    </div>
  </div>
</div>

<script>
// ── 전역 변수 ────────────────────────────────────────
var kakaoMap = null;
var markers  = [];
var circles  = [];
var radiusKm = 5;
var centerLat = 0, centerLng = 0;
var selectedCustomerId = null;
var allCustomers = [];
var routeFrom = null;
var routeTo   = null;

// ── 초기화 ───────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  // 고객 데이터 로드
  try { allCustomers = JSON.parse(localStorage.getItem('unispace_customers') || '[]'); } catch(e){}

  // sessionStorage에서 타겟 정보
  var target = null;
  try { target = JSON.parse(sessionStorage.getItem('nearbyTarget') || 'null'); } catch(e){}
  if(target) {
    document.getElementById('targetName').textContent = target.name || '—';
    document.getElementById('targetAddr').textContent = target.address || '주소를 입력해주세요';
    document.getElementById('addrInput').value        = target.address || '';
    document.getElementById('headerSub').textContent  = target.name + ' 주변 고객 찾기';
    sessionStorage.removeItem('nearbyTarget');
  }

  // 저장된 API 키
  var savedKey = localStorage.getItem('kakao_map_key') || '';
  if(savedKey) {
    document.getElementById('apiKeyInput').value = savedKey;
    loadKakaoScript(savedKey);
  }

  // 팝업 버튼 이벤트 등록
  var btnClose = document.getElementById('btnClose');
  if(btnClose) btnClose.addEventListener('click', closePopup);

  var btnDetail = document.getElementById('btnDetail');
  if(btnDetail) btnDetail.addEventListener('click', goDetail);

  var btnFrom = document.getElementById('btnFrom');
  if(btnFrom) btnFrom.addEventListener('click', function(){
    if(!selectedCustomerId) return;
    var c = findCustomerById(selectedCustomerId);
    if(!c || !c.lat) { alert('이 고객은 좌표가 없어 출발지로 설정할 수 없습니다.'); return; }
    routeFrom = c;
    document.getElementById('btnFrom').className = 'route-btn btn-from active';
    updateRouteStatus();
  });

  var btnTo = document.getElementById('btnTo');
  if(btnTo) btnTo.addEventListener('click', function(){
    if(!selectedCustomerId) return;
    var c = findCustomerById(selectedCustomerId);
    if(!c || !c.lat) { alert('이 고객은 좌표가 없어 도착지로 설정할 수 없습니다.'); return; }
    routeTo = c;
    document.getElementById('btnTo').className = 'route-btn btn-to active';
    updateRouteStatus();
  });
});

// ── 카카오맵 로드 ────────────────────────────────────
function initMap() {
  var key = document.getElementById('apiKeyInput').value.trim();
  if(!key) { alert('API 키를 입력해주세요'); return; }
  localStorage.setItem('kakao_map_key', key);
  loadKakaoScript(key);
}

function loadKakaoScript(key) {
  var existing = document.getElementById('kakaoScript');
  if(existing) existing.remove();
  var s = document.createElement('script');
  s.id  = 'kakaoScript';
  s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey='+key+'&libraries=services&autoload=false';
  s.onload = function() {
    if(typeof kakao === 'undefined' || !kakao.maps) {
      console.error('[NEARBY] kakao 객체 없음 - 도메인 미등록 가능성');
      alert('지도 SDK 로드 실패.\n현재 주소: ' + window.location.origin + '\n이 주소가 카카오 콘솔 도메인과 일치하는지 확인하세요.');
      return;
    }
    kakao.maps.load(function() {
      document.getElementById('apiBanner').style.display = 'none';
      document.getElementById('mapLegend').style.display = '';
      var container = document.getElementById('kakaoMap');
      var options = { center: new kakao.maps.LatLng(35.1631, 129.1635), level: 7 };
      kakaoMap = new kakao.maps.Map(container, options);
      console.log('[NEARBY] 지도 로드 성공');
      var addr = document.getElementById('addrInput').value.trim();
      if(addr) searchAddr();
    });
  };
  s.onerror = function() {
    console.error('[NEARBY] SDK 스크립트 로드 자체 실패');
    console.error('[NEARBY] 현재 주소(origin):', window.location.origin);
    console.error('[NEARBY] 사용 키:', key);
    alert('지도 SDK 스크립트 로드 실패\n\n현재 페이지 주소: ' + window.location.origin + '\n\n카카오 콘솔 JavaScript SDK 도메인에\n위 주소가 정확히 등록되어 있어야 합니다.\n저장 후 5~10분 기다린 뒤 Ctrl+Shift+R 새로고침하세요.');
  };
  document.head.appendChild(s);
}

// ── 반경 선택 ────────────────────────────────────────
function setRadius(km, el) {
  radiusKm = km;
  document.querySelectorAll('.rchip').forEach(function(c){ c.className='rchip off'; });
  el.className = 'rchip on';
  if(centerLat && centerLng) drawNearby(centerLat, centerLng);
}

// ── 주소 검색 ────────────────────────────────────────
function searchAddr() {
  if(!kakaoMap) { alert('먼저 API 키를 입력하고 지도를 불러주세요'); return; }
  var addr = document.getElementById('addrInput').value.trim();
  if(!addr) { alert('주소를 입력해주세요'); return; }
  var geocoder = new kakao.maps.services.Geocoder();
  var places   = new kakao.maps.services.Places();
  // 장소명 검색 우선
  places.keywordSearch(addr, function(result, status) {
    if(status === kakao.maps.services.Status.OK && result.length > 0) {
      var p = result[0];
      centerLat = parseFloat(p.y); centerLng = parseFloat(p.x);
      document.getElementById('targetAddr').textContent = p.place_name + ' · ' + p.address_name;
      drawNearby(centerLat, centerLng);
    } else {
      // 주소 검색으로 fallback
      geocoder.addressSearch(addr, function(result2, status2) {
        if(status2 === kakao.maps.services.Status.OK) {
          centerLat = parseFloat(result2[0].y); centerLng = parseFloat(result2[0].x);
          drawNearby(centerLat, centerLng);
        } else {
          alert('주소를 찾을 수 없습니다. 더 구체적으로 입력해보세요.');
        }
      });
    }
  });
}

// ── 주변 고객 표시 ───────────────────────────────────
function drawNearby(lat, lng) {
  clearMarkers();
  kakaoMap.setCenter(new kakao.maps.LatLng(lat, lng));
  kakaoMap.setLevel(7);

  // 기준 마커
  var centerPos = new kakao.maps.LatLng(lat, lng);
  var centerMarker = new kakao.maps.Marker({
    position: centerPos,
    map: kakaoMap,
    title: '기준 위치'
  });
  var centerOverlay = new kakao.maps.CustomOverlay({
    position: centerPos,
    content: '<div style="background:rgba(13,22,40,.9);border:1px solid rgba(59,130,246,.4);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:#60A5FA;white-space:nowrap;margin-bottom:4px">'+document.getElementById('targetName').textContent+'</div>',
    yAnchor: 2.8
  });
  centerOverlay.setMap(kakaoMap);
  markers.push(centerMarker);

  // 반경 원
  var circle = new kakao.maps.Circle({
    center: centerPos,
    radius: radiusKm * 1000,
    strokeWeight: 2,
    strokeColor: '#3B82F6',
    strokeOpacity: 0.5,
    strokeStyle: 'dashed',
    fillColor: '#3B82F6',
    fillOpacity: 0.04
  });
  circle.setMap(kakaoMap);
  circles.push(circle);

  // 고객 중 좌표 있는 것만, 반경 내 필터
  var nearby = [];
  allCustomers.forEach(function(c) {
    if(!c.lat || !c.lng) return;
    var dist = getDistKm(lat, lng, parseFloat(c.lat), parseFloat(c.lng));
    if(dist <= radiusKm) nearby.push({ c:c, dist:dist });
  });
  nearby.sort(function(a,b){ return a.dist-b.dist; });

  // 결과 없으면 안내
  document.getElementById('resultCount').innerHTML = '반경 '+radiusKm+'km 내 고객 <b>'+nearby.length+'명</b> 발견';

  if(!nearby.length) {
    document.getElementById('clist').innerHTML = '<div class="empty">😊 반경 '+radiusKm+'km 내<br>등록된 고객이 없습니다</div>';
    return;
  }

  // 리스트 + 마커 렌더
  var listHtml = '';
  nearby.forEach(function(item, idx) {
    var c    = item.c;
    var dist = item.dist;
    var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
    var tagClass = c.customerType==='계약'?'tc':c.customerType==='관리'?'tm':'tw';
    var tagText  = c.customerType||'고객';
    listHtml += '<div class="ci" id="citem_'+idx+'" onclick="selectCustomer('+idx+')">'
      +'<div class="ctop"><span class="cn">'+c.name+'</span><span class="cd">'+distStr+'</span></div>'
      +'<div class="ci2">'+(c.address||'주소 미등록')+'<span class="ctag '+tagClass+'">'+tagText+'</span></div>'
      +'</div>';

    // 마커
    var pos = new kakao.maps.LatLng(parseFloat(c.lat), parseFloat(c.lng));
    var color = c.customerType==='계약'?'#10B981':c.customerType==='관리'?'#8B5CF6':'#F59E0B';
    var svgContent = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">'
      +'<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'"/>'
      +'<circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/>'
      +'</svg>';
    var markerImg = new kakao.maps.MarkerImage(
      'data:image/svg+xml;base64,'+btoa(svgContent),
      new kakao.maps.Size(28,36)
    );
    var marker = new kakao.maps.Marker({ position:pos, map:kakaoMap, image:markerImg, title:c.name });
    markers.push(marker);

    // 이름 오버레이 (클릭 가능 - 큰 클릭 영역)
    var labelEl = document.createElement('div');
    labelEl.style.cssText = 'background:rgba(13,22,40,.9);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;color:#F0F4FF;white-space:nowrap;margin-bottom:2px;cursor:pointer';
    labelEl.textContent = c.name;
    (function(customer, distance){
      function fire(e){
        if(e){ e.preventDefault(); e.stopPropagation(); }
        console.log('[NEARBY] 라벨 클릭:', customer.name);
        // 라벨 DOM 위치로 픽셀 좌표 계산
        var mapWrap = document.querySelector('.map-wrap');
        var rect = mapWrap ? mapWrap.getBoundingClientRect() : {left:0,top:0};
        var lrect = labelEl.getBoundingClientRect();
        var px = lrect.left - rect.left + lrect.width/2;
        var py = lrect.top  - rect.top  + lrect.height;
        showPopup(customer, distance, px, py);
      }
      labelEl.addEventListener('click', fire);
      labelEl.addEventListener('touchstart', fire);
    })(c, dist);
    var nameOverlay = new kakao.maps.CustomOverlay({
      position: pos,
      content: labelEl,
      yAnchor: 3.0,
      clickable: true
    });
    nameOverlay.setMap(kakaoMap);

    // 마커 클릭 이벤트 (픽셀 좌표 = 지도 컨테이너 좌표계로 변환)
    (function(customer, distance, markerEl, latLng){
      kakao.maps.event.addListener(markerEl, 'click', function() {
        console.log('[NEARBY] 마커 클릭:', customer.name);
        var proj = kakaoMap.getProjection();
        var point = proj.containerPointFromCoords(latLng);
        showPopup(customer, distance, point.x, point.y);
      });
    })(c, dist, marker, pos);
  });

  document.getElementById('clist').innerHTML = listHtml;
  window._nearbyList = nearby;

  // 리스트 항목에 클릭 이벤트 직접 등록 (onclick 속성 의존 제거)
  nearby.forEach(function(item, idx){
    var el = document.getElementById('citem_'+idx);
    if(el){
      el.style.cursor = 'pointer';
      (function(i){
        el.addEventListener('click', function(){ selectCustomer(i); });
      })(idx);
    }
  });
}

// ── 고객 ID로 찾기 ───────────────────────────────────
function findCustomerById(id) {
  for(var i=0; i<allCustomers.length; i++){
    if(allCustomers[i].id === id) return allCustomers[i];
  }
  if(window._nearbyList){
    for(var j=0; j<window._nearbyList.length; j++){
      if(window._nearbyList[j].c.id === id) return window._nearbyList[j].c;
    }
  }
  return null;
}

// ── 고객 선택 ────────────────────────────────────────
function selectCustomer(idx) {
  document.querySelectorAll('.ci').forEach(function(el){ el.classList.remove('sel'); });
  var el = document.getElementById('citem_'+idx);
  if(el) el.classList.add('sel');
  var item = window._nearbyList[idx];
  if(item) showPopup(item.c, item.dist);
}

// ── 팝업 표시 ────────────────────────────────────────
function showPopup(c, dist, pixelX, pixelY) {
  console.log('[NEARBY] showPopup 호출:', c.name);
  selectedCustomerId = c.id;
  var distStr = dist < 1 ? Math.round(dist*1000)+'m' : dist.toFixed(1)+'km';
  var tagClass = c.customerType==='계약'?'tc':c.customerType==='관리'?'tm':'tw';

  var elName = document.getElementById('popupName');
  if(elName) elName.textContent = c.name;
  var elTag = document.getElementById('popupTag');
  if(elTag){ elTag.textContent = c.customerType||'고객'; elTag.className = 'ptag '+tagClass; }
  var elAddr = document.getElementById('popupAddr');
  if(elAddr) elAddr.textContent = '📍 '+(c.address||'주소 미등록')+' · '+distStr;
  var elPhone = document.getElementById('popupPhone');
  if(elPhone) elPhone.innerHTML = c.phone ? '📞 '+c.phone : '';
  var elContact = document.getElementById('popupContact');
  if(elContact) elContact.textContent = c.lastContact ? '마지막 연락: '+c.lastContact : '';

  // 단독 길찾기 (현재 위치 → 이 고객)
  var destLat = c.lat || '', destLng = c.lng || '';
  var destName = encodeURIComponent(c.name);
  if(destLat && destLng) {
    var navUrl = 'https://map.kakao.com/link/to/'+destName+','+destLat+','+destLng;
    var nc = document.getElementById('navCar');  if(nc) nc.href = navUrl;
    var nb = document.getElementById('navBus');  if(nb) nb.href = navUrl;
    var nw = document.getElementById('navWalk'); if(nw) nw.href = navUrl;
  }

  // 출발/도착 버튼 상태 반영
  var bf = document.getElementById('btnFrom');
  var bt = document.getElementById('btnTo');
  if(bf){ bf.className = 'route-btn btn-from' + (routeFrom && routeFrom.id===c.id?' active':''); }
  if(bt){ bt.className = 'route-btn btn-to'   + (routeTo   && routeTo.id===c.id?' active':''); }

  // 고객간 길찾기 상태 표시
  updateRouteStatus();

  // 전화
  var bc = document.getElementById('btnCall');
  if(bc) bc.href = c.phone ? 'tel:'+c.phone.replace(/-/g,'') : '#';

  // 카카오톡
  var bk = document.getElementById('btnKakao');
  if(bk){
    bk.onclick = function() {
      if(typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
        Kakao.Share.sendDefault({ objectType:'text', text:'[유니스] '+c.name+' 고객님께 연락드립니다.', link:{ mobileWebUrl: window.location.href } });
      } else { alert('카카오톡 공유는 카카오 SDK 연동 후 사용 가능합니다.'); }
      return false;
    };
  }

  // 팝업 위치 — 핀 근처
  var popup = document.getElementById('mapPopup');
  if(popup){
    popup.style.display = 'block';
    popup.style.zIndex  = '9999';

    var mapWrap = document.querySelector('.map-wrap');
    var mw = mapWrap ? mapWrap.offsetWidth  : window.innerWidth;
    var mh = mapWrap ? mapWrap.offsetHeight : window.innerHeight;
    var pw = 240, ph = 380; // 팝업 예상 크기

    var px = 16, py = 60;
    if(pixelX !== undefined && pixelY !== undefined) {
      px = pixelX + 16;
      py = pixelY - ph / 2;
    }
    // 화면 밖으로 나가면 반대쪽으로
    if(px + pw > mw - 10) px = (pixelX !== undefined ? pixelX : pw) - pw - 16;
    if(py < 10)           py = 10;
    if(py + ph > mh - 10) py = mh - ph - 10;
    if(px < 10)           px = 10;

    popup.style.left = px + 'px';
    popup.style.top  = py + 'px';
    console.log('[NEARBY] 팝업 표시 완료 at', px, py);
  } else {
    console.error('[NEARBY] mapPopup 요소 없음');
  }
}

// ── 고객간 길찾기 상태 갱신 ──────────────────────────
function updateRouteStatus() {
  var rs = document.getElementById('routeStatus');
  var ri = document.getElementById('routeInfo');
  if(!rs || !ri) return;
  if(routeFrom && routeTo) {
    rs.style.display = '';
    ri.innerHTML = '<b>🚩 '+routeFrom.name+'</b> → <b>🏁 '+routeTo.name+'</b>';
    var fromName = encodeURIComponent(routeFrom.name);
    var toName   = encodeURIComponent(routeTo.name);
    var base = 'https://map.kakao.com/link/from/'+fromName+','+routeFrom.lat+','+routeFrom.lng+'/to/'+toName+','+routeTo.lat+','+routeTo.lng;
    var rc = document.getElementById('routeCar');  if(rc)  rc.href = base;
    var rb = document.getElementById('routeBus');  if(rb)  rb.href = base;
    var rw = document.getElementById('routeWalk'); if(rw)  rw.href = base;
  } else if(routeFrom || routeTo) {
    rs.style.display = '';
    ri.innerHTML = routeFrom
      ? '<b>🚩 '+routeFrom.name+'</b> 설정됨 · 도착지를 선택하세요'
      : '출발지를 선택하세요 · <b>🏁 '+routeTo.name+'</b> 설정됨';
    var rc2=document.getElementById('routeCar'); if(rc2) rc2.href='#';
    var rb2=document.getElementById('routeBus'); if(rb2) rb2.href='#';
    var rw2=document.getElementById('routeWalk'); if(rw2) rw2.href='#';
  } else {
    rs.style.display = 'none';
  }
}

function closePopup() {
  var p = document.getElementById('mapPopup');
  if(p) p.style.display = 'none';
}

function goDetail() {
  if(selectedCustomerId) {
    sessionStorage.setItem('openCustomerId', selectedCustomerId);
    window.location.href = 'customer.html';
  }
}

// ── 마커 클리어 ──────────────────────────────────────
function clearMarkers() {
  markers.forEach(function(m){ m.setMap(null); });
  circles.forEach(function(c){ c.setMap(null); });
  markers=[]; circles=[];
}

// ── 거리 계산 (Haversine) ────────────────────────────
function getDistKm(lat1,lng1,lat2,lng2) {
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
