<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일광 레이스 · UNISPACE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="unispace-192.png">
<link rel="icon" type="image/png" href="unispace-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#F7F0E4; --sand2:#EFE4D0; --shell:#FFFFFF;
  --sea:#1F8C8C; --sea2:#2AA6A0; --sea-l:#D9F0EE;
  --amber:#E2782E; --amber-l:#FCE7D6;
  --ink:#1B2A41; --ink2:#5B6B80; --ink3:#9AA7B8;
  --blue:#2F6FE4; --blue-l:#E4EDFF; --red:#E04848; --red-l:#FDE7E7; --judge:#B8860B; --judge-l:#FBF3DC;
  --line:#E4D9C4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all}
.disp{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 60px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.head .t{font-size:20px;color:var(--sea);text-decoration:none}
.head .t small{font-size:12px;color:var(--ink3);font-family:'Noto Sans KR';margin-left:6px}
.tag{font-size:11px;font-weight:900;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.blue{background:var(--blue-l);color:var(--blue)}.tag.red{background:var(--red-l);color:var(--red)}.tag.staff{background:var(--amber-l);color:var(--amber)}.tag.judge{background:var(--judge-l);color:var(--judge)}
.banner{border-radius:20px;padding:16px 18px;margin-bottom:12px;background:linear-gradient(135deg,#2AA6A0,#1F8C8C 60%,#176F72);color:#fff;position:relative;overflow:hidden}
.banner:after{content:'';position:absolute;right:-20px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.banner .k{font-size:12px;opacity:.85}
.banner .t{font-size:26px;line-height:1.15;margin-top:2px;position:relative;z-index:1}
.banner .d{position:absolute;right:16px;top:14px;font-size:22px;color:#FFE6B0}
.banner .lk{display:inline-block;margin-top:8px;font-size:12px;color:#FFE6B0;text-decoration:underline;cursor:pointer;position:relative;z-index:1}
.card{background:var(--shell);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-size:16px;cursor:pointer;font-family:'Jua','Noto Sans KR',sans-serif;color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sea{background:var(--sea);box-shadow:0 6px 16px rgba(31,140,140,.3)}
.btn.amber{background:var(--amber);box-shadow:0 6px 16px rgba(226,120,46,.3)}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line);font-family:'Noto Sans KR';font-weight:700;font-size:13px;box-shadow:none}
.btn.wide{width:100%}.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.muted{font-size:12px;color:var(--ink3)}
.team{border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid;position:relative;background:#fff}
.team.blue{border-color:var(--blue)}.team.red{border-color:var(--red)}
.team .nm{font-size:18px}.team.blue .nm{color:var(--blue)}.team.red .nm{color:var(--red)}
.team .chips{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.team .chips b{font-size:54px;line-height:1;font-family:'Jua';font-weight:400}
.team.blue .chips b{color:var(--blue)}.team.red .chips b{color:var(--red)}
.team .chips span{font-size:13px;color:var(--ink2);font-weight:700}
.coins{display:flex;gap:3px;margin:6px 0 4px;flex-wrap:wrap}
.coin{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF1C2,#F2B93C 60%,#B8791A);border:2px dashed rgba(255,255,255,.7);box-shadow:0 2px 0 #8a5a12}
.coin.base{background:radial-gradient(circle at 40% 35%,#fff,#CBD3DE 60%,#8C97A6);box-shadow:0 2px 0 #6a7482}
.calc{font-size:12px;color:var(--ink2);margin-top:2px}
.calc b{font-weight:900}
.avg{font-size:15px;font-weight:900;margin-top:8px}.avg span{color:var(--ink2);font-weight:500;font-size:12px}
.gauge{height:12px;border-radius:99px;background:var(--sand2);overflow:hidden;margin-top:8px}
.gauge i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F2B93C,var(--amber));width:0;transition:width .7s ease}
.next{font-size:13px;margin-top:6px;font-weight:700;color:var(--amber)}
.mems{margin-top:10px}
.mem{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}
.mem:first-child{border-top:none}
.mem span{color:var(--ink2)}
.mem.me b{color:var(--sea)}
.lead{position:absolute;right:14px;top:14px;background:#FFE6B0;color:#7A4E00;font-size:11px;font-weight:900;padding:2px 9px;border-radius:99px}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.ladder div{background:var(--sand);border-radius:8px;text-align:center;padding:6px 0 22px;font-size:11px;color:var(--ink2);position:relative;border:2px solid transparent}
.ladder div b{display:block;font-family:'Jua';font-weight:400;font-size:15px;color:var(--ink)}
.ladder div .who{position:absolute;left:0;right:0;bottom:4px;font-size:12px;letter-spacing:-2px}
.ladder div.b{border-color:var(--blue)}.ladder div.r{border-color:var(--red)}.ladder div.br{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--red)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;width:16px;height:16px;margin-right:4px}
.shopli{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.shopli:first-of-type{border-top:none}
.shopli .ic{font-size:24px}.shopli b{font-size:14px}.shopli .pr{color:var(--amber);font-weight:900;white-space:nowrap}
.gmbar{background:#fff;border:2px solid var(--amber);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.gmbar .t{font-size:13px;font-weight:900;color:var(--amber);margin-bottom:8px}
.seg{display:flex;background:var(--sand2);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:none;padding:9px 0;border-radius:10px;font-family:'Noto Sans KR';font-weight:800;font-size:12px;color:var(--ink3);cursor:pointer}
.seg button.on{background:var(--amber);color:#fff}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
.kv b{font-weight:900}
.tog{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:13px;gap:10px}
.tog:first-of-type{border-top:none}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--sea)}.sw.on:after{left:21px}
.sw.lockd{opacity:.6;cursor:default}
.err{background:#FFF1F1;border:1px solid #F3C4C4;color:#9B2C2C;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.err a{color:#9B2C2C}
.locked{border:2px dashed var(--line);border-radius:18px;padding:28px 16px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.7;margin-bottom:12px;background:#fff}
.locked b{color:var(--amber)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;white-space:nowrap;z-index:99;pointer-events:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(27,42,65,.75);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.ov.on{display:flex}
.md{width:100%;max-width:520px;background:var(--sand);border-radius:22px;padding:18px 12px 16px;position:relative}
.md .tt{text-align:center;font-size:26px;color:var(--sea);margin-bottom:2px}
.md .st{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:10px}
.lw{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 4px 10px;margin-bottom:10px}
#ladder{display:block;width:100%;height:auto}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rb{border-radius:14px;padding:10px 12px;border:2px solid transparent;background:#fff}
.rb.blue{border-color:var(--blue)}.rb.red{border-color:var(--red)}.rb.judge{border-color:var(--judge);grid-column:1 / span 2;background:var(--judge-l)}
.rb .tn{font-size:14px;font-family:'Jua'}.rb.blue .tn{color:var(--blue)}.rb.red .tn{color:var(--red)}.rb.judge .tn{color:var(--judge)}
.rb .tm{font-size:14px;font-weight:700;margin-top:2px;line-height:1.6}
.rb .td{font-size:12px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){.gauge i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="t disp" href="index.html">🌊 일광 레이스<small>9.18 목</small></a>
    <span class="tag" id="roleTag"></span>
  </div>
  <div id="loading" class="muted" style="text-align:center;padding:30px 0">불러오는 중…</div>
  <div id="errBox" class="err" style="display:none"></div>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<div class="ov" id="ov">
  <div class="md">
    <div class="tt disp">🎲 팀 뽑기</div>
    <div class="st" id="ladSub">매니저 9명 · 블루 4 · 레드 4 · 해변 특별심판 1</div>
    <div class="lw"><canvas id="ladder"></canvas></div>
    <div class="row" style="margin-bottom:10px">
      <button type="button" class="btn amber" id="btnRun" style="flex:1">▶ 내 이름 타기</button>
      <button type="button" class="btn ghost" id="btnSkip">결과만</button>
    </div>
    <div id="resultGrid" class="rg" style="display:none"></div>
    <button type="button" class="btn ghost wide" id="btnClose" style="margin-top:10px">닫기</button>
  </div>
</div>

<script>
var UNISPACE_GAS_URL = 'https://script.google.com/macros/s/AKfycbx3dE8zn0pkrjsklnrWP-dLUJQ_PyLfVPGd49YsX28U-Wc6ifM4TxdNBgB14b9bOyvL/exec';
var currentUser = null;
var ST = null;
var L = null;
var _animating = false;

function $(id){ return document.getElementById(id); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(function(){ t.classList.remove('on'); }, 2200); }
function man(n){ return (Math.round((n||0)/1000)/10).toFixed(1).replace(/\.0$/,'') + '만'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function coins(perf, base){ var h='<div class="coins">'; for(var i=0;i<Math.min(perf,14);i++) h+='<i class="coin"></i>'; for(var j=0;j<base;j++) h+='<i class="coin base"></i>'; return h+'</div>'; }

/* ---------- GAS ---------- */
function gasGet(params, cb){
  var qs=[]; for(var k in params){ if(params.hasOwnProperty(k)) qs.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  var url = UNISPACE_GAS_URL + '?' + qs.join('&') + '&_=' + Date.now();
  var done=false; function finish(res){ if(done) return; done=true; cb(res); }
  try { fetch(url,{method:'GET',cache:'no-store'}).then(function(r){ return r.json(); }).then(finish).catch(function(){ jsonp(url, finish); }); }
  catch(e){ jsonp(url, finish); }
}
function jsonp(url, cb){
  var name='swk_cb_'+Math.floor(Math.random()*1e9), s=document.createElement('script');
  window[name]=function(res){ cb(res); try{ delete window[name]; }catch(e){ window[name]=null; } if(s.parentNode) s.parentNode.removeChild(s); };
  s.src=url+'&callback='+name; s.onerror=function(){ cb({ok:false,msg:'서버 연결 실패'}); }; document.body.appendChild(s);
}

/* ---------- init ---------- */
function init(){
  try { currentUser = JSON.parse(localStorage.getItem('unispace_user') || 'null'); } catch(e){}
  if(!currentUser || !currentUser.id){ $('loading').style.display='none'; showErr('유니스페이스에 먼저 로그인해 주세요. <a href="index.html">로그인하러 가기</a>'); return; }
  $('btnRun').addEventListener('click', function(){ if(ST.role==='staff') runLadder(false); else rideMine(); });
  $('ladder').addEventListener('click', onLadderTap);
  $('btnSkip').addEventListener('click', function(){ runLadder(true); });
  $('btnClose').addEventListener('click', closeLadder);
  $('app').addEventListener('click', onAct);
  window.addEventListener('resize', function(){ if($('ov').classList.contains('on') && !_animating) drawLadder(null); });
  load(false);
}
function showErr(html){ $('errBox').innerHTML=html; $('errBox').style.display=''; }
function load(quiet){
  gasGet({action:'swkState', fp:currentUser.id}, function(res){
    $('loading').style.display='none';
    if(!res || !res.ok){ showErr(esc((res&&res.msg)||'불러오지 못했습니다')); return; }
    $('errBox').style.display='none';
    ST=res; L=null; render();
    if(quiet) toast('업적 기준으로 다시 계산했어요');
    maybeAutoLadder();
  });
}

/* ---------- render ---------- */
function roleTag(){
  var r=ST.role, t=$('roleTag');
  if(r==='staff'){ t.className='tag staff'; t.textContent='운영진 · '+currentUser.name; }
  else if(r==='judge'){ t.className='tag judge'; t.textContent='특별심판 · '+currentUser.name; }
  else { t.className='tag '+r; t.textContent=(r==='blue'?'블루팀':'레드팀')+' · '+currentUser.name; }
}
function render(){
  roleTag();
  $('app').innerHTML = ST.role==='staff' ? gmView() : teamView();
  setTimeout(function(){ var bars=document.querySelectorAll('.gauge i'); for(var i=0;i<bars.length;i++) bars[i].style.width=bars[i].getAttribute('data-w')+'%'; }, 40);
}
function dday(){
  var ev=new Date(2026,8,18), now=new Date();
  var dd=Math.ceil((ev.getTime()-new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime())/86400000);
  return dd>0?'D-'+dd:(dd===0?'D-DAY':'');
}
function topMember(){
  var best=null, ks=['blue','red'];
  for(var k=0;k<ks.length;k++){ var m=ST.teams[ks[k]].members; for(var i=0;i<m.length;i++) if(!best||m[i].amt>best.amt) best=m[i]; }
  return best;
}
function praise(){
  var b=ST.teams.blue, r=ST.teams.red, top=topMember();
  var topTxt = top && top.amt>0 ? '<br>'+esc(top.name)+' '+man(top.amt)+' 🔥' : '';
  var c=ST.lastChange;
  if(c && c.at && (Date.now()-new Date(c.at).getTime()) < 86400000){
    var ct=ST.teams[c.team]; if(ct && ct.chips===c.to) return esc(ct.name)+' '+c.from+'→'+c.to+'칩!'+topTxt;
  }
  if(b.chips===r.chips) return '두 팀 나란히 '+b.chips+'칩!'+topTxt;
  var lead = b.chips>r.chips?b:r;
  return esc(lead.name)+' '+lead.chips+'칩 리드!'+topTxt;
}
function teamCard(t, isLead){
  var pct = t.avg<ST.rule.start ? Math.min(100,Math.round(t.avg/ST.rule.start*100)) : Math.round(((t.avg-ST.rule.start)%ST.rule.step)/ST.rule.step*100);
  var tier = t.avg<ST.rule.start ? '30만 미만' : (Math.floor((t.avg-ST.rule.start)/ST.rule.step)*10+30)+'만 구간';
  var h='<div class="team '+t.key+'">'+(isLead?'<span class="lead">리드</span>':'');
  h+='<div class="nm disp">'+(t.key==='blue'?'🔵':'🔴')+' '+esc(t.name)+'팀</div>';
  h+='<div class="chips"><b>'+t.chips+'</b><span>칩</span></div>'+coins(t.perfChips,t.baseChips);
  h+='<div class="calc">= 실적칩 <b style="color:#B8791A">'+t.perfChips+'</b> (평균 '+man(t.avg)+' → '+tier+') + 기본칩 <b style="color:#6a7482">'+t.baseChips+'</b></div>';
  h+='<div class="avg">평균 '+man(t.avg)+' <span>· 합계 '+man(t.total)+'</span></div>';
  h+='<div class="gauge"><i data-w="'+pct+'"></i></div>';
  h+='<div class="next">다음 칩까지 팀 합계 '+man(t.toNext*t.members.length)+' (1인 '+man(t.toNext)+')</div>';
  h+='<div class="mems">';
  for(var i=0;i<t.members.length;i++){ var m=t.members[i], me=String(m.code).toUpperCase()===String(currentUser.id).toUpperCase();
    h+='<div class="mem'+(me?' me':'')+'"><b>'+esc(m.name)+(me?' (나)':'')+'</b><span>'+man(m.amt)+'</span></div>'; }
  return h+'</div></div>';
}
function ladderCard(){
  var b=ST.teams.blue, r=ST.teams.red;
  function tierIdx(avg){ return avg<ST.rule.start ? -1 : Math.floor((avg-ST.rule.start)/ST.rule.step); }
  var bi=tierIdx(b.avg), ri=tierIdx(r.avg);
  var maxI=Math.max(5,bi,ri), start=Math.max(0,maxI-5);
  var h='<div class="card" style="padding:12px 14px"><div class="disp" style="font-size:15px">실적칩 계단 <span class="muted" style="font-family:Noto Sans KR">· 팀 평균 · 10만마다 +2</span></div><div class="ladder">';
  for(var i=start;i<=start+5;i++){
    var cls=(bi===i&&ri===i)?'br':(bi===i?'b':(ri===i?'r':''));
    var who=(bi===i?'🔵':'')+(ri===i?'🔴':'');
    h+='<div class="'+cls+'"><b>'+(2+i*2)+'</b>'+(30+i*10)+'만<span class="who">'+who+'</span></div>';
  }
  h+='</div><div class="legend"><span>🔵 블루 · 🔴 레드 지금 위치</span><span><i class="coin base"></i>기본 2개는 공통</span></div></div>';
  return h;
}
var ITEMS=[{ic:'🧭',nm:'힌트 패키지',ds:'힌트 요청 +2회 · 정답 공개 1회',pr:3},{ic:'📞',nm:'대표 직통전화',ds:'막히면 대표에게 전화 1회',pr:2},{ic:'🏖️',nm:'종목 지명권',ds:'백사장 게임 후보 중 1개 지명',pr:2},{ic:'🎁',nm:'미스터리 박스',ds:'칩+2 · 힌트 무료 · 꽝 · 벌칙',pr:1}];
function previewCard(){
  var h='<div class="card" style="border:2px solid #F2B93C"><div class="disp" style="font-size:16px">🛒 9/18 칩 마켓 미리보기</div><div class="muted" style="margin-bottom:6px">칩으로 살 수 있는 것들 · 당일 11:00 오픈</div>';
  for(var i=0;i<ITEMS.length;i++){ var it=ITEMS[i]; h+='<div class="shopli"><span class="ic">'+it.ic+'</span><div style="flex:1"><b>'+it.nm+'</b><div class="muted">'+it.ds+'</div></div><span class="pr">'+it.pr+'칩</span></div>'; }
  return h+'</div>';
}
function teamView(){
  var b=ST.teams.blue, r=ST.teams.red;
  var lead = b.chips===r.chips ? '' : (b.chips>r.chips?'blue':'red');
  var h='';
  if(!ST.ladderRevealed){
    h+='<div class="locked">팀 뽑기는 <b>9월 9일 조회</b>에서!<br>결과가 나오면 여기서 바로 볼 수 있어요</div>';
  } else {
    h+='<div class="banner"><div class="k">9/1~9/17 보장월초 · 팀 평균으로 칩 적립</div><div class="t disp">'+praise()+'</div><div class="d disp">'+dday()+'</div><span class="lk" data-act="ladder">🎲 팀 뽑기 다시 보기</span></div>';
  }
  h+=teamCard(b, lead==='blue')+teamCard(r, lead==='red')+ladderCard();
  if(ST.preview) h+=previewCard();
  h+='<div class="muted" style="text-align:center;margin-top:4px"><span data-act="refresh" style="text-decoration:underline;cursor:pointer">업적 기준으로 새로고침</span></div>';
  return h;
}
function gmView(){
  var b=ST.teams.blue, r=ST.teams.red;
  var h='<div class="gmbar"><div class="t">운영진 · 전원 화면을 이 단계로</div><div class="seg"><button type="button" class="on">① 칩 획득</button><button type="button" data-act="soon">② 칩 마켓</button><button type="button" data-act="soon">③ 미션</button></div></div>';
  h+='<div class="card"><div class="disp" style="font-size:17px">🎲 팀 뽑기</div><div class="muted">'+(ST.ladderRevealed?'공개됨 · 전원이 사다리를 볼 수 있어요':'공개하면 전원 폰에 사다리 애니메이션 + 푸시')+'</div><div class="row" style="margin-top:8px">'+
     (ST.ladderRevealed?'<button type="button" class="btn sea" style="flex:1" data-act="ladder">사다리 보기</button><button type="button" class="btn ghost sm" data-act="hide">공개 취소</button>':'<button type="button" class="btn amber" style="flex:1" data-act="reveal">사다리 공개하기</button>')+'</div></div>';
  function sum(t){ var best=t.members[0]; return '<div class="team '+t.key+'" style="padding:12px 14px"><div class="nm disp">'+(t.key==='blue'?'🔵':'🔴')+' '+esc(t.name)+' · '+t.chips+'칩</div><div class="kv"><span>평균 보장월초</span><b>'+man(t.avg)+'</b></div><div class="kv"><span>다음 칩까지</span><b>팀 합계 '+man(t.toNext*t.members.length)+'</b></div><div class="kv"><span>개인 최고</span><b>'+(best?esc(best.name)+' '+man(best.amt):'-')+'</b></div></div>'; }
  h+=sum(b)+sum(r);
  var lp = ST.lastPush && ST.lastPush.at ? ST.lastPush.at.slice(5,16).replace('T',' ') : '-';
  h+='<div class="card"><div class="disp" style="font-size:15px">📣 칩 현황 푸시</div><div class="tog"><span>매일 09:30 자동 발송</span><div class="sw on lockd"></div></div><div class="tog"><span>칩 수가 바뀌면 즉시 푸시<br><span class="muted">30분마다 확인, 늘거나 줄면 자동</span></span><div class="sw on lockd"></div></div><button type="button" class="btn ghost wide" style="margin-top:8px" data-act="push">지금 보내기</button><div class="muted" style="margin-top:6px">마지막 발송 '+lp+(ST.lastPush&&ST.lastPush.body?' · '+esc(ST.lastPush.body):'')+'</div></div>';
  h+='<div class="card"><div class="disp" style="font-size:15px">🛒 칩 마켓 미리보기</div><div class="tog"><span>매니저에게 마켓 상품 미리 보여주기<br><span class="muted">구매는 잠김 · 당일 11:00 오픈 표시</span></span><div class="sw '+(ST.preview?'on':'')+'" data-act="preview"></div></div></div>';
  h+='<button type="button" class="btn ghost wide" data-act="soon">✏️ 힌트 · 사진 · 봉투 코드 설정</button>';
  h+='<div class="muted" style="text-align:center;margin-top:10px"><span data-act="refresh" style="text-decoration:underline;cursor:pointer">업적 기준으로 새로고침</span></div>';
  return h;
}

/* ---------- actions ---------- */
function onAct(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act');
  if(a==='refresh') load(true);
  if(a==='ladder') openLadder();
  if(a==='soon') toast('9/18 전에 열립니다');
  if(a==='reveal'){ if(!confirm('사다리를 공개하고 전원에게 푸시를 보낼까요?')) return; gasGet({action:'swkReveal',fp:currentUser.id,on:1}, function(res){ if(!res||!res.ok){ toast((res&&res.msg)||'실패'); return; } toast('공개했어요'); load(false); }); }
  if(a==='hide'){ if(!confirm('공개를 취소하고 다시 잠글까요?')) return; gasGet({action:'swkReveal',fp:currentUser.id,on:0}, function(res){ if(!res||!res.ok){ toast((res&&res.msg)||'실패'); return; } toast('다시 잠갔어요'); load(false); }); }
  if(a==='push'){ if(!confirm('지금 칩 현황 푸시를 보낼까요?')) return; gasGet({action:'swkPush',fp:currentUser.id}, function(res){ if(!res||!res.ok){ toast((res&&res.msg)||'실패'); return; } toast('보냈어요: '+res.body); load(false); }); }
  if(a==='preview'){ var on=!ST.preview; gasGet({action:'swkSet',fp:currentUser.id,key:'preview',value:on?'true':'false'}, function(res){ if(!res||!res.ok){ toast((res&&res.msg)||'실패'); return; } ST.preview=on; render(); toast(on?'매니저 화면에 미리보기 표시':'미리보기 숨김'); }); }
}

/* ---------- ladder ---------- */
function maybeAutoLadder(){
  if(!ST.ladderRevealed || ST.role==='staff') return;
  var key='swk_ladder_seen_'+ST.ladderSeed;
  if(localStorage.getItem(key)) return;
  localStorage.setItem(key,'1');
  openLadder();
}
function doneIdx(){ var out=[], d=ST.ladderDone||[]; for(var i=0;i<ST.ladder.length;i++){ for(var j=0;j<d.length;j++) if(String(d[j]).toUpperCase()===ST.ladder[i].code.toUpperCase()) out.push(i); } return out; }
function myIdx(){ for(var i=0;i<ST.ladder.length;i++) if(ST.ladder[i].code.toUpperCase()===String(currentUser.id).toUpperCase()) return i; return -1; }
function openLadder(){
  $('ov').classList.add('on'); $('resultGrid').style.display='none';
  var mine=myIdx(), done=doneIdx();
  var iDone=false; for(var i=0;i<done.length;i++) if(done[i]===mine) iDone=true;
  if(ST.role==='staff'){ $('btnRun').textContent='▶ 전체 타기'; $('ladSub').textContent=done.length+'/9명 탔어요 · 위 이름을 누르면 그 사람만 내려갑니다'; }
  else if(mine>=0){ $('btnRun').textContent=iDone?'↻ 내 이름 다시 타기':'▶ 내 이름 타기'; $('ladSub').textContent='위에서 내 이름을 누르거나 버튼을 눌러보세요 · '+done.length+'/9명 완료'; }
  else { $('btnRun').textContent='▶ 전체 보기'; $('ladSub').textContent=done.length+'/9명 탔어요'; }
  $('btnSkip').style.display=(ST.role==='staff'||done.length>=ST.ladder.length)?'':'none';
  if(done.length>=ST.ladder.length) showResult();
  drawLadder({idx:-1,t:0,done:done});
  startPoll();
}
var _poll=null;
function startPoll(){
  stopPoll();
  _poll=setInterval(function(){
    if(!$('ov').classList.contains('on')){ stopPoll(); return; }
    if(_animating) return;
    gasGet({action:'swkState',fp:currentUser.id}, function(res){
      if(!res||!res.ok||_animating||!$('ov').classList.contains('on')) return;
      var before=(ST.ladderDone||[]).length; ST.ladderDone=res.ladderDone||[];
      if(ST.ladderDone.length!==before){ var d=doneIdx(); drawLadder({idx:-1,t:0,done:d}); $('ladSub').textContent=d.length+'/9명 완료'; if(d.length>=ST.ladder.length){ $('btnSkip').style.display=''; showResult(); } }
    });
  }, 8000);
}
function stopPoll(){ if(_poll){ clearInterval(_poll); _poll=null; } }
function onLadderTap(e){
  if(_animating||!L) return;
  var cv=$('ladder'), rect=cv.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
  if(y>60) return;
  var W=rect.width, padX=22, gap=(W-padX*2)/(L.n-1), col=Math.round((x-padX)/gap);
  if(col<0||col>=L.n) return;
  if(ST.role!=='staff' && col!==myIdx()){ toast('본인 이름만 탈 수 있어요'); return; }
  rideOne(col);
}
function rideMine(){ var m=myIdx(); if(m<0){ runLadder(true); return; } rideOne(m); }
function rideOne(idx){
  if(_animating) return; if(!L) buildLadder();
  var code=ST.ladder[idx].code;
  gasGet({action:'swkTap',fp:currentUser.id,code:code}, function(res){ if(res&&res.ok) ST.ladderDone=res.ladderDone; });
  var base=doneIdx(); var others=[]; for(var i=0;i<base.length;i++) if(base[i]!==idx) others.push(base[i]);
  _animating=true; $('btnRun').disabled=true; $('btnSkip').disabled=true;
  var start=null, dur=1800;
  function frame(ts){ if(!start) start=ts; var t=Math.min(1,(ts-start)/dur); drawLadder({idx:idx,t:t,done:others});
    if(t<1){ requestAnimationFrame(frame); return; }
    others.push(idx); drawLadder({idx:-1,t:0,done:others});
    _animating=false; $('btnRun').disabled=false; $('btnSkip').disabled=false;
    var role=ST.ladder[idx].result; toast(ST.ladder[idx].name+' → '+roleName(role)+(role==='judge'?'!':'팀!'));
    if(!ST.ladderDone) ST.ladderDone=[]; var has=false; for(var k=0;k<ST.ladderDone.length;k++) if(String(ST.ladderDone[k]).toUpperCase()===ST.ladder[idx].code.toUpperCase()) has=true; if(!has) ST.ladderDone.push(ST.ladder[idx].code);
    if(ST.role!=='staff') $('btnRun').textContent='↻ 내 이름 다시 타기';
    $('ladSub').textContent=doneIdx().length+'/9명 완료';
    if(doneIdx().length>=ST.ladder.length) showResult(); }
  requestAnimationFrame(frame);
}
function closeLadder(){ $('ov').classList.remove('on'); stopPoll(); }
function rng(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; var t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function buildLadder(){
  var n=ST.ladder.length, rows=16, r=rng(ST.ladderSeed||1), rungs=[];
  for(var y=0;y<rows;y++){ rungs.push([]); for(var x=0;x<n-1;x++){ var left=x>0&&rungs[y][x-1]; rungs[y].push(!left && r()<0.42); } }
  var paths=[];
  for(var c=0;c<n;c++){ var col=c, pts=[[col,-1]];
    for(var yy=0;yy<rows;yy++){ pts.push([col,yy]); if(col<n-1&&rungs[yy][col]){ col++; pts.push([col,yy]); } else if(col>0&&rungs[yy][col-1]){ col--; pts.push([col,yy]); } }
    pts.push([col,rows]); paths.push({from:c,to:col,pts:pts}); }
  var bottom=[]; for(var i=0;i<n;i++) bottom.push(null);
  for(var p=0;p<paths.length;p++) bottom[paths[p].to]=ST.ladder[paths[p].from].result;
  L={n:n,rows:rows,rungs:rungs,paths:paths,bottom:bottom};
}
function roleColor(role){ return role==='blue'?'#2F6FE4':(role==='red'?'#E04848':'#B8860B'); }
function roleName(role){ return role==='blue'?'블루':(role==='red'?'레드':'심판'); }
function drawLadder(progress){
  if(!L) buildLadder();
  var cv=$('ladder'), W=Math.max(300, cv.parentNode.clientWidth-8), H=380, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  var padX=22, top=46, bot=H-40, gap=(W-padX*2)/(L.n-1), rowH=(bot-top)/(L.rows+1);
  function X(c){ return padX+c*gap; } function Y(r){ return top+(r+1)*rowH; }
  ctx.font='700 11px "Noto Sans KR", sans-serif'; ctx.textAlign='center';
  ctx.strokeStyle='#E4D9C4'; ctx.lineWidth=2;
  for(var c=0;c<L.n;c++){ ctx.beginPath(); ctx.moveTo(X(c),top); ctx.lineTo(X(c),bot); ctx.stroke(); }
  for(var y=0;y<L.rows;y++) for(var x=0;x<L.n-1;x++) if(L.rungs[y][x]){ ctx.beginPath(); ctx.moveTo(X(x),Y(y)); ctx.lineTo(X(x+1),Y(y)); ctx.stroke(); }
  for(var i=0;i<L.n;i++){ ctx.fillStyle='#1B2A41'; ctx.fillText(ST.ladder[i].name, X(i), top-(i%2?24:8)); }
  var done=progress?progress.done:[];
  for(var d=0;d<done.length;d++) strokePath(ctx,done[d],1,X,Y,top,bot);
  if(progress&&progress.idx>=0&&progress.t>0) strokePath(ctx,progress.idx,progress.t,X,Y,top,bot);
  var reached={}; for(var q=0;q<done.length;q++) reached[L.paths[done[q]].to]=true;
  for(var b=0;b<L.n;b++){ var role=L.bottom[b], show=reached[b]||(progress&&progress.showAll);
    ctx.beginPath(); ctx.arc(X(b),bot+16,13,0,Math.PI*2); ctx.fillStyle=show?roleColor(role):'#F7F0E4'; ctx.fill();
    ctx.strokeStyle=show?roleColor(role):'#E4D9C4'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle=show?'#fff':'#9AA7B8'; ctx.font='900 10px "Noto Sans KR", sans-serif'; ctx.fillText(show?roleName(role):'?', X(b), bot+20); }
}
function strokePath(ctx,idx,t,X,Y,top,bot){
  var p=L.paths[idx], pts=p.pts, role=ST.ladder[p.from].result;
  ctx.strokeStyle=(t>=1)?roleColor(role):'#1B2A41'; ctx.lineWidth=3.5; ctx.lineCap='round'; ctx.lineJoin='round';
  var segs=pts.length-1, upto=segs*t;
  function px(pt){ return X(pt[0]); } function py(pt){ return pt[1]<0?top:(pt[1]>=L.rows?bot:Y(pt[1])); }
  ctx.beginPath(); ctx.moveTo(px(pts[0]),py(pts[0]));
  for(var s=0;s<segs;s++){ var a=pts[s], b=pts[s+1]; if(s+1<=upto) ctx.lineTo(px(b),py(b)); else { var f=Math.max(0,upto-s); ctx.lineTo(px(a)+(px(b)-px(a))*f, py(a)+(py(b)-py(a))*f); break; } }
  ctx.stroke();
}
function runLadder(skip){
  if(_animating) return; if(!L) buildLadder();
  var prm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(skip||prm){ var all=[]; for(var i=0;i<L.n;i++) all.push(i); drawLadder({idx:-1,t:0,done:all,showAll:true}); showResult(); return; }
  _animating=true; $('btnRun').disabled=true; $('btnSkip').disabled=true;
  var done=[], idx=0, start=null, dur=1000;
  function frame(ts){ if(!start) start=ts; var t=Math.min(1,(ts-start)/dur); drawLadder({idx:idx,t:t,done:done});
    if(t<1){ requestAnimationFrame(frame); return; }
    done.push(idx); idx++; start=null;
    if(idx<L.n){ setTimeout(function(){ requestAnimationFrame(frame); },220); }
    else { drawLadder({idx:-1,t:0,done:done,showAll:true}); _animating=false; $('btnRun').disabled=false; $('btnSkip').disabled=false; $('btnRun').textContent='↻ 다시 보기'; showResult(); } }
  requestAnimationFrame(frame);
}
function showResult(){
  var by={blue:[],red:[],judge:[]};
  for(var i=0;i<ST.ladder.length;i++){ var r=ST.ladder[i].result; if(by[r]) by[r].push(esc(ST.ladder[i].name)); }
  var h='<div class="rb blue"><div class="tn">🔵 블루팀</div><div class="tm">'+by.blue.join(' · ')+'</div></div>';
  h+='<div class="rb red"><div class="tn">🔴 레드팀</div><div class="tm">'+by.red.join(' · ')+'</div></div>';
  h+='<div class="rb judge"><div class="tn">⚖️ 해변 특별심판</div><div class="tm">'+by.judge.join(' · ')+'</div><div class="td">백사장 게임 심판 · 요리 심사표 1장 · 미스터리 박스 뽑기</div></div>';
  $('resultGrid').innerHTML=h; $('resultGrid').style.display='';
}
document.addEventListener('DOMContentLoaded', init);
</script>
