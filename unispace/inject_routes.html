<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>주간 동선 더미 주입</title>
<style>
body{font-family:'Noto Sans KR',sans-serif;background:#080E1C;color:#F0F4FF;
display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
.box{background:#0D1628;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px;text-align:center;max-width:500px;width:100%;}
.title{font-size:18px;font-weight:800;margin-bottom:8px;color:#E8C97A;}
.sub{font-size:13px;color:#8B98B8;margin-bottom:16px;line-height:1.7;}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px;}
.tag{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:700;}
.t-c{background:rgba(59,130,246,.12);color:#60A5FA;}
.t-m{background:rgba(139,92,246,.12);color:#A78BFA;}
.t-g{background:rgba(16,185,129,.12);color:#34D399;}
.t-w{background:rgba(244,163,38,.12);color:#FCD34D;}
.btn{padding:13px 28px;border:none;border-radius:12px;
background:linear-gradient(135deg,#E8C97A,#C9A84C);color:#080E1C;
font-size:14px;font-weight:800;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin:4px;}
.btn2{background:rgba(255,255,255,.06);color:#8B98B8;border:1px solid rgba(255,255,255,.14);}
.done{color:#34D399;font-size:14px;font-weight:700;margin-top:14px;}
.warn{color:#FCD34D;font-size:12px;margin-top:10px;line-height:1.6;}
.note{font-size:11px;color:#8B98B8;margin-top:14px;line-height:1.8;text-align:left;background:rgba(255,255,255,.03);border-radius:10px;padding:12px 14px;}
.note b{color:#E8C97A;}
.miss{font-size:11px;color:#FCA5A5;margin-top:8px;}
</style></head>
<body>
<div class="box">
  <div class="title">🗺️ 주간 동선 더미</div>
  <div class="sub">이번 주(월~금) 알파지점 FP 5명<br>FP별 하루 2~3곳 동선 · 좌표 자동 매칭</div>
  <div class="tags">
    <span class="tag t-c">활동 약 32건</span>
    <span class="tag t-g">청약/PT 금액 포함</span>
    <span class="tag t-m">지점장/헬퍼 지원요청</span>
    <span class="tag t-w">권역별 동선 구성</span>
  </div>
  <button class="btn" onclick="inject()">기존 활동에 추가</button>
  <button class="btn btn2" onclick="replaceAll()">전체 교체</button>
  <div class="warn">⚠️ 먼저 '부산 더미 고객 30명'을 주입해야<br>좌표가 매칭됩니다 (BSN001~030)</div>
  <div class="note">
    <b>전소영</b>(지점장) 해운대권 · <b>김려원</b> 센텀/수영권<br>
    <b>김명옥</b> 동래권 · <b>김유경</b> 서면권 · <b>강현주</b> 연제/금정권<br>
    ※ 활동의 미팅장소 좌표는 고객 등록좌표에서 가져옵니다
  </div>
  <div id="result"></div>
</div>
<script>
// 이번 주 월요일 구하기
function weekDates(){
  var now=new Date(); now.setHours(0,0,0,0);
  var dow=now.getDay();
  var mon=new Date(now); mon.setDate(now.getDate()-(dow===0?6:dow-1));
  var arr=[];
  for(var i=0;i<5;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  return arr; // [월,화,수,목,금]
}

function getCustomers(){
  var arr=[]; try{ arr=JSON.parse(localStorage.getItem('unispace_customers')||'[]'); }catch(e){}
  if(!Array.isArray(arr)) arr=[];
  return arr;
}

// FP 정의 (실제 사번)
var FPS={
  jso:{ id:'H2502969', name:'전소영', branch:'알파지점' },
  kry:{ id:'H2502980', name:'김려원', branch:'알파지점' },
  kmo:{ id:'H2502972', name:'김명옥', branch:'알파지점' },
  kyk:{ id:'H2503207', name:'김유경', branch:'알파지점' },
  khj:{ id:'H2502976', name:'강현주', branch:'알파지점' }
};

// 동선 plan: FP별, 요일index(0~4), 고객명 배열 + 옵션
// 고객명은 부산30 더미와 일치해야 좌표 매칭됨
function plan(){
  return [
    // 전소영(지점장) - 해운대권 (월/수)
    { fp:'jso', day:0, stops:[
      { c:'김서연', t:'10:00', type:'2차', status:'진행중' },
      { c:'박지민', t:'11:30', type:'1차', status:'진행중', support:'지점장', rs:'11:00', re:'12:30' },
      { c:'한소희', t:'14:00', type:'관리', status:'완료' }
    ]},
    { fp:'jso', day:2, stops:[
      { c:'윤재호', t:'10:30', type:'청약', status:'완료', cc:'교보생명', ca:'35만원' },
      { c:'강민서', t:'13:00', type:'2차', status:'진행중' }
    ]},
    { fp:'jso', day:4, stops:[
      { c:'최은지', t:'09:30', type:'1차', status:'진행중' },
      { c:'김서연', t:'11:00', type:'3차', status:'진행중', support:'헬퍼', rs:'10:30' }
    ]},

    // 김려원 - 센텀/수영권 (월/화/목)
    { fp:'kry', day:0, stops:[
      { c:'이준호', t:'10:00', type:'1차', status:'진행중' },
      { c:'송하은', t:'12:00', type:'2차', status:'진행중' },
      { c:'배수진', t:'14:30', type:'관리', status:'완료' }
    ]},
    { fp:'kry', day:1, stops:[
      { c:'신예준', t:'11:00', type:'PT', status:'진행중', cc:'한화생명', ca:'20만원' },
      { c:'송하은', t:'13:30', type:'청약', status:'완료', cc:'한화생명', ca:'45만원' }
    ]},
    { fp:'kry', day:3, stops:[
      { c:'임도현', t:'10:00', type:'2차', status:'진행중', support:'지점장', rs:'09:30', re:'10:30' },
      { c:'배수진', t:'13:00', type:'1차', status:'진행중' }
    ]},

    // 김명옥 - 동래권 (화/목)
    { fp:'kmo', day:1, stops:[
      { c:'장미경', t:'10:30', type:'2차', status:'진행중' },
      { c:'권나라', t:'13:00', type:'1차', status:'진행중' },
      { c:'문채원', t:'15:00', type:'관리', status:'완료' }
    ]},
    { fp:'kmo', day:3, stops:[
      { c:'장미경', t:'11:00', type:'청약', status:'완료', cc:'삼성생명', ca:'30만원' },
      { c:'권나라', t:'14:00', type:'2차', status:'진행중', support:'헬퍼', rs:'13:30' }
    ]},

    // 김유경 - 서면권 (월/수/금)
    { fp:'kyk', day:0, stops:[
      { c:'조현우', t:'10:00', type:'2차', status:'진행중', support:'지점장', rs:'09:30', re:'11:00' },
      { c:'김다은', t:'13:00', type:'1차', status:'진행중' }
    ]},
    { fp:'kyk', day:2, stops:[
      { c:'황지우', t:'11:00', type:'청약', status:'완료', cc:'KB손해보험', ca:'25만원' },
      { c:'서지안', t:'14:00', type:'관리', status:'진행중' }
    ]},
    { fp:'kyk', day:4, stops:[
      { c:'조현우', t:'10:30', type:'3차', status:'진행중' },
      { c:'김다은', t:'13:30', type:'2차', status:'진행중' }
    ]},

    // 강현주 - 연제/금정권 (화/금)
    { fp:'khj', day:1, stops:[
      { c:'유진아', t:'10:00', type:'2차', status:'진행중' },
      { c:'백서윤', t:'12:30', type:'1차', status:'진행중' },
      { c:'노태민', t:'15:00', type:'관리', status:'완료' }
    ]},
    { fp:'khj', day:4, stops:[
      { c:'추예린', t:'10:30', type:'PT', status:'진행중', cc:'한화생명', ca:'15만원' },
      { c:'유진아', t:'13:00', type:'청약', status:'완료', cc:'교보생명', ca:'40만원' }
    ]}
  ];
}

function buildActivities(){
  var customers=getCustomers();
  var byName={};
  customers.forEach(function(c){ if(c&&c.name) byName[c.name]=c; });
  var wd=weekDates();
  var P=plan();
  var out={}; var missing={}; var seq=0;
  P.forEach(function(grp){
    var fp=FPS[grp.fp];
    var dateStr=wd[grp.day];
    grp.stops.forEach(function(s){
      var cust=byName[s.c];
      var lat='', lng='', addr=s.c;
      if(cust){ lat=cust.lat||''; lng=cust.lng||''; addr=cust.address||s.c; }
      else { missing[s.c]=true; }
      seq++;
      var id='act_route_'+dateStr.replace(/-/g,'')+'_'+seq;
      out[id]={
        id:id, fpId:fp.id, fpName:fp.name, branch:fp.branch,
        date:dateStr, time:s.t,
        place:addr, placeAddr:addr, lat:lat, lng:lng,
        customerName:s.c,
        type:s.type||'1차', status:s.status||'진행중',
        helper:'', support:s.support||'',
        supportReqTime:s.rs||'', supportReqEndTime:s.re||'',
        nextDate:'', nextTime:'', nextPlace:'',
        note:'',
        chungyakCompany:(s.type==='청약'||s.type==='PT')?(s.cc||''):'',
        chungyakAmount:(s.type==='청약'||s.type==='PT')?(s.ca||''):'',
        parentId:'', createdAt:new Date().toISOString()
      };
    });
  });
  return { acts:out, missing:Object.keys(missing) };
}

function inject(){
  var built=buildActivities();
  var db={}; try{ db=JSON.parse(localStorage.getItem('unispace_activities')||'{}'); }catch(e){}
  if(typeof db!=='object'||!db) db={};
  var added=0;
  Object.keys(built.acts).forEach(function(k){ if(!db[k]){ db[k]=built.acts[k]; added++; } });
  localStorage.setItem('unispace_activities', JSON.stringify(db));
  finish(added+'건 추가 완료 (전체 '+Object.keys(db).length+'건)', built.missing);
}

function replaceAll(){
  if(!confirm('기존 활동을 모두 지우고 주간 동선 더미로 교체합니다.\n계속할까요?')) return;
  var built=buildActivities();
  localStorage.setItem('unispace_activities', JSON.stringify(built.acts));
  finish('전체 교체 완료 ('+Object.keys(built.acts).length+'건)', built.missing);
}

function finish(msg, missing){
  var extra='';
  if(missing && missing.length) extra='<div class="miss">⚠️ 좌표 매칭 실패(고객 미존재): '+missing.join(', ')+'<br>부산 더미 고객을 먼저 주입하세요</div>';
  document.getElementById('result').innerHTML='<div class="done">✅ '+msg+'</div>'+extra+'<div style="font-size:11px;color:#8B98B8;margin-top:8px">3초 후 메인으로 이동</div>';
  setTimeout(function(){ window.location.href='index.html'; }, 3500);
}
</script>
</body></html>
