<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분야별 준비 지도 · 부산 여성 일자리박람회</title>
<meta name="description" content="16개 분야를 어떻게 준비하는지 한 장에 담았어요. 준비 순서, 드는 돈, 신청 방법과 전화번호, 소득, 미리 생각할 점까지.">
<meta property="og:type" content="website">
<meta property="og:title" content="분야별 준비 지도 · 부산 여성 일자리박람회">
<meta property="og:description" content="준비 순서 · 드는 돈 · 신청 방법과 전화번호 · 소득 · 미리 생각할 점을 한 장에 담았어요.">
<meta property="og:image" content="https://unice-vip.co.kr/unispace/jobfair/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="600">
<meta name="theme-color" content="#6d1740">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--wine-950:#33081e;--wine-900:#450c29;--wine-800:#58113a;--wine-700:#6d1740;--wine-600:#842050;--wine-500:#9e2f62;--wine-400:#c35a86;--wine-200:#ecc6d5;--wine-100:#f7e4ec;--wine-50:#fcf2f6;
--gold-700:#9a6510;--gold-600:#b97d1c;--gold-500:#d39a2a;--gold-400:#e9b84d;--gold-300:#f3d184;--gold-100:#fbecc7;--gold-50:#fff8e9;
--cream:#fdf8f4;--line:#f0e0d8;--line-2:#e5cfc5;--ink:#24131b;--ink-2:#4b3640;--mute:#7c6570;--ok:#2c8a5a}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:#f4ece7;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
sup{color:var(--gold-600);font-weight:800;font-size:.7em;line-height:0}

/* 맨 위 줄 */
.bar{position:sticky;top:0;z-index:30;background:rgba(253,248,244,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar .bk{display:none;align-items:center;gap:4px;height:42px;padding:0 14px 0 9px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:15px;color:var(--ink-2);white-space:nowrap}
.app .bar .bk{display:inline-flex}
.bar .tt{min-width:0;flex:1}
.bar .tt b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tt span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ab{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff;font-weight:700;font-size:15px;color:var(--wine-700);white-space:nowrap}
.bar .ab .ic{font-size:18px}
.bar .ab.kk{background:#fee500;border-color:#f2d800;color:#3a1d1d}

/* 분야 고르기 */
.pick{max-width:1240px;margin:0 auto;padding:16px 20px 0}
.pick h1{font-size:15px;font-weight:700;color:var(--mute);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pick h1 em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--gold-700);background:var(--gold-50);border:1px solid var(--gold-100);border-radius:99px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px 0 11px;border-radius:99px;border:1.5px solid var(--line-2);background:#fff;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.chip .ic{font-size:18px;color:var(--wine-600)}
.chip.on{background:var(--wine-700);border-color:var(--wine-700);color:#fff}.chip.on .ic{color:#fff}
.chip i{font-style:normal;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;background:var(--gold-100);color:var(--gold-700);margin-left:1px}
.chip i.rq{background:#dff1e7;color:var(--ok)}
.chip.on i{background:rgba(255,255,255,.22);color:#fff}

/* 한 장 */
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 40px}
.scr{background:#fff;border-radius:24px;box-shadow:0 2px 6px rgba(51,8,30,.05),0 24px 50px -22px rgba(51,8,30,.28);border:1px solid var(--line);overflow:hidden}
.ib{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#8a2254,#58113a);color:#fff;display:grid;place-items:center;font-size:23px;flex:none}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 1px 2px rgba(51,8,30,.04)}
.mh{display:flex;align-items:center;gap:16px;padding:24px 30px;background:linear-gradient(135deg,#fcf2f6,#fff8e9);border-bottom:1px solid var(--line)}
.mh .ib{width:60px;height:60px;border-radius:18px;font-size:30px}
.mh h2{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.3}.mh p{font-size:16px;color:var(--ink-2);margin-top:3px}
.body{padding:24px 30px 28px}
.cert{display:flex;align-items:center;gap:12px;border-radius:16px;padding:13px 17px;margin-bottom:12px;border:1.5px solid}
.cert .ct2{font-size:14px;font-weight:800;color:#fff;border-radius:99px;padding:5px 14px;white-space:nowrap}
.cert b{font-size:17px;white-space:nowrap}.cert .cd{font-size:14.5px;color:var(--ink-2)}
.cert.cn{background:var(--wine-50);border-color:var(--wine-200)}.cert.cn .ct2{background:var(--wine-700)}
.cert.cp{background:var(--gold-50);border-color:var(--gold-300)}.cert.cp .ct2{background:var(--gold-600)}
.cert.ch{background:#eef4f8;border-color:#cfdfea}.cert.ch .ct2{background:#3f6b8a}
.cert.cx{background:#f6f1ee;border-color:var(--line-2)}.cert.cx .ct2{background:#8d7a82}
.key{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.k{border-radius:18px;padding:16px 18px;background:var(--cream);border:1px solid var(--line);min-width:0}
.k em{font-style:normal;font-size:14px;font-weight:700;color:var(--gold-700);display:flex;gap:6px;align-items:center}
.k b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:5px;color:var(--wine-800);line-height:1.3}.k b small{font-size:15px;font-weight:700}
.k span{font-size:14px;color:var(--mute);display:block;margin-top:2px}
.sec{margin-top:24px}
h3{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
h3 i{font-style:normal;width:29px;height:29px;border-radius:10px;background:var(--wine-700);color:#fff;font-size:15px;display:grid;place-items:center;flex:none}
h3 small{font-size:14.5px;font-weight:500;color:var(--mute)}
.road{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.road:before{content:"";position:absolute;left:8%;right:8%;top:21px;height:3px;background:linear-gradient(90deg,var(--gold-300),var(--wine-400))}
.st{text-align:center;padding:0 7px;position:relative;min-width:0}
.st>i{font-style:normal;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--wine-600);color:var(--wine-700);font-weight:800;font-size:18px;display:grid;place-items:center;margin:0 auto 10px}
.st b{font-size:16px;display:block;line-height:1.35}
.st u{text-decoration:none;display:inline-block;font-size:12.5px;font-weight:700;color:var(--gold-700);background:var(--gold-50);border:1px solid var(--gold-100);border-radius:99px;padding:2px 10px;margin:5px 0}
.st u.no{visibility:hidden}
.st span{font-size:13.5px;color:var(--ink-2);display:block;line-height:1.5}
.two{display:grid;grid-template-columns:1.08fr 1fr;gap:18px;align-items:start}
.two>div{min-width:0}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:9px 0;border-bottom:1px dashed var(--line-2);vertical-align:top}
td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:12px}
td small{display:block;font-size:13px;color:var(--mute);font-weight:400}
tr.sum td{border-bottom:0;padding-top:13px;font-size:16.5px;font-weight:800;color:var(--wine-800)}
tr.sum td:last-child{white-space:normal}
tr.plus td:last-child{color:var(--ok)}
.how{counter-reset:h;display:grid;gap:10px}
.how div{display:flex;gap:11px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.how div:before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--gold-400);color:#4a2c00;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none;margin-top:1px}
.how b{color:var(--ink)}
.tel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tel a{display:block;text-decoration:none;background:var(--wine-50);border-radius:13px;padding:11px 14px;min-width:0}
.tel em{font-style:normal;font-size:13px;color:var(--mute);display:block}
.tel b{font-size:19px;color:var(--wine-700);display:flex;gap:7px;align-items:center}
.tel span{font-size:12.5px;color:var(--mute);display:block}
.pay b{font-size:28px;font-weight:800;color:var(--wine-800);letter-spacing:-.02em;line-height:1.3;display:block}
.dist{display:flex;height:14px;border-radius:9px;overflow:hidden;margin:14px 0 8px}.dist i{display:block}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.lg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.p{font-size:15px;color:var(--ink-2);margin-top:10px;line-height:1.6}
.p.s{margin-top:2px;color:var(--mute);font-size:14px}
.ws{display:grid;gap:10px}
.w{display:flex;gap:13px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 17px}
.w .ic{font-size:21px;color:var(--gold-600);margin-top:2px}.w b{font-size:16px;display:block}
.w span{font-size:14.5px;color:var(--ink-2);line-height:1.55;display:block;margin-top:2px}
.ment{background:linear-gradient(135deg,#58113a,#33081e);color:#fff;border-radius:18px;padding:20px 24px;display:flex;align-items:center;gap:16px;margin-top:24px}
.ment .ib{background:rgba(255,255,255,.14)}
.ment .mt{min-width:0;flex:1}.ment .mt b{font-size:19px;display:block}.ment .mt span{font-size:14.5px;color:#ecc6d5;display:block}
.ment button{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:52px;padding:0 20px;border-radius:14px;border:0;font-weight:800;font-size:16.5px;background:linear-gradient(135deg,#f6d98d,#e2aa3f);color:#3b2200;white-space:nowrap}
.ment button.done{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.ment button:disabled{opacity:.6}
.src{font-size:13px;color:var(--mute);margin-top:16px;line-height:1.6}
.ph{display:none}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(36,19,27,.92);color:#fff;font-size:15px;font-weight:600;border-radius:99px;padding:11px 20px;z-index:99;max-width:90vw;text-align:center}

@media screen and (max-width:900px){
  .two{grid-template-columns:1fr}
  .key{grid-template-columns:1fr 1fr}
  .road{grid-auto-flow:row;gap:0}
  .road:before{left:21px;right:auto;top:22px;bottom:30px;width:3px;height:auto;background:linear-gradient(180deg,var(--gold-300),var(--wine-400))}
  .st{text-align:left;padding:0 0 16px 60px;min-height:52px}.st:last-child{padding-bottom:0}
  .st>i{position:absolute;left:0;top:0;margin:0}
  .st b{display:inline;font-size:16.5px}.st u{margin:0 0 0 6px;vertical-align:1px}.st u.no{display:none}
  .st span{font-size:14.5px;margin-top:2px}
  .cert{flex-wrap:wrap;gap:6px 10px}.cert b{white-space:normal}.cert .cd{flex-basis:100%}
}
@media screen and (max-width:640px){
  .bar-in{padding-left:12px;padding-right:12px;gap:7px}
  .bar .bk{padding:0 11px 0 6px}
  .bar .tt span{display:none}.bar .tt b{font-size:16px}
  .bar .ab{padding:0 11px;font-size:14px}.bar .ab.pr span{display:none}
  .pick{padding:12px 0 0}.pick h1{padding:0 14px;font-size:14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
  .chip{height:40px;font-size:14.5px}
  .wrap{padding:10px 10px 30px}
  .scr{border-radius:20px}
  .mh{padding:18px 16px;gap:12px;align-items:flex-start}.mh .ib{width:48px;height:48px;border-radius:15px;font-size:24px}
  .mh h2{font-size:21px}.mh p{font-size:14.5px}
  .body{padding:16px 14px 20px}
  .key{gap:8px}.k{padding:13px 14px;border-radius:15px}.k b{font-size:20px}.k b small{font-size:13.5px}.k em{font-size:13px}.k span{font-size:13px}
  h3{font-size:18.5px}
  .card{padding:16px 15px;border-radius:16px}
  .tel{grid-template-columns:1fr}
  .pay b{font-size:24px}
  .ment{flex-wrap:wrap;padding:18px 16px}.ment .ib{display:none}.ment .mt{flex-basis:100%}.ment button{width:100%}
}
@media print{
  @page{size:A4;margin:9mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.pick,.ment button,.toast{display:none!important}
  .wrap{max-width:none;padding:0;width:1240px;zoom:.565}
  .body{padding:18px 26px 20px}.sec{margin-top:16px}.mh{padding:18px 26px}
  .scr{box-shadow:none;border-radius:18px}
  .ph{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--mute);padding:0 4px 10px}
  .card,.w,.k,.cert,.st,.ment{break-inside:avoid}
  .two{grid-template-columns:1.08fr 1fr!important}.key{grid-template-columns:repeat(4,1fr)!important}
  .ment{margin-top:16px}
}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <button type="button" class="bk" id="bk"><svg class="ic" style="font-size:20px"><use href="#i-chevron-left"/></svg>닫기</button>
  <div class="tt"><b>분야별 준비 지도</b><span>부산 여성 일자리박람회 · 16개 분야</span></div>
  <button type="button" class="ab pr" id="pr"><svg class="ic" viewBox="0 0 24 24"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg><span>인쇄</span></button>
  <button type="button" class="ab kk" id="sh"><svg class="ic"><use href="#i-message-circle"/></svg><span id="shTx">보내기</span></button>
</div></div>
<div class="pick"><h1>분야를 눌러 보세요<em id="pkNote" hidden>신청 = 멘토링 신청하신 분야</em></h1><div class="chips" id="chips"></div></div>
<div class="wrap"><div class="ph"><span>부산 여성 일자리박람회 · 분야별 준비 지도</span><span>여성취업센터</span></div><div class="scr" id="sheet"></div></div>
<script src="jobfair/jf-icons.js?v=349"></script>
<script src="jobfair/map-data.js?v=349"></script>
<script>
(function(){
  var D = window.JF_MAP || [], Q = new URLSearchParams(location.search);
  var APP = Q.get('app') === '1' && window.parent !== window;
  function list(k){ return String(Q.get(k) || '').split(',').filter(Boolean); }
  var picks = list('pick'), req = list('req'), cur = Q.get('f') || '', busy = false, CAN = APP && Q.get('id') === '1';
  if (!D.some(function(f){ return f.key === cur; })) cur = picks[0] || (D[0] && D[0].key) || '';
  if (APP) document.documentElement.classList.add('app');
  function E(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function S(s){ return String(s == null ? '' : s).replace(/＊/g, '<sup>＊</sup>'); }   // 내용은 우리가 쓴 글 (굵은 글씨 태그 포함)
  function ic(n){ return '<svg class="ic"><use href="#i-' + n + '"/></svg>'; }
  function get(k){ for (var i = 0; i < D.length; i++) if (D[i].key === k) return D[i]; return null; }
  function ttl(f){ return f.title || f.key; }
  function toast(t){ var o = document.querySelector('.toast'); if (o) o.remove(); var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2600); }
  var CL = { n:'국가자격', p:'민간자격', x:'자격증 없이 시작' };

  function chips(){
    function rk(f){ var i = picks.indexOf(f.key); return i < 0 ? 99 : i; }
    var order = D.slice().sort(function(a, b){ return rk(a) - rk(b); });
    document.getElementById('chips').innerHTML = order.map(function(f){
      var tg = req.indexOf(f.key) >= 0 ? '<i class="rq">멘토링 신청함</i>' : picks.indexOf(f.key) >= 0 ? '<i>신청</i>' : '';
      return '<button type="button" class="chip' + (f.key === cur ? ' on' : '') + '" data-k="' + E(f.key) + '">' + ic(f.icon) + E(ttl(f)) + tg + '</button>'; }).join('');
    document.getElementById('pkNote').hidden = !picks.length;
    var on = document.querySelector('.chip.on'), bx = document.getElementById('chips'); if (on && bx.scrollWidth > bx.clientWidth) bx.scrollLeft = Math.max(0, on.offsetLeft - bx.offsetLeft - (bx.clientWidth - on.offsetWidth) / 2);
  }
  function sheet(){
    var f = get(cur); if (!f) { document.getElementById('sheet').innerHTML = '<div class="body">내용을 불러오지 못했어요.</div>'; return; }
    var m = f.money, h = f.how, p = f.pay, c = f.cert, hr = f.hours, o = '';
    o += '<div class="mh"><span class="ib">' + ic(f.icon) + '</span><div><h2>' + E(ttl(f)) + ' 준비 지도</h2><p>' + S(f.lead) + '</p></div></div><div class="body">';
    if (c) o += '<div class="cert c' + c[0] + '"><span class="ct2">' + E(c[3] || CL[c[0]]) + '</span><b>' + E(c[1]) + '</b><span class="cd">' + S(c[2]) + '</span></div>';
    if (hr) o += '<div class="cert ch"><span class="ct2">근무 시간</span><b>' + S(hr[0]) + '</b><span class="cd">' + S(hr[1]) + '</span></div>';
    o += '<div class="key">' + f.keys.map(function(k){ return '<div class="k"><em>' + ic(k[0]) + E(k[1]) + '</em><b>' + S(k[2]) + '<small>' + S(k[3]) + '</small></b><span>' + S(k[4]) + '</span></div>'; }).join('') + '</div>';
    o += '<div class="sec"><h3><i>1</i>이렇게 준비합니다 <small>' + S(f.who) + '</small></h3><div class="card"><div class="road">' +
      f.steps.map(function(s, i){ return '<div class="st"><i>' + (i + 1) + '</i><b>' + S(s[0]) + '</b>' + (s[1] ? '<u>' + S(s[1]) + '</u>' : '<u class="no">.</u>') + '<span>' + S(s[2]) + '</span></div>'; }).join('') + '</div></div></div>';
    o += '<div class="sec two"><div><h3><i>2</i>돈은 얼마나 들까요</h3><div class="card"><table>' +
      m.rows.map(function(r){ return '<tr class="' + E(r[3]) + '"><td>' + S(r[0]) + (r[1] ? '<small>' + S(r[1]) + '</small>' : '') + '</td><td>' + S(r[2]) + '</td></tr>'; }).join('') +
      '<tr class="sum"><td>정리하면</td><td>' + S(m.sum) + '</td></tr></table><p class="p">' + S(m.note) + '</p></div></div>';
    o += '<div><h3><i>3</i>' + S(h.title) + '</h3><div class="card"><div class="how">' + h.steps.map(function(s){ return '<div><span>' + S(s) + '</span></div>'; }).join('') + '</div>' +
      (h.tels && h.tels.length ? '<div class="tel">' + h.tels.map(function(x){ var n = String(x[1]).replace(/[^0-9]/g, '');
        return '<a' + (n ? ' href="tel:' + n + '"' : '') + '><em>' + S(x[0]) + '</em><b>' + ic('phone') + S(x[1]) + '</b><span>' + S(x[2]) + '</span></a>'; }).join('') + '</div>' : '') +
      '<p class="p">' + S(h.note) + '</p></div></div></div>';
    o += '<div class="sec two"><div><h3><i>4</i>일하면 얼마나 벌까요</h3><div class="card"><div class="pay"><b>' + S(p.big) + '</b></div><p class="p s">' + S(p.sub) + '</p><p class="p">' + S(p.p[0]) + '</p>';
    if (p.dist) o += '<div class="dist">' + p.dist.map(function(d){ return '<i style="width:' + (+d[1]) + '%;background:' + E(d[2]) + '"></i>'; }).join('') + '</div><div class="lg">' +
      p.dist.map(function(d){ return '<span style="--c:' + E(d[2]) + '">' + E(d[0]) + (d[0] === '그 밖' ? '' : ' ' + (+d[1]) + '%') + '</span>'; }).join('') + '</div>';
    o += '<p class="p">' + S(p.p[1]) + '</p></div></div>';
    o += '<div><h3><i>5</i>시작 전에 꼭 생각해 보세요</h3><div class="ws">' + f.warn.map(function(w){ return '<div class="w">' + ic(w[0]) + '<div><b>' + S(w[1]) + '</b><span>' + S(w[2]) + '</span></div></div>'; }).join('') + '</div></div></div>';
    var on = req.indexOf(f.key) >= 0;
    o += '<div class="ment"><span class="ib">' + ic('users-round') + '</span><div class="mt"><b>현직자에게 직접 물어보고 싶다면</b><span>' +
      (CAN ? (on ? '멘토링을 신청해 두었어요. 담당자가 따로 연락드립니다.' : '신청해 두시면 담당자가 따로 연락드립니다.') : '상담하실 때 담당자에게 「현직자 멘토링」을 말씀해 주세요.') + '</span></div>' +
      (CAN ? '<button type="button" id="mq" class="' + (on ? 'done' : '') + '"' + (busy ? ' disabled' : '') + '>' + ic(on ? 'check' : 'send-horizontal') + (on ? '현직자 멘토링 신청함' : '현직자 멘토링 신청') + '</button>' : '') + '</div>';
    o += '<p class="src">자료: ' + S(f.src) + '. 2026년 11월 확인. 금액과 일정은 해마다 바뀌니 시작 전에 한 번 더 확인하세요.' + (/＊/.test(JSON.stringify(f)) ? ' <sup>＊</sup> 표시는 현장 기준이라 곳마다 다를 수 있어요.' : '') +
      (/세후/.test(JSON.stringify(f.pay) + JSON.stringify(f.keys)) ? ' 세후 금액은 4대 보험과 세금 (프리랜서는 3.3%)을 뺀 대략의 금액이고, 부양가족 수나 회사에 따라 조금씩 달라요.' : '') + '</p></div>';
    document.getElementById('sheet').innerHTML = o;
    document.title = ttl(f) + ' 준비 지도 · 부산 여성 일자리박람회';
  }
  function show(k, keep){ cur = k; chips(); sheet(); if (!keep) window.scrollTo(0, 0);
    try { var u = new URL(location.href); u.searchParams.set('f', k); history.replaceState(null, '', u); } catch (e) {} }
  function link(){ return location.origin + location.pathname + '?f=' + encodeURIComponent(cur); }

  document.getElementById('chips').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b) show(b.getAttribute('data-k')); });
  document.getElementById('sheet').addEventListener('click', function(e){
    if (!e.target.closest('#mq') || busy) return;
    var on = req.indexOf(cur) < 0;
    if (!on && !confirm('멘토링 신청 표시를 지울까요?')) return;
    busy = true; sheet();
    window.parent.postMessage({ t:'jfm:req', f:cur, on:on }, '*');
  });
  document.getElementById('bk').onclick = function(){ window.parent.postMessage({ t:'jfm:close' }, '*'); };
  document.getElementById('pr').onclick = function(){ window.print(); };
  document.getElementById('shTx').textContent = APP ? '카톡으로 보내기' : '보내기';
  document.getElementById('sh').onclick = function(){
    var f = get(cur); if (!f) return;
    if (APP) { window.parent.postMessage({ t:'jfm:share', f:cur, title:ttl(f) }, '*'); return; }
    var url = link(), tx = ttl(f) + ' 준비 지도 · 부산 여성 일자리박람회';
    if (navigator.share) { navigator.share({ title:tx, text:tx, url:url }).catch(function(){}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){ toast('링크를 복사했어요'); }, function(){ prompt('링크를 복사해 주세요', url); });
    else prompt('링크를 복사해 주세요', url);
  };
  window.addEventListener('message', function(ev){
    var m = ev.data; if (!APP || ev.source !== window.parent || !m || typeof m !== 'object') return;
    if (m.t === 'jfm:req') { busy = false; if (Array.isArray(m.list)) req = m.list.map(String); if (m.msg) toast(String(m.msg)); chips(); sheet(); }
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && APP) window.parent.postMessage({ t:'jfm:close' }, '*'); });
  chips(); sheet();
  if (APP) window.parent.postMessage({ t:'jfm:ready' }, '*');
})();
</script>
</body>
</html>
