    dz:S.dz.filter(function(c){ return S.ans[c.q] === '예' && trim(c.name); }) };
  SENDING = true; SERR = ''; render();
  post({ action:'gojiLinkSubmit', k:K, data:JSON.stringify(data), memo:trim(S.memo) }).then(function(res){
    SENDING = false;
    if (res && res.ok) { if (res.fp) L.fp = res.fp; drop(); go('done'); return; }
    if (res && (res.err === 'used' || res.err === 'exp' || res.err === 'none')) { L.err = res.err; if (res.fp) L.fp = res.fp; drop(); go('err'); return; }
    SERR = (res && res.msg) || '보내지 못했어요. 다시 눌러 주세요'; render();
  }, function(){ SENDING = false; SERR = '인터넷 연결을 확인하고 다시 눌러 주세요'; render(); });
}
// 쓰는 중인 내용: 이 탭에만 (카톡 안 브라우저를 새로 고쳐도 남아요, 탭을 닫으면 없어져요)
function skey(){ return 'goji_c_' + K; }
function keep(){ try { if (K && STEPS.indexOf(STEP) >= 0) sessionStorage.setItem(skey(), JSON.stringify({ s:S, step:STEP })); } catch (e) {} }
function drop(){ try { sessionStorage.removeItem(skey()); } catch (e) {} }
function restore(){
  try {
    var o = JSON.parse(sessionStorage.getItem(skey()) || 'null');
    if (o && o.s && o.s.v === 1 && Array.isArray(o.s.dz)) { S = o.s; STEP = STEPS.indexOf(o.step) >= 0 ? o.step : 'hi'; }
  } catch (e) {}
}

D.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el) { if (e.target === $('sh')) shClose(); return; }
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id'), c = id ? dzOf(id) : null;
  switch (a) {
    case 'agall': var on = !(S.ag.a && S.ag.b && S.ag.c); S.ag = { a:on, b:on, c:on }; render(); break;
    case 'ag': var k = el.getAttribute('data-k'); S.ag[k] = !S.ag[k]; render(); break;
    case 'agv': agSheet(el.getAttribute('data-k')); break;
    case 'agok': S.ag[el.getAttribute('data-k')] = true; shClose(); render(); break;
    case 'start': if (S.ag.a && S.ag.b && S.ag.c) { if (!S.cust.name) S.cust.name = L.cust.name || ''; go('me'); } break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'goto': go(el.getAttribute('data-v')); break;
    case 'sex': S.cust.sex = el.getAttribute('data-v'); render(); break;
    case 'ans': var n = +STEP.charAt(1), v = el.getAttribute('data-v'); S.ans[n] = v; if (v === '예' && !dzQ(n).length) newDz(n); BAD = ''; render(); break;
    case 'add': var d = newDz(+STEP.charAt(1)); render(); var x = $('dz-' + d.id); if (x) x.scrollIntoView({ block:'start', behavior:'smooth' }); break;
    case 'dzdel': S.dz = S.dz.filter(function(z){ return z.id !== id; }); render(); break;
    case 'tx': var tk = el.getAttribute('data-k'); if (Object.prototype.hasOwnProperty.call(c.tx, tk)) delete c.tx[tk]; else c.tx[tk] = (c.q === 4 && tk === '투약') ? '계속 복용' : ''; render(); break;
    case 'now': var nv = el.getAttribute('data-v'); c.now = c.now === nv ? '' : nv; render(); break;
    case 'send': send(); break;
    case 'retry': open(); break;
  }
});
D.addEventListener('input', function(e){
  var el = e.target, f = el.getAttribute('data-f'), id = el.getAttribute('data-id'), c = id ? dzOf(id) : null, k = el.getAttribute('data-k');
  if (f === 'name') S.cust.name = el.value;
  else if (f === 'birth') S.cust.birth = el.value;
  else if (f === 'memo') S.memo = el.value;
  else if (c && f === 'dname') c.name = el.value;
  else if (c && f === 'drug') c.drug = el.value;
  else if (c && k && el.tagName === 'INPUT') c.tx[k] = el.value;
  keep();
});
D.addEventListener('change', function(e){
  var el = e.target, f = el.getAttribute('data-f'), id = el.getAttribute('data-id'), c = id ? dzOf(id) : null, k = el.getAttribute('data-k');
  if (f === 'birth') { S.cust.birth = birthFmt(el.value); el.value = S.cust.birth; return; }
  if (!c) return;
  if (f === 'yy') c.y = +el.value || 0;
  else if (f === 'mm') c.m = +el.value || 0;
  else if (f === 'nd') c.nd = el.checked;
  else if (k && el.tagName === 'SELECT') c.tx[k] = el.value;
  else return;
  render();
});

// 시작: 주소 # 뒤의 토큰으로 서버에 물어봐요 (기한 지남 · 이미 보냄 · 없는 링크 → 안내 화면)
function open(){
  K = location.hash.replace(/^#/, '').replace(/[^0-9a-f]/gi, '').toLowerCase();
  if (!/^[0-9a-f]{32}$/.test(K)) { L = { err:'none' }; STEP = 'err'; render(); return; }
  STEP = 'load'; render();
  fetch(GAS + '?action=gojiLinkGet&k=' + K + '&_=' + Date.now()).then(function(r){ return r.json(); }).then(function(res){
    if (res && res.ok && res.fp && res.cust) {
      L = { fp:res.fp, cust:res.cust, exp:res.exp };
      STEP = 'hi'; restore(); render(); return;
    }
    if (res && res.err === 'busy') { STEP = 'net'; render(); return; }
    L = { err:(res && res.err) || 'none', fp:res && res.fp }; drop(); STEP = 'err'; render();
  }, function(){ STEP = 'net'; render(); });
}
open();
})();
