<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>🎂 유니스 생일복권 — TV</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; }
body { font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif; color:#fff; position:relative;
  background:linear-gradient(135deg,#2a0a2e 0%,#5a1650 35%,#9c2b5e 70%,#e8643f 100%); }
.cf { position:absolute; width:14px; height:24px; border-radius:3px; opacity:.8; z-index:1; animation:fall 9s linear infinite; }
@keyframes fall { 0%{transform:translateY(-40px) rotate(0)} 100%{transform:translateY(1120px) rotate(720deg); opacity:0} }

.top { position:absolute; left:0; right:0; top:0; height:150px; display:flex; align-items:center; padding:0 48px; gap:26px; z-index:2; }
.top .cake { font-size:84px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.4)); }
.top .kicker { font-size:20px; font-weight:800; color:#ffd9e6; letter-spacing:4px; }
.top h1 { font-size:50px; font-weight:900; line-height:1.15; text-shadow:0 6px 20px rgba(30,10,30,.6); }
.top h1 .y { color:#ffd166; }
.top .sub { font-size:19px; font-weight:800; color:#ffe6ef; margin-top:4px; }
.top .right { margin-left:auto; text-align:right; }
.dday { font-size:44px; font-weight:900; color:#ffd166; text-shadow:0 4px 14px rgba(0,0,0,.4); }
.conn { display:inline-flex; align-items:center; gap:8px; margin-top:6px; padding:7px 16px; border-radius:100px; font-size:15px; font-weight:900; background:#ff9f1c; color:#3a1d1d; }
.conn.live { background:#2ecc71; color:#0c2a17; }
.conn.err { background:#e63946; color:#fff; }
.conn .dot { width:10px; height:10px; border-radius:50%; background:currentColor; animation:blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.btns { margin-top:8px; display:flex; gap:8px; justify-content:flex-end; }
.btns button { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:100px; padding:7px 14px; font-size:14px; font-weight:900; cursor:pointer; font-family:inherit; }

.grid { position:absolute; left:40px; right:40px; top:160px; bottom:130px; display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:22px; z-index:2; }
.panel { background:rgba(255,255,255,.96); border-radius:26px; padding:22px 24px; color:#3a1a2a; box-shadow:0 20px 50px rgba(20,5,30,.4); overflow:hidden; display:flex; flex-direction:column; }
.panel.dark { background:rgba(20,5,25,.55); border:1px solid rgba(255,190,210,.3); color:#fff; }
.p-t { font-size:24px; font-weight:900; color:#a3245c; display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.p-t small { font-size:15px; color:#9a8090; font-weight:800; }
.panel.dark .p-t { color:#ffd9e6; } .panel.dark .p-t small { color:#e6b8cc; }

/* ladder */
.ladder { display:flex; gap:10px; }
.tk { flex:1; border-radius:16px; padding:12px 8px; text-align:center; border:2px dashed #e5c9d6; background:#fff5f9; position:relative; }
.tk .d { font-size:15px; font-weight:800; color:#a08090; }
.tk .n { font-size:34px; font-weight:900; color:#c9306a; line-height:1.1; }
.tk .n small { font-size:16px; }
.tk.live { border:3px solid #ffb703; background:linear-gradient(135deg,#fff3c4,#ffe08a); }
.tk.live .d { color:#7a4a00; } .tk.live .n { color:#7a2e00; }
.tk.live:before { content:'NOW'; position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:#ff3d71; color:#fff; font-size:12px; font-weight:900; padding:2px 10px; border-radius:100px; }
.tk.past { opacity:.35; }

/* branch */
.br { margin-top:16px; padding:18px 20px; border-radius:20px; background:#fbf4f7; }
.br-h { display:flex; justify-content:space-between; align-items:baseline; }
.br-name { font-size:30px; font-weight:900; }
.br-name span { font-size:16px; font-weight:800; color:#9a8090; margin-left:8px; }
.br-pct { font-size:48px; font-weight:900; color:#c9306a; line-height:1; }
.bar { position:relative; height:30px; background:#eadbe2; border-radius:100px; margin-top:12px; }
.bar .fill { height:100%; border-radius:100px; background:linear-gradient(90deg,#ff8fb1,#e8385f); transition:width 1s; }
.bar .goal { position:absolute; right:0; top:-6px; height:42px; width:5px; background:#3a1a2a; border-radius:3px; }
.br-f { display:flex; justify-content:space-between; margin-top:10px; font-size:18px; font-weight:800; color:#7a5a6a; }
.br-f b { color:#3a1a2a; }
.br-left { margin-top:12px; display:flex; gap:10px; }
.br-left div { flex:1; background:#fff; border:2px solid #ffd3e0; border-radius:14px; padding:10px; text-align:center; }
.br-left .l { font-size:14px; font-weight:800; color:#9a8090; }
.br-left .v { font-size:30px; font-weight:900; color:#c9306a; }
.br-left .v small { font-size:15px; }
.br.done { background:linear-gradient(135deg,#fff7d6,#ffe9a8); border:2px solid #ffd166; }
.br.done .br-pct { color:#7a4a00; }
.br.done .bar .fill { background:linear-gradient(90deg,#ffc94d,#ff9f1c); }
.br-done-msg { margin-top:12px; background:#3a1a2a; color:#ffd166; border-radius:14px; padding:14px; font-size:22px; font-weight:900; text-align:center; }

/* roster */
.rs-h { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:900; margin-top:10px; }
.rs-h .g { font-size:14px; color:#9a8090; font-weight:800; }
.rs-h .c { margin-left:auto; color:#e8385f; font-size:18px; }
.rs-h .gift { font-size:13px; font-weight:800; color:#9a8090; }
.chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
.chips span { background:#f7eef3; color:#6a2a4a; border-radius:100px; padding:7px 15px; font-size:18px; font-weight:800; }
.chips span.p { background:#3a1a2a; color:#ffd166; }
.chips span.g { background:#fff1c2; color:#7a4a00; }
.chips .none { background:none; color:#b8acd0; font-size:15px; }
.rs-sum { margin-top:auto; background:linear-gradient(135deg,#3a1a2a,#7a2e5e); color:#fff; border-radius:16px; padding:14px 16px; }
.rs-sum .l { font-size:14px; font-weight:800; color:#ffd9e6; }
.rs-sum .v { font-size:28px; font-weight:900; color:#ffd166; }
.rs-sum .v small { font-size:15px; color:#fff; margin-left:6px; }
.rs-sum .bar { height:14px; background:rgba(255,255,255,.2); margin-top:8px; }
.rs-sum .bar .fill { background:linear-gradient(90deg,#ffc94d,#ff9f1c); }

/* feed */
.feed { flex:1; overflow:hidden; }
.fi { display:flex; gap:12px; align-items:center; padding:12px 8px; border-bottom:1px solid rgba(255,255,255,.12); font-size:19px; font-weight:700; }
.fi .ic { font-size:24px; }
.fi b { color:#ffd166; }
.fi .t { margin-left:auto; font-size:14px; color:#e6b8cc; font-weight:800; white-space:nowrap; }
.fi.big { background:rgba(255,209,102,.15); border-radius:14px; }
.empty { color:#e6b8cc; font-size:18px; font-weight:800; text-align:center; padding:40px 0; }

/* bottom prize strip */
.strip { position:absolute; left:40px; right:40px; bottom:26px; height:90px; display:flex; gap:16px; z-index:2; }
.pz { flex:1; display:flex; align-items:center; gap:14px; padding:0 20px; border-radius:20px; }
.pz .ic { font-size:40px; }
.pz .n { font-size:21px; font-weight:900; }
.pz .g { font-size:16px; font-weight:800; opacity:.85; margin-top:2px; }
.pz .cnt { margin-left:auto; font-size:26px; font-weight:900; }
.t-p { background:linear-gradient(135deg,#3a1a2a,#7a2e5e); color:#ffd166; }
.t-g { background:linear-gradient(135deg,#fff3d0,#ffe0a8); color:#7a4a00; }
.t-s { background:linear-gradient(135deg,#eef2f7,#d9e0ea); color:#3a4a5a; }

/* all-status overlay */
.ov { display:none; position:absolute; inset:0; background:rgba(20,5,25,.85); z-index:20; align-items:center; justify-content:center; }
.ov-in { width:1760px; height:960px; background:#fff; border-radius:30px; padding:28px 32px; color:#3a1a2a; display:flex; flex-direction:column; }
.ov-h { display:flex; justify-content:space-between; align-items:center; font-size:30px; font-weight:900; }
.ov-h button { background:#f3eef1; border:none; border-radius:100px; width:48px; height:48px; font-size:22px; font-weight:900; color:#7a5a6a; font-family:inherit; cursor:pointer; }
.ov-cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:16px; flex:1; overflow:hidden; }
.ov-col { overflow:auto; }
.bh { display:flex; justify-content:space-between; align-items:center; font-size:24px; font-weight:900; }
.bh span { font-size:17px; font-weight:800; color:#c9306a; }
table.all { width:100%; border-collapse:collapse; margin-top:8px; font-size:17px; }
table.all th { font-size:14px; font-weight:800; color:#9a8090; text-align:left; padding:6px 8px; border-bottom:2px solid #eadbe2; }
table.all td { padding:7px 8px; border-bottom:1px solid #f3eef1; font-weight:800; }
table.all td.r { text-align:right; }
table.all .tg { display:inline-block; font-size:13px; font-weight:900; border-radius:100px; padding:3px 10px; }
table.all .tg.p { background:#3a1a2a; color:#ffd166; }
table.all .tg.g { background:#fff1c2; color:#7a4a00; }
table.all .tg.s { background:#d9e0ea; color:#3a4a5a; }
table.all .tg.n { background:#f3eef1; color:#9a8090; }
table.all td.gap { color:#c9306a; font-size:15px; text-align:right; }
</style>
</head>
<body>
<div class="cf" style="left:6%;background:#ffd166;animation-delay:0s"></div>
<div class="cf" style="left:18%;background:#ff8fb1;animation-delay:2s"></div>
<div class="cf" style="left:33%;background:#7ee8fa;animation-delay:4s"></div>
<div class="cf" style="left:52%;background:#ffd166;animation-delay:1s"></div>
<div class="cf" style="left:70%;background:#b8f2a4;animation-delay:5s"></div>
<div class="cf" style="left:86%;background:#ff8fb1;animation-delay:3s"></div>
<div class="cf" style="left:95%;background:#7ee8fa;animation-delay:6.5s"></div>

<div class="top">
  <div class="cake">🎂</div>
  <div>
    <div class="kicker">9월 30일은 김대표 생일</div>
    <h1>생일선물은 <span class="y">"지점 목표 100%"</span>로 주세요!</h1>
    <div class="sub">유니스 생일복권 · 9/16(수) ~ 9/30(수) · 100% 달성 시 김대표가 복권을 쏩니다 🎟</div>
  </div>
  <div class="right">
    <div class="dday" id="dday">D-</div>
    <div class="conn" id="conn"><span class="dot"></span><span id="connTxt">연결 중...</span></div>
    <div class="btns"><button id="allBtn">📊 전체 현황</button><button id="refBtn">🔄 지금 갱신</button></div>
  </div>
</div>

<div class="grid">
  <div class="panel">
    <div class="p-t">🏁 지점 목표 100% 현황 <small>9월 보장월초 누계</small></div>
    <div class="ladder" id="ladder"></div>
    <div id="branches"></div>
  </div>
  <div class="panel">
    <div class="p-t">🎫 복권 발급자 명단 <small id="rsTotal">50만 이상</small></div>
    <div id="roster"></div>
    <div class="rs-sum" id="rsSum"></div>
  </div>
  <div class="panel dark">
    <div class="p-t">🔴 실시간 LIVE <small id="asof">업적 입력 즉시 반영</small></div>
    <div class="feed" id="feed"><div class="empty">불러오는 중...</div></div>
  </div>
</div>

<div class="strip" id="strip"></div>

<div class="ov" id="ov">
  <div class="ov-in">
    <div class="ov-h"><span id="ovTitle">📊 전체 현황</span><button id="ovClose">✕</button></div>
    <div class="ov-cols"><div class="ov-col" id="ovA"></div><div class="ov-col" id="ovB"></div></div>
  </div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx3dE8zn0pkrjsklnrWP-dLUJQ_PyLfVPGd49YsX28U-Wc6ifM4TxdNBgB14b9bOyvL/exec';
var EVENT_END = '2026-09-30';
var POLL_MS = 60000;
var STATE = null;
var TIER_META = { p:{ name:'\ud50c\ub798\ud2f0\ub118', icon:'\ud83c\udfc6', cls:'t-p' }, g:{ name:'\uace8\ub4dc', icon:'\ud83e\udd47', cls:'t-g' }, s:{ name:'\uc2e4\ubc84', icon:'\ud83e\udd48', cls:'t-s' } };

function qs(id){ return document.getElementById(id); }
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function man(v){ return Math.round((parseInt(v,10)||0)/10000); }
function comma(n){ var s = String(n), o = '', c = 0; for (var i = s.length-1; i >= 0; i--) { o = s.charAt(i) + o; c++; if (c % 3 === 0 && i > 0) o = ',' + o; } return o; }
function manTxt(v){ return comma(man(v)) + '\ub9cc'; }
function wd(ds){ var p = ds.split('-'); var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); return ['\uc77c','\uc6d4','\ud654','\uc218','\ubaa9','\uae08','\ud1a0'][d.getDay()]; }
function md(ds){ return parseInt(ds.slice(5,7),10) + '/' + parseInt(ds.slice(8,10),10); }

var JSONP_SEQ = 0;
function fetchTimeout(url, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){ if (!done) { done = true; reject(new Error('timeout')); } }, ms);
    fetch(url).then(function(r){ return r.json(); })
      .then(function(d){ if (done) return; done = true; clearTimeout(t); resolve(d); })
      .catch(function(e){ if (done) return; done = true; clearTimeout(t); reject(e); });
  });
}
function jsonpGet(url, ms){
  return new Promise(function(resolve, reject){
    var name = '__tv_cb' + (++JSONP_SEQ) + '_' + new Date().getTime();
    var done = false;
    var s = document.createElement('script');
    var t = setTimeout(function(){ finish(); reject(new Error('timeout')); }, ms || 20000);
    function finish(){ if (done) return; done = true; clearTimeout(t); try { window[name] = undefined; } catch(e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function(d){ if (done) return; finish(); resolve(d); };
    s.onerror = function(){ if (done) return; finish(); reject(new Error('jsonp')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name;
    document.body.appendChild(s);
  });
}
function gasGet(url){ return fetchTimeout(url, 25000).catch(function(){ return jsonpGet(url, 25000); }); }

function setConn(kind, txt){ var c = qs('conn'); c.className = 'conn ' + kind; qs('connTxt').textContent = txt; }

function load(){
  setConn('', '\uc5f0\uacb0 \uc911...');
  gasGet(GAS_URL + '?action=tkBoard')
    .then(function(d){
      if (!d || !d.ok) { setConn('err', '\uc624\ub958: ' + (d && d.msg ? d.msg : '\uc751\ub2f5 \uc5c6\uc74c')); return; }
      STATE = d; render(d);
      setConn('live', 'LIVE \u00b7 ' + d.asOf);
    })
    .catch(function(e){ setConn('err', '\uc5f0\uacb0 \uc2e4\ud328 (' + (e && e.message) + ') \u00b7 60\ucd08 \ud6c4 \uc7ac\uc2dc\ub3c4'); });
}

function render(d){
  var today = d.period.today, h = '', liveSet = false;
  for (var i = 0; i < d.deadlines.length; i++) {
    var dl = d.deadlines[i], cls = 'tk';
    if (today > dl.until) cls += ' past'; else if (!liveSet) { cls += ' live'; liveSet = true; }
    h += '<div class="' + cls + '"><div class="d">' + md(dl.until) + '(' + wd(dl.until) + ')\uae4c\uc9c0 \ub2ec\uc131</div><div class="n">' + dl.tickets + '<small>\uc7a5</small></div></div>';
  }
  qs('ladder').innerHTML = h;
  qs('branches').innerHTML = brHtml(d.alpha, '\uc54c\ud30c\uc9c0\uc810', d.nowTickets) + brHtml(d.bravo, '\ube0c\ub77c\ubcf4\uc9c0\uc810', d.nowTickets);

  var rh = '', total = 0;
  for (var t = 0; t < d.tiers.length; t++) {
    var tr = d.tiers[t]; total += tr.names.length;
    rh += '<div class="rs-h">' + tr.icon + ' ' + esc(tr.name) + ' <span class="g">' + man(tr.min) + '\ub9cc~</span><span class="gift">' + esc(tr.gifts) + '</span><span class="c">' + tr.names.length + '\uba85</span></div><div class="chips">';
    if (!tr.names.length) rh += '<span class="none">\uc544\uc9c1 \uc5c6\uc74c</span>';
    for (var j = 0; j < tr.names.length; j++) rh += '<span class="' + tr.key + '">' + esc(tr.names[j].name) + '</span>';
    rh += '</div>';
  }
  qs('roster').innerHTML = rh;
  qs('rsTotal').textContent = '50\ub9cc \uc774\uc0c1 \u00b7 \ucd1d ' + total + '\uba85';
  qs('rsSum').innerHTML = '<div class="l">\uc720\ub2c8\uc2a4\uc9c0\uc0ac \ud569\uacc4</div><div class="v">' + manTxt(d.total.cum) + '<small>/ ' + manTxt(d.total.goal) + ' (' + d.total.pct + '%)</small></div><div class="bar"><div class="fill" style="width:' + Math.min(100, d.total.pct) + '%"></div></div>';

  var f = d.feed || [], fh = '';
  if (!f.length) fh = '<div class="empty">\uc544\uc9c1 \uc18c\uc2dd\uc774 \uc5c6\uc5b4\uc694 \u00b7 \uccab \uc5c5\uc801\uc744 \uae30\ub2e4\ub9ac\ub294 \uc911 \ud83c\udf82</div>';
  for (var k = 0; k < Math.min(f.length, 9); k++) fh += feedLine(f[k]);
  qs('feed').innerHTML = fh;
  qs('asof').textContent = d.asOf + ' \uae30\uc900';

  var sh = '';
  for (var s = 0; s < d.tiers.length; s++) {
    var tt = d.tiers[s];
    sh += '<div class="pz ' + TIER_META[tt.key].cls + '"><div class="ic">' + tt.icon + '</div><div><div class="n">' + esc(tt.name) + ' ' + man(tt.min) + '\ub9cc~</div><div class="g">' + esc(tt.gifts) + '</div></div><div class="cnt">' + tt.names.length + '\uba85</div></div>';
  }
  qs('strip').innerHTML = sh;
  if (qs('ov').style.display === 'flex') renderOverlay(d);
}

function brHtml(b, label, nowTickets){
  var h = '<div class="br' + (b.done ? ' done' : '') + '"><div class="br-h"><div class="br-name">' + label + '<span>' + b.head + '\uba85 \u00b7 \ubaa9\ud45c ' + manTxt(b.goal) + '</span></div><div class="br-pct">' + b.pct + '%</div></div>'
    + '<div class="bar"><div class="fill" style="width:' + Math.min(100, b.pct) + '%"></div><div class="goal"></div></div>'
    + '<div class="br-f"><span>\ub204\uacc4 <b>' + manTxt(b.cum) + '</b></span><span>\ubaa9\ud45c ' + manTxt(b.goal) + '</span></div>';
  if (b.done) h += '<div class="br-done-msg">\ud83c\udf89 ' + md(b.doneDate) + ' 100% \ub2ec\uc131! \uc778\ub2f9 \ubcf5\uad8c ' + b.tickets + '\uc7a5 \ud655\ubcf4 (\ubc1c\uae09 \ub300\uc0c1\uc790 ' + b.eligible + '\uba85)</div>';
  else h += '<div class="br-left"><div><div class="l">100%\uae4c\uc9c0 \ucd1d</div><div class="v">' + comma(man(b.left)) + '<small>\ub9cc\uc6d0</small></div></div><div><div class="l">1\uc778\ub2f9</div><div class="v">' + man(b.perLeft) + '<small>\ub9cc\uc6d0</small></div></div><div><div class="l">\uc9c0\uae08 \ub2ec\uc131 \uc2dc</div><div class="v">' + nowTickets + '<small>\uc7a5</small></div></div></div>';
  return h + '</div>';
}
function feedLine(f){
  if (f.type === 'done') return '<div class="fi big"><span class="ic">\ud83c\udf82</span><span><b>' + esc(f.branch) + '\uc9c0\uc810 100% \ub2ec\uc131!</b> \uc778\ub2f9 \ubcf5\uad8c ' + f.tickets + '\uc7a5</span><span class="t">' + esc(f.at) + '</span></div>';
  if (f.type === 'mile') return '<div class="fi big"><span class="ic">\ud83c\udf89</span><span><b>' + esc(f.branch) + '</b> ' + f.pct + '% \ub3cc\ud30c! 100%\uae4c\uc9c0 ' + manTxt(f.left) + '</span><span class="t">' + esc(f.at) + '</span></div>';
  var tag = f.tag === 's' ? ' (\ubc1c\uae09 \ub300\uc0c1 \ud83c\udfab)' : (f.tag === 'g' ? ' (\uace8\ub4dc \ud83e\udd47)' : (f.tag === 'p' ? ' (\ud50c\ub798\ud2f0\ub118 \ud83c\udfc6)' : ''));
  return '<div class="fi"><span class="ic">\ud83d\udcc8</span><span><b>' + esc(f.name) + ' ' + esc(f.title) + '</b> ' + manTxt(f.amt) + ' \u2192 \ub204\uacc4 ' + manTxt(f.cum) + tag + '</span><span class="t">' + esc(f.at) + '</span></div>';
}

function allTable(list){
  var h = '<table class="all"><tr><th>\uc774\ub984</th><th class="r">\ub204\uacc4</th><th>\ub4f1\uae09</th><th class="r">\ub2e4\uc74c \ub4f1\uae09\uae4c\uc9c0</th></tr>';
  if (!list.length) h += '<tr><td colspan="4" style="text-align:center;color:#9a8090">\uc544\uc9c1 \uc5c5\uc801\uc774 \uc5c6\uc5b4\uc694</td></tr>';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var tg = r.tier ? '<span class="tg ' + r.tier + '">' + TIER_META[r.tier].name + '</span>' : '<span class="tg n">\ubbf8\ubc1c\uae09</span>';
    h += '<tr><td>' + esc(r.name) + ' ' + esc(r.title) + '</td><td class="r">' + manTxt(r.amt) + '</td><td>' + tg + '</td><td class="gap">' + (r.gap > 0 ? esc(r.next) + ' \u2212' + manTxt(r.gap) : '\ucd5c\uace0 \ub4f1\uae09 \ud83c\udf89') + '</td></tr>';
  }
  return h + '</table>';
}
function renderOverlay(d){
  qs('ovTitle').textContent = '\ud83d\udcca \uc804\uccb4 \ud604\ud669 \u00b7 \uc720\ub2c8\uc2a4\uc9c0\uc0ac ' + manTxt(d.total.cum) + ' / ' + manTxt(d.total.goal) + ' (' + d.total.pct + '%) \u00b7 \ubc1c\uae09 \ub300\uc0c1 ' + d.total.eligible + '\uba85 \u00b7 ' + d.asOf + ' \uae30\uc900';
  qs('ovA').innerHTML = '<div class="bh">\uc54c\ud30c\uc9c0\uc810 ' + manTxt(d.alpha.cum) + ' / ' + manTxt(d.alpha.goal) + ' <span>' + d.alpha.pct + '% \u00b7 ' + (d.alpha.done ? '\ub2ec\uc131 \ud83c\udf89' : '\ub0a8\uc740 ' + manTxt(d.alpha.left)) + '</span></div>' + allTable(d.all.alpha);
  qs('ovB').innerHTML = '<div class="bh">\ube0c\ub77c\ubcf4\uc9c0\uc810 ' + manTxt(d.bravo.cum) + ' / ' + manTxt(d.bravo.goal) + ' <span>' + d.bravo.pct + '% \u00b7 ' + (d.bravo.done ? '\ub2ec\uc131 \ud83c\udf89' : '\ub0a8\uc740 ' + manTxt(d.bravo.left)) + '</span></div>' + allTable(d.all.bravo);
}
qs('allBtn').addEventListener('click', function(){ if (STATE) renderOverlay(STATE); qs('ov').style.display = 'flex'; });
qs('ovClose').addEventListener('click', function(){ qs('ov').style.display = 'none'; });
qs('refBtn').addEventListener('click', load);

function tickDday(){
  var n = new Date();
  var kst = new Date(n.getTime() + n.getTimezoneOffset() * 60000 + 9 * 3600000);
  var t0 = new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  var p = EVENT_END.split('-');
  var e0 = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  var diff = Math.round((e0 - t0) / 86400000);
  qs('dday').textContent = diff > 0 ? 'D-' + diff : (diff === 0 ? 'D-DAY \ud83c\udf82' : '\uc9d1\uacc4 \uc644\ub8cc');
}
tickDday();
load();
setInterval(load, POLL_MS);
setInterval(tickDday, 600000);
</script>
