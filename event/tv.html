<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🌕 유니스 한가위 윷놀이 TV</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; }
body { font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif;
  background:linear-gradient(180deg,#150d3d 0%,#241560 30%,#3d2470 60%,#5a3468 85%,#8a5a50 100%); color:#fff; position:relative; }

.moon { position:absolute; top:40px; right:70px; width:150px; height:150px; border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fffbe8,#ffe9a8 60%,#f5c96a); box-shadow:0 0 110px 45px rgba(255,225,140,.4); animation:float 6s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.star { position:absolute; color:#ffe9a8; animation:tw 2.6s ease-in-out infinite; font-size:18px; }
@keyframes tw { 0%,100%{opacity:.9} 50%{opacity:.2} }

.head { padding:44px 70px 0; display:flex; align-items:flex-end; gap:30px; }
.head h1 { font-size:62px; font-weight:900; text-shadow:0 6px 24px rgba(20,5,60,.7); }
.head h1 .y { color:#ffd94d; }
.head .sub { font-size:24px; font-weight:800; color:#e8d8ff; padding-bottom:10px; }
.head .dday { margin-left:auto; margin-right:190px; background:rgba(255,255,255,.12); border:2px solid rgba(255,217,77,.5);
  border-radius:100px; padding:12px 30px; font-size:26px; font-weight:900; color:#ffd94d; margin-bottom:6px; }

.grid { display:grid; grid-template-columns:1fr 1.1fr 1fr; gap:26px; padding:30px 70px 0; height:760px; }
.panel { background:rgba(255,255,255,.07); border:1px solid rgba(200,160,255,.25); border-radius:26px; padding:26px 28px; backdrop-filter:blur(3px); display:flex; flex-direction:column; overflow:hidden; }
.p-t { font-size:27px; font-weight:900; color:#ffd94d; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; }
.p-t small { font-size:16px; color:#c5b0e5; font-weight:800; }

/* moon distribution */
.dist-row { display:flex; align-items:center; gap:14px; margin-bottom:19px; }
.dist-moon { width:52px; height:52px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#fffbe8,#ffe9a8 55%,#f0c25e); position:relative; overflow:hidden; flex:none; border:3px solid #4a3a80; }
.dist-moon .sh { position:absolute; top:-8%; width:116%; height:116%; border-radius:50%; background:#241552; }
.dist-info { flex:1; }
.dist-name { font-size:19px; font-weight:900; display:flex; justify-content:space-between; }
.dist-name .cnt { color:#ffd94d; }
.dist-name .gift { color:#c5b0e5; font-size:16px; font-weight:800; }
.dist-bar { height:14px; background:rgba(255,255,255,.12); border-radius:100px; margin-top:7px; overflow:hidden; }
.dist-fill { height:100%; border-radius:100px; background:linear-gradient(90deg,#c9a5e8,#ffd94d); transition:width 1s; }

/* full moon hall */
.hall { flex:1; overflow:hidden; }
.hall-row { display:flex; align-items:center; gap:14px; padding:13px 6px; border-bottom:1px solid rgba(255,255,255,.1); }
.hall-rank { font-size:26px; width:44px; text-align:center; }
.hall-name { flex:1; font-size:25px; font-weight:900; }
.hall-name small { font-size:16px; font-weight:800; color:#c5b0e5; margin-left:10px; }
.hall-date { font-size:18px; font-weight:900; color:#ff8fb0; }
.hall-empty { text-align:center; color:#c5b0e5; font-size:20px; font-weight:800; padding:40px 0; }

/* live feed */
.feed { flex:1; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
.f-item { background:rgba(255,255,255,.1); border-radius:16px; padding:15px 19px; font-size:21px; font-weight:800; color:#f0e8ff; animation:slideIn .6s ease-out; }
.f-item b { color:#ffd94d; }
.f-item.big { background:linear-gradient(135deg,rgba(255,217,77,.28),rgba(255,160,60,.22)); border:1px solid rgba(255,217,77,.5); }
@keyframes slideIn { 0%{transform:translateY(-16px);opacity:0} 100%{transform:translateY(0);opacity:1} }

/* bottom gift strip */
.strip { display:flex; gap:20px; padding:26px 70px 0; }
.g-item { flex:1; background:rgba(255,255,255,.09); border:1px solid rgba(200,160,255,.25); border-radius:20px; padding:16px 10px; text-align:center; }
.g-item.top { background:linear-gradient(135deg,rgba(255,217,77,.25),rgba(255,150,60,.18)); border-color:rgba(255,217,77,.6); }
.g-ico { font-size:34px; }
.g-name { font-size:20px; font-weight:900; margin-top:4px; }
.g-amt { font-size:16px; font-weight:800; color:#ffd94d; margin-top:2px; }
.livebadge { position:absolute; top:150px; right:70px; font-size:15px; font-weight:900; color:#fff; padding:6px 16px; border-radius:100px; border:2px solid rgba(255,120,80,.8); background:rgba(255,120,80,.3); z-index:5; }
.clock { position:absolute; bottom:24px; right:70px; font-size:20px; font-weight:800; color:#c5b0e5; }
</style>
</head>
<body>
<div class="moon"></div>
<div class="star" style="top:60px;left:8%">✦</div>
<div class="star" style="top:130px;left:22%;animation-delay:.8s">✦</div>
<div class="star" style="top:80px;left:44%;animation-delay:1.4s">✦</div>
<div class="star" style="top:170px;right:28%;animation-delay:.5s">✦</div>

<div class="head">
  <h1>🌕 유니스 <span class="y">한가위 윷놀이</span></h1>
  <div class="sub">"달이 차오른다, 가자!" · 9/1 ~ 9/15 연장!</div>
  <div class="dday" id="dday">마감</div>
  <div class="livebadge" id="liveBadge">실데이터 연결 중...</div>
</div>

<div class="grid">
  <!-- moon distribution -->
  <div class="panel">
    <div class="p-t">🌙 우리 지사 달 현황 <small id="totalCnt">참여 0명</small></div>
    <div id="dist"></div>
  </div>

  <!-- full moon hall -->
  <div class="panel">
    <div class="p-t">🌕 보름달 완성 명단 <small>한우 확정! 🥩</small></div>
    <div class="hall" id="hall"></div>
  </div>

  <!-- live -->
  <div class="panel">
    <div class="p-t">📡 실시간 LIVE</div>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div class="strip">
  <div class="g-item top"><div class="g-ico">🥩</div><div class="g-name">한우세트 · 보름달</div><div class="g-amt">50만 이상</div></div>
  <div class="g-item"><div class="g-ico">🍷</div><div class="g-name">와인세트 · 둥근달</div><div class="g-amt">40만~</div></div>
  <div class="g-item"><div class="g-ico">🐟</div><div class="g-name">참치세트 · 볼록달</div><div class="g-amt">30만~</div></div>
  <div class="g-item"><div class="g-ico">🍙</div><div class="g-name">김세트 · 반달</div><div class="g-amt">20만~</div></div>
  <div class="g-item"><div class="g-ico">🥞</div><div class="g-name">부침가루세트 · 초승달</div><div class="g-amt">20만 미만</div></div>
</div>

<div class="clock" id="clock"></div>

<script>
/* SAMPLE DATA - replace with GAS fetch on production hookup */
var SAMPLE_DIST = [
  { name: 'BOREUM',  label: '\uBCF4\uB984\uB2EC',  gift: '\uD55C\uC6B0', shade: '-150%', count: 3 },
  { name: 'DUNGEUN', label: '\uB465\uADFC\uB2EC',  gift: '\uC640\uC778', shade: '-96%',  count: 5 },
  { name: 'BOLLOK',  label: '\uBCFC\uB85D\uB2EC',  gift: '\uCC38\uCE58', shade: '-74%',  count: 9 },
  { name: 'BANDAL',  label: '\uBC18\uB2EC',        gift: '\uAE40',       shade: '-52%',  count: 12 },
  { name: 'CHO',     label: '\uCD08\uC2B9\uB2EC',  gift: '\uBD80\uCE68', shade: '-30%',  count: 14 }
];
var SAMPLE_HALL = [
  { rank: '\uD83E\uDD47', name: '\uAE40\uC9C4\uC601', team: '\uC13C\uD130',   date: '9/4' },
  { rank: '\uD83E\uDD48', name: '\uC774\uC218\uC544', team: '\uBE0C\uB77C\uBCF4', date: '9/6' },
  { rank: '\uD83E\uDD49', name: '\uCD5C\uC131\uACBD', team: '\uAD50\uC721',   date: '9/7' }
];
var SAMPLE_FEED = [
  { big: true,  html: '\uD83C\uDF15 <b>\uAE40\uC9C4\uC601</b>\uB2D8 \uBCF4\uB984\uB2EC \uC644\uC131! \uD55C\uC6B0\uC138\uD2B8 \uD655\uC815 \uD83E\uDD69' },
  { big: false, html: '\uD83C\uDF89 <b>\uBC15\u25CB\u25CB</b>\uB2D8 <b>\uBAA8!</b> \uD65C\uB3D9\uBB3C\uD488 3\uC885 \uB2F9\uCCA8!' },
  { big: false, html: '\uD83C\uDF14 <b>\uC815\u25CB\u25CB</b>\uB2D8 \uBCFC\uB85D\uB2EC \uC9C4\uC785 \u2014 \uCC38\uCE58\uC138\uD2B8 \uD655\uC815' },
  { big: false, html: '\u2615 <b>\uD55C\u25CB\u25CB</b>\uB2D8 \uAC1C! \uD22C\uC370 \uC544\uBA54\uB9AC\uCE74\uB178 \uB2F9\uCCA8' },
  { big: false, html: '\uD83C\uDF81 <b>\uC724\u25CB\u25CB</b>\uB2D8 \uAC78! \uD65C\uB3D9\uBB3C\uD488 1\uC885 \uB2F9\uCCA8' },
  { big: true,  html: '\uD83C\uDF15 <b>\uC774\uC218\uC544</b>\uB2D8 \uBCF4\uB984\uB2EC \uC644\uC131! \uD55C\uC6B0\uC138\uD2B8 \uD655\uC815 \uD83E\uDD69' },
  { big: false, html: '\uD83C\uDF13 <b>\uC1A1\u25CB\u25CB</b>\uB2D8 \uBC18\uB2EC \uB3C4\uB2EC \u2014 \uAE40\uC138\uD2B8 \uD655\uC815' }
];

function renderDist() {
  var total = 0, max = 1, i;
  for (i = 0; i < SAMPLE_DIST.length; i++) {
    total += SAMPLE_DIST[i].count;
    if (SAMPLE_DIST[i].count > max) max = SAMPLE_DIST[i].count;
  }
  document.getElementById('totalCnt').textContent = '\uCC38\uC5EC ' + total + '\uBA85';
  var el = document.getElementById('dist');
  var htm = '';
  for (i = 0; i < SAMPLE_DIST.length; i++) {
    var d = SAMPLE_DIST[i];
    var w = Math.round(d.count / max * 100);
    htm += '<div class="dist-row">'
        + '<div class="dist-moon"><div class="sh" style="left:' + d.shade + '"></div></div>'
        + '<div class="dist-info"><div class="dist-name"><span>' + d.label
        + ' <span class="gift">\u00b7 ' + d.gift + '</span></span><span class="cnt">' + d.count + '\uBA85</span></div>'
        + '<div class="dist-bar"><div class="dist-fill" style="width:' + w + '%"></div></div></div>'
        + '</div>';
  }
  el.innerHTML = htm;
}

function renderHall() {
  var el = document.getElementById('hall');
  if (SAMPLE_HALL.length === 0) {
    el.innerHTML = '<div class="hall-empty">\uCCAB \uBCF4\uB984\uB2EC\uC744 \uAE30\uB2E4\uB9AC\uB294 \uC911 \uD83C\uDF15</div>';
    return;
  }
  var htm = '', i;
  for (i = 0; i < SAMPLE_HALL.length; i++) {
    var r = SAMPLE_HALL[i];
    htm += '<div class="hall-row"><div class="hall-rank">' + r.rank + '</div>'
        + '<div class="hall-name">' + r.name + '<small>' + r.team + '</small></div>'
        + '<div class="hall-date">' + r.date + ' \uC644\uC131</div></div>';
  }
  el.innerHTML = htm;
}

var feedIdx = 0;
function pushFeed() {
  var feed = document.getElementById('feed');
  var item = SAMPLE_FEED[feedIdx % SAMPLE_FEED.length];
  feedIdx++;
  var d = document.createElement('div');
  d.className = item.big ? 'f-item big' : 'f-item';
  d.innerHTML = item.html;
  feed.insertBefore(d, feed.firstChild);
  while (feed.children.length > 8) feed.removeChild(feed.lastChild);
}

function tickClock() {
  var n = new Date();
  var h = n.getHours(), m = n.getMinutes();
  var mm = m < 10 ? '0' + m : '' + m;
  document.getElementById('clock').textContent = (n.getMonth() + 1) + '/' + n.getDate() + ' ' + h + ':' + mm + ' \uAE30\uC900 \u00b7 \uC790\uB3D9 \uAC31\uC2E0';
}

function tickDday() {
  /* date-based diff: deadline day itself must show 0 */
  var now = new Date();
  var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var end0 = new Date(2026, 8, 15);
  var diff = Math.round((end0.getTime() - today0.getTime()) / 86400000);
  var el = document.getElementById('dday');
  if (diff > 0) el.textContent = '\uB9C8\uAC10 D-' + diff;
  else if (diff === 0) el.textContent = '\uD83D\uDD25 \uC624\uB298 \uB9C8\uAC10!';
  else el.textContent = '\uC9D1\uACC4 \uC644\uB8CC \uD83C\uDF15';
}

/* ---- GAS hookup: poll moonBoard, fall back to sample data ---- */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx3dE8zn0pkrjsklnrWP-dLUJQ_PyLfVPGd49YsX28U-Wc6ifM4TxdNBgB14b9bOyvL/exec';
var MOON_SHADE = { '\uBCF4\uB984\uB2EC':'-150%', '\uB465\uADFC\uB2EC':'-96%', '\uBCFC\uB85D\uB2EC':'-74%', '\uBC18\uB2EC':'-52%', '\uCD08\uC2B9\uB2EC':'-30%' };
var MOON_GIFT_SHORT = { '\uBCF4\uB984\uB2EC':'\uD55C\uC6B0', '\uB465\uADFC\uB2EC':'\uC640\uC778', '\uBCFC\uB85D\uB2EC':'\uCC38\uCE58', '\uBC18\uB2EC':'\uAE40', '\uCD08\uC2B9\uB2EC':'\uBD80\uCE68' };
var liveMode = false;
var lastFeedKey = '';

function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function applyBoard(d) {
  if (!d || !d.ok) return;
  liveMode = true;
  var i;
  var dist = [];
  for (i = 0; i < d.dist.length; i++) {
    var it = d.dist[i];
    dist.push({ label: it.moon, gift: MOON_GIFT_SHORT[it.moon] || '', shade: MOON_SHADE[it.moon] || '-30%', count: it.count });
  }
  SAMPLE_DIST = dist;
  var hall = [];
  var medals = ['\uD83E\uDD47','\uD83E\uDD48','\uD83E\uDD49'];
  for (i = 0; i < d.hall.length; i++) {
    var hh = d.hall[i];
    var dt = hh.date ? String(hh.date).slice(5).replace('-','/') : '';
    hall.push({ rank: i < 3 ? medals[i] : '\uD83C\uDF15', name: esc(hh.name), team: esc(hh.branch), date: dt });
  }
  SAMPLE_HALL = hall;
  document.getElementById('totalCnt').textContent = '\uCC38\uC5EC ' + d.total + '\uBA85';
  renderDist();
  renderHall();
  // feed: rebuild from server, newest first
  var key = '';
  var items = [];
  for (i = 0; i < d.feed.length && i < 8; i++) {
    var f = d.feed[i];
    key += String(f.ep) + '|';
    if (f.type === 'full') {
      items.push({ big:true, html:'\uD83C\uDF15 <b>' + esc(f.name) + '</b>\uB2D8 \uBCF4\uB984\uB2EC \uC644\uC131! \uD55C\uC6B0\uC138\uD2B8 \uD655\uC815 \uD83E\uDD69' });
    } else {
      var pre = f.big ? '\uD83C\uDF89 ' : '';
      items.push({ big:!!f.big, html: pre + '<b>' + esc(f.name) + '</b>\uB2D8 <b>' + esc(f.yut) + '!</b> ' + esc(f.snack) });
    }
  }
  if (key !== lastFeedKey) {
    lastFeedKey = key;
    var feedEl = document.getElementById('feed');
    feedEl.innerHTML = '';
    for (i = items.length - 1; i >= 0; i--) {
      var el = document.createElement('div');
      el.className = items[i].big ? 'f-item big' : 'f-item';
      el.innerHTML = items[i].html;
      feedEl.insertBefore(el, feedEl.firstChild);
    }
  }
}

var JSONP_SEQ = 0;
function jsonpGet(url) {
  return new Promise(function(resolve, reject){
    var name = '__tv_cb' + (++JSONP_SEQ) + '_' + new Date().getTime();
    var s = document.createElement('script');
    var done = false;
    var t = setTimeout(function(){ if (!done) { done = true; cleanup(); reject(new Error('timeout')); } }, 90000);
    function cleanup(){ clearTimeout(t); try { window[name] = undefined; } catch(e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function(data){ if (done) return; done = true; cleanup(); resolve(data); };
    s.onerror = function(){ if (done) return; done = true; cleanup(); reject(new Error('jsonp error')); };
    s.src = url + '&callback=' + name;
    document.body.appendChild(s);
  });
}
function setLiveBadge(txt, ok) {
  var el = document.getElementById('liveBadge');
  if (!el) return;
  el.textContent = txt;
  el.style.background = ok ? 'rgba(80,200,120,.25)' : 'rgba(255,120,80,.3)';
  el.style.borderColor = ok ? 'rgba(80,200,120,.7)' : 'rgba(255,120,80,.8)';
}
function pollBoard() {
  if (!liveMode) setLiveBadge('\uC2E4\uB370\uC774\uD130 \uC5F0\uACB0 \uC911...', false);
  var url = GAS_URL + '?action=moonBoard';
  fetch(url)
    .then(function(r){ return r.json(); })
    .catch(function(){ return jsonpGet(url); })
    .then(function(d){
      applyBoard(d);
      if (d && d.ok) setLiveBadge('LIVE \u00B7 ' + (d.asOf || ''), true);
    })
    .catch(function(){
      setLiveBadge('\uC11C\uBC84 \uC751\uB2F5 \uC5C6\uC74C \u00B7 \uC7AC\uC2DC\uB3C4 \uC911', false);
    });
}

renderDist();
renderHall();
pushFeed(); pushFeed(); pushFeed(); pushFeed();
tickClock(); tickDday();
setInterval(function(){ if (!liveMode) pushFeed(); }, 6000);
setInterval(tickClock, 30000);
setInterval(tickDday, 60000);
pollBoard();
setInterval(function(){ pollBoard(); }, 60000);
setTimeout(function(){ if (!liveMode) pollBoard(); }, 25000);
</script>
</body>
</html>
