<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎪 워크플레이</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  background:linear-gradient(160deg,#1b2f4b 0%,#20456e 45%,#0f2439 100%); min-height:100vh; min-height:100dvh; padding:22px 14px 40px; }
.wrap { max-width:440px; margin:0 auto; }
.top { text-align:center; margin-bottom:18px; }
.top h1 { font-size:24px; font-weight:900; color:#fff; letter-spacing:-.3px; }
.top p { font-size:12.5px; font-weight:700; color:#a9c8e4; margin-top:5px; }

.card { background:#fff; border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 12px 32px rgba(0,20,45,.35); position:relative; overflow:hidden; }
.card.live { border:2px solid #ffc63d; }
.tag { display:inline-block; font-size:10.5px; font-weight:900; padding:4px 10px; border-radius:100px; margin-bottom:8px; }
.tag.live { background:linear-gradient(135deg,#ff5f6d,#ff2d55); color:#fff; animation:blink 1.6s ease-in-out infinite; }
.tag.soon { background:#fff2cc; color:#a5691f; }
.tag.end { background:#eef1f4; color:#8b9aa8; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.55} }
.ttl { font-size:19px; font-weight:900; color:#12314f; }
.dsc { font-size:12.5px; font-weight:700; color:#5d7386; margin-top:5px; line-height:1.55; }
.per { font-size:11.5px; font-weight:800; color:#8b9aa8; margin-top:7px; }
.go { display:block; width:100%; margin-top:12px; padding:13px; border:none; border-radius:100px; font-family:inherit;
  font-size:15.5px; font-weight:900; cursor:pointer; color:#3a2000; background:linear-gradient(135deg,#ffe14d,#ffb400);
  box-shadow:0 8px 22px rgba(255,190,40,.45); }
.go.soft { background:#eef3f8; color:#5d7386; box-shadow:none; cursor:default; }
.card.dim { opacity:.72; }

.none { background:rgba(255,255,255,.96); border-radius:20px; padding:28px 20px; text-align:center; box-shadow:0 12px 32px rgba(0,20,45,.35); }
.none .em { font-size:44px; }
.none h2 { font-size:18px; font-weight:900; color:#12314f; margin-top:10px; }
.none p { font-size:13px; font-weight:700; color:#6a8296; margin-top:8px; line-height:1.65; }
.sect { font-size:12px; font-weight:900; color:#9dbcd8; margin:18px 0 8px 4px; }
.back { display:block; width:100%; margin-top:16px; padding:12px; border:none; border-radius:100px; font-family:inherit;
  font-size:13.5px; font-weight:800; color:#cfe2f2; background:rgba(255,255,255,.12); cursor:pointer; }
.splash { position:fixed; inset:0; background:linear-gradient(160deg,#1b2f4b,#0f2439); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:50; }
.splash .em { font-size:52px; animation:bob 1.1s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
.splash p { font-size:14px; font-weight:900; color:#fff; margin-top:12px; }
</style>
</head>
<body>

<div class="splash" id="splash" style="display:none;">
  <div class="em" id="splashEm">🎣</div>
  <p id="splashTxt">이벤트로 이동 중...</p>
</div>

<div class="wrap" id="wrap" style="display:none;">
  <div class="top">
    <h1>🎪 워크플레이</h1>
    <p id="todayTxt">-</p>
  </div>
  <div id="list"></div>
  <button class="back" onclick="goHome()">← 유니스페이스로 돌아가기</button>
</div>

<script>
/* ---- event list: add a new line here when a new event starts ---- */
var EVENTS = [
  {
    key: 'fishing',
    emoji: '🎣',
    name: '유니스 조기낚시',
    desc: '조기영업 10만원 = 낚시찌 1개! 대조기는 서서갈비세트 🥩',
    start: '2026-08-01',
    end: '2026-08-10',
    url: '/fishing/',
    demoUrl: '/fishing/demo/',
    demoOpen: '2026-07-25'
  }
];

function kstNow(){
  var n = new Date();
  var utc = n.getTime() + n.getTimezoneOffset() * 60000;
  return new Date(utc + 9 * 3600000);
}
function ymd(d){
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}
function dnum(s){ return parseInt(String(s || '').replace(/-/g, ''), 10) || 0; }
function daysBetween(a, b){
  return Math.round((new Date(b + 'T00:00:00+09:00').getTime() - new Date(a + 'T00:00:00+09:00').getTime()) / 86400000);
}
function goHome(){ location.href = '/unispace/'; }

var today = ymd(kstNow());
var tn = dnum(today);

var live = [], soon = [], past = [];
var i;
for (i = 0; i < EVENTS.length; i++) {
  var e = EVENTS[i];
  var s = dnum(e.start), en = dnum(e.end);
  if (tn >= s && tn <= en) live.push(e);
  else if (tn < s) soon.push(e);
  else past.push(e);
}

/* candidates = live events + upcoming events whose demo is already open */
var cand = [];
for (i = 0; i < live.length; i++) cand.push({ e: live[i], url: live[i].url, demo: false });
for (i = 0; i < soon.length; i++) {
  if (soon[i].demoUrl && dnum(soon[i].demoOpen) <= tn) cand.push({ e: soon[i], url: soon[i].demoUrl, demo: true });
}

/* exactly one thing to do -> jump straight in */
if (cand.length === 1) {
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('splashEm').textContent = cand[0].e.emoji;
  document.getElementById('splashTxt').textContent = cand[0].e.name + (cand[0].demo ? ' 체험판' : '') + '(으)로 이동 중...';
  (function(u){ setTimeout(function(){ location.href = u; }, 900); })(cand[0].url);
} else {
  render();
}

function cardHtml(e, kind){
  var h = '';
  var dim = kind === 'past' ? ' dim' : '';
  var lv = kind === 'live' ? ' live' : '';
  h += '<div class="card' + lv + dim + '">';
  if (kind === 'live') h += '<span class="tag live">진행 중</span>';
  else if (kind === 'soon') {
    var dleft = daysBetween(today, e.start);
    h += '<span class="tag soon">오픈 D-' + dleft + '</span>';
  } else h += '<span class="tag end">종료</span>';
  h += '<div class="ttl">' + e.emoji + ' ' + e.name + '</div>';
  h += '<div class="dsc">' + e.desc + '</div>';
  h += '<div class="per">📅 ' + e.start.substring(5).replace('-', '/') + ' ~ ' + e.end.substring(5).replace('-', '/') + '</div>';
  if (kind === 'live') {
    h += '<button class="go" onclick="location.href=\'' + e.url + '\'">참여하러 가기 ' + e.emoji + '</button>';
  } else if (kind === 'soon' && e.demoUrl && dnum(e.demoOpen) <= tn) {
    h += '<button class="go" onclick="location.href=\'' + e.demoUrl + '\'">체험판 미리 해보기 👀</button>';
  } else if (kind === 'soon') {
    h += '<button class="go soft">오픈 준비 중 🔜</button>';
  } else {
    h += '<button class="go soft">종료된 이벤트</button>';
  }
  h += '</div>';
  return h;
}

function render(){
  document.getElementById('wrap').style.display = 'block';
  document.getElementById('todayTxt').textContent = today.replace(/-/g, '.') + ' 기준';
  var html = '';
  var i;
  if (!live.length && !soon.length) {
    html += '<div class="none"><div class="em">🎣</div><h2>지금은 운영 중인 이벤트가 없어요</h2>'
         + '<p>다음 이벤트를 열심히 준비 중입니다!<br>조금만 기다려주세요 🔜</p></div>';
  }
  for (i = 0; i < live.length; i++) html += cardHtml(live[i], 'live');
  if (soon.length) {
    html += '<div class="sect">🔜 오픈 예정</div>';
    for (i = 0; i < soon.length; i++) html += cardHtml(soon[i], 'soon');
  }
  if (past.length) {
    html += '<div class="sect">🗂️ 지난 이벤트</div>';
    for (i = 0; i < past.length; i++) html += cardHtml(past[i], 'past');
  }
  document.getElementById('list').innerHTML = html;
}
</script>
</body>
</html>
