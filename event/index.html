function tickDday(){
  var n = new Date();
  var kst = new Date(n.getTime() + n.getTimezoneOffset() * 60000 + 9 * 3600000);
  var t0 = new Date(kst.getFullYear(), kst.getMonth(), kst.getDate());
  var p = EVENT_END.split('-');
  var e0 = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  var diff = Math.round((e0 - t0) / 86400000);
  qs('dday').textContent = diff > 0 ? 'D-' + diff : (diff === 0 ? 'D-DAY \ud83c\udf82' : '\uc9d1\uacc4 \uc644\ub8cc');
}

  ]).slice(0, 12);
  var elig = tiers[0].names.length + tiers[1].names.length + tiers[2].names.length;
  return {

    nowTickets:3, minAmt:500000, alpha:a, bravo:b,

    tiers:tiers, all:all, feed:feed, asOf:'9/22 14:02 (\ub370\ubaa8)',

  };
