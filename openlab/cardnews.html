<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E3B26">
<title>소비자 패널 안내 · UNICE 오픈랩</title>
<style>
  :root{
    --green-deep:#0E3B26; --green:#1B5E3B; --green-soft:#E4EFE7;
    --gold:#C69E4A; --gold-deep:#A9822F; --ivory:#F7F5EE; --white:#fff;
    --dark:#22291F; --gray:#8B9187;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--green-deep);color:var(--dark);
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .stage{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

  /* 상단 바 */
  .topbar{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;color:#fff;}
  .topbar .brand{font-size:14px;font-weight:800;letter-spacing:1px;}
  .topbar .brand .g{color:var(--gold);}
  .topbar .count{font-size:13px;color:#BFD3C6;font-weight:700;}

  /* 카드 영역 */
  .viewer{
    position:relative;width:100%;overflow:hidden;
    background:var(--green-deep);
    flex:none;
  }
  .track{display:flex;transition:transform .34s cubic-bezier(.4,0,.2,1);}
  .slide{min-width:100%;}
  .slide img{width:100%;display:block;}

  /* 화살표 */
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;
    background:rgba(14,59,38,.55);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:5;backdrop-filter:blur(4px);}
  .nav:active{background:rgba(14,59,38,.8);}
  .nav.prev{left:10px;} .nav.next{right:10px;}
  .nav[disabled]{opacity:0;pointer-events:none;}

  /* 점 인디케이터 */
  .dots{display:flex;justify-content:center;gap:7px;padding:14px 0 10px;background:var(--green-deep);}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .25s;}
  .dot.on{background:var(--gold);width:22px;border-radius:5px;}

  /* 하단 CTA */
  .cta-wrap{background:var(--ivory);border-radius:22px 22px 0 0;margin-top:auto;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(0,0,0,.18);}
  .cta-head{font-size:15px;font-weight:800;color:var(--green-deep);text-align:center;margin-bottom:4px;}
  .cta-sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:16px;line-height:1.5;}
  .btn-apply{display:block;width:100%;padding:16px;border:none;border-radius:15px;
    background:linear-gradient(135deg,#C69E4A,#A9822F);color:#fff;font-size:16px;font-weight:800;
    letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 18px rgba(169,130,47,.35);text-align:center;text-decoration:none;}
  .btn-apply:active{transform:scale(.98);}
  .btn-video{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;margin-top:10px;
    border:1.5px solid var(--green-soft);border-radius:15px;background:#fff;color:var(--green-deep);
    font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;}
  .btn-video:active{background:var(--green-soft);}
  .fp-note{margin-top:14px;font-size:12px;color:var(--gray);text-align:center;line-height:1.6;}
  .fp-note b{color:var(--green);}
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="brand">UNICE <span class="g">오픈랩</span></div>
    <div class="count"><span id="cur">1</span> / 7</div>
  </div>

  <div class="viewer" id="viewer">
    <div class="track" id="track">
      <div class="slide"><img src="1.png" alt="딱 1시간, 3만원 받아가세요"></div>
      <div class="slide"><img src="2.png" alt="어렵지 않아요"></div>
      <div class="slide"><img src="3.png" alt="유고비 - 보험료 비교"></div>
      <div class="slide"><img src="4.png" alt="케어핏 - 의료비 진단"></div>
      <div class="slide"><img src="5.png" alt="노후파이 · 고객지원서비스"></div>
      <div class="slide"><img src="6.png" alt="참여 방법"></div>
      <div class="slide"><img src="7.png" alt="지금 바로 신청하세요"></div>
    </div>
    <button class="nav prev" id="prev" aria-label="이전">&#8249;</button>
    <button class="nav next" id="next" aria-label="다음">&#8250;</button>
  </div>

  <div class="dots" id="dots"></div>

  <div class="cta-wrap">
    <div class="cta-head">딱 1시간, 활동지원금 3만원</div>
    <div class="cta-sub">30~55세 누구나 · 부산 자성로 129, 6층 UNICE</div>
    <a class="btn-apply" id="btnApply" href="vip-apply.html">지금 바로 신청하기</a>
    <a class="btn-video" href="https://youtu.be/LChecM_Du1M" target="_blank" rel="noopener">▶ 1분 홍보영상 보기</a>
    <div class="fp-note" id="fpNote"></div>
  </div>
</div>

<script>
(function(){
  var track = document.getElementById("track");
  var slides = track.getElementsByClassName("slide");
  var total = slides.length;
  var idx = 0;
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var curEl = document.getElementById("cur");
  var dotsWrap = document.getElementById("dots");

  /* 점 생성 */
  var i, d;
  for(i=0;i<total;i++){
    d = document.createElement("div");
    d.className = "dot";
    dotsWrap.appendChild(d);
  }
  var dots = dotsWrap.getElementsByClassName("dot");

  function render(){
    track.style.transform = "translateX(-" + (idx*100) + "%)";
    curEl.textContent = (idx+1);
    prevBtn.disabled = (idx===0);
    nextBtn.disabled = (idx===total-1);
    var k;
    for(k=0;k<dots.length;k++){
      if(k===idx){ dots[k].className = "dot on"; }
      else{ dots[k].className = "dot"; }
    }
  }
  function go(n){
    if(n<0) n=0;
    if(n>total-1) n=total-1;
    idx = n; render();
  }

  prevBtn.addEventListener("click", function(){ go(idx-1); });
  nextBtn.addEventListener("click", function(){ go(idx+1); });

  /* 터치 스와이프 */
  var startX = 0, dx = 0, dragging = false;
  var viewer = document.getElementById("viewer");
  viewer.addEventListener("touchstart", function(e){
    startX = e.touches[0].clientX; dx = 0; dragging = true;
  }, {passive:true});
  viewer.addEventListener("touchmove", function(e){
    if(!dragging) return;
    dx = e.touches[0].clientX - startX;
  }, {passive:true});
  viewer.addEventListener("touchend", function(){
    if(!dragging) return;
    dragging = false;
    if(dx < -45){ go(idx+1); }
    else if(dx > 45){ go(idx-1); }
  });

  /* 담당 FP 파라미터 이어붙이기 */
  function getParam(key){
    var q = window.location.search;
    if(!q) return "";
    var parts = q.substring(1).split("&");
    var j, kv;
    for(j=0;j<parts.length;j++){
      kv = parts[j].split("=");
      if(kv[0]===key){ return decodeURIComponent(kv[1]||""); }
    }
    return "";
  }
  var fp = getParam("fp");
  var applyBtn = document.getElementById("btnApply");
  var fpNote = document.getElementById("fpNote");
  if(fp){
    applyBtn.href = "vip-apply.html?fp=" + encodeURIComponent(fp);
    fpNote.innerHTML = "<b>" + fp + "</b> 담당자가 안내해 드립니다";
  } else {
    fpNote.textContent = "신청하시면 담당자가 안내해 드립니다";
  }

  render();
})();
</script>
</body>
</html>
